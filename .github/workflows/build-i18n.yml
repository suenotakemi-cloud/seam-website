name: Build i18n (prerender localized pages)

# ja ページが変わったら、各言語の翻訳を焼き込んだ静的ページを
# /en/ /zh/ /tw/ /ko/ に生成して commit する（検索に多言語を露出させる）。
# 生成物は新規ディレクトリのため、既存 ja ページ(本番)には影響しない。
#
# 【2026-08-11 に見つけた抜け】build-i18n.js の PAGES は33枚あるのに、
# ここの paths には最初の6枚しか書いていなかった。2026-08-01 に
# 店舗7 + 地域LP19 + スパ3 を PAGES に足したとき、paths を足し忘れている。
# そのため salon-*.html などを直しても多言語版が再生成されず、27枚が凍結していた
# (免税の追記も、先回りブロックも、/en/ /zh/ /tw/ /ko/ には届いていなかった)。
# 一枚ずつ列挙するとまた同じズレが起きるので、ルート直下の .html はすべて対象にする。
# 生成は決定論的で、出力が変わらなければ commit しないので、余分に起動しても害はない。
#
# 【2026-07-25 の障害メモ】#125〜#129 が step6 で連続失敗した。真因は
# ワークフローではなく「node_modules 1809ファイルが誤ってコミットされていた」こと。
# tracked な node_modules があると rm -rf / git reset --hard のどちらでも
# 破綻する(前者は pull --rebase が拒否、後者は CI が入れた jsdom を巻き戻す)。
# node_modules は .gitignore 済み。二度とコミットしないこと。
on:
  push:
    paths:
      - '*.html'
      - 'js/lang.js'
      - '.github/scripts/build-i18n.js'
      - '.github/workflows/build-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を直列化（push が重なってもブランチ競合しにくく）
concurrency:
  group: build-i18n
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 既定の fetch-depth:1 は「浅いクローン」なので、リモートが進んだときに
      # rebase の共通祖先が見つからず push まで到達できない(run #125〜#128の失敗)。
      # 直近履歴まで取れば reset/rebase/push が安定する。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: jsdom インストール
        run: npm init -y && npm i --no-save jsdom@^24

      - name: 多言語ページを生成
        run: node .github/scripts/build-i18n.js

      - name: 生成物をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 注: [skip ci] は付けない。CF Pages は [skip ci] 入りコミットの配信をスキップするため
          # （付けると生成物が本番に出ない）。en/zh/tw/ko/sitemap はこのworkflowのトリガーパス外
          # ＋GITHUB_TOKENのpushは新規workflowを起動しないため、ループにはならない。
          #
          # 以前は「commit → pull --rebase → push」をリトライしていたが、人間の push が
          # 連続すると毎回 rebase 先が動いて 5回とも負け exit 1 になった(run #127)。
          # 生成は決定論的(同じjaページ→同じ出力)なので、負けたら
          # 「リモート最新に合わせ直して作り直す」方が確実。衝突が原理的に起きない。
          # node_modules は消さない(ループ内で再生成するのに jsdom が要る)。
          # git add はパス指定なので node_modules/package.json が混入することはない。
          # set +e: どの git コマンドで落ちたかを握りつぶさず自分で判定して報告する
          # (ジョブログは管理者しか読めないので、失敗理由を ::error:: 注釈に出す)。
          set +e
          pushed=0; last=""
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main            || { last="fetch失敗(attempt $i)"; sleep 5; continue; }
            git reset --hard FETCH_HEAD      || { last="reset失敗(attempt $i)"; sleep 5; continue; }
            node .github/scripts/build-i18n.js || { last="生成失敗(attempt $i)"; break; }
            git add en zh tw ko sitemap.xml  || { last="add失敗(attempt $i)"; break; }
            if git diff --staged --quiet; then
              echo "no change (attempt $i)"; pushed=1; break
            fi
            git commit -m "build: prerender 多言語ページ en/zh/tw/ko" || { last="commit失敗(attempt $i)"; break; }
            if git push origin HEAD:main; then pushed=1; break; fi
            last="push拒否(attempt $i)"
            echo "$last — リモート最新から作り直して再試行"; sleep $((i * 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error title=build-i18n::多言語ページの反映に失敗しました（最後の失敗: ${last}）。ja側の本番配信には影響しません。"
            exit 1
          fi
