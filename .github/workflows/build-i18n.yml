name: Build i18n (prerender localized pages)

# コンテンツ6ページ or 翻訳辞書(lang.js)が変わったら、各言語の翻訳を焼き込んだ
# 静的ページを /en/ /zh/ /tw/ /ko/ に生成して commit する（検索に多言語を露出させる）。
# 生成物は新規ディレクトリのため、既存 ja ページ(本番)には影響しない。
on:
  push:
    paths:
      - 'index.html'
      - 'shop.html'
      - 'hairsalon.html'
      - 'headspa.html'
      - 'brand.html'
      - 'onlineshop.html'
      - 'js/lang.js'
      - '.github/scripts/build-i18n.js'
      - '.github/workflows/build-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を直列化（push が重なってもブランチ競合しにくく）
concurrency:
  group: build-i18n
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: jsdom インストール
        run: npm init -y && npm i --no-save jsdom@^24

      - name: 多言語ページを生成
        run: node .github/scripts/build-i18n.js

      - name: 生成物をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 注: [skip ci] は付けない。CF Pages は [skip ci] 入りコミットの配信をスキップするため
          # （付けると生成物が本番に出ない）。en/zh/tw/ko/sitemap はこのworkflowのトリガーパス外
          # ＋GITHUB_TOKENのpushは新規workflowを起動しないため、ループにはならない。
          #
          # 以前は「commit → pull --rebase → push」をリトライしていたが、人間の push が
          # 連続すると毎回 rebase 先が動いて 5回とも負け exit 1 になった(run #127)。
          # 生成は決定論的(同じjaページ→同じ出力)なので、負けたら
          # 「リモート最新に合わせ直して作り直す」方が確実。衝突が原理的に起きない。
          # node_modules は消さない(ループ内で再生成するのに jsdom が要る)。
          # git add はパス指定なので node_modules/package.json が混入することはない。
          pushed=0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main      # tracked のみ戻る = node_modules は残る
            node .github/scripts/build-i18n.js
            git add en zh tw ko sitemap.xml
            if git diff --staged --quiet; then echo "no change (attempt $i)"; pushed=1; break; fi
            git commit -m "build: prerender 多言語ページ en/zh/tw/ko"
            if git push; then pushed=1; break; fi
            echo "push attempt $i rejected, rebuilding from latest main..."; sleep $((i * 5))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 8 attempts"; exit 1; }
