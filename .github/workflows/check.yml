# 出す前の関所
#
# これまで、生成物を直接 main へ書き戻すワークフローはあったのに、
# 「壊れていないか確かめる」ものが1つも無かった。
# 壊れたものがそのまま seam.site に出ていた。
#
# ここでやるのは、落ちたら気づける最低限だけ。
#   ・JavaScript が構文として成立しているか
#   ・HTML の中の <script> が成立しているか
#   ・お店の情報が映る画面に、うっかり noindex が外れていないか
#   ・HTML が参照している絵・動画・css・js の実体が木に在るか（★札より中身）
#
# ★「土台のしくみ（saas/）のテストが通るか」と以前ここに書いてあったが、
#   その段は一度も存在しなかった（2026-09-03・外部チェックで発覚）。
#   saas/ はこのリポジトリに無い。書いてあって走らない段は、無いより悪いので消した。
#
# ★重いことはしない。関所は「速くて必ず通る」ことが大事で、
#   遅いと必ず外される。

name: 出す前の関所

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: LINE・通知が使う予約ページを消していないか
        run: node .github/tests/legacy-booking-pages.test.mjs

      - name: JavaScript が成立しているか
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::構文が成立していません"; fail=1; }
          done < <(find . -name '*.js' -not -path './node_modules/*' -not -path './vendor/*' -not -path './.git/*')
          exit $fail

      - name: HTML の中の script が成立しているか
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile, os, pathlib, sys
          # ★JavaScript として動くものだけを見る。
          #   type="application/ld+json"（検索エンジン向けの説明書き）や
          #   text/template は JavaScript ではないので、node --check にかけると
          #   全部「壊れている」と出る（680件の誤検知が実際に出た）。
          JS_TYPE = re.compile(r'type\s*=\s*["\']?\s*(module|text/javascript|application/javascript)\s*["\']?', re.I)
          HAS_TYPE = re.compile(r'\btype\s*=', re.I)
          bad = n = 0
          for f in pathlib.Path('.').rglob('*.html'):
              if any(p in str(f) for p in ('node_modules', 'vendor', '.git')): continue
              try: s = f.read_text(encoding='utf-8')
              except Exception: continue
              for m in re.finditer(r'<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>', s, re.S):
                  attrs, code = m.group(1), m.group(2)
                  if not code.strip(): continue
                  if HAS_TYPE.search(attrs) and not JS_TYPE.search(attrs): continue
                  n += 1
                  with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False, encoding='utf-8') as t:
                      t.write(code); p = t.name
                  r = subprocess.run(['node', '--check', p], capture_output=True, text=True)
                  os.unlink(p)
                  if r.returncode:
                      bad += 1
                      print(f'::error file={f}::{r.stderr.strip()[:300]}')
          print(f'JavaScript の script {n}本を確認、壊れているもの {bad}本')
          sys.exit(1 if bad else 0)
          PY

      - name: お店の情報が映る画面が検索に出ない設定か
        run: |
          fail=0
          for f in booking/*.html entrance.html admin.html pim/*.html; do
            [ -f "$f" ] || continue
            grep -qi 'name="robots"[^>]*noindex' "$f" || {
              echo "::error file=$f::noindex が入っていません（お店の画面が検索に出ます）"; fail=1; }
          done
          exit $fail

      - name: 参照先の実体が木に在るか（★札より中身）
        run: |
          # ★2026-08-22 の整理コミットで絵の実体だけが消え、HTML の参照は残った。
          #   試験は緑のまま、お客様の画面で 41 本が 404 になっていた（2026-09-03 に復元）。
          #   HTML という札ではなく、参照先の実体を1本ずつ叩く。
          python3 - <<'PY'
          import re, pathlib, sys, html
          ROOT = pathlib.Path('.').resolve()
          ATTR = re.compile(r'(?:src|href|poster|content)\s*=\s*["\']([^"\'#?]+)', re.I)
          SRCSET = re.compile(r'srcset\s*=\s*["\']([^"\']+)["\']', re.I)
          ILL = re.compile(r"ill:\s*'(ill_[a-z0-9_]+)'")   # booking/precare.html は名前で絵を組み立てる
          KINDS = ('images/', 'css/', 'js/', 'videos/', 'vendor/', 'data/')
          bad, n = [], 0
          def check(page, ref, seen):
              global n
              ref = html.unescape(ref)
              if not ref or ref.startswith(('http:', 'https:', '//', 'data:', 'mailto:', 'tel:', 'javascript:')): return
              if '{' in ref: return
              p = (ROOT / ref.lstrip('/')) if ref.startswith('/') else (page.parent / ref)
              try: rel = p.resolve().relative_to(ROOT).as_posix()
              except ValueError: return
              if not rel.startswith(KINDS) or rel in seen: return
              seen.add(rel); n += 1
              if not p.exists(): bad.append(f'{page.relative_to(ROOT)}: {ref}')
          for page in ROOT.rglob('*.html'):
              if any(x in page.parts for x in ('node_modules', 'vendor', '.git')): continue
              s = page.read_text(encoding='utf-8', errors='replace'); seen = set()
              for m in ATTR.finditer(s): check(page, m.group(1).strip(), seen)
              for m in SRCSET.finditer(s):
                  for part in m.group(1).split(','):
                      if part.strip(): check(page, part.strip().split()[0], seen)
              for m in ILL.finditer(s):
                  check(page, ('../' if page.parent != ROOT else '') + f'images/lp/spa/{m.group(1)}.webp', seen)
          for b in bad: print(f'::error::参照先の実体がありません  {b}')
          print(f'参照 {n}本を確認、実体の無いもの {len(bad)}本')
          sys.exit(1 if bad else 0)
          PY

      - name: PIM（商品マスタ）の中身が消えていないか
        run: |
          # ★2026-09-14 の booking 撤去コミットが、古い main を元にしていたため
          #   マージ済みの PR #25（SalonPro へ写真を送る・15 ファイル）を丸ごと打ち消して main に入った。
          #   本番から機能が消えたまま翌日まで気づかなかった。
          #   PIM は別の線で育てているので、「あるべきファイルと目印」が無くなっていたらここで止める。
          #   増やすときは CLAUDE.md の約束どおり、PIM の線のセッションで足す。
          fail=0
          need() { [ -f "$1" ] || { echo "::error file=$1::PIM のファイルが消えています（古い main への巻き戻し？ CLAUDE.md を読んでください）"; fail=1; }; }
          mark() { grep -q -- "$2" "$1" 2>/dev/null || { echo "::error file=$1::PIM の目印「$2」が消えています（古い main への巻き戻し？）"; fail=1; }; }
          for f in functions/api/pim/_lib.js functions/api/pim/_middleware.js functions/api/pim/_salonpro.js functions/api/pim/push.js functions/api/pim/ack.js functions/api/pim/refs.js functions/api/pim/fetch.js functions/api/pim/import.js functions/api/pim/images.js functions/api/pim/products.js functions/api/pim/review.js functions/api/pim/queue.js functions/api/pim/staff.js functions/api/pim/dict.js functions/api/pim/inbox.js functions/api/pim/report.js functions/api/pim/admin/accounts.js \
                   pim/index.html pim/import.html pim/admin.html pim/photo-guide.html pim/photo-guide.js pim/manual-phone.html pim/manual-pc.html pim/labels.html \
                   "functions/pim-img/[[path]].js" js/pim-client.js js/pim-normalize.js db/pim-schema.sql db/SETUP_PIM.md; do need "$f"; done
          mark functions/api/pim/_lib.js "ec_push_at"
          mark functions/api/pim/_lib.js "pim_refs"
          mark functions/api/pim/account.js "ec_key"
          mark functions/api/pim/import.js "'fill'"
          mark pim/import.html 'data-tab="push"'
          mark pim/import.html 'data-rv="delete"'
          mark pim/import.html 'data-tab="series"'
          mark pim/index.html "btnBackList"
          mark pim/index.html "shRef"
          mark pim/index.html "HTMLCanvasElementLuminanceSource"
          exit $fail

      - name: 合言葉らしきものが混ざっていないか
        run: |
          # 本物の鍵の形だけを見る。誤検知で止めない。
          if grep -rInE '(sq0atp-|sk_live_|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
              --include='*.html' --include='*.js' --include='*.json' \
              --exclude-dir=node_modules --exclude-dir=vendor . ; then
            echo "::error::合言葉らしきものが入っています"
            exit 1
          fi
          echo "見つかりませんでした"
