      {id:'20260129172956411JaUZLFP',step:'special',c:['hari']},
      {id:'20230901142428347bQgjGVO',step:'special',c:['hari']},
      {id:'20250701161337581ibQQgii',step:'special',c:['tone']},
      {id:'20250228122137070iDOfidb',step:'special',c:['pore']},
      {id:'20250424194605348eedgPBb',step:'special',c:['pore','tone']},
      {id:'20230901142428231FeXfaga',step:'special',c:['pore']},
      {id:'20250929214221576jIjJKhH',step:'special',c:['pore','tone']},
      {id:'20230901142428189cagiEjP',step:'special',c:['dry']}
    ];

    /* ─────────── 章(タイプ)定義 ─────────── */
    var TYPES = {
      glow: { name:'うるみ玉の章', story:'あなたの物語は、光をためる季節に入っています。' },
      kime: { name:'きぬ肌の章', story:'あなたの物語は、面をなめらかに磨く季節に入っています。' },
      hari: { name:'ハリ弾む章', story:'あなたの物語は、ふっくらと弾みを取り戻す季節に入っています。' },
      tone: { name:'透きとおる章', story:'あなたの物語は、くもりを晴らしていく季節に入っています。' },
      calm: { name:'凪の章', story:'あなたの物語は、ゆらぎを鎮めて土台を育てる季節に入っています。' }
    };
    var PEAK_LINE = {
      teen:'学生の頃の肌が輝いていたなら、あなたの肌には<b>いい設計図</b>がもともとあります。',
      twenties:'20代のあの頃の輝きを知っているなら、肌は<b>戻り方を覚えて</b>います。',
      recent:'最近いちばん良かったと感じているなら、いまのケアは<b>正しい道の途中</b>です。',
      future:'いちばんいい章はこれから、という答えがいちばん強い。<b>伸びしろしかない</b>ということです。'
    };
    var EXP_LINE = {
      simple:'シンプルに続けてきた丁寧さは、これから足す一本を<b>まっすぐ効かせる土台</b>になります。',
      explorer:'たくさん試してきた経験は、<b>自分に合うものを見抜く目</b>としてもう備わっています。',
      salon:'プロの手を知っている肌は、<b>いいものへの反応が早い</b>。自宅ケアにもそれは活きます。',
      doctor:'成分で選んできたあなたには、<b>根拠のある一本</b>がいちばん似合います。'
    };
    var MEM_LINE = {
      travel:'旅先でも荒れなかったあの日の肌は、あなたの肌の底力の証明です。',
      praised:'「肌きれい」と言われた日があるなら、その日はまた作れます。',
      nofoundation:'ノーファンデで出かけたあの日を、次の章の目的地にしましょう。',
      searching:'思い出はこれから作ればいい。今日の診断が、その最初のページです。'
    };
    var BUDGET = {
      b1:{min:0,max:4400},
      b2:{min:2400,max:9800},
      b3:{min:6000,max:17000},
      b4:{min:9000,max:99999}
    };
    var STEP_LABEL = { cleanse:'落とす', wash:'洗う', lotion:'うるおす', serum:'効かせる', moist:'とじこめる', uv:'守る', special:'週のご褒美' };

    /* ─────────── 状態 ─────────── */
    var idx = 0, ans = {}, catalogMap = null, copyMap = {};

    var $ = function(id){ return document.getElementById(id); };

    function show(sec){ ['sfIntro','sfQuiz','sfResult'].forEach(function(s){ $(s).classList.toggle('hidden', s!==sec); }); window.scrollTo({top:0}); }

    function renderQ(){
      var q = QS[idx];
      $('sfChap').textContent = '— Chapter ' + q.ch + ' · ' + (idx+1) + ' / ' + QS.length;
      $('sfChapName').textContent = q.chn;
      $('sfBar').style.width = Math.round(((idx)/QS.length)*100) + '%';
      $('sfQ').innerHTML = q.q;
      $('sfQnote').textContent = q.note || '';
      var box = $('sfOpts'); box.innerHTML = '';
      var cur = ans[q.id];
      q.opts.forEach(function(o){
        var b = document.createElement('button');
        b.className = 'sf-opt';
        b.innerHTML = o.l + (o.s ? '<small>' + o.s + '</small>' : '');
        var on = q.multi ? (Array.isArray(cur) && cur.indexOf(o.v) > -1) : cur === o.v;
        if (on) b.classList.add('on');
        b.onclick = function(){
          if (q.multi) {
            var arr = Array.isArray(ans[q.id]) ? ans[q.id].slice() : [];
            if (o.x) { arr = arr.indexOf(o.v) > -1 ? [] : [o.v]; }
            else {
              arr = arr.filter(function(v){ return !q.opts.some(function(p){ return p.x && p.v === v; }); });
              var i = arr.indexOf(o.v);
              if (i > -1) arr.splice(i,1); else arr.push(o.v);
            }
            ans[q.id] = arr;
            renderQ();
          } else {
            ans[q.id] = o.v;
            renderQ();
            setTimeout(next, 220);
          }
        };
        box.appendChild(b);
      });
      var ok = q.multi ? (Array.isArray(cur) && cur.length > 0) : !!cur;
      $('sfNext').classList.toggle('ok', ok);
      $('sfNext').style.display = q.multi ? '' : 'none';
      $('sfBack').style.visibility = idx === 0 ? 'hidden' : 'visible';
      $('sfQuiz').classList.remove('fadein'); void $('sfQuiz').offsetWidth; $('sfQuiz').classList.add('fadein');
    }
    function next(){
      var q = QS[idx];
      var cur = ans[q.id];
      var ok = q.multi ? (Array.isArray(cur) && cur.length > 0) : !!cur;
      if (!ok) return;
      if (idx < QS.length - 1) { idx++; renderQ(); }
      else finish();
    }

    /* ─────────── データ取得 ─────────── */
    function loadData(){
      var p1 = fetch('data/products/seam-catalog.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
        catalogMap = {};
        (j.items || []).forEach(function(it){ if (it && it.id) catalogMap[it.id] = it; });
      });
      var p2 = fetch('data/products/seam-copy.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){ copyMap = j.items || {}; }).catch(function(){});
      return Promise.all([p1, p2]);
    }

    /* ─────────── 選定ロジック ─────────── */
    function pickRoutine(){
      var goal = ans.goal || 'glow';
      var concerns = Array.isArray(ans.concerns) ? ans.concerns.filter(function(c){ return c !== 'none'; }) : [];
      var base = ans.base;
      if (base === 'dry' && concerns.indexOf('dry') < 0) concerns.push('dry');
      if (base === 'sensitive' && concerns.indexOf('sensitive') < 0) concerns.push('sensitive');
      if (base === 'oily' && concerns.indexOf('pore') < 0) concerns.push('pore');
      var wants = concerns.slice();
      if (wants.indexOf(goal) < 0) wants.push(goal); // なりたいも軸に
      var w = BUDGET[ans.budget] || BUDGET.b2;

      // 時間タイプでステップ構成を決める(自分で選んだ感=回答が構成を変える)
      var steps;
      if (ans.time === 'quick') steps = ['cleanse','moist','uv'];
      else if (ans.time === 'weekend') steps = ['wash','lotion','special'];
      else if (ans.time === 'night') steps = ['cleanse','lotion','serum'];
      else steps = ['lotion','serum','moist','uv'];

      // なりたい→商品タグの対応(calm=敏感ケア等・タグ語彙に翻訳)
      var GOAL_KEYS = { glow:['glow','dry'], kime:['kime','pore'], hari:['hari'], tone:['tone'], calm:['sensitive'] };
      var gk = GOAL_KEYS[goal] || [goal];
      function score(m){
        var s = 0;
        (m.c || []).forEach(function(c){
          if (gk.indexOf(c) > -1) s += 6;
          if (concerns.indexOf(c) > -1) s += 4;
        });
        if ((m.c || []).length === 0) s += 1; // 汎用
        if (ans.time === 'quick' && m.quick) s += 3;
        if (concerns.indexOf('acne') > -1 && (m.c || []).indexOf('acne') > -1) s += 5; // ニキビは専用処方を最優先
        return s;
      }
      var dir = (ans.budget === 'b3' || ans.budget === 'b4') ? -1 : 1; // 高予算は同点なら上質側
      var picks = [];
      steps.forEach(function(st){
        var cands = M.filter(function(m){ return m.step === st && catalogMap[m.id] && catalogMap[m.id].p; });
        if (!cands.length) return;
        var inWin = cands.filter(function(m){ var p = catalogMap[m.id].p; return p >= w.min && p <= w.max; });
        var chosen, stretch = false, under = false;
        if (inWin.length) {
          chosen = inWin.sort(function(a,b){ return score(b) - score(a) || (catalogMap[a.id].p - catalogMap[b.id].p) * dir; })[0];
        } else if (cands.every(function(m){ return catalogMap[m.id].p < w.min; })) {
          // 全候補が予算の下=予算超えではないので普通に一番合うものを(同点なら上質側)
          chosen = cands.sort(function(a,b){ return score(b) - score(a) || catalogMap[b.id].p - catalogMap[a.id].p; })[0];
          under = true;
        } else {
          // この役割の最安でも予算の上=正直に伝えて最安を
          chosen = cands.sort(function(a,b){ return catalogMap[a.id].p - catalogMap[b.id].p; })[0];
          stretch = true;
        }
        picks.push({ m:chosen, st:st, stretch:stretch, under:under });
      });
      return picks;
    }

    /* ─────────── 結果描画 ─────────── */
    function finish(){
      $('sfBar').style.width = '100%';
      show('sfResult');
      var box = $('sfResult');
      box.innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;font-size:13px;">あなたの章を綴じています…</p>';
      loadData().then(function(){
        var goal = ans.goal || 'glow';
        var T = TYPES[goal];
        var picks = pickRoutine();
        var story = PEAK_LINE[ans.peak] + '<br>' + EXP_LINE[ans.exp] + '<br>' + MEM_LINE[ans.memory] + '<br>' + T.story + 'ここからは、<b>選んだ答えのぶんだけ</b>、まっすぐ進みます。';
        var html = '';
        html += '<div class="fadein" style="text-align:center;">';
        html += '<span class="sf-badge mono">Your Skin History</span>';
        html += '<h1 class="sf-type serif">「' + T.name + '」</h1>';
        html += '</div>';
        html += '<div class="sf-story serif fadein">' + story + '</div>';
        html += '<div class="sf-sec fadein"><h2 class="serif">この章の、あなたのルーティン</h2><p class="sub">選んだ時間と予算の中で、いま組めるいちばんいい並びです。</p>';
        picks.forEach(function(pk){
          var it = catalogMap[pk.m.id];
          var cp = copyMap[pk.m.id] || '';
          html += '<article class="sf-step">';
          html += '<img src="images/catalog/' + it.id + '.webp" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">';
          html += '<div style="min-width:0;">';
          html += '<p class="role mono">' + STEP_LABEL[pk.st] + '</p>';
          html += '<p class="bname">' + esc(it.b) + '</p>';
          html += '<p class="pname serif">' + esc(it.n) + '</p>';
          html += '<p class="price">定価 ¥' + it.p.toLocaleString() + ' <small>税込・会員はサマーセール価格</small></p>';
          if (cp) html += '<p class="copy">' + esc(cp) + '</p>';
          if (pk.stretch) html += '<p class="rel">ご予算の枠より上ですが、この役割でいちばん手に取りやすい一本です。</p>';
          else if (pk.under) html += '<p class="rel">ご予算に余裕を残せる役割です。ここで浮いた分を「効かせる」に回すのが上手な配分。</p>';
          html += '</div></article>';
        });
        html += '</div>';
        html += '<div class="sf-cta fadein"><p class="serif" style="font-size:15px;">テクスチャーと香りは、店頭でたしかめられます。</p>';
        html += '<p>この画面をスタッフに見せていただければ<br>あなたの章に合わせて、その場でご案内します。</p>';
        html += '<a href="shop.html">お店の場所を見る →</a></div>';
        html += '<p class="sf-cross fadein">髪の物語も知りたくなったら → <a href="finder.html">髪格診断へ</a></p>';
        html += '<button class="sf-again" id="sfAgain">← もう一度、章をひらき直す</button>';
        box.innerHTML = html;
        $('sfAgain').onclick = function(){ idx = 0; ans = {}; show('sfIntro'); };
        try {
          navigator.sendBeacon && navigator.sendBeacon('/api/ev', JSON.stringify({ name:'skinfinder_complete', path:'/skinfinder', type:goal, device:(innerWidth<640?'mobile':'desktop') }));
        } catch(e){}
      }).catch(function(){
        box.innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;">読み込みに失敗しました。通信環境をご確認のうえ、もう一度お試しください。</p>';
      });
    }

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    $('sfStart').onclick = function(){
      show('sfQuiz'); renderQ();
      try { navigator.sendBeacon && navigator.sendBeacon('/api/ev', JSON.stringify({ name:'skinfinder_start', path:'/skinfinder' })); } catch(e){}
    };
    $('sfNext').onclick = next;
    $('sfBack').onclick = function(){ if (idx > 0) { idx--; renderQ(); } };
  })();
  </script>
