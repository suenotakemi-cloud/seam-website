    var CATS = ['cleanse','wash','lotion','serum','moist','special','lash','uv','foundation','inner'];

    /* ─────────── 肌タイプ判定・レーダー(言語非依存) ─────────── */
    function has(arr, k){ return Array.isArray(arr) && arr.indexOf(k) > -1; }
    // 5軸レーダー: 潤い/キメ/ハリ/透明感/守り を回答から算出(各1〜5)
    function computeRadar(a){
      var cns = a.concerns || [], fut = a.future || [];
      var r = { moisture:3.5, texture:3.5, firmness:3.5, clarity:3.5, barrier:3.5 };
      // 潤い
      if (a.base === 'dry') r.moisture -= 1.8;
      if (a.base === 'oily') r.moisture += 0.6;
      if (a.base === 'sensitive') r.moisture -= 0.6;
      if (a.hydration === 'low') r.moisture -= 1.4;
      else if (a.hydration === 'partial') r.moisture -= 0.7;
      else if (a.hydration === 'inner') r.moisture -= 1.2;
      else if (a.hydration === 'high') r.moisture += 1.0;
      if (has(cns, 'dry')) r.moisture -= 0.8;
      // キメ・毛穴
      if (has(cns, 'pore')) r.texture -= 1.8;
      if (a.base === 'oily') r.texture -= 0.7;
      if (a.base === 'combo') r.texture -= 0.4;
      if (has(cns, 'acne')) r.texture -= 0.8;
      if (has(fut, 'porefix')) r.texture -= 0.6;
      // ハリ
      if (has(cns, 'hari')) r.firmness -= 1.8;
      if (a.age === '40s') r.firmness -= 0.9;
      else if (a.age === '50s') r.firmness -= 1.6;
      else if (a.age === '30s') r.firmness -= 0.3;
      else if (a.age === '10s' || a.age === '20s') r.firmness += 0.6;
      if (has(fut, 'sag')) r.firmness -= 0.7;
      if (has(fut, 'dryline')) r.firmness -= 0.3;
      // 透明感
      if (has(cns, 'tone')) r.clarity -= 1.8;
      if (has(fut, 'spots')) r.clarity -= 0.7;
      if (a.age === '40s') r.clarity -= 0.4;
      else if (a.age === '50s') r.clarity -= 0.8;
      // 守り(バリア・安定)
      if (a.trouble === 'allergy') r.barrier -= 1.8;
      else if (a.trouble === 'ingredient') r.barrier -= 1.3;
      else if (a.trouble === 'seasonal') r.barrier -= 0.9;
      if (a.base === 'sensitive') r.barrier -= 1.0;
      if (has(cns, 'sensitive')) r.barrier -= 0.7;
      for (var k in r) r[k] = Math.max(1, Math.min(5, Math.round(r[k])));
      return r;
    }
    // 実像の肌タイプ(6型): 皮脂×水分を主軸に判定(トラブル歴は型でなく優先軸/見立てで扱う=髪格のダメージ=タグと同思想)
    function computeSkinType(a){
      if (a.base === 'sensitive') return 'SENS';         // ベースが敏感=ゆらぎ型
      if (a.hydration === 'inner') return 'INNER';       // テカるのに乾く=かくれ乾燥
      if (a.base === 'oily') return 'OILY';
      if (a.base === 'combo') return 'COMBO';
      if (a.base === 'dry' || a.hydration === 'low') return 'DRY';
      if (a.trouble === 'allergy') return 'SENS';        // 標準肌でも強いアレルギー歴だけはゆらぎ寄りに
      return 'NORMAL';
    }
    // いちばん弱い軸=優先課題(同点は 守り>潤い>ハリ>キメ>透明感 の順)
    function priorityAxis(r){
      var order = ['barrier', 'moisture', 'firmness', 'texture', 'clarity'];
      var best = order[0], bv = r[best];
      order.forEach(function(k){ if (r[k] < bv) { bv = r[k]; best = k; } });
      return best;
    }
    var PRIORITY_CAT = { moisture:'lotion', barrier:'moist', firmness:'serum', texture:'wash', clarity:'serum' };
    // 5角形レーダーSVG(値1〜5・ラベル配列)
    function radarSVG(vals, labels){
      var cx = 90, cy = 90, R = 60, n = 5;
      function pt(i, rad){ var ang = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)]; }
      var grid = '';
      [1, 2, 3, 4, 5].forEach(function(lv){
        var pts = vals.map(function(_, i){ return pt(i, R * lv / 5).map(function(x){ return x.toFixed(1); }).join(','); }).join(' ');
        grid += '<polygon points="' + pts + '" fill="none" stroke="rgba(184,148,90,' + (lv === 5 ? 0.35 : 0.14) + ')" stroke-width="1"/>';
      });
      var axes = '';
      vals.forEach(function(_, i){ var p = pt(i, R); axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="rgba(184,148,90,.18)" stroke-width="1"/>'; });
      var shape = vals.map(function(v, i){ return pt(i, R * Math.max(1, v) / 5).map(function(x){ return x.toFixed(1); }).join(','); }).join(' ');
      var dots = vals.map(function(v, i){ var p = pt(i, R * Math.max(1, v) / 5); return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.2" fill="#B8945A"/>'; }).join('');
      var labs = labels.map(function(lb, i){ var p = pt(i, R + 15); var anch = Math.abs(p[0] - cx) < 4 ? 'middle' : (p[0] > cx ? 'start' : 'end'); return '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 3).toFixed(1) + '" font-size="9.5" fill="#4A463F" text-anchor="' + anch + '" font-family="Noto Sans JP,sans-serif">' + lb + '</text>'; }).join('');
      return '<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="skin radar">' + grid + axes + '<polygon points="' + shape + '" fill="rgba(184,148,90,.22)" stroke="#B8945A" stroke-width="1.6"/>' + dots + labs + '</svg>';
    }

    function pickAll(){
      var goal = ans.goal || 'glow';
      var concerns = Array.isArray(ans.concerns) ? ans.concerns.filter(function(c){ return c !== 'none'; }) : [];
      var base = ans.base;
      if (base === 'dry' && concerns.indexOf('dry') < 0) concerns.push('dry');
      if (base === 'sensitive' && concerns.indexOf('sensitive') < 0) concerns.push('sensitive');
      if (base === 'oily' && concerns.indexOf('pore') < 0) concerns.push('pore');
      // トラブル歴(かゆみ・赤み/合わない成分)→敏感扱い+ドクターズ系を優先
      var troubled = (ans.trouble === 'allergy' || ans.trouble === 'ingredient');
      if (troubled && concerns.indexOf('sensitive') < 0) concerns.push('sensitive');
      // インナードライ(水分不足)→乾燥ケアも軸に
      if ((ans.hydration === 'inner' || ans.hydration === 'low') && concerns.indexOf('dry') < 0) concerns.push('dry');
      var DOCTOR = /ドクターソワ|JC |エクスバリア|アクネオ|インプレア/;
      var w = BUDGET[ans.budget] || BUDGET.b2;
      var dir = (ans.budget === 'b3' || ans.budget === 'b4') ? -1 : 1; // 高予算は同点なら上質側

      // なりたい→商品タグの対応(calm=敏感ケア等・タグ語彙に翻訳)
      var GOAL_KEYS = { glow:['glow','dry'], kime:['kime','pore'], hari:['hari'], tone:['tone'], calm:['sensitive'] };
      var gk = GOAL_KEYS[goal] || [goal];
      // 優先軸(いちばん弱い軸)のタグを微加点=結果を診断と一貫させる
      var PRI_TAG = { moisture:'dry', barrier:'sensitive', firmness:'hari', texture:'pore', clarity:'tone' };
      var priTag = PRI_TAG[priorityAxis(computeRadar(ans))];
      var brandUsed = {}; // ブランド露出制御(先に選ばれたブランドを軽く抑制→10カテゴリを多様化)
      function score(m){
        var s = 0;
        (m.c || []).forEach(function(c){
          if (gk.indexOf(c) > -1) s += 6;
          if (concerns.indexOf(c) > -1) s += 4;
          if (c === priTag) s += 3;
        });
        if ((m.c || []).length === 0) s += 1; // 汎用
        if (ans.time === 'quick' && m.quick) s += 3;
        if (concerns.indexOf('acne') > -1 && (m.c || []).indexOf('acne') > -1) s += 5; // ニキビは専用処方を最優先
        if (m.step === 'foundation' && m.f && m.f === ans.makeup) s += 7;             // 仕上がりの好み
        if (m.step === 'lash' && m.f && m.f === ans.lash) s += 7;                      // まつげの答え
        if (troubled && DOCTOR.test(catalogMap[m.id].n)) s += 5;                       // トラブル歴→クリニック発想・低刺激設計を前に
        s -= (brandUsed[catalogMap[m.id].b] || 0) * 2.5;                               // 既出ブランドは軽く後ろへ(多様性)
        return s;
      }
      var out = {};
      CATS.forEach(function(st){
        var cands = M.filter(function(m){ return m.step === st && catalogMap[m.id] && catalogMap[m.id].p; });
        if (!cands.length) { out[st] = []; return; }
        var price = function(m){ return catalogMap[m.id].p; };
        var inWin = [], under = [], over = [];
        cands.forEach(function(m){
          var p = price(m);
          if (p >= w.min && p <= w.max) inWin.push(m);
          else if (p < w.min) under.push(m);
          else over.push(m);
        });
        inWin.sort(function(a,b){ return score(b) - score(a) || (price(a) - price(b)) * dir; });
        under.sort(function(a,b){ return score(b) - score(a) || price(b) - price(a); });
        over.sort(function(a,b){ return price(a) - price(b); });
        var ordered = inWin.map(function(m){ return { m:m, over:false }; })
          .concat(under.map(function(m){ return { m:m, over:false }; }))
          .concat(over.map(function(m){ return { m:m, over:true }; }));
        out[st] = ordered.slice(0, 3);
        if (out[st][0]) { var b = catalogMap[out[st][0].m.id].b; brandUsed[b] = (brandUsed[b] || 0) + 1; }
      });

          vals = (Array.isArray(v) ? v : [v]).map(function(x){ return (lq.o[x] || {}).l || x || '—'; }).join('、');
        }
        html += '<tr><th>' + (L.sheetLabels[st.id] || st.id) + '</th><td>' + vals + '</td></tr>';
      });
      html += '</table>';
      html += '<p class="sh-notes"><b>' + L.sheetNotes + ':</b> ' + noteKeys.map(function(k){ return L.notes[k] ? L.notes[k].t : ''; }).filter(Boolean).join(' ／ ') + '</p>';
      html += '<p class="sh-hint">' + L.sheetHint + '</p>';
      html += '</div></details>';

      html += '<div class="sf-cta fadein"><p class="serif" style="font-size:15px;">' + L.ctaH + '</p>';
      html += '<p>' + L.ctaP + '</p>';
      html += '<a href="shop.html" data-sfcta="shop">' + L.ctaBtn + '</a></div>';
      html += '<p class="sf-cross fadein">' + L.cross + ' <a href="finder.html" data-sfcta="hairfinder">' + L.crossLink + '</a></p>';
      html += '<button class="sf-again" id="sfAgain">' + L.again + '</button>';
      box.innerHTML = html;
      $('sfAgain').onclick = function(){ idx = 0; ans = {}; lastResult = null; show('sfIntro'); };
    }

    /* 計測: seamTrack があれば正しい e/p 形式+流入属性で送る(無ければ生sendBeacon fallback) */
    function sfTrack(name, props){
      try {
        if (window.seamTrack) { window.seamTrack(name, props || {}); return; }
        var body = { e: name, p: '/skinfinder', device: (innerWidth < 640 ? 'mobile' : 'desktop') };
        if (props) for (var k in props) if (props[k] != null) body[k] = props[k];
        navigator.sendBeacon && navigator.sendBeacon('/api/ev', new Blob([JSON.stringify(body)], { type: 'application/json' }));
      } catch (e) {}
    }
    function csv(a){ return Array.isArray(a) ? a.filter(function(x){ return x !== 'none'; }).join(',') : ''; }

    function finish(){
      $('sfBar').style.width = '100%';
      show('sfResult');
      var box = $('sfResult');
      box.innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;font-size:13px;">' + T().loading + '</p>';
      loadData().then(function(){
        lastResult = { goal: ans.goal || 'glow', picks: pickAll() };
        renderResult();
        try { localStorage.setItem('seam_skin_last', JSON.stringify({ ans: ans })); } catch (e) {}
        try {
          // 髪格診断と同型の豊富なプロファイルをmetaで送る(肌タイプ=type、詳細=meta短縮キー)
          var rd = computeRadar(ans);
          var meta = {
            sty: computeSkinType(ans), pri: priorityAxis(rd),
            bse: ans.base, hyd: ans.hydration, trb: ans.trouble, age: ans.age,
            gl: ans.goal, bud: ans.budget, tm: ans.time, mk: ans.makeup, lsh: ans.lash, inn: ans.inner,
            cns: csv(ans.concerns), fut: csv(ans.future),
            // v5 追加(8問): 使用中/不満/UV/毛穴ニキビ/生活環境/1品上限/購入場所/美容医療
            cu: ans.current, cp: csv(ans.complaint), uv: ans.uv, pa: csv(ans.poreAcne),
            ls: csv(ans.lifestyle), sp: ans.spend, bp: csv(ans.buyPlace),
            // v6: cb=カテゴリ別予算(cat:band csv・skip=使わない) / bv=購入で大切にすること
            cb: (function(o){ o = o || {}; return Object.keys(o).map(function(k){ return k + ':' + o[k]; }).join(','); })(ans.catBudget),
            bv: csv(ans.buyValue),
            // v7: be=美容体験(menu:state csv・none/want/done) / cs=ケアのスタイル
            be: (function(o){ o = o || {}; return Object.keys(o).map(function(k){ return k + ':' + o[k]; }).join(','); })(ans.beautyExp),
            cs: ans.careStyle,
            rm: rd.moisture, rt: rd.texture, rf: rd.firmness, rc: rd.clarity, rb: rd.barrier
          };
          sfTrack('skinfinder_complete', { type: computeSkinType(ans), meta: meta });
        } catch(e){}
      }).catch(function(){
        box.innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;">' + T().error + '</p>';
      });
    }

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    $('sfStart').onclick = function(){
      show('sfQuiz'); renderQ();
      sfTrack('skinfinder_start');
    };
    $('sfNext').onclick = next;
    $('sfBack').onclick = function(){ if (idx > 0) { idx--; renderQ(); } };
    // 結果内CTAクリックを計測(店頭導線 / 髪格診断への相互送客)
    $('sfResult').addEventListener('click', function(e){
      var a = e.target && e.target.closest && e.target.closest('a[data-sfcta]');
      if (a) {
        var tgt = a.getAttribute('data-sfcta');
        // 髪格診断へワンタップ切替: 遷移先で前回カルテを自動表示させるフラグ
        if (tgt === 'hairfinder') { try { sessionStorage.setItem('seam_open_karte', '1'); } catch (e2) {} }
        sfTrack('skinfinder_cta', { target: tgt });
      }
    });

    /* 髪格診断からワンタップ切替で来たら 前回の肌診断結果を復元して表示 */
    try {
      if (sessionStorage.getItem('seam_open_skin') === '1') {
        sessionStorage.removeItem('seam_open_skin');
        var _skRaw = localStorage.getItem('seam_skin_last');
        if (_skRaw) {
          var _sk = JSON.parse(_skRaw);
          if (_sk && _sk.ans && Object.keys(_sk.ans).length) {
            ans = _sk.ans;
            show('sfResult');
            $('sfResult').innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;font-size:13px;">' + T().loading + '</p>';
            loadData().then(function(){ lastResult = { goal: ans.goal || 'glow', picks: pickAll() }; renderResult(); })
              .catch(function(){ ans = {}; show('sfIntro'); });
          }
        }
      }
    } catch (e) {}

    /* lang.js からの言語切替コールバック: 表示中の画面を描き直す */
    window.onLangChange = function(){
      if (visible('sfQuiz')) renderQ();
      else if (visible('sfResult') && lastResult) renderResult();
    };
  })();
  </script>
