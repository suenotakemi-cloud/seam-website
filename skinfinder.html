    function loadData(){
      var p1 = catalogMap ? Promise.resolve() : fetch('data/products/seam-catalog.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
        catalogMap = {};

      });

      return Promise.all([p1, p2]);

    /* ─────────── 選定ロジック(全カテゴリ×3点) ─────────── */
    var CATS = ['cleanse','wash','lotion','serum','moist','special','lash','uv','foundation','inner'];
    function startCatsByTime(){
      if (ans.time === 'quick') return ['cleanse','moist','uv'];
      if (ans.time === 'weekend') return ['wash','lotion','special'];
      if (ans.time === 'night') return ['cleanse','lotion','serum'];
      return ['lotion','serum','moist'];
    }
    function pickAll(){
      var goal = ans.goal || 'glow';
      var concerns = Array.isArray(ans.concerns) ? ans.concerns.filter(function(c){ return c !== 'none'; }) : [];
      var base = ans.base;
      if (base === 'dry' && concerns.indexOf('dry') < 0) concerns.push('dry');
      if (base === 'sensitive' && concerns.indexOf('sensitive') < 0) concerns.push('sensitive');
      if (base === 'oily' && concerns.indexOf('pore') < 0) concerns.push('pore');
      var w = BUDGET[ans.budget] || BUDGET.b2;
      var dir = (ans.budget === 'b3' || ans.budget === 'b4') ? -1 : 1; // 高予算は同点なら上質側

      // なりたい→商品タグの対応(calm=敏感ケア等・タグ語彙に翻訳)
      var GOAL_KEYS = { glow:['glow','dry'], kime:['kime','pore'], hari:['hari'], tone:['tone'], calm:['sensitive'] };
      var gk = GOAL_KEYS[goal] || [goal];
      function score(m){
        var s = 0;
        (m.c || []).forEach(function(c){
          if (gk.indexOf(c) > -1) s += 6;
          if (concerns.indexOf(c) > -1) s += 4;
        });
        if ((m.c || []).length === 0) s += 1; // 汎用
        if (ans.time === 'quick' && m.quick) s += 3;
        if (concerns.indexOf('acne') > -1 && (m.c || []).indexOf('acne') > -1) s += 5; // ニキビは専用処方を最優先
        if (m.step === 'foundation' && m.f && m.f === ans.makeup) s += 7;             // 仕上がりの好み
        if (m.step === 'lash' && m.f && m.f === ans.lash) s += 7;                      // まつげの答え
        return s;
      }
      var out = {};
      CATS.forEach(function(st){
        var cands = M.filter(function(m){ return m.step === st && catalogMap[m.id] && catalogMap[m.id].p; });
        if (!cands.length) { out[st] = []; return; }
        var price = function(m){ return catalogMap[m.id].p; };
        var inWin = [], under = [], over = [];
        cands.forEach(function(m){
          var p = price(m);
          if (p >= w.min && p <= w.max) inWin.push(m);
          else if (p < w.min) under.push(m);
          else over.push(m);
        });
        inWin.sort(function(a,b){ return score(b) - score(a) || (price(a) - price(b)) * dir; });
        under.sort(function(a,b){ return score(b) - score(a) || price(b) - price(a); });
        over.sort(function(a,b){ return price(a) - price(b); });
        var ordered = inWin.map(function(m){ return { m:m, over:false }; })
          .concat(under.map(function(m){ return { m:m, over:false }; }))
          .concat(over.map(function(m){ return { m:m, over:true }; }));
        out[st] = ordered.slice(0, 3);
      });
      return out;
    }

      var story = L.peak[ans.peak] + '<br>' + L.exp[ans.exp] + '<br>' + L.mem[ans.memory] + '<br>' + ty.story + L.closing;
      var box = $('sfResult');
      var html = '';
      html += '<div class="fadein" style="text-align:center;">';
      html += '<span class="sf-badge mono">' + L.badge + '</span>';
      html += '<h1 class="sf-type serif">' + ty.name + '</h1>';

      html += '<div class="sf-sec fadein"><h2 class="serif">' + L.routineH + '</h2><p class="sub">' + L.routineSub + '</p>';
      var startCats = startCatsByTime();
      html += '<p class="sf-startline">' + L.startLine.replace('%s', startCats.map(function(k){ return '<b>' + L.cats[k] + '</b>'; }).join('・')) + '</p>';
      CATS.forEach(function(st){
        var list = picks[st] || [];
        if (!list.length) return;
        html += '<section class="sf-cat">';
        html += '<h3 class="serif">' + L.cats[st] + (startCats.indexOf(st) > -1 ? ' <span class="sf-badgeS mono">' + L.badgeStart + '</span>' : '') + '</h3>';
        if (st === 'lash' && L.lashNote[ans.lash]) html += '<p class="sf-catnote">' + L.lashNote[ans.lash] + '</p>';
        if (st === 'inner' && L.innerNote[ans.inner]) html += '<p class="sf-catnote">' + L.innerNote[ans.inner] + '</p>';
        html += '<p class="sf-swipe">' + L.swipe + '</p>';
        html += '<div class="sf-slider">';
        list.forEach(function(pk){
          var it = catalogMap[pk.m.id];
          var cp = copyMap[pk.m.id] || '';
          html += '<article class="sf-card">';
          html += '<img src="images/catalog/' + it.id + '.webp" alt="" loading="eager" onerror="this.style.visibility=\'hidden\'">';
          html += '<p class="bname">' + esc(it.b) + '</p>';
          html += '<p class="pname serif">' + esc(it.n) + '</p>';
          html += '<p class="price">' + L.price + ' ¥' + it.p.toLocaleString() + ' <small>' + L.priceNote + '</small></p>';
          if (cp) html += '<p class="copy">' + esc(cp) + '</p>';
          if (pk.over) html += '<span class="sf-over">' + L.chipOver + '</span>';
          html += '</article>';
        });
        html += '</div></section>';
      });
      html += '</div>';
      html += '<div class="sf-cta fadein"><p class="serif" style="font-size:15px;">' + L.ctaH + '</p>';
      html += '<p>' + L.ctaP + '</p>';
      html += '<a href="shop.html">' + L.ctaBtn + '</a></div>';
      html += '<p class="sf-cross fadein">' + L.cross + ' <a href="finder.html">' + L.crossLink + '</a></p>';
      html += '<button class="sf-again" id="sfAgain">' + L.again + '</button>';
      box.innerHTML = html;
      $('sfAgain').onclick = function(){ idx = 0; ans = {}; lastResult = null; show('sfIntro'); };
    }

    function finish(){
      $('sfBar').style.width = '100%';
      show('sfResult');
      var box = $('sfResult');
      box.innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;font-size:13px;">' + T().loading + '</p>';
      loadData().then(function(){
        lastResult = { goal: ans.goal || 'glow', picks: pickAll() };
        renderResult();
        try {
          navigator.sendBeacon && navigator.sendBeacon('/api/ev', JSON.stringify({ name:'skinfinder_complete', path:'/skinfinder', type:lastResult.goal, device:(innerWidth<640?'mobile':'desktop') }));
        } catch(e){}
      }).catch(function(){
        box.innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;">' + T().error + '</p>';
      });
    }

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    $('sfStart').onclick = function(){
      show('sfQuiz'); renderQ();
      try { navigator.sendBeacon && navigator.sendBeacon('/api/ev', JSON.stringify({ name:'skinfinder_start', path:'/skinfinder' })); } catch(e){}
    };
    $('sfNext').onclick = next;
    $('sfBack').onclick = function(){ if (idx > 0) { idx--; renderQ(); } };

    /* lang.js からの言語切替コールバック: 表示中の画面を描き直す */
    window.onLangChange = function(){
      if (visible('sfQuiz')) renderQ();
      else if (visible('sfResult') && lastResult) renderResult();
    };
  })();
  </script>
