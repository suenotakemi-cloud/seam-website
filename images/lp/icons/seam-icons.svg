<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- ══════════════════════════════════════════════════════════════
     SEAM 線画アイコン（スプライト）
     使い方: <svg class="si"><use href="images/lp/icons/seam-icons.svg#si-headspa"/></svg>
     線は currentColor。太さは 1.4 で統一（採用ページのイラストと同じ細さ感）。
     viewBox は全て 0 0 32 32。塗りは使わない。
     ══════════════════════════════════════════════════════════════ -->
<defs>
  <style>
    symbol{overflow:visible}
    symbol path,symbol circle,symbol line,symbol ellipse,symbol polyline{
      fill:none;stroke:currentColor;stroke-width:1.4;
      stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  </style>
</defs>

<!-- ヘッドスパ: 頭を両手で包み、上からしずくが落ちる（16pxでも読める形） -->
<symbol id="si-headspa" viewBox="0 0 32 32">
  <circle cx="16" cy="19.2" r="6.4"/>
  <path d="M7.6 13.2c-1.8 1.6-2.6 3.6-2.4 6 .2 2.3 1.3 4.2 3.2 5.6"/>
  <path d="M24.4 13.2c1.8 1.6 2.6 3.6 2.4 6-.2 2.3-1.3 4.2-3.2 5.6"/>
  <path d="M16 3.4c1.9 2.3 2.9 4 2.9 5.2a2.9 2.9 0 0 1-5.8 0c0-1.2 1-2.9 2.9-5.2z"/>
</symbol>

<!-- カット: はさみ -->
<symbol id="si-cut" viewBox="0 0 32 32">
  <circle cx="8.5" cy="24" r="3.6"/>
  <circle cx="23.5" cy="24" r="3.6"/>
  <path d="M11 21.4 24.6 5.2"/>
  <path d="M21 21.4 7.4 5.2"/>
  <path d="m14.6 15.2 2.8 3.3"/>
</symbol>

<!-- カラー: 刷毛と色のしずく -->
<symbol id="si-color" viewBox="0 0 32 32">
  <path d="M18.4 4.6 27 13.2l-3.3 3.3a2.6 2.6 0 0 1-3.7 0l-4.9-4.9a2.6 2.6 0 0 1 0-3.7z"/>
  <path d="m16.6 15.4-9.2 9.2c-1 1-2.6 1-3.6 0s-1-2.6 0-3.6l9.2-9.2"/>
  <path d="M25 22c0 1.2 1 2.2 2.2 2.2s2.2-1 2.2-2.2c0-1.4-2.2-3.9-2.2-3.9S25 20.6 25 22z"/>
</symbol>

<!-- トリートメント: 一房の髪とつや -->
<symbol id="si-treatment" viewBox="0 0 32 32">
  <path d="M11 3.6c-3.4 4.6-4.4 9.4-3 14.4 1 3.6.6 6.6-1.2 9"/>
  <path d="M16.4 4.4c-2.6 5-3 9.8-1.2 14.4 1.2 3.2 1.2 6-.2 8.2"/>
  <path d="M21.8 6c-1.8 4.6-1.8 8.8 0 12.6 1.4 2.8 1.6 5.4.6 7.6"/>
  <path d="M26.4 10.6c.6.8.6 1.6 0 2.4"/>
  <path d="M28.4 15.6c.4.6.4 1.2 0 1.8"/>
</symbol>

<!-- 髪格診断: 一房の髪をレンズで見る -->
<symbol id="si-diagnosis" viewBox="0 0 32 32">
  <circle cx="13.6" cy="13.6" r="8.4"/>
  <path d="m19.8 19.8 6.4 6.4"/>
  <path d="M10.4 9.6c-1.4 2.6-1.4 5.2 0 7.8"/>
  <path d="M14 8.8c-1.8 3.2-1.8 6.4 0 9.6"/>
  <path d="M17.4 9.8c-1.2 2.4-1.2 4.8 0 7.2"/>
</symbol>

<!-- 予約: カレンダーにチェック -->
<symbol id="si-booking" viewBox="0 0 32 32">
  <path d="M5.6 8.6a2 2 0 0 1 2-2h16.8a2 2 0 0 1 2 2v15.8a2 2 0 0 1-2 2H7.6a2 2 0 0 1-2-2z"/>
  <path d="M5.6 12.6h20.8"/>
  <path d="M11 4.4v4.2M21 4.4v4.2"/>
  <path d="m11.8 19 3 3 5.4-5.8"/>
</symbol>

<!-- 会員証: カードとバーコード -->
<symbol id="si-member" viewBox="0 0 32 32">
  <path d="M4 9.4a2 2 0 0 1 2-2h20a2 2 0 0 1 2 2v13.2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
  <path d="M8.4 13.4h6.4"/>
  <path d="M8.4 17.2v3.4M11 17.2v3.4M13.6 17.2v3.4M16.2 17.2v3.4"/>
  <circle cx="22.4" cy="16" r="3"/>
  <path d="M19 21.6c.6-1.4 1.9-2.2 3.4-2.2s2.8.8 3.4 2.2"/>
</symbol>

<!-- 贈る: 手から手へ渡す -->
<symbol id="si-gift" viewBox="0 0 32 32">
  <path d="M3.4 20.6c2-1.6 3.8-2.2 5.4-1.8l3.4.8"/>
  <path d="M12.2 19.6h4.2c1 0 1.8.8 1.8 1.8s-.8 1.8-1.8 1.8h-3"/>
  <path d="M16.4 23.2c3.4 0 6-.8 7.8-2.4l3-2.6c.8-.7.9-1.7.3-2.4-.6-.7-1.6-.8-2.4-.2l-3.4 2.6"/>
  <path d="M11.6 12.4h9v-3.4h-9z"/>
  <path d="M16.1 9v3.4"/>
  <path d="M16.1 9c-.9-1.6-2-2.4-3.2-2.4-.9 0-1.6.7-1.6 1.5s.7 1.5 1.6 1.5z"/>
  <path d="M16.1 9c.9-1.6 2-2.4 3.2-2.4.9 0 1.6.7 1.6 1.5s-.7 1.5-1.6 1.5z"/>
</symbol>

<!-- 完全個室: 扉と静けさ -->
<symbol id="si-private" viewBox="0 0 32 32">
  <path d="M7.4 27.4V6.6a2 2 0 0 1 1.6-2l11-2.1a1.4 1.4 0 0 1 1.7 1.4v23a1.4 1.4 0 0 1-1.7 1.4l-11-2.1a2 2 0 0 1-1.6-2z"/>
  <path d="M4.4 27.4h21.4"/>
  <circle cx="17.6" cy="16" r=".9"/>
  <path d="M25 11.4c1.4 3 1.4 6.2 0 9.2"/>
</symbol>

<!-- 時間: 時計 -->
<symbol id="si-time" viewBox="0 0 32 32">
  <circle cx="16" cy="16.6" r="11.4"/>
  <path d="M16 9.8v6.8l4.4 2.8"/>
  <path d="M12.6 3.2h6.8"/>
</symbol>

<!-- 香り: 小瓶から立ちのぼる香り -->
<symbol id="si-scent" viewBox="0 0 32 32">
  <path d="M12.4 15.6a3.6 3.6 0 0 1 7.2 0v9.8a2 2 0 0 1-2 2h-3.2a2 2 0 0 1-2-2z"/>
  <path d="M14.2 12v-1.8h3.6V12"/>
  <path d="M20.8 19.4h-9.6"/>
  <path d="M23.4 12.6c-1.2-1.2-1.2-2.4 0-3.6s1.2-2.4 0-3.6"/>
  <path d="M27.2 14c-.9-.9-.9-1.8 0-2.7"/>
</symbol>

<!-- 水素バブル: 泡 -->
<symbol id="si-bubble" viewBox="0 0 32 32">
  <circle cx="13" cy="17.4" r="7.6"/>
  <circle cx="23.4" cy="10.6" r="4.2"/>
  <circle cx="22.6" cy="22.6" r="2.6"/>
  <path d="M9.4 14.2c.8-1.2 1.9-2 3.2-2.3"/>
</symbol>

<!-- water: しずく -->
<symbol id="si-water" viewBox="0 0 32 32">
  <path d="M16 3.6c4.6 5.4 8 10.1 8 14.2 0 4.6-3.6 8.2-8 8.2s-8-3.6-8-8.2c0-4.1 3.4-8.8 8-14.2z"/>
  <path d="M12.2 18.6c0 2.2 1.5 3.9 3.6 4.3"/>
</symbol>

<!-- スタッフ/担当: 人 -->
<symbol id="si-staff" viewBox="0 0 32 32">
  <circle cx="16" cy="10.6" r="5.4"/>
  <path d="M5.6 27.4c1.4-5.4 5.5-8.4 10.4-8.4s9 3 10.4 8.4"/>
</symbol>

<!-- 店舗: 建物 -->
<symbol id="si-store" viewBox="0 0 32 32">
  <path d="M5 13.4v13a1 1 0 0 0 1 1h20a1 1 0 0 0 1-1v-13"/>
  <path d="M3.4 13.4 6 5.6a1 1 0 0 1 .9-.7h18.2a1 1 0 0 1 .9.7l2.6 7.8"/>
  <path d="M3.4 13.4c0 1.8 1.4 3.2 3.2 3.2s3.2-1.4 3.2-3.2c0 1.8 1.4 3.2 3.2 3.2s3.2-1.4 3.2-3.2c0 1.8 1.4 3.2 3.2 3.2s3.2-1.4 3.2-3.2c0 1.8 1.4 3.2 3.2 3.2s3.2-1.4 3.2-3.2"/>
  <path d="M13 27.4v-7h6v7"/>
</symbol>

<!-- 矢印 -->
<symbol id="si-arrow" viewBox="0 0 32 32">
  <path d="M5.6 16h20.8"/>
  <path d="m19.4 9 7 7-7 7"/>
</symbol>
</svg>
