<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>受信箱｜salon.town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#86868B;--blue:#0071E3;--line:rgba(0,0,0,.08);--paper:#F5F5F7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .nav{max-width:1100px;margin:0 auto;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:700;letter-spacing:-.02em}
  .brand small{font-weight:500;color:var(--ink-3);margin-left:8px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .tools input{padding:9px 12px;border:1px solid #D2D2D7;border-radius:10px;font:inherit;font-size:.95rem;min-width:220px}
  .btn{padding:9px 14px;border-radius:999px;border:1px solid transparent;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border-color:#D2D2D7}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid #D2D2D7;background:#fff;font-size:.85rem;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .msg{font-size:.9rem;color:var(--ink-2);margin:8px 0 18px}
  .msg.err{color:#c0392b}
  .note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.9rem;color:var(--ink-2);margin-bottom:18px;line-height:1.7}
  .list{display:grid;gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
  .card.done{opacity:.55}
  .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--ink-3)}
  .src{font-weight:700;padding:3px 9px;border-radius:999px;font-size:.72rem;letter-spacing:.04em}
  .src.ai{background:#E8F1FF;color:#0056B3}
  .src.form{background:#EAF7EE;color:#1B7A3D}
  .who{font-weight:700;font-size:1.05rem;margin-top:2px}
  .who span{font-weight:500;color:var(--ink-2);margin-left:8px}
  .contact{font-size:.95rem;margin-top:2px}
  .contact b{font-weight:600}
  .body{color:var(--ink-2);font-size:.95rem;margin-top:8px;white-space:pre-wrap;line-height:1.7}
  .act{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .act button{white-space:nowrap}
  details{grid-column:1/-1;font-size:.9rem}
  summary{cursor:pointer;color:var(--blue);font-weight:500}
  .tr{margin-top:8px;display:grid;gap:6px}
  .tr div{padding:8px 12px;border-radius:12px;background:var(--paper);max-width:80%}
  .tr div.agent{justify-self:end;background:#E8F1FF}
  .tr small{display:block;color:var(--ink-3);font-size:.72rem;margin-bottom:2px}
  @media (max-width:640px){.card{grid-template-columns:1fr}.act{flex-direction:row;align-items:center}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">salon.town <small>受信箱</small></div><a class="btn ghost" href="./">サイトへ</a></div></header>
<main class="wrap">
  <div class="tools">
    <input id="key" type="password" placeholder="管理キー（ADMIN_KEY）" autocomplete="off">
    <button class="btn" id="load">読み込む</button>
    <button class="chip on" data-f="all">すべて</button>
    <button class="chip" data-f="ai">AI受付</button>
    <button class="chip" data-f="form">フォーム</button>
    <button class="chip" data-f="open">未対応のみ</button>
  </div>
  <p class="msg" id="msg">管理キーを入れて「読み込む」を押してください。キーはこの端末にだけ保存されます。</p>
  <div class="note" id="hook" hidden>AI受付の会話はまだ届いていません。ElevenLabs の Settings → Webhooks で <code>https://seam.site/api/salontown-ai-webhook</code> を登録し、発行された秘密鍵を Cloudflare Pages の環境変数 <code>ELEVENLABS_WEBHOOK_SECRET</code> に入れると、会話が終わるたびにここへ届きます。</div>
  <div class="list" id="list"></div>
</main>
<script>
(function(){
  var API='/api/salontown-inbox';
  var keyEl=document.getElementById('key'),msg=document.getElementById('msg'),list=document.getElementById('list'),hook=document.getElementById('hook');
  var data=[],filter='all';
  try{keyEl.value=localStorage.getItem('st_admin_key')||'';}catch(e){}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmt(t){if(!t)return '';var d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  var TYPE={salon:'サロン',dealer:'ディーラー',maker:'メーカー',media:'取材・メディア',other:'その他'};
  function render(){
    var rows=data.filter(function(x){return filter==='all'||(filter==='open'?!x.handled:x.source===filter);});
    if(!rows.length){list.innerHTML='<p class="msg">該当する問い合わせはありません。</p>';return;}
    list.innerHTML=rows.map(function(x,i){
      var who=esc(x.company||'')+(x.name?' <span>'+esc(x.name)+'</span>':'');
      if(!x.company&&!x.name)who='（名前なし）';
      var meta='<span class="src '+x.source+'">'+(x.source==='ai'?'AI受付':'フォーム')+'</span><span>'+fmt(x.at)+'</span>'+(x.type?'<span>'+esc(TYPE[x.type]||x.type)+'</span>':'')+(x.duration_secs?'<span>'+Math.round(x.duration_secs/60*10)/10+'分</span>':'')+(x.topic?'<span>'+esc(x.topic)+'</span>':'');
      var contact=(x.contact?'<div class="contact"><b>連絡先</b> '+esc(x.contact)+'</div>':'')+(x.prefer?'<div class="contact"><b>希望</b> '+esc(x.prefer)+'</div>':'');
      var body='<div class="body">'+esc(x.message||'')+'</div>';
      var tr=x.source==='ai'?'<details data-i="'+i+'"><summary>会話の全文を見る</summary><div class="tr" id="tr'+i+'">読み込み中…</div></details>':'';
      return '<div class="card'+(x.handled?' done':'')+'"><div><div class="top">'+meta+'</div><div class="who">'+who+'</div>'+contact+body+'</div><div class="act"><button class="btn'+(x.handled?' ghost':'')+'" data-i="'+i+'">'+(x.handled?'未対応に戻す':'対応済みにする')+'</button></div>'+tr+'</div>';
    }).join('');
  }
  function load(){
    var k=keyEl.value.trim(); if(!k){msg.className='msg err';msg.textContent='管理キーを入れてください';return;}
    try{localStorage.setItem('st_admin_key',k);}catch(e){}
    msg.className='msg';msg.textContent='読み込んでいます…';
    fetch(API,{headers:{'x-seam-key':k}}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){
      if(!x.ok){msg.className='msg err';msg.textContent=x.j.keyConfigured===false?'サーバーに ADMIN_KEY が設定されていません':'管理キーが違います';return;}
      data=x.j.entries||[];var ai=data.filter(function(e){return e.source==='ai';}).length;
      msg.textContent=data.length+'件（AI受付 '+ai+'、フォーム '+(data.length-ai)+'）。未対応 '+data.filter(function(e){return !e.handled;}).length+'件';
      hook.hidden=!!(x.j.webhookConfigured&&ai);if(x.j.webhookConfigured&&!ai)hook.hidden=true;if(!x.j.webhookConfigured)hook.hidden=false;
      render();
    }).catch(function(){msg.className='msg err';msg.textContent='読み込めませんでした';});
  }
  document.getElementById('load').addEventListener('click',load);
  keyEl.addEventListener('keydown',function(e){if(e.key==='Enter')load();});
  document.querySelectorAll('.chip').forEach(function(c){c.addEventListener('click',function(){document.querySelectorAll('.chip').forEach(function(d){d.classList.remove('on');});c.classList.add('on');filter=c.dataset.f;render();});});
  list.addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]');if(!b)return;var x=data[+b.dataset.i];
    fetch(API,{method:'PATCH',headers:{'content-type':'application/json','x-seam-key':keyEl.value.trim()},body:JSON.stringify({source:x.source,id:x.id,handled:!x.handled})})
      .then(function(r){if(r.ok){x.handled=!x.handled;render();}});
  });
  list.addEventListener('toggle',function(e){
    var d=e.target;if(d.tagName!=='DETAILS'||!d.open)return;var i=+d.dataset.i,x=data[i],box=document.getElementById('tr'+i);
    if(box.dataset.done)return;
    fetch(API+'?transcript='+encodeURIComponent(x.conversation_id),{headers:{'x-seam-key':keyEl.value.trim()}}).then(function(r){return r.json();}).then(function(j){
      var t=j.transcript||[];box.dataset.done='1';
      box.innerHTML=t.length?t.map(function(m){return '<div class="'+(m.role==='agent'?'agent':'user')+'"><small>'+(m.role==='agent'?'AI受付':'お客様')+(m.t!=null?' · '+Math.floor(m.t/60)+':'+('0'+(m.t%60)).slice(-2):'')+'</small>'+esc(m.text)+'</div>';}).join(''):'全文はありません';
    }).catch(function(){box.textContent='読み込めませんでした';});
  },true);
  if(keyEl.value)load();
})();
</script>
</body>
</html>
