<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>管理画面｜salon.town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#86868B;--blue:#0071E3;--green:#1B7A3D;--line:rgba(0,0,0,.08);--paper:#F5F5F7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .nav{max-width:1180px;margin:0 auto;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:700;letter-spacing:-.02em}
  .brand small{font-weight:500;color:var(--ink-3);margin-left:8px}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .tools input{padding:9px 12px;border:1px solid #D2D2D7;border-radius:10px;font:inherit;font-size:.95rem;min-width:220px}
  .btn{padding:9px 14px;border-radius:999px;border:1px solid transparent;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border-color:#D2D2D7}
  .btn.sm{padding:6px 12px;font-size:.85rem}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid #D2D2D7;background:#fff;font-size:.85rem;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .msg{font-size:.9rem;color:var(--ink-2);margin:6px 0 14px}
  .msg.err{color:#c0392b}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 20px;overflow-x:auto}
  .tab{padding:10px 14px;border:0;background:none;font:inherit;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .tab b{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#E8F1FF;color:#0056B3;font-size:.72rem;margin-left:6px;text-align:center}
  .pane{display:none}.pane.on{display:block}
  [hidden]{display:none!important}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .kpi small{display:block;color:var(--ink-3);font-size:.75rem;letter-spacing:.02em}
  .kpi b{display:block;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .kpi i{font-style:normal;font-size:.75rem;color:var(--ink-3)}
  .kpi i.up{color:var(--green)} .kpi i.down{color:#c0392b}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
  .card h3{font-size:.95rem;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
  .card h3 span{font-weight:500;color:var(--ink-3);font-size:.78rem}
  .note{font-size:.85rem;color:var(--ink-2);line-height:1.7}
  .note code{background:var(--paper);padding:1px 6px;border-radius:6px;font-size:.82rem}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th{font-weight:600;color:var(--ink-3);font-size:.75rem;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:6px;border-radius:3px;background:#E8F1FF;overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
  .bar.g i{background:var(--green)}
  .chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}
  .chart div{flex:1;max-width:48px;background:var(--blue);border-radius:3px 3px 0 0;min-width:4px;position:relative;opacity:.9}
  .chart div:hover{opacity:1}
  .chart div span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--ink-3);white-space:nowrap;display:none}
  .chart div:hover span{display:block}
  .axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-3);margin-top:4px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--paper);color:var(--ink-2);margin-right:4px}
  .tag.form{background:#EAF7EE;color:#1B7A3D}.tag.ai{background:#E8F1FF;color:#0056B3}.tag.scr{background:#FFF4E5;color:#9A5B00}.tag.nav{background:#F2F2F7;color:#555}.tag.lang{background:#F5E9FF;color:#6A2DA8}.tag.out{background:#FDECEC;color:#B03030}
  .empty{color:var(--ink-3);font-size:.9rem;padding:10px 0}
  /* 受信箱 */
  .list{display:grid;gap:12px}
  .icard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
  .icard.done{opacity:.55}
  .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--ink-3)}
  .src{font-weight:700;padding:3px 9px;border-radius:999px;font-size:.72rem;letter-spacing:.04em}
  .src.ai{background:#E8F1FF;color:#0056B3}.src.form{background:#EAF7EE;color:#1B7A3D}
  .who{font-weight:700;font-size:1.05rem;margin-top:2px}.who span{font-weight:500;color:var(--ink-2);margin-left:8px}
  .contact{font-size:.95rem;margin-top:2px}.contact b{font-weight:600}
  .body{color:var(--ink-2);font-size:.95rem;margin-top:8px;white-space:pre-wrap;line-height:1.7}
  .act{display:flex;flex-direction:column;gap:8px;align-items:flex-end}.act button{white-space:nowrap}
  details{grid-column:1/-1;font-size:.9rem}summary{cursor:pointer;color:var(--blue);font-weight:500}
  .tr{margin-top:8px;display:grid;gap:6px}.tr div{padding:8px 12px;border-radius:12px;background:var(--paper);max-width:80%}
  .tr div.agent{justify-self:end;background:#E8F1FF}.tr small{display:block;color:var(--ink-3);font-size:.72rem;margin-bottom:2px}
  @media (max-width:640px){.icard{grid-template-columns:1fr}.act{flex-direction:row;align-items:center}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">salon.town <small>管理画面</small></div><div style="display:flex;gap:8px"><button class="btn ghost sm" id="logout" type="button" hidden>キーを消す</button><a class="btn ghost sm" href="./">サイトへ</a></div></div></header>
<main class="wrap">
  <div class="tools" id="login">
    <input id="key" type="password" placeholder="管理キー" autocomplete="off">
    <button class="btn" id="load" type="button">ログイン</button>
  </div>
  <div class="tools" id="period" hidden>
    <span style="font-size:.85rem;color:var(--ink-3)">期間</span>
    <button class="chip" data-d="1" type="button">今日</button>
    <button class="chip" data-d="7" type="button">7日</button>
    <button class="chip on" data-d="30" type="button">30日</button>
    <button class="chip" data-d="90" type="button">90日</button>
    <button class="chip" data-d="365" type="button">1年</button>
    <button class="btn ghost sm" id="reload" type="button" style="margin-left:auto">更新</button>
  </div>
  <p class="msg" id="msg">管理キーを入れてログインしてください。キーはこの端末にだけ保存されます。</p>
  <div class="tabs" id="tabs" hidden>
    <button class="tab on" data-t="overview" type="button">概要</button>
    <button class="tab" data-t="pages" type="button">ページ</button>
    <button class="tab" data-t="interest" type="button">興味（章ごと）</button>
    <button class="tab" data-t="source" type="button">流入経路</button>
    <button class="tab" data-t="inbox" type="button">受信箱<b id="openN" hidden>0</b></button>
  </div>
  <section class="pane on" id="p-overview"></section>
  <section class="pane" id="p-pages"></section>
  <section class="pane" id="p-interest"></section>
  <section class="pane" id="p-source"></section>
  <section class="pane" id="p-inbox">
    <div class="tools">
      <button class="chip on" data-f="all" type="button">すべて</button>
      <button class="chip" data-f="open" type="button">未対応のみ</button>
      <button class="chip" data-f="form" type="button">フォーム</button>
      <button class="chip" data-f="ai" type="button">AI受付</button>
    </div>
    <p class="msg" id="imsg"></p>
    <div class="list" id="list"></div>
  </section>
</main>
<script>
(function(){
  var EV='/api/salontown-ev', INBOX='/api/salontown-inbox';
  var keyEl=document.getElementById('key'),msg=document.getElementById('msg'),tabs=document.getElementById('tabs');
  var days=30, stats=null, inbox=[], ifilter='all', key='';
  try{keyEl.value=localStorage.getItem('st_admin_key')||'';}catch(e){}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function n(v){return (Number(v)||0).toLocaleString('ja-JP');}
  function fmt(t){if(!t)return '';var d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  function secs(s){s=Math.round(Number(s)||0);return s>=60?Math.floor(s/60)+'分'+('0'+(s%60)).slice(-2)+'秒':s+'秒';}
  var SEC={hdr:'ヘッダー',platform:'冒頭（悩みを解決する）',problems:'悩みと解決の一覧',screens:'実際の画面',reserve:'Salon Town Booking（予約）',ec:'店販EC',dealer:'ディーラー様向け',
    'dealer-support':'ディーラー支援（連携・撮影・AI）',b2b:'卸EC',ai:'AI',security:'セキュリティ',shift:'シフト',cases:'導入例','for':'こんな方へ',vision:'ビジョン',faq:'よくある質問',news:'お知らせ',company:'会社概要',contact:'お問い合わせフォーム',footer:'フッター'};
  var PAGE={'/salontown/':'トップ','/salontown/screens.html':'実際の画面','/salontown/contact.html':'AI受付'};
  var KIND={cta_form:['form','フォームへ'],cta_ai:['ai','AI受付へ'],cta_screens:['scr','画面を見る'],nav:['nav','ページ内移動'],lang:['lang','言語切替'],outbound:['out','外部リンク']};
  var TYPE={salon:'サロン',dealer:'ディーラー',maker:'メーカー',media:'取材・メディア',other:'その他'};
  function page(p){return PAGE[p]||p;}
  function sec(id){return SEC[id]||id;}
  function diff(a,b){a=Number(a)||0;b=Number(b)||0;if(!b)return '<i>前の期間: 0</i>';var d=Math.round((a-b)/b*100);return '<i class="'+(d>0?'up':d<0?'down':'')+'">前の期間比 '+(d>0?'+':'')+d+'%（'+n(b)+'）</i>';}
  function bar(v,max,g){var w=max?Math.round(v/max*100):0;return '<div class="bar'+(g?' g':'')+'"><i style="width:'+w+'%"></i></div>';}
  function table(head,rows,empty){if(!rows.length)return '<p class="empty">'+(empty||'まだデータがありません')+'</p>';return '<div style="overflow-x:auto"><table><thead><tr>'+head.map(function(h){return '<th'+(h[1]?' class="n"':'')+'>'+h[0]+'</th>';}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';}
  function card(title,sub,body){return '<div class="card"><h3>'+title+(sub?'<span>'+sub+'</span>':'')+'</h3>'+body+'</div>';}

  function renderOverview(s){
    var t=s.totals||{},ib=s.inbox||{};
    var html='<div class="kpis">'
      +'<div class="kpi"><small>ページ表示</small><b>'+n(t.pv)+'</b>'+diff(t.pv,s.prev&&s.prev.pv)+'</div>'
      +'<div class="kpi"><small>訪問者（端末）</small><b>'+n(t.visitors)+'</b>'+diff(t.visitors,s.prev&&s.prev.visitors)+'</div>'
      +'<div class="kpi"><small>訪問回数</small><b>'+n(t.sessions)+'</b>'+diff(t.sessions,s.prev&&s.prev.sessions)+'</div>'
      +'<div class="kpi"><small>平均滞在</small><b>'+secs(t.avg_dur)+'</b><i>平均で'+(Math.round(t.avg_depth)||0)+'%まで読まれた</i></div>'
      +'<div class="kpi"><small>相談ボタン</small><b>'+n(t.cta_form)+'</b><i>AI受付へ '+n(t.cta_ai)+'・画面を見る '+n(t.cta_screens)+'</i></div>'
      +'<div class="kpi"><small>受信（フォーム / AI）</small><b>'+n(ib.form)+' / '+n(ib.ai)+'</b><i>未対応 '+n(ib.open)+'件'+(ib.ai_avg_secs?'・AI平均'+secs(ib.ai_avg_secs):'')+'</i></div>'
      +'</div>';
    var d=s.daily||[],max=Math.max.apply(null,[1].concat(d.map(function(x){return x.pv;})));
    html+=card('日別のページ表示','日本時間',d.length?'<div class="chart">'+d.map(function(x){return '<div style="height:'+Math.max(2,Math.round(x.pv/max*100))+'%"><span>'+x.d.slice(5)+'：'+n(x.pv)+'表示・'+n(x.visitors)+'人</span></div>';}).join('')+'</div><div class="axis"><span>'+d[0].d+'</span><span>'+d[d.length-1].d+'</span></div>':'<p class="empty">まだデータがありません</p>');
    var h=s.hours||[],hm=Math.max.apply(null,[1].concat(h.map(function(x){return x.pv;})));var hs=[];for(var i=0;i<24;i++){var f=h.filter(function(x){return x.h===i;})[0];hs.push(f?f.pv:0);}
    html+='<div class="grid">'+card('時間帯別','どの時間に見られているか','<div class="chart" style="height:90px">'+hs.map(function(v,i){return '<div style="height:'+Math.max(2,Math.round(v/hm*100))+'%"><span>'+i+'時：'+n(v)+'</span></div>';}).join('')+'</div><div class="axis"><span>0時</span><span>12時</span><span>23時</span></div>');
    var dv=s.device||[],dm=Math.max.apply(null,[1].concat(dv.map(function(x){return x.sessions;})));
    var lg=s.lang||[];
    html+=card('端末と言語','訪問回数',table([['端末'],['訪問',1],['']],dv.map(function(x){return '<tr><td>'+({mobile:'スマホ',desktop:'パソコン',tablet:'タブレット'}[x.device]||x.device||'不明')+'</td><td class="n">'+n(x.sessions)+'</td><td>'+bar(x.sessions,dm)+'</td></tr>';}))+'<div style="height:10px"></div>'+table([['言語'],['訪問',1]],lg.map(function(x){return '<tr><td>'+(x.lang==='en'?'英語':x.lang==='ja'?'日本語':x.lang||'不明')+'</td><td class="n">'+n(x.sessions)+'</td></tr>';})))+'</div>';
    if(!s.tracking)html+='<div class="card note">まだ計測データがありません。サイトが表示されると自動で保存が始まります（D1 に <code>salontown_events</code> テーブルが自動で作られます）。</div>';
    document.getElementById('p-overview').innerHTML=html;
  }
  function renderPages(s){
    var p=s.pages||[],max=Math.max.apply(null,[1].concat(p.map(function(x){return x.pv;})));
    var html=card('ページ別','表示数・訪問者・平均滞在・読了率',table([['ページ'],['表示',1],['訪問者',1],['平均滞在',1],['読了',1],['']],p.map(function(x){return '<tr><td>'+esc(page(x.path))+'<br><small style="color:var(--ink-3)">'+esc(x.path)+'</small></td><td class="n">'+n(x.pv)+'</td><td class="n">'+n(x.visitors)+'</td><td class="n">'+secs(x.avg_dur)+'</td><td class="n">'+(x.avg_depth!=null?Math.round(x.avg_depth)+'%':'—')+'</td><td>'+bar(x.pv,max)+'</td></tr>';})));
    var l=s.landing||[],lm=Math.max.apply(null,[1].concat(l.map(function(x){return x.sessions;})));
    html+=card('最初に開かれたページ（入口）','訪問回数',table([['入口'],['訪問',1],['']],l.map(function(x){return '<tr><td>'+esc(page(x.landing.split('?')[0]))+' <small style="color:var(--ink-3)">'+esc(x.landing)+'</small></td><td class="n">'+n(x.sessions)+'</td><td>'+bar(x.sessions,lm,1)+'</td></tr>';})));
    document.getElementById('p-pages').innerHTML=html;
  }
  function renderInterest(s){
    var sc=s.sections||[],max=Math.max.apply(null,[1].concat(sc.map(function(x){return x.views;})));
    var html='<div class="card note">章ごとに「画面に3割以上映っていた時間」を足し上げています。<b>見た訪問数</b>が多い章は目に留まっている章、<b>平均滞在</b>が長い章は読み込まれている章、<b>ボタン</b>はその章の中で押された相談ボタン等の回数です。</div>';
    html+=card('章ごとの興味','見た訪問数の多い順',table([['ページ / 章'],['見た訪問',1],['合計滞在',1],['平均滞在',1],['ボタン',1],['']],sc.map(function(x){return '<tr><td><small style="color:var(--ink-3)">'+esc(page(x.path))+'</small><br>'+esc(sec(x.section))+'</td><td class="n">'+n(x.views)+'</td><td class="n">'+secs(x.total_dur)+'</td><td class="n">'+secs(x.avg_dur)+'</td><td class="n">'+n(x.clicks)+'</td><td>'+bar(x.views,max)+'</td></tr>';})));
    var c=s.clicks||[],cm=Math.max.apply(null,[1].concat(c.map(function(x){return x.n;})));
    html+=card('押されたボタン・リンク','回数の多い順',table([['種類'],['ボタン'],['場所'],['回数',1],['']],c.map(function(x){var k=KIND[x.kind]||['nav',x.kind];return '<tr><td><span class="tag '+k[0]+'">'+esc(k[1])+'</span></td><td>'+esc(x.label)+'</td><td><small>'+esc(page(x.path))+' / '+esc(sec(x.section))+'</small></td><td class="n">'+n(x.n)+'</td><td>'+bar(x.n,cm)+'</td></tr>';})));
    var t=s.totals||{};
    html+=card('相談までの流れ','期間内の合計','<div class="kpis"><div class="kpi"><small>訪問回数</small><b>'+n(t.sessions)+'</b></div><div class="kpi"><small>相談ボタンを押した</small><b>'+n(t.cta_form)+'</b></div><div class="kpi"><small>フォーム送信</small><b>'+n(t.form_sent)+'</b></div><div class="kpi"><small>AI受付を開始</small><b>'+n(t.ai_start)+'</b><i>最後まで '+n(t.ai_end)+'</i></div></div>');
    document.getElementById('p-interest').innerHTML=html;
  }
  function renderSource(s){
    var r=s.refs||[],rm=Math.max.apply(null,[1].concat(r.map(function(x){return x.sessions;})));
    var html='<div class="card note">流入元は、リンク元のサイト名か UTM（<code>?utm_source=…</code>）か配布用の <code>?src=…</code> で分けています。名刺・チラシ・QR には <code>https://seam.site/salontown/?src=meishi</code> のように付けると、どの配布物から来たか分かります。</div>';
    html+=card('流入元','訪問回数の多い順',table([['流入元'],['訪問',1],['訪問者',1],['']],r.map(function(x){return '<tr><td>'+esc(x.source)+'</td><td class="n">'+n(x.sessions)+'</td><td class="n">'+n(x.visitors)+'</td><td>'+bar(x.sessions,rm)+'</td></tr>';})));
    var rc=s.refConv||[],rcm=Math.max.apply(null,[1].concat(rc.map(function(x){return x.sessions;})));
    html+='<div class="grid">'+card('相談につながった流入元','相談ボタン・フォーム送信・AI受付をした訪問',table([['流入元'],['訪問',1],['']],rc.map(function(x){return '<tr><td>'+esc(x.source)+'</td><td class="n">'+n(x.sessions)+'</td><td>'+bar(x.sessions,rcm,1)+'</td></tr>';}),'まだ相談行動がありません'));
    var u=s.utm||[];
    html+=card('UTM（広告・メール・SNS投稿など）','設定した分だけ出ます',table([['source'],['medium'],['campaign'],['訪問',1]],u.map(function(x){return '<tr><td>'+esc(x.utm_source)+'</td><td>'+esc(x.utm_medium)+'</td><td>'+esc(x.utm_campaign)+'</td><td class="n">'+n(x.sessions)+'</td></tr>';}),'UTM付きの訪問はまだありません'))+'</div>';
    var c=s.country||[];
    html+=card('国・地域','訪問回数',table([['国'],['訪問',1]],c.map(function(x){return '<tr><td>'+esc(x.country||'不明')+'</td><td class="n">'+n(x.sessions)+'</td></tr>';})));
    document.getElementById('p-source').innerHTML=html;
  }
  function renderInbox(){
    var list=document.getElementById('list'),im=document.getElementById('imsg');
    var rows=inbox.filter(function(x){return ifilter==='all'||(ifilter==='open'?!x.handled:x.source===ifilter);});
    var ai=inbox.filter(function(e){return e.source==='ai';}).length,open=inbox.filter(function(e){return !e.handled;}).length;
    im.textContent=inbox.length+'件（フォーム '+(inbox.length-ai)+'、AI受付 '+ai+'）。未対応 '+open+'件';
    var on=document.getElementById('openN');on.textContent=open;on.hidden=!open;
    if(!rows.length){list.innerHTML='<p class="empty">該当する問い合わせはありません。</p>';return;}
    list.innerHTML=rows.map(function(x,i){
      var idx=inbox.indexOf(x);
      var who=esc(x.company||'')+(x.name?' <span>'+esc(x.name)+'</span>':'');if(!x.company&&!x.name)who='（名前なし）';
      var meta='<span class="src '+x.source+'">'+(x.source==='ai'?'AI受付':'フォーム')+'</span><span>'+fmt(x.at)+'</span>'+(x.type?'<span>'+esc(TYPE[x.type]||x.type)+'</span>':'')+(x.duration_secs?'<span>'+Math.round(x.duration_secs/60*10)/10+'分</span>':'')+(x.topic?'<span>'+esc(x.topic)+'</span>':'')+(x.lang==='en'?'<span>英語</span>':'');
      var contact=(x.contact?'<div class="contact"><b>連絡先</b> '+esc(x.contact)+'</div>':'')+(x.prefer?'<div class="contact"><b>希望</b> '+esc(x.prefer)+'</div>':'');
      var tr=x.source==='ai'?'<details data-i="'+idx+'"><summary>会話の全文を見る</summary><div class="tr" id="tr'+idx+'">読み込み中…</div></details>':'';
      return '<div class="icard'+(x.handled?' done':'')+'"><div><div class="top">'+meta+'</div><div class="who">'+who+'</div>'+contact+'<div class="body">'+esc(x.message||'')+'</div></div><div class="act"><button class="btn'+(x.handled?' ghost':'')+'" data-i="'+idx+'" type="button">'+(x.handled?'未対応に戻す':'対応済みにする')+'</button></div>'+tr+'</div>';
    }).join('');
  }
  function api(url){return fetch(url,{headers:{'x-seam-key':key}}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,j:j};});});}
  function load(){
    key=keyEl.value.trim(); if(!key){msg.className='msg err';msg.textContent='管理キーを入れてください';return;}
    msg.className='msg';msg.textContent='読み込んでいます…';
    Promise.all([api(EV+'?days='+days),api(INBOX)]).then(function(r){
      var a=r[0],b=r[1];
      if(!a.ok){msg.className='msg err';msg.textContent=a.j.keyConfigured===false?'サーバーに ADMIN_KEY / STAFF_KEY が設定されていません（Cloudflare Pages の Variables and secrets に追加してください）':a.status===401?'管理キーが違います':'読み込めませんでした';return;}
      try{localStorage.setItem('st_admin_key',key);}catch(e){}
      stats=a.j; inbox=b.ok?(b.j.entries||[]):[];
      document.getElementById('login').hidden=true;document.getElementById('period').hidden=false;tabs.hidden=false;document.getElementById('logout').hidden=false;
      var d=new Date(stats.generatedAt);
      msg.textContent=(stats.role==='staff'?'担当者キー':'管理キー')+'でログイン中。'+(days===1?'今日':'直近'+days+'日')+'の集計（'+fmt(d)+' 時点）';
      renderOverview(stats);renderPages(stats);renderInterest(stats);renderSource(stats);renderInbox();
    }).catch(function(){msg.className='msg err';msg.textContent='読み込めませんでした';});
  }
  document.getElementById('load').addEventListener('click',load);
  document.getElementById('reload').addEventListener('click',load);
  keyEl.addEventListener('keydown',function(e){if(e.key==='Enter')load();});
  document.getElementById('logout').addEventListener('click',function(){try{localStorage.removeItem('st_admin_key');}catch(e){}location.reload();});
  document.querySelectorAll('#period .chip').forEach(function(c){c.addEventListener('click',function(){document.querySelectorAll('#period .chip').forEach(function(d){d.classList.remove('on');});c.classList.add('on');days=+c.dataset.d;load();});});
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(d){d.classList.remove('on');});t.classList.add('on');document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+t.dataset.t);});try{location.hash=t.dataset.t;}catch(e){}});});
  document.querySelectorAll('#p-inbox .chip').forEach(function(c){c.addEventListener('click',function(){document.querySelectorAll('#p-inbox .chip').forEach(function(d){d.classList.remove('on');});c.classList.add('on');ifilter=c.dataset.f;renderInbox();});});
  var list=document.getElementById('list');
  list.addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]');if(!b)return;var x=inbox[+b.dataset.i];
    fetch(INBOX,{method:'PATCH',headers:{'content-type':'application/json','x-seam-key':key},body:JSON.stringify({source:x.source,id:x.id,handled:!x.handled})})
      .then(function(r){if(r.ok){x.handled=!x.handled;renderInbox();}});
  });
  list.addEventListener('toggle',function(e){
    var d=e.target;if(d.tagName!=='DETAILS'||!d.open)return;var i=+d.dataset.i,x=inbox[i],box=document.getElementById('tr'+i);
    if(box.dataset.done)return;
    api(INBOX+'?transcript='+encodeURIComponent(x.conversation_id)).then(function(r){
      var t=(r.j&&r.j.transcript)||[];box.dataset.done='1';
      box.innerHTML=t.length?t.map(function(m){return '<div class="'+(m.role==='agent'?'agent':'user')+'"><small>'+(m.role==='agent'?'AI受付':'お客様')+(m.t!=null?' · '+Math.floor(m.t/60)+':'+('0'+(m.t%60)).slice(-2):'')+'</small>'+esc(m.text)+'</div>';}).join(''):'全文はありません';
    }).catch(function(){box.textContent='読み込めませんでした';});
  },true);
  var h=(location.hash||'').slice(1);if(h){var tb=document.querySelector('.tab[data-t="'+h+'"]');if(tb)tb.click();}
  if(keyEl.value)load();
})();
</script>
</body>
</html>
