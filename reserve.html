<!DOCTYPE html>
<html lang="ja"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SEAM｜ご予約</title>
  <meta name="description" content="SEAM のヘアサロンとヘッドスパのご予約 銀座 大阪 札幌 福岡 名古屋">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://seam.site/reserve">
  <meta name="theme-color" content="#0E1013">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="SEAM｜ご予約">
  <meta property="og:image" content="https://seam.site/images/stores/headspa_ginza_room.jpg">
  <link rel="icon" href="/favicon.ico">
  <link rel="preload" as="image" href="images/stores/headspa_ginza_room.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Shippori+Mincho:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0E1013;--line:rgba(233,230,225,.14);--on:#E9E6E1;--sub:#B9B3AA;--cu:#D2A57A}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--ink);color:var(--on);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    /* 予約ボタンから来た人が スクロールせずに店を選べる（1画面） */
    .rv{height:100dvh;min-height:560px;max-height:960px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:0 12px max(12px,env(safe-area-inset-bottom,0px))}
    .rv-head{text-align:center;padding:14px 0 4px}
    .rv-head b{display:block;font:500 22px/1 "Cormorant Garamond",serif;letter-spacing:.42em;padding-left:.42em;color:#fff}
    .rv-head span{display:block;margin-top:6px;font:400 16px/1.4 "Shippori Mincho","Noto Serif JP",serif;letter-spacing:.12em;color:var(--on)}
    .rv-sec{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#1b1d21}
    .rv-sec>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .rv-sec:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,11,13,.94) 0%,rgba(10,11,13,.6) 50%,rgba(10,11,13,.15) 100%)}
    .rv-in{position:relative;z-index:1;padding:14px 14px 14px}
    .rv-in small{display:block;font:500 11px/1.4 "Cormorant Garamond",serif;letter-spacing:.3em;color:var(--cu)}
    .rv-in h2{margin:4px 0 2px;font:500 21px/1.4 "Shippori Mincho","Noto Serif JP",serif;color:#fff}
    .rv-in p{margin:0 0 10px;font-size:11.5px;line-height:1.6;color:var(--on);opacity:.85}
    .rv-st{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px}
    .rv-st a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border:1px solid rgba(210,165,122,.6);background:rgba(14,16,19,.55);font-size:14px;letter-spacing:.06em;color:#fff;touch-action:manipulation;transition:background .2s,color .2s}
    .rv-st a small{font:400 10px/1.3 "Noto Sans JP",sans-serif;letter-spacing:.02em;color:var(--sub);margin-top:2px}
    .rv-st a:active,.rv-st a:hover{background:var(--cu);color:var(--ink)}
    .rv-st a:active small,.rv-st a:hover small{color:var(--ink)}
    .rv-note{text-align:center;font-size:10.5px;line-height:1.6;color:var(--sub);padding:2px 0 0}
    .rv-note a{border-bottom:1px solid var(--line)}
    a:focus-visible{outline:2px solid var(--cu);outline-offset:3px}
    .rv-sec{animation:rvIn .7s ease backwards}.rv-sec+.rv-sec{animation-delay:.1s}
    @keyframes rvIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.rv-sec{animation:none}}

    .lg{display:flex;justify-content:center;gap:4px;margin-top:8px}
    .lg button{min-width:30px;min-height:30px;padding:0 5px;border:1px solid transparent;background:none;color:var(--sub);font:500 11px/1 "Noto Sans JP",sans-serif;letter-spacing:.04em;cursor:pointer;border-radius:0}
    .lg button[aria-pressed="true"]{color:#fff;border-color:rgba(210,165,122,.7)}
    .lg button:focus-visible{outline:2px solid var(--cu);outline-offset:1px}
    /* 読みやすく（10/5） */
    .rv-sec:after{background:linear-gradient(0deg,rgba(8,9,11,.95) 0%,rgba(8,9,11,.75) 40%,rgba(8,9,11,.25) 72%,rgba(8,9,11,.08) 100%)!important}
    .rv-in small{color:#E8C9A4;text-shadow:0 1px 8px rgba(0,0,0,.6)}
    .rv-in h2{text-shadow:0 1px 14px rgba(0,0,0,.55)}
    .rv-in p{color:#F3EFE9;opacity:1;text-shadow:0 1px 8px rgba(0,0,0,.6)}
    .rv-st a{background:rgba(10,11,13,.68)}
    .rv-st a small{color:#D6CFC5}
  </style>
</head>
<body>
<main class="rv">
  <header class="rv-head"><b>SEAM</b><span data-i18n="r.title">ご予約</span><nav class="lg" aria-label="Language"><button type="button" data-l="ja">JP</button><button type="button" data-l="en">EN</button><button type="button" data-l="zh">简</button><button type="button" data-l="tw">繁</button><button type="button" data-l="ko">KR</button></nav></header>

  <section class="rv-sec" aria-labelledby="rv-salon">
    <img src="images/stores/headspa_ginza_room.webp" alt="" fetchpriority="high" decoding="async">
    <div class="rv-in">
      <small>Hair salon</small>
      <h2 id="rv-salon" data-i18n="l.salon">ヘアサロン</h2>
      <p data-i18n="l.salon.p">美しくなる時間も 空間も わたしだけのもの</p>
      <div class="rv-st" style="--n:4">
        <a href="https://beauty.hotpepper.jp/slnH000802192/" data-track-click="reserve_salon_ginza"><span data-i18n="l.ginza">銀座</span><small data-i18n="l.private">完全個室</small></a>
        <a href="https://beauty.hotpepper.jp/slnH000791476/" data-track-click="reserve_salon_osaka"><span data-i18n="l.osaka">大阪</span><small data-i18n="l.private">完全個室</small></a>
        <a href="https://beauty.hotpepper.jp/slnH000417753/" data-track-click="reserve_salon_sapporo"><span data-i18n="l.sapporo">札幌</span><small data-i18n="l.semi">半個室</small></a>
        <a href="https://beauty.hotpepper.jp/slnH000734442/" data-track-click="reserve_salon_fukuoka"><span data-i18n="l.fukuoka">福岡</span><small data-i18n="l.semi">半個室</small></a>
      </div>
    </div>
  </section>

  <section class="rv-sec" aria-labelledby="rv-spa">
    <img src="images/stores/salon_ginza_room.webp" alt="" decoding="async">
    <div class="rv-in">
      <small>Head spa</small>
      <h2 id="rv-spa" data-i18n="l.spa">ヘッドスパ</h2>
      <p data-i18n="l.spa.p">頭から疲れが抜けて 全身がほぐれる</p>
      <div class="rv-st" style="--n:3">
        <a href="https://beauty.hotpepper.jp/kr/slnH000802373/" data-track-click="reserve_spa_ginza"><span data-i18n="l.ginza">銀座</span><small data-i18n="l.private">完全個室</small></a>
        <a href="https://beauty.hotpepper.jp/kr/slnH000791418/" data-track-click="reserve_spa_osaka"><span data-i18n="l.osaka">大阪</span><small data-i18n="l.private">完全個室</small></a>
        <a href="https://beauty.hotpepper.jp/kr/slnH000800971/" data-track-click="reserve_spa_nagoya"><span data-i18n="l.nagoya">名古屋</span><small data-i18n="l.yaba">矢場町</small></a>
      </div>
    </div>
  </section>

  <p class="rv-note" data-i18n="r.note">店舗を選ぶと 予約の画面に進みます ／ <a href="links.html">ショップ・その他</a></p>
</main>

<script>
/* 言語：選んだ言語は seamLang に保存し サイトのどのページでもその言語のまま（lang.js と同じ仕組み）
   初めての人で 端末の言語が日本語以外なら その言語で開く */
(function(){var K='seamLang',S=['ja','en','zh','tw','ko'];
 function saved(){try{return localStorage.getItem(K);}catch(e){return null;}}
 if(!saved()){var n=(navigator.language||'ja').toLowerCase(),g=n.indexOf('ja')===0?'ja':n.indexOf('ko')===0?'ko':/zh-(tw|hk|hant)/.test(n)?'tw':n.indexOf('zh')===0?'zh':'en';try{localStorage.setItem(K,g);}catch(e){}}
 function mark(l){document.querySelectorAll('.lg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false');});}
 document.addEventListener('DOMContentLoaded',function(){mark(saved()||'ja');
  document.querySelectorAll('.lg button').forEach(function(b){b.addEventListener('click',function(){if(window.SEAM_LANG)window.SEAM_LANG.apply(b.dataset.l);else{try{localStorage.setItem(K,b.dataset.l);}catch(e){}}mark(b.dataset.l);if(window.seamTrack)window.seamTrack('sec_click',{label:'links_lang_'+b.dataset.l});});});});
})();
</script>

</body></html>
