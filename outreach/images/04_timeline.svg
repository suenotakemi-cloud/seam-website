<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="IPAPGothic, 'Noto Sans JP', sans-serif">
  <rect width="1600" height="760" fill="#F8FAFC"/>
  <text x="80" y="80" font-size="36" font-weight="bold" fill="#0F172A">逆算スケジュール（特集号の原稿締切＝D）</text>
  <text x="80" y="118" font-size="18" fill="#334155">実際の締切日が決まったら D に日付を入れて読み替える。ディーラー先行打診→プレス→業界誌→ディーラー本送信の順。</text>

  <!-- axis: weeks D-8 .. D+3 : 12 cols, col width 100, start x=440 -->
  <g font-size="15" fill="#64748B" text-anchor="middle">
    <text x="490" y="170">D-8週</text><text x="590" y="170">D-7</text><text x="690" y="170">D-6</text><text x="790" y="170">D-5</text><text x="890" y="170">D-4</text><text x="990" y="170">D-3</text><text x="1090" y="170">D-2</text><text x="1190" y="170">D-1</text><text x="1290" y="170" fill="#0369A1" font-weight="bold">D 締切</text><text x="1390" y="170">D+1</text><text x="1490" y="170">D+2</text>
  </g>
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="440" y1="180" x2="440" y2="700"/><line x1="540" y1="180" x2="540" y2="700"/><line x1="640" y1="180" x2="640" y2="700"/><line x1="740" y1="180" x2="740" y2="700"/><line x1="840" y1="180" x2="840" y2="700"/><line x1="940" y1="180" x2="940" y2="700"/><line x1="1040" y1="180" x2="1040" y2="700"/><line x1="1140" y1="180" x2="1140" y2="700"/><line x1="1340" y1="180" x2="1340" y2="700"/><line x1="1440" y1="180" x2="1440" y2="700"/><line x1="1540" y1="180" x2="1540" y2="700"/>
  </g>
  <line x1="1240" y1="180" x2="1240" y2="700" stroke="#0369A1" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- rows -->
  <g font-size="17" fill="#0F172A">
    <text x="80" y="220">編集部に締切を電話確認</text>
    <rect x="440" y="200" width="100" height="30" rx="6" fill="#0369A1"/>

    <text x="80" y="270">【要記入】確定・事実の突合</text>
    <rect x="440" y="250" width="200" height="30" rx="6" fill="#0369A1"/>

    <text x="80" y="320">連絡先の再確認（メール7社・フォーム24社）</text>
    <rect x="540" y="300" width="200" height="30" rx="6" fill="#0369A1"/>

    <text x="80" y="370">ディーラー先行打診（優先度1の18社）</text>
    <rect x="640" y="350" width="200" height="30" rx="6" fill="#0EA5E9"/>

    <text x="80" y="420">リリース本文確定・図版・画面キャプチャ</text>
    <rect x="740" y="400" width="200" height="30" rx="6" fill="#0369A1"/>

    <text x="80" y="470">業界誌に取材依頼（媒体別）</text>
    <rect x="840" y="450" width="200" height="30" rx="6" fill="#0EA5E9"/>

    <text x="80" y="520">取材対応・原稿確認</text>
    <rect x="1040" y="500" width="200" height="30" rx="6" fill="#0EA5E9"/>

    <text x="80" y="570">PR TIMES 配信（Web媒体へ同日送付）</text>
    <rect x="1040" y="550" width="100" height="30" rx="6" fill="#0369A1"/>

    <text x="80" y="620">ディーラー本送信（優先度2〜3）＋フォロー</text>
    <rect x="1140" y="600" width="300" height="30" rx="6" fill="#0EA5E9"/>

    <text x="80" y="670">誌面掲載後の再送・面談化</text>
    <rect x="1340" y="650" width="200" height="30" rx="6" fill="#64748B"/>
  </g>

  <text x="80" y="730" font-size="14" fill="#64748B">濃い青＝社内作業、明るい青＝対外接触、灰＝掲載後。PR TIMES 配信は「特集号の発売日の前後」ではなく「編集部の校了前」に置くと記事に反映されやすい〔要確認：媒体ごとの校了日〕。</text>
</svg>
