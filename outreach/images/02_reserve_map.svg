<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="IPAPGothic, 'Noto Sans JP', sans-serif">
  <rect width="1600" height="1000" fill="#F8FAFC"/>
  <text x="80" y="80" font-size="40" font-weight="bold" fill="#0F172A">サロンタウンリザーブ 機能マップ</text>
  <text x="80" y="120" font-size="19" fill="#334155">予約から会計・カルテ・再来までがひとつの顧客台帳につながる。一人サロンは「つかう機能をえらぶ」で必要なものだけを表示。</text>

  <!-- flow strip -->
  <g font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="80" y="160" width="220" height="56" rx="28" fill="#0369A1"/><text x="190" y="195">予約</text>
    <rect x="330" y="160" width="220" height="56" rx="28" fill="#0369A1"/><text x="440" y="195">来店前のご希望</text>
    <rect x="580" y="160" width="220" height="56" rx="28" fill="#0369A1"/><text x="690" y="195">カウンセリング・施術</text>
    <rect x="830" y="160" width="220" height="56" rx="28" fill="#0369A1"/><text x="940" y="195">会計・店販</text>
    <rect x="1080" y="160" width="220" height="56" rx="28" fill="#0369A1"/><text x="1190" y="195">次回予約・再来</text>
    <rect x="1330" y="160" width="190" height="56" rx="28" fill="#0369A1"/><text x="1425" y="195">招待制EC</text>
  </g>
  <g stroke="#0369A1" stroke-width="3">
    <line x1="300" y1="188" x2="330" y2="188"/><line x1="550" y1="188" x2="580" y2="188"/><line x1="800" y1="188" x2="830" y2="188"/><line x1="1050" y1="188" x2="1080" y2="188"/><line x1="1300" y1="188" x2="1330" y2="188"/>
  </g>

  <!-- cards: 3 columns x 3 rows -->
  <g font-size="16" fill="#334155">
    <!-- row1 -->
    <rect x="80" y="260" width="460" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="104" y="296" font-size="20" font-weight="bold" fill="#0F172A">予約導線</text>
    <text x="104" y="330">・Web／LINE内（LIFF）／会員証QRで3ステップ予約</text>
    <text x="104" y="358">・確定シフト・実予約ベースの空き表示、指名なしは自動割当</text>
    <text x="104" y="386">・隙間なく埋まる枠に特典、詰めのお願いは強制しない</text>
    <text x="104" y="414">・LINE／Google／メールOTPの本人確認、5言語対応</text>
    <text x="104" y="442">・HPB・楽天・minimoの予約メール取込、サロンボード書込</text>

    <rect x="570" y="260" width="460" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="594" y="296" font-size="20" font-weight="bold" fill="#0F172A">前金・キャンセル</text>
    <text x="594" y="330">・Squareでカード事前決済（3Dセキュア、カード情報非保持）</text>
    <text x="594" y="358">・金額はサーバーで再計算、予約失敗時は自動返金</text>
    <text x="594" y="386">・残日数に応じた段階式キャンセル料</text>
    <text x="594" y="414">・無断キャンセル歴のある方は前金必須</text>
    <text x="594" y="442">・国内は定額、海外のお客様は料率で設定</text>

    <rect x="1060" y="260" width="460" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1084" y="296" font-size="20" font-weight="bold" fill="#0F172A">来店前「今日のご希望」</text>
    <text x="1084" y="330">・強さ・部位・香り・音・アレルギーを選ぶだけで設計図に</text>
    <text x="1084" y="358">・担当者の画面にアレルギーを最上段で表示</text>
    <text x="1084" y="386">・2回目以降は「前回と同じ、ここだけ違う」</text>
    <text x="1084" y="414">・施術後、担当の一言が翌朝お客様に届く</text>
    <text x="1084" y="442">・お持ち帰りの1枚（その方の言語で）</text>

    <!-- row2 -->
    <rect x="80" y="490" width="460" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="104" y="526" font-size="20" font-weight="bold" fill="#0F172A">カウンセリング・カルテ</text>
    <text x="104" y="560">・iPadで記入・手書き署名、写真・音声の同意を出し分け</text>
    <text x="104" y="588">・薬剤・量・比率・放置時間を音声入力、バーコードで薬剤登録</text>
    <text x="104" y="616">・予約・会計・シート・診断・同意を1枚の顧客カルテに</text>
    <text x="104" y="644">・髪質診断の結果があれば重複質問を省く</text>
    <text x="104" y="672">・多言語表示、保存は常に日本語</text>

    <rect x="570" y="490" width="460" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="594" y="526" font-size="20" font-weight="bold" fill="#0F172A">レジ・店販・在庫</text>
    <text x="594" y="560">・iPadレジ：JAN・会員QR読取、6決済手段、返品・返金</text>
    <text x="594" y="588">・Squareターミナル連携、お客様画面で支払方法を自ら選択</text>
    <text x="594" y="616">・会計・在庫・ポイントを1リクエストで確定（二重決済防止）</text>
    <text x="594" y="644">・免税会計（2026年11月のリファンド方式へ自動切替）</text>
    <text x="594" y="672">・店舗別在庫・棚卸し・仕入先別発注書・在庫アラート</text>

    <rect x="1060" y="490" width="460" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1084" y="526" font-size="20" font-weight="bold" fill="#0F172A">LINE会員証・再来</text>
    <text x="1084" y="560">・LINE会員証（QR／バーコード）、ランク・ポイント</text>
    <text x="1084" y="588">・月額会員の休会・解約は2タップ、回数券の1回を贈れる</text>
    <text x="1084" y="616">・会計直後に施術周期から次回予約を提案</text>
    <text x="1084" y="644">・予約確認・前日リマインド・再来おすすめの抽出</text>
    <text x="1084" y="672">・お帰りぎわの推薦度1問、口コミは美容師が承認</text>

    <!-- row3 -->
    <rect x="80" y="720" width="460" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="104" y="756" font-size="20" font-weight="bold" fill="#0F172A">スタッフ・シフト・給与</text>
    <text x="104" y="790">・スマホで希望提出・打刻、歩合ゲージと今月の内訳</text>
    <text x="104" y="818">・段階式歩合の自動計算、給与CSV出力</text>
    <text x="104" y="846">・有給の年5日・時間有給の上限を画面とサーバーで管理</text>
    <text x="104" y="874">・消えない申し送り板、モデル募集</text>

    <rect x="570" y="720" width="460" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="594" y="756" font-size="20" font-weight="bold" fill="#0F172A">オーナー・事務画面</text>
    <text x="594" y="790">・売上：支払内訳・担当別・商品と利益・再来率・時間帯</text>
    <text x="594" y="818">・幹部画面は「今日、合っているか」だけを色で表示</text>
    <text x="594" y="846">・一人サロン向けに不要な画面を消せる</text>
    <text x="594" y="874">・自社ポイント・会員ランク・ギフト券・回数券</text>

    <rect x="1060" y="720" width="460" height="180" rx="14" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/>
    <text x="1084" y="756" font-size="20" font-weight="bold" fill="#0F172A">守りの設計</text>
    <text x="1084" y="790">・お客様が触る端末には限定トークンだけを置く</text>
    <text x="1084" y="818">・お客様モードでは管理画面を物理的に消す</text>
    <text x="1084" y="846">・会員番号だけでは名簿を引けない、カード情報は持たない</text>
    <text x="1084" y="874">・招待制ECの会員と同じ番号で入場・ポイント・レジが動く</text>
  </g>

  <text x="80" y="960" font-size="14" fill="#64748B">SEAM各店で稼働中の仕組みをもとに、個人・一人サロン向けに提供準備中〔提供時期・名称は要確認〕。図：株式会社サロンタウン</text>
</svg>
