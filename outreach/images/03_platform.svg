<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="IPAPGothic, 'Noto Sans JP', sans-serif">
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <text x="80" y="86" font-size="40" font-weight="bold" fill="#0F172A">ひとつの基盤の上に、予約・EC・POS・顧客・在庫をつなぐ</text>
  <text x="80" y="128" font-size="20" fill="#334155">ツールごとに分断された二重入力と転記ミスをなくす。データは自然に一か所へ集まる。</text>

  <!-- top layer: front-ends -->
  <g font-size="18" fill="#0F172A" text-anchor="middle">
    <rect x="80" y="200" width="270" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="215" y="250" font-size="22" font-weight="bold">サロンタウンリザーブ</text>
    <text x="215" y="284" fill="#334155">予約・事前カウンセリング</text>
    <text x="215" y="310" fill="#334155">前金・LINE連携</text>

    <rect x="370" y="200" width="270" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="505" y="250" font-size="22" font-weight="bold">招待制クローズドEC</text>
    <text x="505" y="284" fill="#334155">店舗が招待した会員だけが買える</text>
    <text x="505" y="310" fill="#334155">担当者ひも付け・AIレコメンド</text>

    <rect x="660" y="200" width="270" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="795" y="250" font-size="22" font-weight="bold">B2B卸EC</text>
    <text x="795" y="284" fill="#334155">掛け払い・契約単価</text>
    <text x="795" y="310" fill="#334155">まとめ発注・再注文</text>

    <rect x="950" y="200" width="270" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1085" y="250" font-size="22" font-weight="bold">POS・会計</text>
    <text x="1085" y="284" fill="#334155">施術・店販・サブスク</text>
    <text x="1085" y="310" fill="#334155">キャッシュレス・日次締め</text>

    <rect x="1240" y="200" width="280" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1380" y="250" font-size="22" font-weight="bold">シフト・給与</text>
    <text x="1380" y="284" fill="#334155">スマホで希望・打刻</text>
    <text x="1380" y="310" fill="#334155">自動作成・歩合の見える化</text>
  </g>

  <!-- connectors -->
  <g stroke="#0369A1" stroke-width="3">
    <line x1="215" y1="330" x2="215" y2="420"/>
    <line x1="505" y1="330" x2="505" y2="420"/>
    <line x1="795" y1="330" x2="795" y2="420"/>
    <line x1="1085" y1="330" x2="1085" y2="420"/>
    <line x1="1380" y1="330" x2="1380" y2="420"/>
  </g>

  <!-- platform bar -->
  <rect x="80" y="420" width="1440" height="150" rx="16" fill="#0369A1"/>
  <text x="800" y="475" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">salon.town プラットフォーム</text>
  <g font-size="18" fill="#E0F2FE" text-anchor="middle">
    <text x="260" y="530">顧客・カルテ</text>
    <text x="530" y="530">会員・担当者</text>
    <text x="800" y="530">商品・在庫・自動発注</text>
    <text x="1070" y="530">売上・分配</text>
    <text x="1340" y="530">認証・テナント分離</text>
  </g>

  <!-- bottom: infra / security -->
  <g font-size="17" fill="#334155">
    <rect x="80" y="620" width="700" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="110" y="660" font-size="20" font-weight="bold" fill="#0F172A">技術スタック</text>
    <text x="110" y="698">TypeScript / React / Next.js / Node.js / PostgreSQL</text>
    <text x="110" y="728">Cloudflare / PWA / LINE API / Stripe</text>

    <rect x="820" y="620" width="700" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="850" y="660" font-size="20" font-weight="bold" fill="#0F172A">守りの設計</text>
    <text x="850" y="698">認証・テナント分離・通信と保存の暗号化・監査ログと削除の仕組み</text>
    <text x="850" y="728">会員登録はサロンから500m以内・OTP発行から1分以内に限定</text>
  </g>

  <text x="80" y="840" font-size="14" fill="#64748B">出典：salon.town「開発力」「What we build」／2025年12月11日発表リリース　図：株式会社サロンタウン</text>
</svg>
