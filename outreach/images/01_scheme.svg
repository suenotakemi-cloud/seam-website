<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="IPAPGothic, 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F8FAFC"/>

  <!-- title -->
  <text x="80" y="86" font-size="40" font-weight="bold" fill="#0F172A">在庫を持たない店販の役割分担</text>
  <text x="80" y="128" font-size="20" fill="#334155">物流・在庫はディーラー、ECシステムと会員管理はサロンタウン。メーカー規約に沿った正規流通のまま、美容師一人ひとりが自分専用のECを持てる。</text>

  <!-- boxes -->
  <g>
    <rect x="80" y="220" width="300" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="230" y="270" font-size="26" font-weight="bold" fill="#0F172A" text-anchor="middle">メーカー</text>
    <text x="230" y="312" font-size="17" fill="#334155" text-anchor="middle">サロン専売品</text>
    <text x="230" y="342" font-size="17" fill="#334155" text-anchor="middle">流通規約</text>
    <text x="230" y="392" font-size="15" fill="#64748B" text-anchor="middle">正規ルートが維持される</text>
  </g>

  <g>
    <rect x="460" y="220" width="320" height="200" rx="16" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/>
    <text x="620" y="270" font-size="26" font-weight="bold" fill="#0F172A" text-anchor="middle">ディーラー</text>
    <text x="620" y="312" font-size="17" fill="#334155" text-anchor="middle">在庫を持つ</text>
    <text x="620" y="342" font-size="17" fill="#334155" text-anchor="middle">出荷・物流を担う</text>
    <text x="620" y="392" font-size="15" fill="#0369A1" text-anchor="middle">既存の商流・サロンとの関係はそのまま</text>
  </g>

  <g>
    <rect x="860" y="200" width="380" height="240" rx="16" fill="#0369A1"/>
    <text x="1050" y="252" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">サロンタウン</text>
    <text x="1050" y="296" font-size="17" fill="#E0F2FE" text-anchor="middle">ECシステム</text>
    <text x="1050" y="326" font-size="17" fill="#E0F2FE" text-anchor="middle">会員管理・担当者へのひも付け</text>
    <text x="1050" y="356" font-size="17" fill="#E0F2FE" text-anchor="middle">予約（サロンタウンリザーブ）</text>
    <text x="1050" y="386" font-size="17" fill="#E0F2FE" text-anchor="middle">売上の分配</text>
    <text x="1050" y="422" font-size="15" fill="#BAE6FD" text-anchor="middle">同じ基盤の上で開発</text>
  </g>

  <g>
    <rect x="1320" y="220" width="200" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1420" y="270" font-size="26" font-weight="bold" fill="#0F172A" text-anchor="middle">お客様</text>
    <text x="1420" y="312" font-size="17" fill="#334155" text-anchor="middle">招待制ECで購入</text>
    <text x="1420" y="342" font-size="17" fill="#334155" text-anchor="middle">自宅へ配送</text>
  </g>

  <!-- bottom: salon / stylist -->
  <g>
    <rect x="460" y="560" width="780" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="850" y="608" font-size="26" font-weight="bold" fill="#0F172A" text-anchor="middle">サロン／美容師一人ひとり</text>
    <text x="850" y="650" font-size="17" fill="#334155" text-anchor="middle">在庫を持たない。梱包も発送もしない。</text>
    <text x="850" y="680" font-size="17" fill="#334155" text-anchor="middle">来店時に会員登録（サロンから500m以内・OTP発行から1分以内）し、施術履歴に基づいて商品を案内する</text>
    <text x="850" y="716" font-size="15" fill="#0369A1" text-anchor="middle">売上は会員バーコードで担当者にひも付き、販売手数料として分配される</text>
  </g>

  <!-- arrows: goods flow (top) -->
  <line x1="380" y1="320" x2="458" y2="320" stroke="#0369A1" stroke-width="3" marker-end="url(#arr)"/>
  <text x="419" y="300" font-size="14" fill="#0369A1" text-anchor="middle">商品</text>

  <path d="M780,300 C 1000,120 1200,120 1420,218" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1100" y="185" font-size="16" fill="#0369A1" text-anchor="middle">ディーラーから直接配送</text>

  <!-- arrows: data / order flow -->
  <line x1="1318" y1="330" x2="1242" y2="330" stroke="#64748B" stroke-width="3" marker-end="url(#arrg)"/>
  <text x="1280" y="356" font-size="14" fill="#64748B" text-anchor="middle">注文</text>

  <line x1="858" y1="330" x2="782" y2="330" stroke="#64748B" stroke-width="3" marker-end="url(#arrg)"/>
  <text x="820" y="356" font-size="14" fill="#64748B" text-anchor="middle">出荷指示</text>

  <line x1="1050" y1="442" x2="1050" y2="558" stroke="#64748B" stroke-width="3" marker-start="url(#arrg)" marker-end="url(#arrg)"/>
  <text x="1070" y="505" font-size="14" fill="#64748B">会員・売上データ／担当者ひも付け</text>

  <line x1="620" y1="422" x2="620" y2="558" stroke="#0369A1" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="640" y="505" font-size="14" fill="#0369A1">既存の取引関係</text>

  <path d="M1420,422 C 1420,520 1300,600 1242,640" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrg)"/>
  <text x="1380" y="560" font-size="14" fill="#64748B">来店・会員登録</text>

  <!-- footer -->
  <text x="80" y="820" font-size="14" fill="#64748B">出典：株式会社サロンタウン 2025年12月11日発表「美容師一人ひとりに“自分専用EC”を」／salon.town</text>
  <text x="80" y="846" font-size="14" fill="#64748B">図：株式会社サロンタウン</text>
</svg>
