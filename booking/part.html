<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>きょうの働き｜SEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   アルバイト・業務委託の画面

   ★開く理由は2つだけ。「打つ」ことと「いくらになったか見る」こと。
     だから他のものを置かない。カルテもお客様も出さない。
   ★金額は大きく出す。これが次の日の入りを変える。
   ★ただし「概算」と必ず一緒に出す。確定の給与として見せて、
     締めの金額と違ったときに失うのは、数字ではなく信用のほう。
   ══════════════════════════════════════════════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#F7F4EF;color:#2f2a24;font-family:'Noto Sans JP',system-ui,sans-serif;
  font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 70px}
header{padding:16px;text-align:center;border-bottom:1px solid #e7e1d5;background:#fff}
header .b{font-family:'Noto Serif JP',serif;letter-spacing:.32em;font-size:13px;color:#7a6f60}
header .n{font-size:15px;font-weight:700;margin-top:2px}
.hero{background:#12100E;color:#EFE9DF;border-radius:18px;padding:22px 20px;margin:16px 0 12px;
  text-align:center}
.hero .k{font-size:12.5px;color:rgba(239,233,223,.65);font-weight:700}
.hero .v{font-family:'Noto Serif JP',serif;font-size:46px;line-height:1.1;margin:4px 0 2px;
  font-variant-numeric:tabular-nums}
.hero .s{font-size:12.5px;color:rgba(239,233,223,.6);line-height:1.8}
.pc{background:#fff;border:1px solid #ece5d9;border-radius:16px;padding:18px 16px;margin-bottom:12px}
.pc-h{font-size:12px;font-weight:700;color:#8a8177;margin-bottom:10px}
.pc-now{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.pc-now b{font-family:'Noto Serif JP',serif;font-size:30px;line-height:1}
.pc-now span{font-size:12.5px;color:#8a8177}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.b{background:none;border:1px solid #ddd5c8;border-radius:12px;padding:17px 8px;
  font:inherit;font-size:16px;font-weight:700;color:#2f2a24;cursor:pointer;min-height:58px}
.b.go{background:#12100E;color:#fff;border-color:#12100E}
.b:disabled{opacity:.4}
.s{font-size:12px;color:#8a8177;line-height:1.8;margin-top:11px}
.card{background:#fff;border:1px solid #ece5d9;border-radius:16px;padding:16px;margin-bottom:12px}
.ttl{font-size:12px;font-weight:700;color:#8a8177;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.row .c{text-align:center}
.row b{display:block;font-family:'Noto Serif JP',serif;font-size:20px;
  font-variant-numeric:tabular-nums}
.row span{font-size:11px;color:#8a8177}
.li{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid #f2ede4;font-size:14px}
.li:first-of-type{border-top:0}
.li .g{flex:1}
.li .m{font-family:'Noto Serif JP',serif;font-size:17px;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:#8a8177;line-height:1.9;margin-top:10px}
.warn{color:#B4302B;font-weight:700}
.gate{max-width:400px;margin:40px auto;padding:0 20px}
.gate input{width:100%;padding:14px;border:1px solid #ddd5c8;border-radius:11px;
  font:inherit;font-size:22px;text-align:center;letter-spacing:.4em}
.gate button{width:100%;margin-top:10px;background:#12100E;color:#fff;border:0;border-radius:12px;
  padding:16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.who{display:grid;gap:8px;margin-top:12px}
.who button{background:#fff;border:1px solid #ddd5c8;border-radius:12px;padding:16px;
  font:inherit;font-size:16px;cursor:pointer;text-align:left}
.err{color:#B4302B;font-size:13.5px;margin-top:10px}
</style>
</head>
<body>
<header><div class="b">SEAM</div><div class="n" id="nm">きょうの働き</div></header>
<div class="wrap"><div id="app"></div></div>
<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(+n||0).toLocaleString();
const jst=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const DAY=jst();
const Q=new URLSearchParams(location.search);
let TOK=localStorage.getItem('stb_staff_tok')||'';
let ME={id:localStorage.getItem('stb_staff_id')||'',name:localStorage.getItem('stb_staff_nm')||''};
const U=p=>API+p+(p.includes('?')?'&':'?')+'stok='+encodeURIComponent(TOK);
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const tmMin=iso=>{const d=new Date(Date.parse(iso)+9*3600e3);return d.getUTCHours()*60+d.getUTCMinutes();};

let PUN=null, PAY=null;
async function load(){
  if(!TOK)return login();
  $('app').innerHTML='<p class="note" style="margin-top:30px">読み込んでいます…</p>';
  try{
    const [a,b]=await Promise.all([
      fetch(U(`/punch/day?date=${DAY}`)).then(r=>r.json()),
      fetch(U('/pay/me')).then(r=>r.json()),
    ]);
    if(a&&a.error==='ログインが必要です'){TOK='';localStorage.removeItem('stb_staff_tok');return login();}
    PUN=(a&&a.ok&&a.punches&&a.punches[ME.id])||[];
    PAY=(b&&b.ok)?b:null;
    if(PAY&&PAY.名前)$('nm').textContent=PAY.名前+' さん';
    draw();
  }catch(e){ $('app').innerHTML=`<div class="card"><div class="warn">読み込めませんでした</div>
    <div class="note">${esc(e.message)}</div></div>`; }
}
async function login(msg){
  $('app').innerHTML='<div class="gate"><p class="note">読み込んでいます…</p></div>';
  let list=[];
  try{ const r=await fetch(API+'/staff/list'); const j=await r.json(); list=j.staff||[]; }catch(e){}
  if(!list.length){
    $('app').innerHTML=`<div class="gate"><h2 style="font-size:17px">まだ準備ができていません</h2>
      <p class="note">お店の方に「暗証番号を決めてください」とお伝えください</p></div>`; return;
  }
  const pre=(Q.get('s')||'').replace(/[^a-z0-9_-]/gi,'');
  const step=(id,name)=>{
    $('app').innerHTML=`<div class="gate">
      <div style="font-size:18px;font-weight:700">${esc(name)}</div>
      <p class="note" id="lm">暗証番号（3桁）${msg?'　'+esc(msg):''}</p>
      <input id="pin" type="password" inputmode="numeric" maxlength="3" placeholder="＿＿＿" aria-label="＿＿＿">
      <button id="go">入る</button>
      <button id="back" style="background:none;color:#7a6f60;border:1px solid #ddd5c8;margin-top:8px">ひとつ戻る</button>
    </div>`;
    $('pin').focus();
    const go=async()=>{
      const v=($('pin').value||'').replace(/[^0-9]/g,'');
      if(v.length!==3){$('lm').textContent='3桁の数字を入れてください';return;}
      try{
        const r=await fetch(API+'/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({staffId:id,pass:v})});
        const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||'入れませんでした');
        TOK=j.token; ME={id:j.staffId,name:j.name||name};
        localStorage.setItem('stb_staff_tok',TOK);
        localStorage.setItem('stb_staff_id',ME.id);
        localStorage.setItem('stb_staff_nm',ME.name);
        load();
      }catch(e){ $('lm').textContent=e.message; $('pin').value=''; $('pin').focus(); }
    };
    $('go').onclick=go; $('pin').onkeydown=e=>{if(e.key==='Enter')go();};
    $('back').onclick=()=>login();
  };
  const hit=pre&&list.find(x=>x.id===pre);
  if(hit)return step(hit.id,hit.name);
  $('app').innerHTML=`<div class="gate"><h2 style="font-size:17px">自分を選んでください</h2>
    <div class="who">${list.map(x=>`<button data-s="${esc(x.id)}" data-n="${esc(x.name)}">${esc(x.name)}</button>`).join('')}</div></div>`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>step(b.dataset.s,b.dataset.n));
}

const last=()=>(PUN&&PUN.length)?PUN[PUN.length-1].kind:'';
function draw(){
  const L=last();
  const t=k=>{const x=(PUN||[]).filter(p=>p.kind===k).pop(); return x?hm(tmMin(x.at)):'';};
  /* いま働いている時間 */
  let mins=0;
  {const ps=[...(PUN||[])].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));
   const i0=ps.find(x=>x.kind==='in');
   if(i0){ const end=ps.slice().reverse().find(x=>x.kind==='out');
     mins=Math.max(0,Math.round(((end?Date.parse(end.at):Date.now())-Date.parse(i0.at))/60000));
     const bs=ps.filter(x=>x.kind==='bin'), be=ps.filter(x=>x.kind==='bout');
     for(let i=0;i<Math.min(bs.length,be.length);i++)
       mins-=Math.max(0,Math.round((Date.parse(be[i].at)-Date.parse(bs[i].at))/60000));
     if(bs.length>be.length)mins-=Math.max(0,Math.round((Date.now()-Date.parse(bs[bs.length-1].at))/60000));
   }}
  const h=Math.floor(Math.max(0,mins)/60), mm=Math.max(0,mins)%60;
  const B=(k,l,go)=>`<button class="b ${go?'go':''}" data-k="${k}">${l}</button>`;
  let btns='';
  if(!L||L==='out')btns=B('in','出勤',true);
  else if(L==='in'||L==='bout')btns=B('bin','休憩に入る')+B('out','退勤',true);
  else if(L==='bin')btns=B('bout','休憩から戻る',true);

  const P=PAY||{};
  const 委託=P.形==='contract';
  $('app').innerHTML=`
    <div class="hero">
      <div class="k">きょう</div>
      <div class="v">${yen(P.今日)}</div>
      <div class="s">${委託?`自分の売上に ${P.率||0}% をかけた概算`
        :(P.時給?`時給 ${yen(P.時給)}　${h}時間${mm}分`:'時給がまだ入っていません')}</div>
    </div>
    <div class="pc">
      <div class="pc-h">打刻</div>
      <div class="pc-now"><b>${h}時間${mm}分</b>
        <span>${L==='bin'?'休憩中':(L==='out'?'退勤しました':(L?'勤務中':'まだ打っていません'))}</span></div>
      <div class="btns">${btns}</div>
      <div class="s">出勤 ${t('in')||'—'}　休憩 ${t('bin')||'—'}〜${t('bout')||'—'}　退勤 ${t('out')||'—'}</div>
    </div>
    <div class="card">
      <div class="ttl">今月</div>
      <div class="row">
        <div class="c"><b>${yen(P.今月)}</b><span>${委託?'歩合':'お給料の概算'}</span></div>
        ${委託?`<div class="c"><b>${(P.日ごと||[]).length}</b><span>日</span></div>
          <div class="c"><b>${yen((P.日ごと||[]).reduce((a,x)=>a+(x.売上||0),0))}</b><span>売上</span></div>`
        :`<div class="c"><b>${Math.floor((P.今月の分||0)/60)}h</b><span>実働</span></div>
          <div class="c"><b>${Math.floor((P.深夜分||0)/60)}h</b><span>深夜</span></div>`}
      </div>
      ${!委託&&P.残業分?`<div class="note">8時間をこえた分 ${Math.floor(P.残業分/60)}時間${P.残業分%60}分（1.25倍で計算しています）</div>`:''}
      ${P.まだの日?`<div class="note warn">打刻がそろっていない日が ${P.まだの日}日あります　この分は入っていません</div>`:''}
      <div class="note">${esc(P.ことわり||'')}</div>
    </div>
    ${(P.日ごと||[]).length?`<div class="card">
      <div class="ttl">日ごと</div>
      ${(P.日ごと||[]).map(x=>`<div class="li"><div class="g">${String(x.日).slice(5).replace('-','/')}
        <span style="font-size:12px;color:#8a8177">${委託?`　${x.件数}件　${yen(x.売上)}`:`　${Math.floor(x.分/60)}時間${x.分%60}分`}</span></div>
        <div class="m">${yen(x.稼ぎ)}</div></div>`).join('')}
    </div>`:''}
    <div class="note" style="text-align:center">
      <button id="out2" style="background:none;border:1px solid #ddd5c8;border-radius:9px;padding:9px 14px;font:inherit;font-size:12.5px;color:#7a6f60">この端末からログアウト</button>
    </div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{
      const r=await fetch(U('/punch'),{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({kind:b.dataset.k,date:DAY})});
      const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||'打てませんでした');
    }catch(e){ alert(e.message); }
    load();
  });
  $('out2').onclick=()=>{ TOK='';ME={id:'',name:''};
    ['stb_staff_tok','stb_staff_id','stb_staff_nm'].forEach(k=>localStorage.removeItem(k));
    location.reload(); };
}
load();
/* 勤務中は1分ごとに時間と金額を追う（見ているあいだ数字が動く＝それがいちばん効く） */
setInterval(()=>{ if(!document.hidden&&TOK&&PUN&&last()&&last()!=='out')load(); },60000);
</script>
</body>
</html>
