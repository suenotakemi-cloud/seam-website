<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ご予約のキャンセル｜SEAM 銀座</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    background:#f5f3f0;color:#1c1a18;padding:18px 15px 44px;line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto}
  .brand{text-align:center;letter-spacing:.32em;font-size:12px;font-weight:700;color:#8a8177;margin:6px 0 18px}
  .card{background:#fff;border-radius:16px;padding:20px 18px;box-shadow:0 2px 14px rgba(30,24,18,.07);margin-bottom:14px}
  h1{font-size:19px;margin:0 0 14px;font-weight:700}
  .rows{font-size:14.5px}
  .rw{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f2ede7}
  .rw:last-child{border-bottom:0}
  .rw span:first-child{color:#7d746b;font-size:13px;white-space:nowrap}
  .rw b{text-align:right}
  /* 料金の告知 */
  .fee{border-radius:13px;padding:15px 16px;margin-top:14px;line-height:1.7}
  .fee.free{background:#eef7f1;border:1px solid #c6e6d3;color:#0c6b3c}
  .fee.charge{background:#fdf3ec;border:1px solid #ecccae;color:#8a4a16}
  .fee .big{font-size:18px;font-weight:800;display:block;margin-bottom:5px;line-height:1.5}
  .fee .sub{font-size:12.5px;opacity:.92;line-height:1.8;display:block}
  /* 「3〜／10日ほど」のように数字の途中で行が割れるのを防ぐ */
  .nb{white-space:nowrap}
  .fee .big,.done h1,.done .when{white-space:nowrap}
  @media(max-width:360px){.fee .big,.done h1{white-space:normal}}
  .btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:15px;
    font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px}
  .btn.go{background:#26221e;color:#fff}
  .btn.back{background:#fff;color:#7d746b;border:1px solid #e7e1d9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .note{font-size:12.5px;color:#7d746b;margin-top:14px;line-height:1.75}
  .load{text-align:center;color:#9a9188;padding:44px 0;font-size:14px}
  /* ★.card と同じ要素に付くので、横の余白を消さないよう上下だけ足す
   *   （padding の一括指定で書くと .card の 20px 18px を丸ごと上書きしてしまう） */
  .done{text-align:center;padding-top:26px;padding-bottom:24px}
  .done .ic{font-size:38px;line-height:1;color:#0c7a41}
  .done h1{margin:14px 0 4px;font-size:20px}
  .done .when{font-size:13.5px;color:#7d746b;margin:0}
  .done .rows{margin-top:18px;text-align:left}
  .done .fee{text-align:left}
  .done .note{text-align:center;margin-top:18px}
  .err{color:#c0392b;font-size:13.5px;font-weight:700;margin-top:10px;min-height:20px}
  .ask{margin-top:16px;padding-top:15px;border-top:1px solid #f2ede7}
  .ask-t{font-size:13px;font-weight:700;color:#4a443d;margin-bottom:9px;line-height:1.6}
  .ask-t span{display:block;font-weight:400;font-size:11.5px;color:#9a9188;margin-top:2px}
  .ask-c{display:flex;flex-wrap:wrap;gap:7px}
  .rsn{background:#fff;border:1px solid #e7e1d9;border-radius:99px;padding:8px 14px;
    font-size:12.5px;font-family:inherit;color:#7d746b;cursor:pointer}
  .rsn.on{background:#26221e;color:#fff;border-color:#26221e}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">S E A M</div>
  <div id="app"><div class="load">読み込んでいます…</div></div>
</div>
<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
const T=new URLSearchParams(location.search).get('t')||'';
const app=document.getElementById('app');
const yen=n=>'¥'+Number(n||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>{const n=+t||0;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};

async function jget(u){const r=await fetch(u);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'読み込めませんでした');return j;}
async function jpost(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'手続きができませんでした');return j;}

function fail(msg){
  app.innerHTML=`<div class="card"><h1 style="font-size:17px">ご確認ください</h1>
    <p style="font-size:14px;margin:0">${esc(msg)}</p>
    <div class="note">お手数ですが SEAM 銀座までご連絡ください</div></div>`;
}

/* キャンセル料の告知。
 * 押す前に必ず金額を見せる。押したあとに知らせるのは不誠実になる。 */
function feeBox(j){
  if(!j.charge)return `<div class="fee free"><span class="big">キャンセル料はかかりません</span>
    <span class="sub">${j.deposit?`お預かりした ${yen(j.deposit)} は全額ご返金します`:'お預かりはございません'}</span></div>`;
  return `<div class="fee charge"><span class="big">キャンセル料 ${yen(j.charge)}</span>
    <span class="sub">${j.daysLeft<=0?'当日のキャンセルのため':'前日のキャンセルのため'}いただきます。
    ${j.refund?`お預かりした ${yen(j.deposit)} から差し引き、${yen(j.refund)} をご返金します`
      :`お預かりした ${yen(j.deposit)} を充てさせていただきます`}</span></div>`;
}

async function run(){
  if(!T){fail('リンクが正しくありません');return;}
  let j;
  try{ j=await jget(API+'/reservations/cancel-info?t='+encodeURIComponent(T)); }
  catch(e){ fail(e.message); return; }

  if(j.already){
    app.innerHTML=`<div class="card done"><div class="ic">✓</div>
      <h1>すでにキャンセル済みです</h1>
      <p class="when">${esc((j.date||'').replace(/-/g,'/'))} ${hm(j.start)}〜のご予約</p></div>`;
    return;
  }

  app.innerHTML=`<div class="card">
    <h1>ご予約のキャンセル</h1>
    <div class="rows">
      <div class="rw"><span>日時</span><b>${esc((j.date||'').replace(/-/g,'/'))} ${hm(j.start)}〜</b></div>
      <div class="rw"><span>メニュー</span><b>${esc(j.menu||'')}</b></div>
      <div class="rw"><span>担当</span><b>${esc(j.staff||'')}</b></div>
      <div class="rw"><span>お名前</span><b>${esc(j.name||'')}</b></div>
      ${j.deposit?`<div class="rw"><span>お預かり</span><b>${yen(j.deposit)}</b></div>`:''}
    </div>
    ${feeBox(j)}
    <button class="btn go" id="go">このご予約をキャンセルする</button>
    <button class="btn back" id="back">やめる（予約はそのまま）</button>
    <div class="err" id="er"></div>
    <div class="note">日時の変更をご希望の場合は、キャンセルのうえ改めてご予約ください。
      ご不明な点は SEAM 銀座までお気軽にご連絡ください</div>
  </div>`;

  document.getElementById('back').onclick=()=>{
    app.innerHTML=`<div class="card done"><div class="ic" style="color:#b8912a">🙂</div>
      <h1>そのままお待ちしております</h1>
      <p class="when">${esc((j.date||'').replace(/-/g,'/'))} ${hm(j.start)}〜のご予約</p></div>`;
  };
  document.getElementById('go').onclick=()=>confirmStep(j);
}

/* 確認の一段。ブラウザの素っ気ないダイアログではなく、
 * 何が起きるかを最後にもう一度そろえてお見せする。
 * お金が動くので、返金の額と届くまでの時間まで書く。 */
function confirmStep(j){
  app.innerHTML=`<div class="card">
    <h1>この内容でよろしいですか</h1>
    <div class="rows">
      <div class="rw"><span>キャンセルするご予約</span><b>${esc((j.date||'').replace(/-/g,'/'))} ${hm(j.start)}〜</b></div>
      <div class="rw"><span>メニュー</span><b>${esc(j.menu||'')}</b></div>
      ${j.charge?`<div class="rw"><span>キャンセル料</span><b>${yen(j.charge)}</b></div>`:''}
      ${j.refund?`<div class="rw"><span>ご返金</span><b>${yen(j.refund)}</b></div>`:''}
    </div>
    ${j.refund?`<div class="fee free" style="margin-top:12px">
        <span class="big">${yen(j.refund)} をご返金します</span>
        <span class="sub">お手続きはこの場で完了します。カード会社を通すため、
        お手元に戻るまで <b>3〜10日ほど</b>かかります（カード会社により異なります）</span></div>`
      :(j.charge?`<div class="fee charge" style="margin-top:12px">
        <span class="big">お預かりした ${yen(j.deposit)} はご返金されません</span>
        <span class="sub">${j.daysLeft<=0?'当日':'前日'}のキャンセルのため、キャンセル料に充てさせていただきます</span></div>`:'')}

    <div class="ask">
      <div class="ask-t">差し支えなければ、理由をお聞かせください<span>（任意・お答えいただかなくても手続きは進みます）</span></div>
      <div class="ask-c">
        ${['予定が変わった','体調がすぐれない','日程を変えたい','旅行の予定が変わった','その他']
          .map(r=>`<button type="button" class="rsn" data-r="${r}">${r}</button>`).join('')}
      </div>
    </div>

    <button class="btn go" id="yes">はい、キャンセルします</button>
    <button class="btn back" id="no">いいえ、予約はそのままにします</button>
    <div class="err" id="er"></div>
  </div>`;

  let reason='';
  app.querySelectorAll('.rsn').forEach(b=>b.onclick=()=>{
    reason=(reason===b.dataset.r)?'':b.dataset.r;      // もう一度押すと取り消し
    app.querySelectorAll('.rsn').forEach(x=>x.classList.toggle('on',x.dataset.r===reason));
  });
  document.getElementById('no').onclick=()=>run();      // 元の画面へ戻す
  document.getElementById('yes').onclick=async()=>{
    const b=document.getElementById('yes'), er=document.getElementById('er');
    b.disabled=true;b.textContent='お手続きしています…';
    document.getElementById('no').disabled=true;
    try{
      const r=await jpost(API+'/reservations/cancel',{token:T,reason});
      done(j,r);
    }catch(e){
      er.textContent=e.message;
      b.disabled=false;b.textContent='はい、キャンセルします';
      document.getElementById('no').disabled=false;
    }
  };
}

function done(j,r){
  // 同じ金額を2回出さない。返金があるときは緑の箱だけ、無いときは行だけにする
  const box = r.refund
    ? `<div class="fee free"><span class="big">${yen(r.refund)} をご返金します</span>
        <span class="sub">お手続きは完了しています。<br>
        カード会社を通すため、お手元に戻るまで<br><b class="nb">3〜10日ほど</b>かかります</span></div>`
    : (r.fee ? `<div class="rows"><div class="rw"><span>キャンセル料</span><b>${yen(r.fee)}</b></div></div>` : '');
  app.innerHTML=`<div class="card done">
    <div class="ic">✓</div>
    <h1>キャンセルを承りました</h1>
    <p class="when">${esc((j.date||'').replace(/-/g,'/'))} ${hm(j.start)}〜のご予約</p>
    ${box}
    ${(r.refund&&r.fee)?`<div class="rows"><div class="rw"><span>キャンセル料</span><b>${yen(r.fee)}</b></div></div>`:''}
    <div class="note">またお目にかかれる日を<br>楽しみにしております</div>
  </div>`;
}
run();
</script>
</body>
</html>
