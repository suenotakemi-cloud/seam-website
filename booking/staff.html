<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SEAM スタッフ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--ink:#1c1a18;--sub:#7d746b;--line:#e7e1d9;--bg:#f5f3f0;--card:#fff;
    --ok:#0c7a41;--warn:#b04a12;--gold:#b8912a}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
    padding:14px 13px calc(28px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
  .top .b{letter-spacing:.3em;font-size:11.5px;font-weight:700;color:var(--sub)}
  .top .who{margin-left:auto;font-size:13px;font-weight:700}
  .top .out{font-size:11.5px;color:var(--sub);background:none;border:0;font-family:inherit;cursor:pointer;text-decoration:underline}
  .card{background:var(--card);border-radius:15px;padding:17px 16px;box-shadow:0 2px 12px rgba(30,24,18,.06);margin-bottom:13px}
  h2{font-size:14px;margin:0 0 12px;font-weight:700}
  /* 歩合ゲージ */
  .gauge{background:linear-gradient(160deg,#26221e,#413931);color:#fff;border-radius:15px;padding:19px 17px;margin-bottom:13px}
  .gauge .lbl{font-size:11px;letter-spacing:.22em;color:#b8ada0}
  .gauge .amt{font-size:31px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .gauge .of{font-size:12.5px;color:#b8ada0}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin:14px 0 8px;position:relative}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c9a227,#f0d878);transition:width .5s ease}
  .bar.on i{background:linear-gradient(90deg,#2fa86a,#7fe0aa)}
  .marks{display:flex;justify-content:space-between;font-size:10.5px;color:#8f857a}
  .msg{font-size:13px;font-weight:700;margin-top:12px;line-height:1.65}
  .msg.go{color:#f0d878}
  .msg.on{color:#7fe0aa}
  .pay{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
  .pay b{font-size:22px;font-weight:700}
  .pay s{text-decoration:none;font-size:11.5px;color:#b8ada0}
  /* 数字 */
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .kpi>div{background:#faf8f5;border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .kpi .k{font-size:11px;color:var(--sub)}
  .kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .rows{font-size:13.5px}
  .rw{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f2ede7}
  .rw:last-child{border-bottom:0}
  .rw b{font-variant-numeric:tabular-nums}
  /* 予約 */
  .rv{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f2ede7}
  .rv:last-child{border-bottom:0}
  .rv .d{min-width:64px;font-size:12px;color:var(--sub);font-weight:700;line-height:1.45}
  .rv .d i{display:block;font-style:normal;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .rv .n{font-weight:700;font-size:14px}
  .rv .m{font-size:12px;color:var(--sub)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;margin-left:5px}
  .tag.nom{background:#efe6cf;color:#8a6a12}
  .empty{color:var(--sub);font-size:13px;padding:14px 0;text-align:center}
  /* ログイン */
  .lg{max-width:340px;margin:16vh auto 0;text-align:center}
  .lg h1{font-size:18px;margin:0 0 4px}
  .lg p{font-size:13px;color:var(--sub);margin:0 0 18px}
  select,input{width:100%;font-family:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);
    border-radius:11px;background:#fff;color:var(--ink);margin-bottom:9px}
  button.go{width:100%;background:#26221e;color:#fff;border:0;border-radius:11px;padding:14px;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .err{color:#c0392b;font-size:13px;font-weight:700;margin-top:10px;min-height:20px}
  .load{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load">読み込んでいます…</div></div>
<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
const app=document.getElementById('app');
const yen=n=>'¥'+Number(n||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>{const n=+t||0;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
const TOKKEY='seam_staff_tok';
const tok=()=>{try{return localStorage.getItem(TOKKEY)||''}catch(e){return ''}};
const setTok=v=>{try{v?localStorage.setItem(TOKKEY,v):localStorage.removeItem(TOKKEY)}catch(e){}};

/* この店のスタッフ。管理画面(index.html)のSTAFFと同じidと名前にしておく。
 * スタッフが増えたら両方に足す（idがずれると別の人の数字が出てしまう）。 */
const STAFF=[
  {id:'s1',name:'及川 大輝'},
  {id:'s2',name:'ANZU'},
  {id:'s3',name:'CHIKA'},
];

async function jget(u){const r=await fetch(u);const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||('通信に失敗しました('+r.status+')')),{status:r.status});return j;}
async function jpost(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||('通信に失敗しました('+r.status+')')),{status:r.status});return j;}

function login(msg){
  app.innerHTML=`<div class="lg">
    <h1>SEAM スタッフ</h1>
    <p>自分の売上と予約を見られます</p>
    <select id="sid">${STAFF.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    <input id="pw" type="tel" inputmode="numeric" maxlength="6" placeholder="合言葉（6桁）" autocomplete="off">
    <button class="go" id="in">ログイン</button>
    <div class="err" id="er">${esc(msg||'')}</div>
    <p style="margin-top:16px;font-size:12px">合言葉は店長に発行してもらってください</p>
  </div>`;
  const go=async()=>{
    const sid=document.getElementById('sid').value;
    const pw=document.getElementById('pw').value.replace(/\D/g,'');
    const er=document.getElementById('er');
    if(pw.length!==6){er.textContent='合言葉は6桁です';return;}
    const b=document.getElementById('in');b.disabled=true;b.textContent='確認中…';
    try{
      const j=await jpost(API+'/staff/login',{staffId:sid,pass:pw});
      setTok(j.token); home();
    }catch(e){ er.textContent=e.message; b.disabled=false; b.textContent='ログイン'; }
  };
  document.getElementById('in').onclick=go;
  document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go();};
}

/* 歩合のゲージ。
 * ラインに届いていないときは「あといくら」を前に出す。
 * 届いたあとは、次の段に上がるほど率が良くなることを見せる。 */
function gauge(c){
  const base=c.base||0, on=c.reached;
  const line=c.startLine||0;
  const goal=on?(c.next?c.next.from:base):line;
  const pct=goal>0?Math.min(100,Math.round(base/goal*100)):100;
  let msg;
  if(!on) msg=`<div class="msg go">歩合まであと <b>${yen(c.toStart)}</b><br><span style="font-weight:400;color:#b8ada0;font-size:12px">ここを超えると超過分に${(c.next&&c.next.rate)||0}%がつきます</span></div>`;
  else if(c.next) msg=`<div class="msg on">いま <b>${c.rate}%</b>　次の段まであと <b>${yen(c.next.remain)}</b> → <b>${c.next.rate}%</b></div>`;
  else msg=`<div class="msg on">最上段の <b>${c.rate}%</b> に到達しています</div>`;
  return `<div class="gauge">
    <div class="lbl">今月の売上</div>
    <div class="amt">${yen(base)}</div>
    <div class="of">${on?`歩合の対象は ${yen(Math.max(0,base-c.from))}（${c.from>0?yen(c.from)+'を超えた分':'全額'}）`:`歩合のライン ${yen(line)}`}</div>
    <div class="bar ${on?'on':''}"><i style="width:${pct}%"></i></div>
    <div class="marks"><span>${yen(0)}</span><span>${yen(goal)}</span></div>
    ${msg}
    <div class="pay"><b>${yen(c.pay)}</b><s>今の歩合（見込み）</s></div>
  </div>`;
}

function home(){
  app.innerHTML='<div class="load">読み込んでいます…</div>';
  jget(API+'/staff/me?token='+encodeURIComponent(tok())).then(j=>{
    const m=j.month||{}, t=j.today||{}, c=j.commission||{};
    const techTotal=(m.techNom||0)+(m.techFree||0);
    const nomRate=m.count?Math.round((m.nomCount||0)/m.count*100):0;
    const rv=(j.reservations||[]);
    const today=new Date().toISOString().slice(0,10);
    app.innerHTML=`
      <div class="top"><span class="b">S E A M</span>
        <span class="who">${esc(j.name||j.staffId||'')}</span>
        <button class="out" id="out">ログアウト</button></div>
      ${gauge(c)}
      <div class="card"><h2>今日</h2>
        <div class="kpi">
          <div><div class="k">売上</div><div class="v">${yen(t.total)}</div></div>
          <div><div class="k">お客様</div><div class="v">${t.count||0}人</div></div>
        </div></div>
      <div class="card"><h2>今月の内訳</h2>
        <div class="rows">
          <div class="rw"><span>指名の技術</span><b>${yen(m.techNom)}</b></div>
          <div class="rw"><span>フリーの技術</span><b>${yen(m.techFree)}</b></div>
          <div class="rw"><span>店販</span><b>${yen(m.retail)}</b></div>
          <div class="rw"><span>技術の合計</span><b>${yen(techTotal)}</b></div>
          <div class="rw"><span>お客様の数</span><b>${m.count||0}人</b></div>
          <div class="rw"><span>指名の割合</span><b>${nomRate}%</b></div>
        </div></div>
      <div class="card"><h2>これからの予約（${rv.length}件）</h2>
        ${rv.length?rv.map(r=>`<div class="rv">
            <div class="d">${esc((r.date||'').slice(5).replace('-','/'))}${r.date===today?'（今日）':''}<i>${hm(r.start)}</i></div>
            <div style="flex:1;min-width:0">
              <div class="n">${esc(r.name||'（お名前なし）')}${r.nominated?'<span class="tag nom">指名</span>':''}</div>
              <div class="m">${esc(r.note||'')||'&nbsp;'}</div>
            </div>
            ${r.deposit>0?`<div style="font-size:11.5px;color:var(--ok);font-weight:700;white-space:nowrap">前金 ${yen(r.deposit)}</div>`:''}
          </div>`).join(''):'<div class="empty">これからの予約はありません</div>'}
      </div>`;
    document.getElementById('out').onclick=()=>{setTok('');login('');};
  }).catch(e=>{
    if(e.status===401){setTok('');login(e.message);return;}
    app.innerHTML=`<div class="card"><h2>読み込めませんでした</h2>
      <p style="font-size:13px;color:var(--sub);margin:0">${esc(e.message)}</p>
      <button class="go" style="margin-top:12px" onclick="location.reload()">もう一度</button></div>`;
  });
}

tok()?home():login('');
</script>
</body>
</html>
