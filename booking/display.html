<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══ SEAM お客様にお見せする画面（カウンターの2台目）══
   レジのiPadが置いた明細を、1秒ごとに覗きにいって映すだけの画面。
   お客様の目の前に置くので、出すのは「その方のお会計」だけにする。
   在庫・原価・他のお客様・操作ボタンは一切置かない。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--ink:#16171B;--body:#4A4741;--sub:#7C7568;--line:#E3DCD0;--cream:#FBF9F5;
  --gold:#A8823F;--clay:#96613F;--bg:#F7F5F1}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--body);font-family:'Noto Sans JP',-apple-system,sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
/* ★お客様は、カウンター越しに 60〜80cm 離れて座っておられる。
   画面の幅だけで文字を決めると、iPadを縦にした瞬間に小さくなる。
   だから縦と横の両方から基準の大きさを作り、あとは全部その倍数で書く。
   これ以上は触らなくていいように、ここ1か所で全体が大きくなる。 */
.screen{height:100%;display:flex;flex-direction:column;
  font-size:clamp(20px, calc(1.15vw + 1.4vh), 34px);
  padding:clamp(20px,3.6vh,44px) clamp(20px,4.4vw,64px);
  padding-top:calc(clamp(20px,3.6vh,44px) + env(safe-area-inset-top))}

/* ── 待っているとき ── */
.idle{margin:auto;text-align:center}
.idle .mk{font-family:'Cormorant Garamond',serif;font-size:3em;letter-spacing:.34em;
  color:var(--ink);font-weight:500;line-height:1.2}
.idle .sb{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05em;
  letter-spacing:.14em;color:var(--clay);margin-top:.5em}
.idle .ms{font-size:1em;color:var(--body);margin-top:1.2em;line-height:2;letter-spacing:.04em}
.idle .rg{font-size:.6em;color:var(--sub);margin-top:2em;letter-spacing:.2em}

/* ── お会計 ── */
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:.7em;
  border-bottom:1px solid var(--line);padding-bottom:.5em;flex:none}
.hd .mk{font-family:'Cormorant Garamond',serif;font-size:1.3em;letter-spacing:.26em;color:var(--ink)}
.hd .who{font-family:'Noto Serif JP',serif;font-size:1.2em;color:var(--ink);letter-spacing:.04em}
.hd .rk{font-size:.55em;letter-spacing:.12em;color:var(--clay);
  border:1px solid rgba(150,97,63,.4);border-radius:2px;padding:.2em .7em;margin-left:.5em}

.list{flex:1;overflow:hidden;padding:.3em 0}
.li{display:flex;align-items:center;gap:.7em;border-bottom:1px solid var(--line);
  padding:.6em 0}
.li-img{width:2.6em;height:2.6em;object-fit:contain;background:#fff;border-radius:2px;flex:none}
.li-n{flex:1;min-width:0;font-size:1.08em;color:var(--ink);line-height:1.5}
.li-q{flex:none;font-size:.92em;color:var(--body);min-width:2.2em;text-align:right}
.li-p{flex:none;text-align:right;min-width:6.4em}
.li-was{display:block;font-size:.8em;color:#A9A296;text-decoration:line-through;line-height:1.3}
.li-now{font-family:'Cormorant Garamond',serif;font-size:1.5em;color:var(--ink);font-weight:600}
.more{font-size:.9em;color:var(--body);padding:.5em 0;letter-spacing:.04em}
/* ── いっぱいになったら畳む ──
   いま読み込んだ1点は今までどおりの大きさのまま。
   その前に読んだものだけを、2列 → 3列 → 4列 と細かくしていく。
   お客様は「たったいま読まれたもの」を見たいので、そこは絶対に縮めない。 */
.list.d1,.list.d2,.list.d3{display:grid;align-content:start;gap:0 1.2em}
.list.d1{grid-template-columns:repeat(2,1fr)}
.list.d2{grid-template-columns:repeat(3,1fr)}
.list.d3{grid-template-columns:repeat(4,1fr)}
/* 最後の1行＝いま読んだもの。全部の列にまたがって、大きさはそのまま */
.list.d1 .li.fresh,.list.d2 .li.fresh,.list.d3 .li.fresh{grid-column:1/-1}
/* 畳まれたほうは小さく。写真は落として、名前と金額だけにする */
.list.d1 .li:not(.fresh){gap:.4em;padding:.4em 0}
.list.d2 .li:not(.fresh){gap:.35em;padding:.3em 0}
.list.d3 .li:not(.fresh){gap:.3em;padding:.22em 0}
.list.d1 .li:not(.fresh) .li-img{display:none}
.list.d2 .li:not(.fresh) .li-img,.list.d3 .li:not(.fresh) .li-img{display:none}
.list.d1 .li:not(.fresh) .li-n{font-size:.86em;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list.d2 .li:not(.fresh) .li-n{font-size:.74em;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list.d3 .li:not(.fresh) .li-n{font-size:.64em;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list.d1 .li:not(.fresh) .li-now{font-size:1.05em}
.list.d2 .li:not(.fresh) .li-now{font-size:.9em}
.list.d3 .li:not(.fresh) .li-now{font-size:.8em}
.list.d1 .li:not(.fresh) .li-was,.list.d2 .li:not(.fresh) .li-was,.list.d3 .li:not(.fresh) .li-was{display:none}
.list.d1 .li:not(.fresh) .li-p{min-width:4.4em}
.list.d2 .li:not(.fresh) .li-p{min-width:3.8em}
.list.d3 .li:not(.fresh) .li-p{min-width:3.4em}
.list.d1 .li:not(.fresh) .li-q,.list.d2 .li:not(.fresh) .li-q,.list.d3 .li:not(.fresh) .li-q{min-width:1.6em;font-size:.8em}
.list.d1 .more,.list.d2 .more,.list.d3 .more{grid-column:1/-1}

/* ── 合計 ── */
.ft{flex:none;border-top:1px solid var(--line);padding-top:.6em}
.fr{display:flex;justify-content:space-between;font-size:1em;padding:.15em 0}
.fr.cut{color:var(--clay)}
.fr.cut b{font-family:'Cormorant Garamond',serif;font-size:1.3em;font-weight:600}
.fr.tot{align-items:baseline;border-top:1px solid var(--line);margin-top:.4em;padding-top:.5em}
.fr.tot span{font-size:1.2em;color:var(--ink);letter-spacing:.06em}
.fr.tot b{font-family:'Cormorant Garamond',serif;font-size:3.2em;color:var(--ink);
  font-weight:600;line-height:1}

/* ── ポイント ── */
.pt{margin-top:.6em;background:var(--cream);border:1px solid rgba(168,130,63,.34);
  border-radius:3px;padding:.6em .9em;
  display:flex;align-items:center;justify-content:space-between;gap:.7em;flex-wrap:wrap}
.pt-l{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.9em;
  letter-spacing:.1em;color:var(--gold)}
.pt-e{font-size:1.1em;color:var(--ink)}
.pt-e b{font-family:'Cormorant Garamond',serif;font-size:1.8em;color:var(--clay);font-weight:600;margin:0 .1em}
.pt-b{font-size:.9em;color:var(--body)}
.pt-b b{font-family:'Cormorant Garamond',serif;font-size:1.3em;color:var(--ink);font-weight:600;margin:0 .1em}

/* ── ありがとうございました ── */
.done{margin:auto;text-align:center}
.done .t{font-family:'Noto Serif JP',serif;font-size:2em;color:var(--ink);letter-spacing:.08em;line-height:1.7}
.done .s{font-size:1.05em;color:var(--body);margin-top:.8em;letter-spacing:.06em}

.err{margin:auto;text-align:center;color:var(--body);font-size:1em;line-height:2}
/* ── お客様に押していただく画面 ── */
/* ★お伝えすることが多い日でも、押していただくボタンに必ず指が届くようにする。
   iPadを縦にすると画面が短くなり、ボタンが画面の外に出て押せなくなっていた。 */
.ask,.pick{max-height:100%;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
.ask{margin:auto;text-align:center;max-width:26em;padding:1em 0}
.ask-t{font-family:'Noto Serif JP',serif;font-size:1.5em;color:var(--ink);letter-spacing:.06em;line-height:1.7}
.ask-l{list-style:none;margin:1.4em 0 1.8em;padding:0;text-align:left;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ask-l li{font-size:.98em;color:var(--ink);line-height:1.9;padding:.7em .2em;
  border-bottom:1px solid var(--line)}
.ask-l li:last-child{border-bottom:none}
.ask-b{font:inherit;font-size:1.05em;letter-spacing:.14em;color:#fff;background:var(--ink);
  border:none;border-radius:3px;padding:.95em 3.4em;min-height:3.4em;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.ask-b:active{opacity:.8}
.ask-b:disabled{background:var(--clay);opacity:1}
.ask-n{font-size:.72em;color:var(--sub);margin-top:1.3em;letter-spacing:.08em}
/* ── お支払い方法をお選びいただく画面 ──
   カードをお預かりしないための入口。指が届く大きさを最優先にする。 */
.pick{margin:auto;text-align:center;max-width:34em;padding:1em 0;width:100%}
.pick-t{font-family:'Noto Serif JP',serif;font-size:1.35em;color:var(--ink);letter-spacing:.06em}
.pick-e{font-size:.78em;color:var(--sub);letter-spacing:.1em;margin-top:.4em}
.pick-a{font-family:'Cormorant Garamond',serif;font-size:2.6em;color:var(--ink);
  margin:.35em 0 .1em;font-variant-numeric:lining-nums tabular-nums;line-height:1}
.pick-g{display:grid;grid-template-columns:repeat(2,1fr);gap:.7em;margin:1.5em 0 0}
.pick-b{font:inherit;background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:1.1em .6em;min-height:5.2em;cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.18em}
.pick-b:active{border-color:var(--ink);background:var(--cream)}
.pick-b b{font-size:1.15em;font-weight:500;color:var(--ink);letter-spacing:.04em}
.pick-b i{font-style:normal;font-size:.72em;color:var(--sub);letter-spacing:.06em}
.pick-b s{text-decoration:none;font-size:.68em;color:var(--clay);line-height:1.5}
.pick-n{font-size:.72em;color:var(--sub);margin-top:1.5em;letter-spacing:.08em;line-height:1.9}
/* 交通系のように、選ぶ前にお伝えすることがある場合のもう一枚 */
.warn-x{display:flex;gap:.7em;margin-top:1.6em}
.warn-x button{flex:1;font:inherit;font-size:.95em;letter-spacing:.1em;border-radius:3px;
  padding:1em .6em;min-height:3.6em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.warn-back{background:#fff;border:1px solid var(--line);color:var(--body)}
.warn-ok{background:var(--ink);border:none;color:#fff}
.warn-x button:active{opacity:.8}
/* ── 返金が終わった画面 ── */
.rdone{margin:auto;text-align:center;max-width:28em;padding:1em 0}
.rdone-t{font-family:'Noto Serif JP',serif;font-size:1.35em;color:var(--ink);letter-spacing:.06em}
.rdone-a{font-family:'Cormorant Garamond',serif;font-size:3.4em;color:var(--ink);
  font-weight:600;line-height:1.2;margin:.25em 0 .1em;font-variant-numeric:lining-nums tabular-nums}
.rdone-w{font-size:1.05em;color:var(--clay);letter-spacing:.04em;margin-bottom:1.1em}
.rdone-l{list-style:none;margin:0 0 1.2em;padding:0;text-align:left;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rdone-l li{font-size:.86em;color:var(--body);line-height:1.85;padding:.55em .2em;
  border-bottom:1px solid var(--line)}
.rdone-l li:last-child{border-bottom:none}
.rdone-q img{width:8.4em;height:8.4em;image-rendering:pixelated;border:1px solid var(--line);
  background:#fff;padding:.5em}
.rdone-q div{font-size:.72em;color:var(--sub);margin-top:.5em;letter-spacing:.06em}
.rdone-n{font-size:.82em;color:var(--sub);margin-top:1.2em;letter-spacing:.08em}
/* ★Cormorant は既定でオールドスタイル数字（1240 の 2 や 4 が下がる書体）。
   きれいだが、お会計の金額としては一瞬読み違える。数字だけ高さを揃える。 */
.li-now,.fr.cut b,.fr.tot b,.pt-e b,.pt-b b{font-variant-numeric:lining-nums tabular-nums;
  font-feature-settings:'lnum' 1,'tnum' 1}
.fade{animation:fi .5s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="screen" id="scr"></div>
<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
const Q=new URLSearchParams(location.search);
const SHOP=Q.get('s')||'ginza', TOKEN=Q.get('t')||'', REG=Q.get('r')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(+n||0).toLocaleString();
let lastJson='';

/* お待ちいただいている間の画面 */
function idle(){
  return `<div class="idle fade">
    <div class="mk">SEAM</div>
    <div class="sb">GINZA</div>
    <div class="ms">ごゆっくりご覧ください<br>会員の方はお会計時に会員証をお見せください</div>
    ${REG?`<div class="rg">レジ ${esc(REG)}</div>`:''}
  </div>`;
}
function done(st){
  return `<div class="done fade">
    <div class="t">ありがとうございました</div>
    <div class="s">${st&&st.member&&st.member.earn?`本日 ${st.member.earn} ポイントたまりました<br><span style="font-size:.86em">ポイントは半年間おつかいいただけます</span>`:'またお待ちしております'}</div>
  </div>`;
}
/* 会員証を読んだ瞬間の画面。まだ商品が入っていないときに出す。
   はじめての方には「ようこそ」、2回目以降は「いつもありがとうございます」。 */
function welcome(m){
  const again=m.greet==='again';
  return `<div class="idle fade">
    <div class="sb">${again?'Welcome back':'Welcome'}</div>
    <div class="mk" style="font-size:2.4em;letter-spacing:.12em;margin-top:.5em">${esc(m.name||'')} 様</div>
    <div class="ms" style="font-size:1.2em;color:var(--ink);margin-top:.7em">
      ${again?'いつもありがとうございます':'ようこそ SEAM へ'}</div>
    ${m.rank?`<div class="ms" style="margin-top:.6em"><span style="border:1px solid rgba(150,97,63,.4);border-radius:2px;padding:.2em .7em;color:var(--clay);letter-spacing:.12em">${esc(m.rank)}</span></div>`:''}
    <div class="ms" style="margin-top:.8em">メンバー価格でご用意しています${m.points?`　お持ちのポイント ${m.points}`:''}</div>
  </div>`;
}
function bill(st){
  const items=st.items||[];
  const show=items, rest=0;
  const m=st.member;
  return `<div class="hd">
      <span class="mk">SEAM</span>
      ${m&&m.name?`<span class="who">${esc(m.name)} 様${m.rank?`<span class="rk">${esc(m.rank)}</span>`:''}
        <div style="font-size:.62em;color:var(--clay);letter-spacing:.06em;margin-top:2px">${m.greet==='again'?'いつもありがとうございます':'ようこそ SEAM へ'}</div></span>`:''}
    </div>
    <div class="list">
      ${show.map(i=>`<div class="li${i.fresh?' fresh':''}">
        ${i.image?`<img class="li-img" src="https://seam.site/${esc(i.image)}" alt="" onerror="this.style.display='none'">`:''}
        <span class="li-n">${esc(i.name)}</span>
        <span class="li-q">${i.qty>1?'×'+i.qty:''}</span>
        <span class="li-p">${i.was&&i.was!==i.now?`<span class="li-was">${yen(i.was*i.qty)}</span>`:''}
          <span class="li-now">${yen((i.now||i.was)*i.qty)}</span></span>
      </div>`).join('')}
      <div class="more" id="more" style="display:none"></div>
    </div>
    <div class="ft">
      ${st.cut>0?`<div class="fr"><span>定価</span><span>${yen(st.list)}</span></div>
        <div class="fr cut"><span>${st.mode==='sale'?'セール価格':'メンバー価格'}</span><b>−${yen(st.cut)}</b></div>`:''}
      <div class="fr tot"><span>合計</span><b>${yen(st.total)}</b></div>
      ${m?`<div class="pt">
        <span class="pt-l">Points</span>
        <span class="pt-e">このお買い物で<b>+${m.earn||0}</b>ポイント</span>
        <span class="pt-b">お持ちのポイント <b>${m.points||0}</b>→<b>${(m.points||0)+(m.earn||0)}</b>
          ${m.expireOn?`<br><span style="font-size:.86em">${String(m.expireOn).replace(/^\d{4}-/,'').replace('-','月')}日までに ${m.expiring} ポイントが期限</span>`:''}</span>
      </div>`:''}
    </div>`;
}
/* ★入りきらない明細を黙って切らない。
 * 画面の高さは iPad の向きでも変わるので、描いたあとに実際にはかって、
 * 入らなかった分は「ほか◯点」と必ず言う。
 * お客様の前で金額の行が半分だけ見えている状態が、いちばん信用を落とす。 */
function fitList(){
  const list=document.querySelector('.list'), more=document.getElementById('more');
  if(!list||!more)return;
  const rows=[...list.querySelectorAll('.li')];
  if(!rows.length)return;
  /* いま読み込んだ1点＝ここだけは縮めない。
     レジが fresh を送ってきていればそれを使う（同じ商品を続けて読むと行は増えないため）。
     送ってきていなければ、いちばん最後の行を「いま読んだもの」とみなす。 */
  if(!rows.some(r=>r.classList.contains('fresh'))) rows[rows.length-1].classList.add('fresh');
  list.classList.remove('d1','d2','d3');
  rows.forEach(r=>r.style.display='');
  more.style.display='none';
  const over=()=>list.scrollHeight>list.clientHeight+1;
  /* 入らなくなったら、古いほうから順に細かく畳んでいく */
  for(const d of ['d1','d2','d3']){
    if(!over())return;
    list.classList.remove('d1','d2','d3');
    list.classList.add(d);
  }
  /* いちばん細かくしても入らないときだけ、古いものから隠して点数で言う。
     ★隠すのは古いほう。たったいま読んだものが消えるのがいちばん困る。 */
  let hidden=0;
  for(let i=0;i<rows.length-1&&over();i++){
    rows[i].style.display='none'; hidden++;
    more.style.display=''; more.textContent=`ほか ${hidden} 点`;
  }
}
/* ★お客様ご自身に押していただく画面。
   メンバー価格・セール価格でお売りするときは返品交換をお受けしないので、
   お買い上げの前にご確認いただく。押していただくまでレジは先に進まない。
   ★一度押したら、同じお会計では二度と出さない（押し直しを求めない）。 */
/* ★返金が終わったときの画面。
   お客様がいちばん知りたいのは「いつ戻るか」。それを最初に、大きく出す。
   お詫びより先に、事実を出す。もたつかないことが、いちばんの誠意になる。 */
function refundDone(st){
  const r=st.refund;
  return `<div class="rdone fade">
    <div class="rdone-t">ご返金の手続きが完了しました</div>
    <div class="rdone-a">${yen(r.amount||0)}</div>
    <div class="rdone-w">${esc(r.when||'')}</div>
    <ul class="rdone-l">${(r.lines||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${r.qr?`<div class="rdone-q"><img src="${esc(r.qr)}" alt=""><div>控えをお持ち帰りいただけます</div></div>`:''}
    <div class="rdone-n">本日はご不便をおかけしました</div>
  </div>`;
}
/* ══════════ お支払い方法をお選びいただく ══════════
   ★お客様ご自身に押していただく。カードをお預かりしない・お触りしないため。
   ★交通系だけは、押されたあとにもう一枚出す。
     Squareの仕組み上、交通系ICは返金ができない＝返品をお受けできない。
     お選びになる前にお伝えしないと、あとでお断りすることになってしまう。 */
let PICKED='';
function pickScreen(st){
  const p=st.pick;
  return `<div class="pick fade">
    <div class="pick-t">お支払い方法をお選びください</div>
    <div class="pick-e">Please choose how you would like to pay</div>
    <div class="pick-a">${yen(p.total||0)}</div>
    <div class="pick-g">${(p.methods||[]).map((mm,i)=>`
      <button class="pick-b" data-i="${i}">
        <b>${esc(mm.label)}</b>
        <i>${esc(mm.en||'')}</i>
        ${mm.note?`<s>${esc(mm.note)}</s>`:''}
      </button>`).join('')}</div>
    <div class="pick-n">Apple Pay・Google Pay をお使いの方は、そのカードの種類をお選びください<br>
      For Apple Pay / Google Pay, please choose the type your phone uses.</div>
  </div>`;
}
/* 交通系を選ばれたときの、もう一枚 */
function pickWarn(mm){
  const w=mm.warn;
  return `<div class="ask fade">
    <div class="ask-t">${esc(w.title||'ご確認ください')}</div>
    <ul class="ask-l">${(w.lines||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="warn-x">
      <button class="warn-back" id="wBack">${esc(w.back||'別の方法にする')}</button>
      <button class="warn-ok" id="wOk">${esc(w.ok||'了解しました')}</button>
    </div>
    <div class="ask-n">お手数ですが、お客様ご自身でお願いいたします</div>
  </div>`;
}
async function sendPick(st,mm){
  const s=$('scr');
  s.querySelectorAll('.pick-b,.warn-x button').forEach(b=>b.disabled=true);
  try{
    await fetch(`${API}/display/consent`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({t:TOKEN,shopId:SHOP,register:REG,kind:'pay:'+mm.k,
        /* 何をご覧になって選ばれたかを、文面ごと残す */
        text:['お支払い方法：'+mm.label,...(mm.warn?[mm.warn.title,...(mm.warn.lines||[])]:[])].join('\n')})});
    PICKED=JSON.stringify(st.pick);
    s.innerHTML=`<div class="ask fade"><div class="ask-t">${esc(mm.label)}でお受けいたします</div>
      <div class="ask-n">少々お待ちください　One moment, please.</div></div>`;
    lastJson='';
  }catch(e){ s.querySelectorAll('.pick-b,.warn-x button').forEach(b=>b.disabled=false); }
}
function wirePick(st){
  const s=$('scr');
  s.querySelectorAll('.pick-b').forEach(b=>b.onclick=()=>{
    const mm=(st.pick.methods||[])[+b.dataset.i]; if(!mm)return;
    if(mm.warn){                       // 交通系 … 先にお伝えしてから
      s.innerHTML=pickWarn(mm);
      document.getElementById('wOk').onclick=()=>sendPick(st,mm);
      document.getElementById('wBack').onclick=()=>{ s.innerHTML=pickScreen(st); wirePick(st); };
      return;
    }
    sendPick(st,mm);
  });
}

let ASKED='';
function askScreen(st){
  const a=st.ask;
  return `<div class="ask fade">
    <div class="ask-t">${esc(a.title||'ご確認ください')}</div>
    <ul class="ask-l">${(a.lines||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <button class="ask-b" id="askB">${esc(a.button||'同意します')}</button>
    <div class="ask-n">お手数ですが、お客様ご自身でお願いいたします</div>
  </div>`;
}
async function sendConsent(st){
  const b=document.getElementById('askB'); if(b){b.disabled=true;b.textContent='ありがとうございます';}
  try{
    await fetch(`${API}/display/consent`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({t:TOKEN,shopId:SHOP,register:REG,kind:st.ask.kind,
        text:[st.ask.title,...(st.ask.lines||[])].join('\n')})});
    ASKED=JSON.stringify(st.ask);
    lastJson='';                   // 次の巡回で明細の画面に戻す
  }catch(e){ if(b){b.disabled=false;b.textContent=st.ask.button||'同意します';} }
}
function paint(st){
  const j=JSON.stringify(st);
  if(j===lastJson)return;            // 変わっていないなら描き直さない（ちらつき防止）
  lastJson=j;
  const s=$('scr');
  if(!st){ s.innerHTML=idle(); return; }
  if(st.refund){ ASKED=''; PICKED=''; s.innerHTML=refundDone(st); return; }
  if(st.done){ ASKED=''; PICKED=''; s.innerHTML=done(st); return; }
  /* お支払い方法をお選びいただく（まだお選びでなければ） */
  if(st.pick&&JSON.stringify(st.pick)!==PICKED){
    s.innerHTML=pickScreen(st); wirePick(st); return;
  }
  /* お願いが来ていて、まだ押していただいていなければ、それを出す */
  if(st.ask&&JSON.stringify(st.ask)!==ASKED){
    s.innerHTML=askScreen(st);
    const b=document.getElementById('askB'); if(b)b.onclick=()=>sendConsent(st);
    return;
  }
  if(!(st.items||[]).length){ s.innerHTML=st.member?welcome(st.member):idle(); return; }
  s.innerHTML=bill(st); fitList();
}
async function tick(){
  try{
    const r=await fetch(`${API}/display/state?s=${encodeURIComponent(SHOP)}&r=${encodeURIComponent(REG)}&t=${encodeURIComponent(TOKEN)}`,{cache:'no-store'});
    if(r.status===403){ $('scr').innerHTML=`<div class="err">この画面の合言葉が違います<br>レジの「お客様画面」からQRを読み直してください</div>`; return; }
    const j=await r.json();
    let st=j.state||null;
    // レジが5分以上置きっぱなしなら、待機の画面に戻す（前のお客様の明細を残さない）
    if(st&&st.at&&Date.now()-st.at>5*60*1000)st=null;
    paint(st);
  }catch(e){ /* 電波が切れても前の表示のままにする */ }
}
if(!TOKEN){ $('scr').innerHTML=`<div class="err">レジの「お客様画面」からQRを読み取って開いてください</div>`; }
else{ paint(null); tick(); setInterval(tick,1000); }
/* 画面を消さない（iOSは電源に挿していれば自動ロックを切れる。念のため復帰時に読み直す） */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)tick(); });
/* 向きを変えると入る行数が変わる。測り直す（描き直しはしない＝ちらつかない） */
window.addEventListener('resize',()=>{ lastJson=''; tick(); });
</script>
</body>
</html>
