<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINEログイン処理中...</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; background: #f5f5f5; }
    .box { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #ddd;
               border-top-color: #06C755; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #555; font-size: 14px; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">LINEでログイン中...</p>
  </div>
  <script>
    const WORKER = 'https://seam-square-pay.suenotakemi.workers.dev';

    (async () => {
      const params = new URLSearchParams(location.search);
      const code  = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (error) {
        document.getElementById('msg').textContent = 'LINEログインがキャンセルされました。';
        document.getElementById('msg').className = 'error';
        setTimeout(() => { location.href = '../../../index.html'; }, 2000);
        return;
      }

      if (!code || !state) {
        document.getElementById('msg').textContent = 'パラメータが不正です。';
        document.getElementById('msg').className = 'error';
        return;
      }

      // WorkerのGET /line/login/result へ中継（302で成功URL + line_user_id が返る）
      const dest = `${WORKER}/line/login/result?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
      location.href = dest;
    })();
  </script>
</body>
</html>
