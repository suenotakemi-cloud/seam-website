<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SEAM 会員証</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    background:#f5f3f0;color:#1c1a18;padding:16px 14px 40px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto}
  .brand{text-align:center;letter-spacing:.32em;font-size:12px;font-weight:700;color:#8a8177;margin:6px 0 18px}
  .card{background:#fff;border-radius:16px;padding:20px 18px;box-shadow:0 2px 14px rgba(30,24,18,.07);margin-bottom:14px}
  h1{font-size:19px;margin:0 0 4px;font-weight:700}
  .sub{font-size:13px;color:#7d746b;margin:0 0 14px}
  .amt{font-size:30px;font-weight:700;letter-spacing:-.01em}
  .rows{border-top:1px solid #eee9e3;margin-top:12px;padding-top:12px;font-size:14px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  .row span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
  .tot{border-top:1px solid #eee9e3;margin-top:10px;padding-top:10px;font-weight:700;font-size:16px}
  /* 会員証 */
  .mem{background:linear-gradient(160deg,#26221e,#413931);color:#fff;border-radius:16px;padding:20px 18px;text-align:center;margin-bottom:14px}
  .mem .lbl{font-size:11px;letter-spacing:.24em;color:#b8ada0;margin-bottom:10px}
  .mem .no{font-size:27px;font-weight:700;letter-spacing:.16em;font-variant-numeric:tabular-nums}
  .qr{background:#fff;border-radius:12px;padding:13px;margin-top:14px;display:inline-block}
  .qr img{display:block;width:186px;height:186px}
  .qr .cap{font-size:10.5px;color:#8a8177;letter-spacing:.06em;margin-top:6px;text-align:center}
  .use{font-size:11.5px;color:#cfc5b8;margin-top:10px;line-height:1.6}
  .bc{background:#fff;border-radius:8px;padding:11px 10px 7px;margin-top:14px}
  .bc svg{display:block;width:100%;height:58px}
  .bc .cap{font-size:10.5px;color:#8a8177;letter-spacing:.1em;margin-top:3px}
  .rk{display:inline-block;font-size:11px;letter-spacing:.2em;font-weight:700;padding:5px 13px;border-radius:99px;margin-bottom:12px}
  .rk-standard{background:#5c534a;color:#e8e0d6}
  .rk-bronze{background:#8a5a34;color:#ffeedd}
  .rk-silver{background:#9aa0a6;color:#1c1a18}
  .rk-gold{background:linear-gradient(120deg,#c9a227,#f0d878);color:#2b230a}
  .rk-platinum{background:linear-gradient(120deg,#dfe4e8,#fff);color:#1c1a18}
  .axes{margin-top:16px;text-align:left}
  .ax{margin-bottom:10px}
  .ax .t{display:flex;justify-content:space-between;font-size:11.5px;color:#b8ada0;margin-bottom:4px}
  .ax .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  .ax .bar i{display:block;height:100%;border-radius:99px;background:#e8dcc8}
  .nx{font-size:12.5px;color:#e8dcc8;background:rgba(255,255,255,.09);border-radius:9px;padding:9px 12px;margin-top:12px;line-height:1.6}
  .pt{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:14px}
  .pt b{font-size:26px;font-weight:700}
  .pt s{text-decoration:none;font-size:12px;color:#b8ada0}
  .note{font-size:12.5px;color:#7d746b;background:#faf8f5;border:1px solid #eee9e3;border-radius:10px;padding:11px 13px;margin-top:12px}
  .ok{background:#eef7f1;border-color:#c6e6d3;color:#166b3e}
  .warn{background:#fdf6ec;border-color:#ecd9b0;color:#8a611d}
  .hist{font-size:13.5px}
  .hist .h{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f2ede7;color:#4a443d}
  .hist .h:last-child{border-bottom:0}
  .load{text-align:center;color:#9a9188;padding:40px 0;font-size:14px}
  .btn{display:block;width:100%;text-align:center;background:#26221e;color:#fff;border:0;border-radius:11px;
    padding:14px;font-size:15px;font-weight:700;font-family:inherit;text-decoration:none;margin-top:10px;cursor:pointer}
  .btn.line{background:#06c755}
  .btn.ghost{background:#fff;color:#26221e;border:1px solid #ded6cc}
  .btn.quiet{background:transparent;color:#8a8177;border:0;font-weight:400;font-size:13px;padding:10px;text-decoration:underline}
  .btn[disabled]{opacity:.5}
  /* 月額会員 */
  .subc{background:linear-gradient(160deg,#1f2a27,#33443f);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px}
  .subc .lbl{font-size:11px;letter-spacing:.24em;color:#9fc0b4;margin-bottom:12px}
  .subc .big{display:flex;align-items:baseline;gap:9px}
  .subc .big b{font-size:34px;font-weight:700;line-height:1}
  .subc .big s{text-decoration:none;font-size:13px;color:#b6ccc4}
  .subc .meta{font-size:12.5px;color:#c9ddd6;margin-top:12px;line-height:1.8}
  .subc .meta i{font-style:normal;color:#8fb3a7}
  .subc .st{display:inline-block;font-size:11px;letter-spacing:.14em;font-weight:700;padding:4px 11px;border-radius:99px;margin-bottom:10px}
  .st-active{background:#2f6b52;color:#d9f0e4}
  .st-past_due{background:#8a4a1d;color:#ffe6cf}
  .st-paused{background:#4a5560;color:#dce4ec}
  .st-canceled{background:#5c534a;color:#e0d8ce}
  .subact{display:flex;gap:8px;margin-top:14px}
  .subact .btn{margin-top:0;flex:1;font-size:13px;padding:11px}
  .terms{font-size:11.5px;color:#7d746b;background:#faf8f5;border:1px solid #eee9e3;border-radius:10px;padding:12px 13px;margin-top:12px;line-height:1.85}
  .terms b{color:#4a443d}
  .terms ul{margin:6px 0 0;padding-left:18px}
  #sqcardbox{margin-top:12px}
  .pay-secure{font-size:11px;color:#8a8177;margin-top:8px;line-height:1.6}
  .err{font-size:13px;color:#b3261e;background:#fdeceb;border:1px solid #f5c6c2;border-radius:10px;padding:10px 12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">S E A M</div>
  <div id="app"><div class="load">読み込んでいます…</div></div>
</div>
<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
const Q=new URLSearchParams(location.search);
/* どの店舗のLINEで開いているか。LINEのuserIdは店舗のOAごとに別の値なので、
 * 必ずその店のLIFFで開かないと本人確認が通らない。
 * 店舗はURLの ?s= で渡す（レジが出すQRに入っている）。 */
const SHOP=(Q.get('s')||'ginza').replace(/[^a-z0-9_-]/gi,'');
let LIFF_ID='';   // その店のLIFF。サーバーから取る
const app=document.getElementById('app');
const yen=n=>'¥'+Number(n||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* QRコード。入場受付が読むのと同じ値（salon.townの会員番号）を出す。
 * これで1枚のカードで入場もポイントも済む。 */
let _qrP=null;
function loadQR(){
  if(window.qrcode)return Promise.resolve();
  if(_qrP)return _qrP;
  _qrP=new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return _qrP;
}
function qrDataUrl(v,cell){
  try{const q=qrcode(0,'M');q.addData(String(v));q.make();return q.createDataURL(cell||6);}catch(e){return '';}
}

/* Code39のバーコード。数字だけ扱う。
 * レジのバーコードリーダー（1次元）でそのまま読める形にしてある。 */
const C39={'0':'101001101101','1':'110100101011','2':'101100101011','3':'110110010101','4':'101001101011',
  '5':'110100110101','6':'101100110101','7':'101001011011','8':'110100101101','9':'101100101101','*':'100101101101'};
function code39(txt){
  const s='*'+String(txt).replace(/\D/g,'')+'*';
  let bits='';
  for(const ch of s){ bits+=(C39[ch]||C39['*'])+'0'; }
  const w=2, h=58, W=bits.length*w;
  let r='';
  for(let i=0;i<bits.length;i++){ if(bits[i]==='1') r+=`<rect x="${i*w}" y="0" width="${w}" height="${h}"/>`; }
  return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="#111">${r}</svg>`;
}

/* 次のランクまであと何が足りないか。いちばん近い軸だけを一言で出す。
 * 全部並べると遠さが目立つので、届きそうな1本に絞る。 */
function nextLine(nx){
  if(!nx)return '';
  const w={visits:nx.visits?`あと <b>${nx.visits}回</b>のご来店で`:'',
    yVisits:nx.yVisits?`この1年であと <b>${nx.yVisits}回</b>のご来店で`:'',
    ySpend:nx.ySpend?`あと <b>¥${Number(nx.ySpend).toLocaleString()}</b>のご利用で`:''}[nx.closest||'visits'];
  if(!w)return `<div class="nx"><b>${esc(nx.name)}</b>まであと少しです</div>`;
  return `<div class="nx">${w} <b>${esc(nx.name)}</b>へ（ポイント${nx.rate}%）</div>`;
}
function axes(j){
  const nx=j.next; if(!nx)return '';
  const t=(j.rank&&j.rank.key)||'standard';
  const rows=[];
  const mk=(label,now,need,fmt)=>{
    const goal=now+need; if(!goal)return;
    rows.push(`<div class="ax"><div class="t"><span>${label}</span><span>${fmt(now)} / ${fmt(goal)}</span></div>
      <div class="bar"><i style="width:${Math.min(100,Math.round(now/goal*100))}%"></i></div></div>`);
  };
  mk('通算のご来店',j.visits||0,nx.visits||0,v=>v+'回');
  mk('この1年のご来店',j.yVisits||0,nx.yVisits||0,v=>v+'回');
  mk('この1年のご利用',j.ySpend||0,nx.ySpend||0,v=>'¥'+Number(v).toLocaleString());
  return rows.length?`<div class="axes">${rows.join('')}</div>`:'';
}
function memberCard(code,points,name,j){
  j=j||{};
  const rk=j.rank||{}, key=rk.key||'standard';
  const sal=j.salonId||'';
  // 物理の会員カードと同じQR。これ1枚で入場もポイントも済む
  const qr=sal&&window.qrcode?qrDataUrl(sal,6):'';
  return `<div class="mem">
    <div class="lbl">SEAM MEMBER</div>
    ${rk.name?`<div><span class="rk rk-${esc(key)}">${esc(rk.name)}　ポイント${j.rate||1}%</span></div>`:''}
    ${name?`<div style="font-size:15px;font-weight:700;margin-top:8px">${esc(name)} 様</div>`:''}
    ${qr?`<div class="qr"><img src="${qr}" alt=""><div class="cap">入場・お会計 兼用</div></div>
        <div class="use">ご入場のときは受付のiPadに、お会計のときはレジにこの画面をお見せください</div>`
      :''}
    <div class="bc">${code39(code)}<div class="cap">${esc(code)}</div></div>
    ${qr?'':'<div class="use">レジでこの番号を読み取ってポイントをお付けします</div>'}
    <div class="pt"><b>${Number(points||0).toLocaleString()}</b><s>ポイント</s></div>
    ${axes(j)}
    ${nextLine(j.next)}
  </div>
  <div class="note">${qr?'ご入場のときも同じ画面をお見せいただけます。<br>':''}ポイントは<b>オンラインショップで1pt=${j.ptGoods!=null?j.ptGoods:1}円</b>、<b>サロンの施術で1pt=${j.ptTech!=null?j.ptTech:0.5}円</b>としてお使いいただけます</div>`;
}

function receiptCard(r){
  const rows=[];
  // 回数券・月額会員で施術分をカバーしたときは、必ず1行出す。
  // 0円の領収書だけを出すと「何も買っていない」ように見えて不信感を生む。
  if(r.passCode&&r.techCovered){
    rows.push([r.passKind==='membership'?'施術（会員の1回を利用・今月分お預かり済み）':'施術（回数券を1回利用）',0]);
  }else if(r.tech)rows.push(['施術',r.tech]);
  (r.items||[]).forEach(i=>rows.push([i.name+(i.qty>1?' ×'+i.qty:''),(+i.price||0)*(+i.qty||1)]));
  if(r.discount)rows.push(['割引',-r.discount]);
  // 値引きを必ず載せる（明細と合計が合わなくなるため）
  if(r.ptYen)rows.push([`ポイント利用（${Number(r.pointsUsed||0).toLocaleString()}pt）`,-r.ptYen]);
  if(r.giftUsed)rows.push(['ギフト券',-r.giftUsed]);
  const PM={cash:'現金',card:'カード',qr:'QR決済',hpb:'スマート支払い'};
  return `<div class="card">
    <h1>ご利用ありがとうございました</h1>
    <p class="sub">${esc((r.date||'').replace(/-/g,'/'))}　SEAM 銀座${r.customer?'　'+esc(r.customer)+' 様':''}</p>
    <div class="amt">${yen(r.total)}</div>
    <div class="rows">${rows.map(([a,b])=>`<div class="row"><span>${esc(a)}</span><span>${b<0?'−':''}${yen(Math.abs(b))}</span></div>`).join('')}
      <div class="row tot"><span>合計</span><span>${yen(r.total)}</span></div>
      <div class="row" style="color:#7d746b;font-size:13px"><span>お支払い</span><span>${esc(PM[r.method]||r.method||'')}</span></div>
    </div>
  </div>`;
}

function histCard(h){
  if(!h||!h.length)return '';
  const PM={cash:'現金',card:'カード',qr:'QR決済',hpb:'スマート支払い'};
  return `<div class="card hist"><h1 style="font-size:15px;margin-bottom:10px">これまでのご利用</h1>
    ${h.map(x=>`<div class="h"><span>${esc((x.date||'').replace(/-/g,'/'))}</span><span>${yen(x.total)}　<s style="color:#a29a91;text-decoration:none;font-size:12px">${esc(PM[x.method]||'')}</s></span></div>`).join('')}
  </div>`;
}

/* ══════════ 月額会員 ══════════
 * 残回数・次回請求日・カードを見せ、休会と解約を2タップで置く。
 * 解約しづらい会員制は口コミを壊すので、ここは必ず前に出す（特商法の要件でもある）。 */
const ST={active:'ご利用中',past_due:'カードのご確認をお願いします',paused:'お休み中',canceled:'自動更新を止めています'};
let SUB=null, SUBCFG=null, IDTOK='', UID='';

function subCard(sub,cfg){
  cfg=cfg||{};
  if(!sub){
    if(!cfg.enabled)return '';
    return `<div class="card">
      <h1 style="font-size:16px">${esc(cfg.label||'月額会員')}</h1>
      <p class="sub" style="margin:6px 0 0">ひと月に一度いらっしゃる方のための会員です<br>
        月額のなかに90分が一回ふくまれていて 使わなかった月は次の月に持ち越せます</p>
      <div class="rows"><div class="row"><span>月額</span><span>${yen(cfg.priceYen)}</span></div>
        <div class="row"><span>繰越</span><span>${cfg.carryCap||3}回まで</span></div>
        <div class="row"><span>お約束の期間</span><span>${cfg.minTermMonths?cfg.minTermMonths+'ヶ月':'なし（いつでも解約）'}</span></div></div>
      <button class="btn" id="subJoin">会員になる</button></div>`;
  }
  const st=sub.status||'active';
  const canceled=st==='canceled';
  return `<div class="subc">
    <div class="lbl">SEAM GINZA MEMBER</div>
    <div><span class="st st-${esc(st)}">${esc(ST[st]||st)}</span></div>
    <div class="big"><b>${sub.remaining||0}</b><s>回 お使いいただけます</s></div>
    <div class="meta">
      ${canceled
        ? `<i>お使いいただける期限</i> ${esc((sub.expires||'').replace(/-/g,'/')||'—')}`
        : (st==='paused'
            ? `<i>お休み明け</i> ${esc((sub.pausedUntil||'').replace(/-/g,'/')||'—')}`
            : `<i>次回のお引き落とし</i> ${esc((sub.nextChargeAt||'').replace(/-/g,'/')||'—')}　${yen(sub.priceYen)}`)}
      ${sub.cardLast4?`<br><i>カード</i> ${esc(sub.cardBrand||'')} ····${esc(sub.cardLast4)}`:''}
      ${sub.carryCap?`<br><i>繰越</i> ${sub.carryCap}回まで`:''}
      ${sub.termEndsAt&&!canceled?`<br><i>お約束の期間</i> ${esc(sub.termEndsAt.replace(/-/g,'/'))}まで`:''}
    </div>
    ${sub.cancelAt&&!canceled?`<div class="note" style="background:rgba(255,255,255,.1);border:0;color:#e6d9c4;margin-top:12px">
      ${esc(sub.cancelAt.replace(/-/g,'/'))}で自動更新が終わるよう承っています<br>それまではこれまでどおりお使いいただけます
      <button class="btn ghost" id="subUndo" style="margin-top:9px;padding:10px;font-size:13px">やっぱり続ける</button></div>`:''}
    ${(cfg.giftEnabled!==false&&(sub.remaining||0)>0)?`<button class="btn ghost" id="subGift" style="margin-top:14px">この1回を大切な方に贈る</button>`:''}
    <div class="subact">
      ${canceled
        ? `<button class="btn ghost" id="subResume">再開する</button>`
        : `<button class="btn ghost" id="subCard">カードを変える</button>
           ${st==='paused'?'':'<button class="btn ghost" id="subPause">1ヶ月休む</button>'}`}
    </div>
    ${(canceled||sub.cancelAt)?'':'<button class="btn quiet" id="subCancel">自動更新をやめる</button>'}
  </div>
  <div id="giftlist"></div>
  <div id="submsg"></div>`;
}

/* 贈る。1回ぶんをふつうの回数券として切り出し、LINEでそのまま送れる文面にする。
 * 使われなければ戻せるし、期限が来たら自動で戻る＝捨てられない。 */
async function giftFlow(){
  const msg=document.getElementById('submsg')||document.getElementById('app');
  msg.innerHTML=`<div class="card"><h1 style="font-size:16px">この1回を贈る</h1>
    <img src="../images/lp/spa/ill_gift.webp" alt="" aria-hidden="true"
         style="display:block;width:100%;max-width:230px;margin:8px auto 2px;mix-blend-mode:multiply">
    <p class="sub" style="margin:6px 0 0">お使いにならない1回を 大切な方にお渡しいただけます<br>
      ${SUBCFG&&SUBCFG.giftExpireMonths?SUBCFG.giftExpireMonths+'ヶ月':'6ヶ月'}お使いいただけて 使われなければお客様にお戻しします</p>
    <label style="display:block;font-size:13px;color:#4a443d;margin-top:14px">お相手のお名前（任意）
      <input id="giftTo" maxlength="30" placeholder="例：田中 様" style="width:100%;margin-top:6px;padding:12px;border:1px solid #e2dbd2;border-radius:10px;font-size:15px;font-family:inherit"></label>
    <div id="gifterr"></div>
    <button class="btn" id="giftGo">この1回を贈る</button>
    <button class="btn quiet" id="giftBack">やめる</button></div>`;
  document.getElementById('giftBack').onclick=()=>render();
  document.getElementById('giftGo').onclick=async()=>{
    const b=document.getElementById('giftGo'); b.disabled=true; b.textContent='お手続き中…';
    try{
      const j=await jpost(API+'/member/gift',{idToken:IDTOK,uid:UID,s:SHOP,to:(document.getElementById('giftTo').value||'').trim()});
      msg.innerHTML=`<div class="card"><h1 style="font-size:16px">お贈りする番号ができました</h1>
        <div class="mem" style="margin:14px 0 0;padding:22px 18px">
          <div class="lbl">SEAM GINZA — 1 VISIT</div>
          <div class="no" style="font-size:24px">${esc(j.code)}</div>
          <div class="use">${esc((j.expires||'').replace(/-/g,'/'))}までお使いいただけます</div></div>
        <div class="note">ご予約のときにこの番号をお伝えいただくと 1回ぶんとしてお受けできます<br>
          まだお使いでなければ このあと会員証の画面からお戻しいただけます</div>
        <button class="btn" id="giftShare">LINEで送る</button>
        <button class="btn ghost" id="giftCopy">番号をコピー</button>
        <button class="btn quiet" id="giftDone">会員証にもどる</button></div>`;
      document.getElementById('giftDone').onclick=()=>render();
      document.getElementById('giftCopy').onclick=async()=>{
        try{ await navigator.clipboard.writeText(j.code); document.getElementById('giftCopy').textContent='コピーしました'; }catch(e){}
      };
      document.getElementById('giftShare').onclick=async()=>{
        try{
          if(window.liff&&liff.isApiAvailable&&liff.isApiAvailable('shareTargetPicker')){
            await liff.shareTargetPicker([{type:'text',text:j.shareText}]);
          }else if(navigator.share){ await navigator.share({text:j.shareText}); }
          else { await navigator.clipboard.writeText(j.shareText); document.getElementById('giftShare').textContent='文面をコピーしました'; }
        }catch(e){}
      };
    }catch(e){
      const el=document.getElementById('gifterr'); if(el)el.innerHTML=`<div class="err">${esc(e.message)}</div>`;
      b.disabled=false; b.textContent='この1回を贈る';
    }
  };
}

function giftListCard(gifts){
  if(!gifts||!gifts.length)return '';
  const st=g=>g.void?'お戻し済み':(g.used?'お使いいただきました':(g.expired?'期限切れ（お戻しします）':'まだお使いでありません'));
  return `<div class="card hist"><h1 style="font-size:15px;margin-bottom:10px">お贈りした1回</h1>
    ${gifts.map(g=>`<div class="h" style="align-items:flex-start">
      <span>${esc(g.code)}${g.to?'<br><s style="color:#a29a91;text-decoration:none;font-size:12px">'+esc(g.to)+'</s>':''}</span>
      <span style="text-align:right">${esc(st(g))}
        ${g.canReturn?`<br><button class="btn quiet" data-ret="${esc(g.code)}" style="padding:2px 0;margin:0;font-size:12px">戻す</button>`:''}</span>
    </div>`).join('')}
    <div class="note" style="margin-top:10px">まだお使いでない分は お戻しいただけます 期限が過ぎた分は自動でお戻しします</div></div>`;
}

function termsHtml(cfg){
  return `<div class="terms"><b>お申し込みの前にご確認ください</b>
    <ul>
      <li>月額 ${yen(cfg.priceYen)}（税込）を毎月同じ日にご登録のカードからお引き落としします</li>
      <li><b>自動更新です</b>。止めるまで毎月続きます</li>
      ${cfg.minTermMonths?`<li><b>お約束の期間は${cfg.minTermMonths}ヶ月です</b>。期間中に解約をお申し出いただいた場合、満了日で自動更新が終わり、それまでは毎月のお引き落としが続きます</li>
      <li>お申し込みから${cfg.coolOffDays||8}日以内は、その場で解約を承ります</li>`
      :'<li>解約はこの会員証の画面からいつでもできます。次回のお引き落とし日の前日までにお手続きください</li>'}
      <li>解約のお手続きはこの会員証の画面からできます</li>
      <li>お預かり済みの回数は解約後 ${cfg.graceMonths||3}ヶ月お使いいただけます</li>
      <li>お使いにならなかった月は<b>翌月に持ち越せます</b>（${cfg.carryCap?cfg.carryCap+'回まで':'上限なし'}）</li>
      <li>お使いにならない1回は<b>大切な方に贈れます</b>。使われなければお客様にお戻しします</li>
      <li>販売元・お問い合わせ先は<a href="https://seam.site/tokushoho" target="_blank" rel="noopener">特定商取引法に基づく表記</a>をご覧ください</li>
    </ul></div>`;
}

/* Square のカード欄。番号は Square へ直接送られ、当店のサーバーは受け取らない。 */
async function mountCard(boxId){
  const cfg=await jget(API+'/pay/config').catch(()=>null);
  if(!cfg||!cfg.ready)throw new Error('いまカードのお手続きを承っておりません');
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src=cfg.sdk;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  const payments=window.Square.payments(cfg.appId,cfg.locationId);
  const card=await payments.card();
  await card.attach('#'+boxId);
  return {card,payments,env:cfg.env};
}

async function subFlow(mode){
  const msg=document.getElementById('submsg')||document.getElementById('app');
  const isJoin=mode==='join';
  msg.innerHTML=`<div class="card"><h1 style="font-size:16px">${isJoin?'会員のお申し込み':'カードを変える'}</h1>
    ${isJoin?termsHtml(SUBCFG):''}
    <div id="sqcardbox"></div>
    <div class="pay-secure">🔒 カード情報はSquareへ直接送られます（当店のサーバーは番号を受け取りません）</div>
    <div id="suberr"></div>
    ${isJoin?`<label style="display:flex;gap:9px;align-items:flex-start;font-size:13px;margin-top:12px;color:#4a443d">
      <input type="checkbox" id="subAgree" style="margin-top:4px"><span>上の内容に同意します</span></label>`:''}
    <button class="btn" id="subGo" disabled>${isJoin?yen(SUBCFG.priceYen)+'で申し込む':'このカードに変える'}</button>
    <button class="btn quiet" id="subBack">やめる</button></div>`;
  const err=t=>{const e=document.getElementById('suberr');if(e)e.innerHTML=t?`<div class="err">${esc(t)}</div>`:'';};
  let c;
  try{ c=await mountCard('sqcardbox'); }catch(e){ err(e.message); return; }
  const go=document.getElementById('subGo'), ag=document.getElementById('subAgree');
  const sync=()=>{ go.disabled = isJoin ? !(ag&&ag.checked) : false; };
  if(ag)ag.addEventListener('change',sync); sync();
  document.getElementById('subBack').onclick=()=>render();
  go.onclick=async()=>{
    go.disabled=true; err(''); go.textContent='お手続き中…';
    try{
      const r=await c.card.tokenize();
      if(r.status!=='OK')throw new Error((r.errors&&r.errors[0]&&r.errors[0].message)||'カードを確認できませんでした');
      const body={idToken:IDTOK,uid:UID,s:SHOP,cardToken:r.token,verificationToken:r.details&&r.details.verificationToken};
      if(isJoin){ body.agreed=true; body.customer=(SUB&&SUB.customer)||''; }
      const j=await jpost(API+(isJoin?'/member/subscribe':'/member/card'),body);
      await render(isJoin?'会員のお手続きが終わりました':'カードを変えました');
    }catch(e){ err(e.message); go.disabled=false; go.textContent=isJoin?yen(SUBCFG.priceYen)+'で申し込む':'このカードに変える'; }
  };
}

/* ★confirm()/alert()は使わない。
 * このページは必ずLINEのアプリ内ブラウザで開かれ、そこでは confirm() が
 * ダイアログを出さずに false を返すことがある＝ボタンが無反応になる
 * （キャンセルページで実際に起きた・サロンボードRPAでも同じ罠があった）。
 * 確認はページの中に出す。 */
async function subAction(kind){
  const inTerm=SUB&&SUB.termEndsAt&&SUB.termEndsAt>new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
  const labels={pause:'1ヶ月お休みにします。よろしいですか',
    cancel:inTerm
      ? 'お約束の期間は'+String(SUB.termEndsAt).replace(/-/g,'/')+'までです。その日で自動更新が終わるように承ります。それまでは毎月のお引き落としが続きます。よろしいですか'
      : '自動更新をやめます。お預かり済みの残り回数はそのままお使いいただけます。よろしいですか',
    resume:'会員を再開します。よろしいですか',
    'cancel-undo':'解約のご予約を取り消して、このまま続けます。よろしいですか'};
  const doneMsg={pause:'1ヶ月のお休みにしました',cancel:'承りました',resume:'再開しました','cancel-undo':'このまま続けます'};
  const btnIds={pause:'subPause',cancel:'subCancel',resume:'subResume','cancel-undo':'subUndo'};
  const anchor=document.getElementById(btnIds[kind]);
  const old=document.getElementById('subconf'); if(old)old.remove();
  if(!anchor)return;
  anchor.insertAdjacentHTML('afterend',
    `<div id="subconf" class="note" style="border-color:#e0c9a6;background:#fdf8ef;color:#6b4e1d">
       ${esc(labels[kind])}
       <div style="display:flex;gap:8px;margin-top:9px">
         <button type="button" id="subyes" class="btn" style="margin:0;flex:1;padding:12px">はい</button>
         <button type="button" id="subno" class="btn" style="margin:0;flex:1;padding:12px;background:#fff;color:#7d746b;border:1px solid #e7e1d9">やめる</button>
       </div>
       <div id="suberr" style="color:#c0392b;font-weight:700;margin-top:6px;min-height:18px"></div>
     </div>`);
  document.getElementById('subno').onclick=()=>{const c=document.getElementById('subconf');if(c)c.remove();};
  document.getElementById('subyes').onclick=async()=>{
    const y=document.getElementById('subyes');
    y.disabled=true;y.textContent='お手続き中…';
    try{
      await jpost(API+'/member/'+kind,{idToken:IDTOK,uid:UID,s:SHOP});
      await render(doneMsg[kind]);
    }catch(e){
      const el=document.getElementById('suberr'); if(el)el.textContent=e.message;
      y.disabled=false;y.textContent='はい';
    }
  };
}

function wireSub(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  on('subJoin',()=>subFlow('join'));
  on('subCard',()=>subFlow('card'));
  on('subPause',()=>subAction('pause'));
  on('subCancel',()=>subAction('cancel'));
  on('subResume',()=>subAction('resume'));
  on('subUndo',()=>subAction('cancel-undo'));
  on('subGift',()=>giftFlow());
  document.querySelectorAll('[data-ret]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='お戻し中…';
    try{ await jpost(API+'/member/gift-return',{idToken:IDTOK,uid:UID,s:SHOP,code:b.dataset.ret});
      await render('お戻ししました'); }
    catch(e){ b.disabled=false;b.textContent='戻す';
      const m=document.getElementById('submsg'); if(m)m.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  });
}

async function jget(u){const r=await fetch(u);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('通信に失敗しました('+r.status+')'));return j;}
async function jpost(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('通信に失敗しました('+r.status+')'));return j;}

function fail(msg,hint){
  app.innerHTML=`<div class="card"><h1 style="font-size:16px">表示できませんでした</h1>
    <p class="sub" style="margin:6px 0 0">${esc(msg)}</p>
    ${hint?`<div class="note warn">${esc(hint)}</div>`:''}</div>`;
}

async function run(){
  let uid='', dispName='', idToken='', oaUrl='';
  // その店のLIFFを取ってくる（店舗ごとにLINE公式アカウントが違う）
  try{
    const cfg=await jget(API+'/line/shop-config?shop='+encodeURIComponent(SHOP));
    LIFF_ID=cfg.liffId||''; oaUrl=cfg.oaUrl||'';
  }catch(e){}
  if(!LIFF_ID){
    fail('この店舗のLINEの設定がまだありません','お手数ですがスタッフにお声がけください');
    return;
  }
  // LINEの中で開かれたときは、その方のLINEを確かめる
  try{
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    const pf=await liff.getProfile();
    uid=pf.userId; dispName=pf.displayName||'';
    // LINEが発行した本人確認用のトークン。サーバはこれをLINEに問い合わせて本人を確かめる
    idToken=liff.getIDToken()||'';
  }catch(e){ /* LINE以外のブラウザで開かれた場合 */ }

  const t=Q.get('t');
  if(t){
    // 会計直後：合言葉つきで開かれた。LINEと結び付けて領収のご案内を出す
    if(!uid){
      app.innerHTML=`<div class="card"><h1 style="font-size:16px">LINEで開いてください</h1>
        <p class="sub">この画面はLINEアプリの中でご覧いただけます。レジでお見せしているコードをLINEのカメラで読み取ってください</p></div>`;
      return;
    }
    let j;
    try{ j=await jpost(API+'/line/link',{token:t,lineUserId:uid,idToken,displayName:dispName}); }
    catch(e){ fail(e.message,'お手数ですがスタッフにお声がけください'); return; }
    if(j.salonId)await loadQR().catch(()=>{});
    app.innerHTML=(j.receipt?receiptCard(j.receipt):'')
      + (j.memberCode?memberCard(j.memberCode,j.points,'',j):'')
      + `<div class="note ok">LINEに登録しました。次回からご予約のお知らせ・領収のご案内がこちらに届きます</div>`
      + `<a class="btn" href="./line.html?s=${encodeURIComponent(SHOP)}">会員証をひらく</a>`;
    return;
  }

  // 会員証だけを見にきた場合
  if(!uid){
    app.innerHTML=`<div class="card"><h1 style="font-size:16px">会員証</h1>
      <p class="sub">LINEアプリの中で開くと会員証が表示されます</p>
      <a class="btn line" href="https://liff.line.me/${LIFF_ID}?s=${encodeURIComponent(SHOP)}">LINEでひらく</a></div>`;
    return;
  }
  UID=uid; IDTOK=idToken;
  await render();
}

/* 会員証・月額会員・履歴をまとめて描く（休会や解約のあとも同じ関数で描き直す） */
async function render(okMsg){
  app.innerHTML='<div class="load">読み込んでいます…</div>';
  const q='s='+encodeURIComponent(SHOP)+'&uid='+encodeURIComponent(UID)+'&idToken='+encodeURIComponent(IDTOK);
  let j;
  try{ j=await jget(API+'/member/me?'+q); }
  catch(e){ fail(e.message); return; }
  // 月額会員は未導入の店舗でも画面が壊れないよう、失敗したら黙って出さない
  let sres=null, gres=null;
  try{ sres=await jget(API+'/member/subscription?'+q); }catch(e){}
  SUB=(sres&&sres.subscription)||null; SUBCFG=(sres&&sres.config)||null;
  if(SUB)try{ gres=await jget(API+'/member/gift-list?'+q); }catch(e){}
  if(j.salonId)await loadQR().catch(()=>{});
  if(!j.linked){
    app.innerHTML=`<div class="card"><h1 style="font-size:16px">まだ会員証がありません</h1>
      <p class="sub">次回ご来店のお会計のときに、レジでコードを読み取っていただくと会員証が作られます</p></div>`;
    return;
  }
  app.innerHTML=(okMsg?`<div class="note ok">${esc(okMsg)}</div>`:'')
    + memberCard(j.memberCode,j.points,j.name,j)
    + (SUBCFG?subCard(SUB,SUBCFG):'')
    + giftListCard(gres&&gres.gifts)
    + histCard(j.history);
  wireSub();
}
run();
</script>
