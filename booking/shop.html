<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ショップ｜SEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ SEAM ショップ（iPad用）══
   店頭のiPadで、会計と在庫確認を片手で回すための画面。
   Bluetoothのバーコードリーダーは「キーボードとして文字を打ち、最後にEnterを送る」機械なので、
   画面のどこにも触らずに読めるよう、キー入力を常に見張って組み立てる。
   読んだ文字列は長さで行き先が決まる（会員QR24桁 / 会員番号10桁 / 商品JAN13桁・8桁）。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16171B;--body:#3E3B36;--sub:#7C776E;--line:#E3DCD0;--cream:#FBF9F5;--sand:#F3EFE7;
  --gold:#B8945A;--clay:#A87456;--ok:#1F6B45;--ng:#B4442E;--bg:#F7F5F1;
}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--body);
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}   /* 16px未満だとiOSが勝手に拡大する */

/* ── 上の帯 ── */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;
  padding-top:calc(10px + env(safe-area-inset-top))}
.brand{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.18em;color:var(--ink)}
.top select{border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:#fff;color:var(--ink)}
.spacer{flex:1}
/* 読み取り待機のランプ。緑＝いつでも読める */
.lamp{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);letter-spacing:.04em}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block;
  box-shadow:0 0 0 0 rgba(31,107,69,.5);animation:pulse 2.4s infinite}
.lamp.off i{background:#C4BEB4;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,107,69,.45)}70%{box-shadow:0 0 0 9px rgba(31,107,69,0)}100%{box-shadow:0 0 0 0 rgba(31,107,69,0)}}

/* ── 2枚並び。iPadを横にすると左が会計・右が商品 ── */
.wrap{display:grid;grid-template-columns:minmax(360px,38%) 1fr;gap:0;height:calc(100% - 58px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
.pane{overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 40px}
.pane.left{background:#fff;border-right:1px solid var(--line)}
@media(max-width:900px){.pane.left{border-right:0;border-bottom:1px solid var(--line)}}

h2{font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--clay);margin:0 0 14px;
  text-transform:uppercase;font-family:'Cormorant Garamond',serif;font-size:15px}

/* ── いま読んだもの ── */
.said{border:1px solid var(--line);background:var(--cream);border-radius:3px;padding:14px 16px;margin-bottom:16px}
.said.err{border-color:rgba(180,68,46,.4);background:#FCF6F4}
.said-k{font-size:11.5px;letter-spacing:.08em;color:var(--sub)}
.said-v{font-size:16px;color:var(--ink);margin-top:3px;line-height:1.5}

/* ── 会計の明細 ── */
.cart{border-top:1px solid var(--line)}
.ci{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:13px 2px}
.ci-n{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.6}
.ci-b{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:.04em}
.ci-q{display:flex;align-items:center;gap:2px;flex:none}
.ci-q button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-size:17px;color:var(--ink);line-height:1}
.ci-q span{min-width:34px;text-align:center;font-size:15px}
.ci-p{flex:none;min-width:86px;text-align:right;font-family:'Cormorant Garamond',serif;
  font-size:18px;color:var(--ink)}
.ci-x{flex:none;width:34px;height:34px;border:0;background:none;color:#B9B2A6;font-size:19px}
.empty{color:var(--sub);font-size:13px;padding:26px 0;text-align:center;letter-spacing:.04em}

/* ── 合計 ── */
.sum{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.sr{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.sr.big{font-size:16px;color:var(--ink);border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.sr.big b{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600}
.sr.cut{color:var(--clay)}
.pay{display:flex;gap:8px;margin:14px 0 0}
.pay button{flex:1;padding:12px 6px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-size:13px;color:var(--body);letter-spacing:.04em}
.pay button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.go{width:100%;margin-top:14px;padding:17px;border:0;border-radius:3px;background:var(--ink);color:#fff;
  font-size:16px;letter-spacing:.08em}
.go[disabled]{background:#D6D0C6;color:#fff}
.mini{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-size:13px;color:var(--sub)}

/* ── 右側のタブ ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;padding:13px 8px;border:0;background:none;font-size:14px;color:var(--sub);
  border-bottom:2px solid transparent;letter-spacing:.06em}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.srch{display:flex;gap:8px;margin-bottom:14px}
.srch input{flex:1;border:1px solid var(--line);border-radius:3px;padding:13px 14px;background:#fff}
.srch button{padding:0 18px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:13px;color:var(--body)}

/* ── 商品の一覧（指で押しやすい大きさ）── */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pc{text-align:left;border:1px solid var(--line);background:#fff;border-radius:3px;padding:14px;min-height:96px;
  display:flex;flex-direction:column;justify-content:space-between}
.pc:active{background:var(--cream)}
.pc-n{font-size:13.5px;color:var(--ink);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-f{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
.pc-p{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--ink)}
.pc-s{font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.pc-s.zero{color:var(--ng)}

/* ── 在庫の内訳 ── */
.stk{border-top:1px solid var(--line)}
.stk-r{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 2px;font-size:14px}
.stk-r b{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ink);font-weight:600}
.stk-r.here{background:var(--cream)}
.stk-adj{display:flex;gap:8px;margin-top:16px}
.stk-adj button{flex:1;padding:14px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:14px}

/* ── お客様 ── */
.mem-h{font-size:22px;color:var(--ink);letter-spacing:.04em}
.mem-r{display:inline-block;font-size:11.5px;letter-spacing:.1em;color:var(--clay);
  border:1px solid rgba(168,116,86,.35);border-radius:2px;padding:3px 10px;margin-top:8px}
.mem-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0 0}
.mg{border:1px solid var(--line);background:#fff;border-radius:3px;padding:14px}
.mg-k{font-size:11px;letter-spacing:.08em;color:var(--sub)}
.mg-v{font-family:'Cormorant Garamond',serif;font-size:25px;color:var(--ink);line-height:1.2;margin-top:4px}
.hist{margin-top:22px;border-top:1px solid var(--line)}
.hr{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 2px;font-size:13px}
.hr-d{color:var(--sub);font-size:12px;white-space:nowrap}
.hr-i{flex:1;min-width:0;color:var(--body);line-height:1.6}
.hr-p{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ink);white-space:nowrap}

/* ── 合言葉 ── */
.gate{max-width:400px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:3px;padding:32px 26px}
.gate h1{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.18em;color:var(--ink);margin:0 0 6px;font-weight:600}
.gate p{font-size:13px;color:var(--sub);margin:0 0 18px}
.gate input{width:100%;border:1px solid var(--line);border-radius:3px;padding:14px}
.gate button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:3px;background:var(--ink);color:#fff;font-size:15px;letter-spacing:.06em}

/* ── 知らせ ── */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:3px;font-size:14px;z-index:200;
  transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ng{background:var(--ng)}
.hidesink{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <h1>SEAM SHOP</h1>
  <p>店舗のiPadで使う画面です 合言葉を入れてください</p>
  <input id="gtok" type="password" placeholder="管理トークン" autocomplete="off">
  <button id="gbtn">開く</button>
</div>

<div id="app" style="display:none;height:100%">
  <div class="top">
    <span class="brand">SEAM SHOP</span>
    <select id="shopSel"></select>
    <span class="spacer"></span>
    <span class="lamp" id="lamp"><i></i><span id="lampT">読み取り待機中</span></span>
  </div>

  <div class="wrap">
    <div class="pane left">
      <h2>お会計</h2>
      <div id="said"></div>
      <div class="cart" id="cart"></div>
      <div class="sum" id="sum"></div>
    </div>

    <div class="pane right">
      <div class="tabs">
        <button data-t="prod" class="on">商品</button>
        <button data-t="stock">在庫</button>
        <button data-t="mem">お客様</button>
      </div>
      <div id="rbody"></div>
    </div>
  </div>
</div>

<input class="hidesink" id="sink" autocomplete="off" aria-hidden="true">
<div id="toast"></div>

<script>
/* ══════════ 土台 ══════════ */
const API='https://seam-square-pay.suenotakemi.workers.dev';
const TOKK='stb_admin_tok', SHOPK='stb_shop';
let TOK=localStorage.getItem(TOKK)||'';
let SHOP=localStorage.getItem(SHOPK)||'ginza';
let SHOPS=[], TAB='prod', CART=[], MEMBER=null, PAY='cash', STOCKVIEW=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+(+n||0).toLocaleString();
const H=(...a)=>({'Authorization':'Bearer '+TOK,...Object.assign({},...a)});
async function get(p){const r=await fetch(API+p,{headers:H()});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json();}
async function post(p,b){const r=await fetch(API+p,{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify(b)});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json();}
let tt;
function toast(m,ng){const t=$('toast');t.textContent=m;t.className='on'+(ng?' ng':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',ng?3200:1900);}

/* ══════════ 読み取り ══════════
   Bluetoothのリーダーはキーボードとして振る舞う。
   人の入力と混ざらないよう「文字が続けて速く来て 最後にEnter」を機械とみなす。 */
const SALON_QR=/^\d{17}[0-9A-Za-z]{7}$/;   // 会員カードのQR（24桁）
const MEMNO=/^\d{10}$/;                     // うちの会員番号（10桁）
const JAN=/^\d{8}$|^\d{12,14}$/;            // 商品のバーコード
let buf='', last=0;
document.addEventListener('keydown',e=>{
  const el=document.activeElement;
  // 人が打っている欄では邪魔をしない（検索欄・合言葉など）。読み取り用の隠し欄は例外
  const typing=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&el.id!=='sink';
  const now=Date.now();
  if(now-last>120)buf='';               // 間があいたら前の読みは捨てる
  last=now;
  if(e.key==='Enter'){
    const code=buf.trim();buf='';
    if(code.length>=6&&!typing){e.preventDefault();onScan(code);}
    return;
  }
  if(e.key.length===1)buf+=e.key;
});
/* 読んだ文字列の行き先を長さで決める */
async function onScan(code){
  try{
    if(SALON_QR.test(code)||MEMNO.test(code)){ await loadMember(code); return; }
    if(JAN.test(code)){ await onProductCode(code); return; }
    // 形が分からないときも、いちおう商品として引いてみる（社内コード等）
    await onProductCode(code);
  }catch(err){ said('読み取り',esc(err.message||String(err)),true); toast(err.message||'読み取れませんでした',true); }
}
function said(k,v,ng){ $('said').innerHTML=`<div class="said${ng?' err':''}"><div class="said-k">${esc(k)}</div><div class="said-v">${v}</div></div>`; }

async function onProductCode(code){
  const j=await get('/products?barcode='+encodeURIComponent(code));
  const p=(j.products||[])[0];
  if(!p){ said('バーコード',esc(code)+' — 登録がありません',true); toast('この商品は登録されていません',true); return; }
  if(TAB==='stock'){ await showStock(p.id); said('在庫を確認',esc(p.name)); return; }
  addToCart(p); said('読み取りました',esc(p.name)+'　'+yen(p.price));
}

/* ══════════ 会計 ══════════ */
function addToCart(p){
  const f=CART.find(x=>x.productId===p.id);
  if(f)f.qty++; else CART.push({productId:p.id,name:p.name,unit:+p.price||0,qty:1});
  render();
}
function cartTotal(){ return CART.reduce((s,i)=>s+i.unit*i.qty,0); }
function renderCart(){
  if(!CART.length){ $('cart').innerHTML='<div class="empty">バーコードを読み取ると ここに並びます</div>'; return; }
  $('cart').innerHTML=CART.map((i,ix)=>`<div class="ci">
    <div class="ci-n">${esc(i.name)}<div class="ci-b">${yen(i.unit)}</div></div>
    <div class="ci-q"><button data-q="-" data-i="${ix}">−</button><span>${i.qty}</span><button data-q="+" data-i="${ix}">＋</button></div>
    <div class="ci-p">${yen(i.unit*i.qty)}</div>
    <button class="ci-x" data-x="${ix}">×</button></div>`).join('');
  $('cart').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const i=CART[+b.dataset.i]; if(b.dataset.q==='+')i.qty++; else if(--i.qty<=0)CART.splice(+b.dataset.i,1); render();});
  $('cart').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{CART.splice(+b.dataset.x,1);render();});
}
function renderSum(){
  const t=cartTotal();
  const m=MEMBER?`<div class="sr cut"><span>${esc(MEMBER.name||'会員')} 様（${esc(MEMBER.rank||'')}）</span><span>${MEMBER.points||0} pt</span></div>`:'';
  $('sum').innerHTML=m+
    `<div class="sr"><span>点数</span><span>${CART.reduce((s,i)=>s+i.qty,0)} 点</span></div>
     <div class="sr big"><span>合計</span><b>${yen(t)}</b></div>
     <div class="pay">${['cash:現金','card:カード','qr:QR決済'].map(x=>{const[v,l]=x.split(':');
       return `<button data-p="${v}" class="${PAY===v?'on':''}">${l}</button>`}).join('')}</div>
     <button class="go" id="go" ${CART.length?'':'disabled'}>会計する</button>
     ${CART.length?`<button class="mini" id="clr">明細を消す</button>`:''}`;
  $('sum').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{PAY=b.dataset.p;render();});
  if($('go'))$('go').onclick=doCheckout;
  if($('clr'))$('clr').onclick=()=>{if(confirm('明細をすべて消しますか'))
    {CART=[];render();}};
}
async function doCheckout(){
  const t=cartTotal();
  if(!CART.length)return;
  if(!confirm(`${yen(t)} で会計します よろしいですか`))return;
  const btn=$('go'); btn.disabled=true; btn.textContent='送信中…';
  const id='co'+Math.random().toString(36).slice(2,8);
  try{
    await post('/checkouts',{id,date:new Date(Date.now()+9*3600e3).toISOString().slice(0,10),
      mode:'shop',customer:(MEMBER&&MEMBER.name)||'',phone:(MEMBER&&MEMBER.phone)||'',
      tech:0,retail:t,retailItems:CART.map(i=>({name:i.name,qty:i.qty,unit:i.unit,price:i.unit*i.qty,productId:i.productId})),
      discount:0,total:t,method:PAY,memberCode:(MEMBER&&MEMBER.code)||'',at:new Date().toISOString()});
    // 在庫を引く。1件ずつ（どれが失敗したか分かるように）
    for(const i of CART){ await post('/stock/adjust',{shopId:SHOP,productId:i.productId,delta:-i.qty,reason:'店販'}).catch(()=>{}); }
    // ポイントを付ける（会員のときだけ・商品は1円=1pt）
    if(MEMBER&&MEMBER.name){
      await post('/points',{id:'pt'+Math.random().toString(36).slice(2,8),name:MEMBER.name,phone:MEMBER.phone||'',
        delta:Math.floor(t*((MEMBER.rate!=null?MEMBER.rate:1)/100||0.01)),reason:'店販',ref:id,
        date:new Date(Date.now()+9*3600e3).toISOString().slice(0,10)}).catch(()=>{});
    }
    CART=[]; said('会計しました',yen(t)+'　'+({cash:'現金',card:'カード',qr:'QR決済'}[PAY]));
    toast('会計しました');
    if(MEMBER)await loadMember(MEMBER.salonId||MEMBER.code);   // ポイントを取り直す
    render();
  }catch(err){ toast(err.message||'会計に失敗しました',true); }
  finally{ if($('go')){$('go').disabled=false;$('go').textContent='会計する';} }
}

/* ══════════ 右側 ══════════ */
async function renderRight(){
  const b=$('rbody');
  if(TAB==='prod'){
    b.innerHTML=`<div class="srch"><input id="q" placeholder="商品名で探す" autocomplete="off"><button id="qb">探す</button></div><div class="plist" id="pl"></div>`;
    $('qb').onclick=doSearch; $('q').onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();doSearch();}};
    doSearch('');
  }else if(TAB==='stock'){
    b.innerHTML=STOCKVIEW||`<div class="empty">バーコードを読み取ると 各店の在庫が出ます</div>`;
    const a=b.querySelector('#adjP'),m=b.querySelector('#adjM');
    if(a)a.onclick=()=>adjust(+1); if(m)m.onclick=()=>adjust(-1);
  }else{
    b.innerHTML=MEMBER?memHtml():`<div class="empty">会員カードのQRを読み取ると お客様の情報が出ます</div>`;
  }
}
async function doSearch(v){
  const q=v!=null?v:($('q')?$('q').value.trim():'');
  const j=await get('/products'+(q?'?q='+encodeURIComponent(q):'?limit=60')).catch(()=>({products:[]}));
  const list=(j.products||[]).slice(0,60);
  $('pl').innerHTML=list.length?list.map(p=>`<button class="pc" data-p="${esc(p.id)}">
      <span class="pc-n">${esc(p.name)}</span>
      <span class="pc-f"><span class="pc-p">${yen(p.price)}</span><span class="pc-s">${esc(p.barcode||'')}</span></span>
    </button>`).join(''):'<div class="empty">見つかりませんでした</div>';
  $('pl').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const p=list.find(x=>x.id===b.dataset.p); if(!p)return;
    if(TAB==='stock'){showStock(p.id);return;}
    addToCart(p); said('選びました',esc(p.name)+'　'+yen(p.price));});
}
async function showStock(pid){
  const j=await get('/stock/product?productId='+encodeURIComponent(pid));
  const p=j.product||{};
  STOCKVIEW=`<div style="margin-bottom:16px"><div class="mem-h">${esc(p.name||'')}</div>
      <div class="pc-s" style="margin-top:6px">${esc(p.barcode||'')}　${yen(p.price)}</div></div>
    <div class="stk">${(j.stocks||[]).map(s=>`<div class="stk-r ${s.shop_id===SHOP?'here':''}">
      <span>${esc(s.shop_name)}${s.shop_id===SHOP?'（この店）':''}</span><b>${s.qty}</b></div>`).join('')}</div>
    <div class="stk-adj"><button id="adjM">この店を −1</button><button id="adjP">この店を ＋1</button></div>`;
  STOCK_PID=pid; TAB='stock'; syncTabs(); renderRight();
}
let STOCK_PID=null;
async function adjust(d){
  if(!STOCK_PID)return;
  try{ await post('/stock/adjust',{shopId:SHOP,productId:STOCK_PID,delta:d,reason:'手直し'});
    toast(d>0?'1つ足しました':'1つ引きました'); await showStock(STOCK_PID);
  }catch(err){ toast(err.message||'変えられませんでした',true); }
}
async function loadMember(code){
  const j=await get('/member/lookup?code='+encodeURIComponent(code));
  MEMBER={code:j.code,name:j.name||'',phone:j.phone||'',salonId:j.salonId||'',points:j.points||0,
    rank:j.rank||'',rate:j.rate,visits:j.visits||0,yVisits:j.yVisits||0,ySpend:j.ySpend||0,
    membership:j.membership||null,hasLine:!!j.hasLine};
  said('会員カード',esc(MEMBER.name||'（お名前未登録）')+'　'+MEMBER.points+' pt');
  TAB='mem'; syncTabs(); await loadHistory(); render();
}
let HIST=[];
async function loadHistory(){
  HIST=[];
  if(!MEMBER)return;
  const to=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  const from=new Date(Date.now()+9*3600e3-365*86400e3).toISOString().slice(0,10);
  const j=await get(`/checkouts?from=${from}&to=${to}`).catch(()=>({checkouts:[]}));
  const ph=(MEMBER.phone||'').replace(/\D/g,'');
  HIST=(j.checkouts||[]).filter(c=>{
    const cp=String(c.phone||'').replace(/\D/g,'');
    return (ph&&cp===ph)||(MEMBER.name&&c.customer===MEMBER.name);
  }).sort((a,b)=>a.date<b.date?1:-1).slice(0,12);
}
function memHtml(){
  const m=MEMBER;
  const items=c=>{try{const a=JSON.parse(c.retailItems||'[]');return a.length?a.map(i=>i.name).join('／'):(c.tech?'施術':'')}catch(e){return c.tech?'施術':''}};
  return `<div class="mem-h">${esc(m.name||'（お名前未登録）')} 様</div>
    ${m.rank?`<div class="mem-r">${esc(m.rank)}</div>`:''}
    ${m.membership?`<div class="mem-r" style="margin-left:6px">月額会員 残り${m.membership.remaining}回</div>`:''}
    <div class="mem-g">
      <div class="mg"><div class="mg-k">ポイント</div><div class="mg-v">${m.points}</div></div>
      <div class="mg"><div class="mg-k">来店</div><div class="mg-v">${m.visits}</div></div>
      <div class="mg"><div class="mg-k">今年の来店</div><div class="mg-v">${m.yVisits}</div></div>
      <div class="mg"><div class="mg-k">今年のお買い上げ</div><div class="mg-v" style="font-size:19px">${yen(m.ySpend)}</div></div>
    </div>
    <h2 style="margin-top:26px">これまでのご利用</h2>
    <div class="hist">${HIST.length?HIST.map(c=>`<div class="hr">
        <span class="hr-d">${esc(String(c.date).slice(5).replace('-','/'))}</span>
        <span class="hr-i">${esc(items(c))||'—'}</span>
        <span class="hr-p">${yen(c.total)}</span></div>`).join('')
      :'<div class="empty">まだ記録がありません</div>'}</div>
    <button class="mini" id="memoff" style="margin-top:18px">お客様を外す</button>`;
}
function syncTabs(){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB)); }
function render(){ renderCart(); renderSum(); renderRight();
  const mo=$('memoff'); if(mo)mo.onclick=()=>{MEMBER=null;HIST=[];render();}; }

/* ══════════ 起動 ══════════ */
async function boot(){
  try{
    const j=await get('/shops');
    SHOPS=j.shops||[];
    if(!SHOPS.some(s=>s.id===SHOP))SHOP=(SHOPS[0]||{}).id||'ginza';
    $('shopSel').innerHTML=SHOPS.map(s=>`<option value="${esc(s.id)}" ${s.id===SHOP?'selected':''}>${esc(s.name)}</option>`).join('');
    $('shopSel').onchange=e=>{SHOP=e.target.value;localStorage.setItem(SHOPK,SHOP);render();toast(($('shopSel').selectedOptions[0]||{}).text+' に切り替えました');};
  }catch(err){
    localStorage.removeItem(TOKK); TOK=''; showGate(); toast('合言葉が違うようです',true); return;
  }
  $('gate').style.display='none'; $('app').style.display='block';
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;syncTabs();renderRight();});
  render();
  // 画面のどこを触っても、読み取りが効くように隠し欄へ戻す
  const focusSink=()=>{const el=document.activeElement;
    if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA'&&el.tagName!=='SELECT'))$('sink').focus({preventScroll:true});};
  document.addEventListener('click',()=>setTimeout(focusSink,60));
  setInterval(focusSink,4000); focusSink();
}
function showGate(){ $('gate').style.display='block'; $('app').style.display='none'; }
$('gbtn').onclick=()=>{ const v=$('gtok').value.trim(); if(!v)return;
  TOK=v; localStorage.setItem(TOKK,v); boot(); };
$('gtok').onkeydown=e=>{ if(e.key==='Enter'){e.stopPropagation();$('gbtn').click();} };
if(TOK)boot(); else showGate();
</script>
