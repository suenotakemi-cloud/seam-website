<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ショップ｜SEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ SEAM ショップ（iPad用）══
   店頭のiPadで、会計と在庫確認を片手で回すための画面。
   Bluetoothのバーコードリーダーは「キーボードとして文字を打ち、最後にEnterを送る」機械なので、
   画面のどこにも触らずに読めるよう、キー入力を常に見張って組み立てる。
   読んだ文字列は長さで行き先が決まる（会員QR24桁 / 会員番号10桁 / 商品JAN13桁・8桁）。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16171B;--body:#3E3B36;--sub:#7C776E;--line:#E3DCD0;--cream:#FBF9F5;--sand:#F3EFE7;
  --gold:#B8945A;--clay:#A87456;--ok:#1F6B45;--ng:#B4442E;--bg:#F7F5F1;
}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--body);
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}   /* 16px未満だとiOSが勝手に拡大する */

/* ── 上の帯 ── */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;
  padding-top:calc(10px + env(safe-area-inset-top))}
.brand{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.18em;color:var(--ink)}
.top select{border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:#fff;color:var(--ink)}
/* 価格の出し方を切り替える。押した色でいまどれなのか一目で分かるようにする */
.modes{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.modes button{padding:10px 18px;border:0;background:#fff;font-size:13.5px;color:var(--sub);letter-spacing:.05em}
.modes button.on{background:var(--ink);color:#fff}
.modes button.on[data-pm="member"]{background:var(--ok)}
.modes button.on[data-pm="sale"]{background:var(--ng)}
.dispBtn{border:1px solid var(--line);background:#fff;border-radius:3px;padding:9px 14px;
  font-size:12.5px;color:var(--sub);letter-spacing:.04em}
.dlg{position:fixed;inset:0;background:rgba(22,23,27,.42);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.dlg-b{background:#fff;border-radius:3px;max-width:620px;width:100%;padding:30px 28px}
.dlg-b h3{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.14em;color:var(--ink);margin:0 0 6px;font-weight:600}
.dlg-b p{font-size:13px;color:var(--sub);line-height:2;margin:0 0 16px}
.dlg-u{border:1px solid var(--line);background:var(--cream);border-radius:3px;padding:14px;
  font-size:13px;word-break:break-all;line-height:1.8;color:var(--ink)}
.qrwrap{text-align:center;padding:6px 0 16px}
.qrwrap img{width:220px;height:220px;image-rendering:pixelated;border:1px solid var(--line);background:#fff;padding:10px}
.qrnote{font-size:12px;color:var(--sub);margin-top:10px;letter-spacing:.04em}
.qrload{font-size:12.5px;color:var(--sub);padding:40px 0}
/* ── レジ締め ── */
.clg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.clg2{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
.clg label,.clg2 label{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.clg input,.clg2 input{display:block;width:100%;font:inherit;font-size:15px;padding:10px;margin-top:4px;
  border:1px solid var(--line);border-radius:3px;min-height:44px;text-align:right;
  font-variant-numeric:tabular-nums}
.clg2 input{text-align:left}
.clnote{font-size:11.5px;color:var(--sub);line-height:1.7;margin:2px 0 10px}
.clmemo{width:100%;font:inherit;font-size:14px;padding:11px;border:1px solid var(--line);
  border-radius:3px;min-height:76px;resize:vertical;margin-bottom:4px}
.cllist{border:1px solid var(--line);border-radius:3px;max-height:200px;overflow:auto}
.cll-r{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.cll-r:last-child{border-bottom:none}
.cll-r span{color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.cll-r em{flex:1;min-width:0;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cll-r i{font-style:normal;font-size:11.5px;color:var(--sub);flex:none}
.cll-r b{font-variant-numeric:tabular-nums;flex:none}
@media(max-width:600px){.clg{grid-template-columns:1fr}}
/* ── 返品 ── */
.rfbox{max-width:640px;max-height:92vh;overflow:auto}
.rfr{align-items:center!important}
.rfr span i{display:block;font-size:11.5px;color:var(--sub);font-style:normal;margin-top:2px}
.rfq{display:flex;align-items:center;gap:8px;margin:0 12px}
/* ★指で押す場所は44px以上（お金が動くボタンで押し間違えない大きさ） */
.rfq button{font:inherit;width:44px;height:44px;border:1px solid var(--line);background:#fff;
  border-radius:3px;cursor:pointer;font-size:16px;line-height:1}
.rfq b{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.rfr em{font-style:normal;font-variant-numeric:tabular-nums;min-width:5em;text-align:right}
.rfall{display:flex;gap:8px;margin:8px 0 14px}
.rffull{margin:8px 0 14px;font-size:12.5px;color:#8c3a22;background:#fdf6f4;border:1px solid #e0b8ae;border-radius:3px;padding:10px 12px;line-height:1.7}
.rfall button{font:inherit;font-size:12.5px;padding:8px 14px;min-height:40px;
  border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer}
.rfsay{background:var(--ink);color:#fff;border-radius:3px;padding:12px 14px;margin:14px 0 0;font-size:13.5px;line-height:1.75}
.hmine{font-size:12px;color:var(--clay);padding:0 2px 10px;letter-spacing:.04em}
.rfnote{border:1px solid #e0b8ae;background:#fdf6f4;border-radius:3px;padding:14px 16px;margin:14px 0}
.rfnote-h{font-weight:600;color:#8c3a22;font-size:14px;margin-bottom:8px}
.rfnote ul{margin:0;padding-left:1.1em}
.rfnote li{font-size:12.8px;line-height:1.85;color:var(--ink);margin-bottom:4px}
.rfsend{border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:14px}
.rfsend-h{font-size:13px;margin-bottom:8px}
.rfsend-b{display:flex;gap:6px;flex-wrap:wrap}
.rfh{font:inherit;font-size:12.5px;padding:9px 16px;min-height:42px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer}
.rfh.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rfsend input{margin-top:10px;width:100%;font:inherit;font-size:14px;padding:11px 12px;
  border:1px solid var(--line);border-radius:3px;min-height:44px}
.rfn{margin-top:8px;font-size:12px;color:var(--sub);line-height:1.7}
.rfwarn{font-size:12px;color:#8c3a22;text-align:center;margin:10px 0 0!important}
/* ── 免税の申請シート ── */
.tfsheet{max-width:760px}
.ci-tfx{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:.06em;color:#a8624a;
  border:1px solid #e3cfc6;border-radius:999px;padding:1px 8px;vertical-align:middle}
.tflock{background:#fdf0ee;border:1px solid #e0b8ae;border-radius:3px;color:#a03a24;
  font-size:12.5px;line-height:1.7;padding:10px 12px;margin:8px 0}
.tfsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.tfsum>div{border:1px solid var(--line);border-radius:3px;padding:12px 14px;background:var(--cream)}
.tfsum span{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--sub)}
.tfsum b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:4px}
.tfsum i{font-size:12px;color:var(--sub);font-style:normal}
.tfsum .tot{background:var(--ink);color:#fff;border-color:var(--ink)}
.tfsum .tot span,.tfsum .tot i{color:rgba(255,255,255,.72)}
.tfrows{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:3px}
.tfr{display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;align-items:center;
  padding:11px 14px;border-bottom:1px solid var(--line)}
.tfr:last-child{border-bottom:none}
.tfr-n{font-size:13.5px;line-height:1.5}
.tfr-g{display:flex;gap:4px}
.tfk{font:inherit;font-size:12px;padding:6px 12px;min-height:44px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer;white-space:nowrap}
.tfk.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tfr-v{text-align:right;white-space:nowrap}
.tfr-v span{display:block;font-size:10.5px;letter-spacing:.06em;color:var(--sub)}
.tfr-v b{font-size:16px;font-variant-numeric:tabular-nums}
.tfr-v b.cp{cursor:pointer;border-bottom:1px dashed var(--line)}
.tfbag{margin-top:12px;font-size:12.5px;color:var(--sub);background:var(--cream);
  border-radius:3px;padding:10px 12px}
.tfwarn{font-size:12px;color:#a03a24;text-align:center;margin:10px 0 0!important}
@media(max-width:700px){.tfr{grid-template-columns:1fr;gap:6px}.tfr-v{text-align:left}
  .tfsum{grid-template-columns:1fr}}
.dlg-a{display:flex;gap:8px;margin-top:14px}
.dlg-a button{flex:1;padding:13px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:13.5px}
.dlg-a button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.ci-was{font-size:11px;color:#B9B2A6;text-decoration:line-through;margin-right:5px}
.srch button.on2{border-color:var(--ink);background:var(--ink);color:#fff}
.srch select{border:1px solid var(--line);border-radius:3px;padding:0 12px;background:#fff;color:var(--ink)}
.stk-r[data-h]:active{background:var(--cream)}
.sr.cut b{font-family:'Cormorant Garamond',serif;font-size:18px}
.spacer{flex:1}
/* 読み取り待機のランプ。緑＝いつでも読める */
.lamp{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);letter-spacing:.04em}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block;
  box-shadow:0 0 0 0 rgba(31,107,69,.5);animation:pulse 2.4s infinite}
.lamp.off i{background:#C4BEB4;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,107,69,.45)}70%{box-shadow:0 0 0 9px rgba(31,107,69,0)}100%{box-shadow:0 0 0 0 rgba(31,107,69,0)}}

/* ── 2枚並び。iPadを横にすると左が会計・右が商品 ── */
.wrap{display:grid;grid-template-columns:minmax(360px,38%) 1fr;gap:0;height:calc(100% - 58px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
.pane{overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 40px}
.pane.left{background:#fff;border-right:1px solid var(--line)}
@media(max-width:900px){.pane.left{border-right:0;border-bottom:1px solid var(--line)}}

h2{font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--clay);margin:0 0 14px;
  text-transform:uppercase;font-family:'Cormorant Garamond',serif;font-size:15px}

/* ── いま読んだもの ── */
.said{border:1px solid var(--line);background:var(--cream);border-radius:3px;padding:14px 16px;margin-bottom:16px}
.said.err{border-color:rgba(180,68,46,.4);background:#FCF6F4}
.said-k{font-size:11.5px;letter-spacing:.08em;color:var(--sub)}
.said-v{font-size:16px;color:var(--ink);margin-top:3px;line-height:1.5}

/* ── 会計の明細 ── */
.cart{border-top:1px solid var(--line)}
.ci{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:13px 2px}
.ci-n{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.6}
.ci-b{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:.04em}
.ci-q{display:flex;align-items:center;gap:2px;flex:none}
.ci-q button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-size:17px;color:var(--ink);line-height:1}
.ci-q span{min-width:34px;text-align:center;font-size:15px}
.ci-p{flex:none;min-width:86px;text-align:right;font-family:'Cormorant Garamond',serif;
  font-size:18px;color:var(--ink)}
.ci-x{flex:none;width:34px;height:34px;border:0;background:none;color:#B9B2A6;font-size:19px}
.empty{color:var(--sub);font-size:13px;padding:26px 0;text-align:center;letter-spacing:.04em}

/* ── 合計 ── */
.sum{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.sr{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.sr.big{font-size:16px;color:var(--ink);border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.sr.big b{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600}
.sr.cut{color:var(--clay)}
/* ── 通った決済が残っているときの帯。見落とすと二重請求になるので赤く出す ── */
.heldpay{border:1px solid var(--clay);border-radius:3px;padding:10px 12px;margin:12px 0 0;
  background:#fff;font-size:12px;line-height:1.8;color:var(--clay)}
.heldpay button{display:block;width:100%;margin-top:8px;font:inherit;font-size:12px;
  padding:9px;border:1px solid var(--line);background:#fff;border-radius:3px;
  color:var(--sub);cursor:pointer}
/* ── 現金のお預かりとおつり ──
   おつりは離れた場所に小さく出さない。数える人の目の高さに、いちばん大きく出す。 */
.cashbox{border:1px solid var(--line);border-radius:3px;padding:11px 12px;margin:10px 0 0;background:#fff}
.cashh{font-size:11.5px;color:var(--sub);letter-spacing:.08em;margin-bottom:8px}
.cashq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.cashq button{font:inherit;font-size:13px;padding:11px 4px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer;color:var(--ink)}
.cashq button:active{background:var(--ink);color:#fff}
#cashin{width:100%;font:inherit;font-size:17px;text-align:right;padding:11px 12px;
  border:1px solid var(--line);border-radius:3px;background:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:.04em}
.cashc{margin-top:9px;text-align:right;font-size:13px;color:var(--clay);min-height:1.6em}
.cashc.ok{color:var(--sub)}
.cashc b{font-size:26px;color:var(--ink);font-weight:600;margin-left:.4em;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cashd{margin-top:6px;text-align:right;font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.tfbox{border:1px solid rgba(0,0,0,.12);border-radius:11px;padding:11px 12px;margin:9px 0;background:#fff}
.tfh{font-size:12px;font-weight:800;color:#6a5a4a;margin-bottom:7px}
.tfbox input{width:100%;padding:10px 11px;border:1px solid rgba(0,0,0,.14);border-radius:8px;
  font:inherit;font-size:15px;margin-bottom:6px}
.tfrow{display:grid;grid-template-columns:1fr 116px;gap:6px}
.tfn{font-size:11px;color:#8a7d70;line-height:1.5}
/* 決済手段は6つ。横一列だと潰れるので3列×2段にする（指で押す幅を残す） */
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.pay button{padding:12px 6px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-size:13px;color:var(--body);letter-spacing:.04em}
.pay button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.go{width:100%;margin-top:14px;padding:17px;border:0;border-radius:3px;background:var(--ink);color:#fff;
  font-size:16px;letter-spacing:.08em}
.go[disabled]{background:#D6D0C6;color:#fff}
.mini{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-size:13px;color:var(--sub)}

/* ── 右側のタブ ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;padding:13px 8px;border:0;background:none;font-size:14px;color:var(--sub);
  border-bottom:2px solid transparent;letter-spacing:.06em}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.srch{display:flex;gap:8px;margin-bottom:14px}
.srch input{flex:1;border:1px solid var(--line);border-radius:3px;padding:13px 14px;background:#fff}
.srch button{padding:0 18px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:13px;color:var(--body)}

/* ── 商品の一覧（指で押しやすい大きさ）── */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pc{text-align:left;border:1px solid var(--line);background:#fff;border-radius:3px;padding:14px;min-height:96px;
  display:flex;flex-direction:column;justify-content:space-between}
/* 商品の写真。名前を読むより速く正しく選べる。無い商品は枠だけ出さない */
.pc-img{width:100%;height:104px;object-fit:contain;background:var(--cream);border-radius:2px;margin-bottom:10px}
.ci-img{width:44px;height:44px;object-fit:contain;background:var(--cream);border-radius:2px;flex:none}
.pc:active{background:var(--cream)}
.pc-n{font-size:13.5px;color:var(--ink);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-f{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
.pc-p{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--ink)}
.pc-s{font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.pc-s.zero{color:var(--ng)}

/* ── 在庫の内訳 ── */
.stk{border-top:1px solid var(--line)}
.stk-r{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 2px;font-size:14px}
.stk-r b{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ink);font-weight:600}
.stk-r.here{background:var(--cream)}
/* ── レジ締め：免税と金種 ── */
.cl-h{font-size:12px;letter-spacing:.16em;color:var(--sub);font-weight:600;
  margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.tfl{border-top:1px solid var(--line)}
.tfl-r{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;
  border-bottom:1px solid var(--line);padding:11px 2px;font-size:13px}
.tfl-r b{font-size:13px;font-weight:600;color:var(--body);white-space:nowrap}
.tfl-r em{font-style:normal;font-family:'Cormorant Garamond',serif;font-size:16px;
  color:var(--ink);white-space:nowrap;min-width:72px;text-align:right}
.dn{border-top:1px solid var(--line);margin-top:12px}
.dn-r{display:grid;grid-template-columns:64px 1fr 26px 88px;gap:9px;align-items:center;
  border-bottom:1px solid var(--line);padding:8px 2px}
.dn-d{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ink)}
.dn-i{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:3px;
  font-size:17px;text-align:right;background:#fff;-moz-appearance:textfield}
.dn-i::-webkit-outer-spin-button,.dn-i::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dn-u{font-size:12px;color:var(--sub)}
.dn-s{font-style:normal;font-size:13px;color:var(--sub);text-align:right}
.stk-adj{display:flex;gap:8px;margin-top:16px}
.stk-adj button{flex:1;padding:14px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:14px}

/* ── お客様 ── */
.mem-h{font-size:22px;color:var(--ink);letter-spacing:.04em}
.mem-r{display:inline-block;font-size:11.5px;letter-spacing:.1em;color:var(--clay);
  border:1px solid rgba(168,116,86,.35);border-radius:2px;padding:3px 10px;margin-top:8px}
.mem-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0 0}
.mg{border:1px solid var(--line);background:#fff;border-radius:3px;padding:14px}
.mg-k{font-size:11px;letter-spacing:.08em;color:var(--sub)}
.mg-v{font-family:'Cormorant Garamond',serif;font-size:25px;color:var(--ink);line-height:1.2;margin-top:4px}
.hist{margin-top:22px;border-top:1px solid var(--line)}
.hr{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 2px;font-size:13px}
.hr-d{color:var(--sub);font-size:12px;white-space:nowrap}
.hr-i{flex:1;min-width:0;color:var(--body);line-height:1.6}
.hr-p{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ink);white-space:nowrap}

/* ── 合言葉 ── */
.gate{max-width:400px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:3px;padding:32px 26px}
.gate h1{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.18em;color:var(--ink);margin:0 0 6px;font-weight:600}
.gate p{font-size:13px;color:var(--sub);margin:0 0 18px}
.gate input{width:100%;border:1px solid var(--line);border-radius:3px;padding:14px}
.gate button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:3px;background:var(--ink);color:#fff;font-size:15px;letter-spacing:.06em}

/* ── 知らせ ── */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:3px;font-size:14px;z-index:200;
  transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ng{background:var(--ng)}
.hidesink{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}

/* ★端末で「視差効果を減らす」を選んでいる方には、動きを出さない。
   目が回る・気分が悪くなる方がいらっしゃる。iPadの設定に従う。 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <h1>SEAM SHOP</h1>
  <p>店舗のiPadで使う画面です 合言葉を入れてください</p>
  <input id="gtok" type="password" placeholder="管理トークン" autocomplete="off">
  <button id="gbtn">開く</button>
</div>

<div id="app" style="display:none;height:100%">
  <div class="top">
    <span class="brand">SEAM SHOP</span>
    <select id="shopSel"></select>
    <button class="dispBtn" id="regBtn">レジ —</button>
    <button class="dispBtn" id="staffBtn">担当 —</button>
    <div class="modes" id="priceModes">
      <button data-pm="normal" class="on">通常</button>
      <button data-pm="member">メンバー</button>
      <button data-pm="sale">セール</button>
    </div>
    <span class="spacer"></span>
    <button class="dispBtn" id="dispBtn">お客様画面</button>
    <button class="dispBtn" id="kioskBtn">カウンセリング端末</button>
    <span class="lamp" id="lamp"><i></i><span id="lampT">読み取り待機中</span></span>
  </div>

  <div class="wrap">
    <div class="pane left">
      <h2>お会計</h2>
      <div id="said"></div>
      <div class="cart" id="cart"></div>
      <div class="sum" id="sum"></div>
    </div>

    <div class="pane right">
      <div class="tabs">
        <button data-t="prod" class="on">商品</button>
        <button data-t="stock">在庫</button>
        <button data-t="mem">お客様</button>
        <button data-t="hist">履歴</button>
        <button data-t="close">レジ締め</button>
      </div>
      <div id="rbody"></div>

  </div>
</div>

<input class="hidesink" id="sink" autocomplete="off" aria-hidden="true">
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
/* ══════════ 土台 ══════════ */
const API='https://seam-square-pay.suenotakemi.workers.dev';
/* 商品の写真はホームページと同じものを使う（images/catalog/<商品ID>.webp） */
const IMGBASE='https://seam.site/';
const TOKK='stb_admin_tok', SHOPK='stb_shop', REGK='stb_register';
let TOK=localStorage.getItem(TOKK)||'';
let SHOP=localStorage.getItem(SHOPK)||'ginza';
/* ★1つの店にレジが複数ある（銀座は3台）。この端末がどのレジかを覚えておく。
   お客様画面・履歴・レジ締めはこの番号で分かれ、データはすべて同じ場所に集まる。 */
let REG=localStorage.getItem(REGK)||'';
/* いまレジに立っている人。社員証のQRで入れ替える。
   誰が打ったか分からない会計を作らないため、会計の前に必ず要る。 */
/* 担当者を必ず選ばせるか。設定 require_staff が '1' のときだけ会計を止める。
   本番前のテスト中は止めない（既定）。設定は接続テスト画面から切り替える。 */
let REQUIRE_STAFF=false;
let STAFF=null;
try{ STAFF=JSON.parse(localStorage.getItem('stb_staff')||'null'); }catch(e){}
let SHOPS=[], TAB='prod', CART=[], MEMBER=null, PAY='cash', STOCKVIEW=null;

/* ══════════ 決済手段 ══════════
   Squareターミナルが持っている区分をそのまま並べる。
   ★Apple Pay は独立した区分ではない。お客様がiPhoneをかざすと
     カードのタッチ決済・iD・QUICPay・交通系 のどれかとして通る。
     だから「Apple Pay」ボタンは作らず、どのボタンでも通ることを添え書きで伝える。
   ★交通系だけ返金の扱いが違う（Squareでは返金できず現金でお返しする）。
     まとめて「電子マネー」にすると、返品のときに見分けられない。 */
const PAYS=[['cash','現金'],['card','カード'],['transit','交通系'],
            ['id','iD'],['quickpay','QUICPay'],['qr','QR決済']];
const PAY_HINT={
  card:'端末にかざす／差し込む　Apple Pay・Google Pay のカードもここ',
  transit:'⚠ 交通系ICは返品・返金ができません　お客様に必ずお伝えしてください',
  id:'Apple Pay の iD もここ',
  quickpay:'Apple Pay の QUICPay もここ',
  qr:'端末にQRが出ます　PayPay・d払いなど'};
/* お客様画面に出す説明（英語つき）。押す前にお読みいただく。 */
const PAY_EN={cash:'Cash',card:'Credit / Debit card',transit:'Suica, PASMO, ICOCA',
  id:'iD',quickpay:'QUICPay',qr:'PayPay, d払い, etc.'};
const PAY_NOTE={card:'Apple Pay・Google Pay のカードもこちら',
  transit:'⚠ 返品・返金をお受けできません',
  id:'Apple Pay の iD もこちら',quickpay:'Apple Pay の QUICPay もこちら'};
/* ★交通系ICだけは、お選びになる前にお伝えする。
     Squareの仕組み上、交通系ICへは返金ができない＝返品をお受けできない。
     あとからお断りするのがいちばん良くないので、選ぶ前の一枚にする。
     出典 https://squareup.com/help/jp/ja/article/5060-refunds-faq */
const TRANSIT_WARN={
  title:'交通系ICでお支払いの場合　Paying with a transit IC card',
  /* ★短く。読み切れない量を出すと、読まずに押されてしまう。
       「他の方法も選べます」はボタンが語るので、文では言わない。 */
  lines:['交通系IC（Suica・PASMO など）でお支払いの場合、ご返品・ご返金をお受けできません',
         'Purchases paid with a transit IC card cannot be returned or refunded.',
         'カードへお戻しする仕組みがないためです　不良品の場合は、この限りではありません',
         'This is because the card cannot be credited back. Defective items are an exception.'],
  ok:'了解しました　Understood', back:'別の方法にする　Choose another'};
/* 集計はこれまでどおり4つに寄せる（レジ締めや売上の合計を変えないため）。
   実際に何で払われたかは cardBrand に残る（交通系IC / iD / QUICPay / VISA …）。 */
const payBucket=k=>({transit:'emoney',id:'emoney',quickpay:'emoney'}[k]||k);

/* ══════════ このお会計1回ぶんの合図（flow） ══════════
   ★お客様に押していただく画面が2種類ある。
       ・お支払い方法をお選びいただく
       ・返品交換をお受けしないことへのご同意
     同じ置き場所を使っていたので、支払い方法を押していただいただけで
     「返品交換不可に同意していただいた」ことにできてしまった。
   ★flow と kind の両方が合ったときだけ、押していただいたものとして扱う。
   ★カートが変わったら flow を作り直す。
     前の金額を見て押していただいた同意を、変わったあとの金額に使わない。 */
let FLOW=newFlow();
function newFlow(){ return 'f'+Math.random().toString(36).slice(2,10); }
function resetFlow(){
  FLOW=newFlow(); CONSENT=null; PICKCONSENT=null; GOT=0;
  /* 待っている最中なら、その待ちも捨てる（古い画面のまま押されないように） */
  if(ASKWAIT)ASKWAIT=null;
  if(PICKWAIT)PICKWAIT=null;
}
/* お客様に押していただいている間は、カートを触らせない */
const asking=()=>!!(ASKWAIT||PICKWAIT);
function lockedByAsk(){
  if(!asking())return false;
  toast('お客様が画面をご覧になっています　終わるまでお待ちください',true);
  return true;
}

/* ══════════ 通ってしまった決済を落とさない ══════════
   ★Squareの端末で決済が通ったあと、会計をD1に保存する。
     その保存が失敗しても、お客様のお金はもう動いている。
     控えておかないと「押し直す＝もう一度いただく」になる。
   ★localStorage に置くのは、画面を閉じても・iPadが落ちても残すため。
     レジごとに分ける（1番レジの決済を2番レジが拾わないように）。
   ★30分より古いものは使わない（別のお客様のものを拾わないように）。 */
const paidKey=()=>'stb_held_pay:'+(REG||'');
function paidHold(o){ try{ localStorage.setItem(paidKey(),JSON.stringify({...o,at:Date.now()})); }catch(e){} }
function paidClear(){ try{ localStorage.removeItem(paidKey()); }catch(e){} }
function paidHeld(){
  try{
    const j=JSON.parse(localStorage.getItem(paidKey())||'null');
    if(!j||!j.payId)return null;
    if(Date.now()-(j.at||0)>30*60*1000){ paidClear(); return null; }
    return j;
  }catch(e){ return null; }
}

/* ══════════ 現金のお預かりとおつり ══════════
   ★レジでいちばん手が止まるのが、おつりの暗算と札の数え方。
     押すだけで済むように、その金額でありそうな出し方だけを並べる。
   ★ちょうど・千円単位の切り上げ・よく出る札。並びは小さい順。 */
let GOT=0;                                       // お預かり金額
function cashQuick(total){
  if(total<=0)return [];
  const v=new Set([total]);                      // ちょうど
  const up=n=>Math.ceil(total/n)*n;
  v.add(up(1000)); v.add(up(5000)); v.add(up(10000));   // 切り上げ
  /* 「1万円札1枚＋小銭」のような、実際によくある出し方 */
  [1000,5000,10000].forEach(n=>{ if(n>total)v.add(n); });
  v.add(up(1000)+1000);                          // 千円多めに出されたとき
  return [...v].filter(x=>x>=total).sort((a,b)=>a-b).slice(0,6);
}
/* おつりの内訳。数え間違いと、金庫に無い札を出す事故を防ぐ */
const DENOM=[10000,5000,1000,500,100,50,10,5,1];
function changeBreak(n){
  const out=[];
  for(const d of DENOM){ const c=Math.floor(n/d); if(c){ out.push(`${yen(d)}×${c}`); n-=d*c; } }
  return out.join('　')||'—';
}
/* 管理画面の「つかう機能をえらぶ」で消したものは、レジでも出さない。
   何も決めていなければ、ぜんぶ出す。 */
let USEFEAT={};
const useFeat=(v)=>USEFEAT[v]!==false;
/* 価格の出し方。normal=定価 / member=メンバー価格 / sale=セール価格。
   割引の率は「価格設定」の画面(prices.html)で決めたものを settings から読む。 */
let PMODE='normal', RULES={member:{},sale:{}};
/* 免税は「値引きだけ」こちらで行い、申請書類は別のしくみを使う（オーナー方針）。
   税率10%ぶんを引く＝税抜相当。免税の可否判定はここではしない。 */
let TAXFREE=false;
const TAXFREE_RATE=10;
let HISTORY=[], HDETAIL=null, TERM={deviceId:localStorage.getItem('stb_term_dev:'+(localStorage.getItem('stb_register')||''))||'',checkoutId:'',timer:null};
const SIZE_RE=/(\d+(?:\.\d+)?)\s*(mL|ml|ML|Ml|g|G|kg|KG|L)\b/;
function sizeOf(name){const m=SIZE_RE.exec(String(name||''));if(!m)return '';
  const u=m[2].toLowerCase()==='ml'?'ml':(m[2].toLowerCase()==='kg'?'kg':m[2].toLowerCase());return m[1]+u;}
const brandOf=p=>String(p.brand||'').trim()||'（ブランド未設定）';
/* 細かいほうが勝つ: 商品ごと → ブランド＋サイズ → ブランド → 既定 */
function pctFor(p){
  if(PMODE==='normal')return 0;
  const r=RULES[PMODE]||{}, b=brandOf(p), sz=sizeOf(p.name||p.nm);
  if(r.product&&r.product[p.productId||p.id]!=null)return +r.product[p.productId||p.id];
  if(sz&&r.size&&r.size[b+'|'+sz]!=null)return +r.size[b+'|'+sz];
  /* ★並び順のある規則。上から順に見て、最初に当たったものを使う。
     細かい指定（エルジューダ20%）を、大きい指定（ミルボン製品10%）より上に置くこと。
     照合はブランド・商品名・メーカー・種類をつないだ文字列に対して行う。 */
  if(Array.isArray(r.rules)){
    const hay=[b,p.name||p.nm||'',p.maker||'',p.category||''].join(' / ');
    for(const x of r.rules){ try{ if(new RegExp(x.re,'i').test(hay))return +x.pct; }catch(e){} }
  }
  if(r.brand&&r.brand[b]!=null)return +r.brand[b];
  return +(r.default||0);
}
const lineNow=i=>Math.round(i.unit*(1-pctFor(i)/100));   // 1点あたりの今の値段
/* お客様側のタブレットへ、いまの明細を置く。
   置くのは見せてよいものだけ（在庫も原価も他のお客様も送らない）。 */
let pushT=null;
function pushDisplay(done){
  clearTimeout(pushT);
  pushT=setTimeout(()=>{
    const t=cartTotal();
    const earn=(useFeat('member')&&MEMBER&&MEMBER.name)?Math.floor(t*((MEMBER.rate!=null?MEMBER.rate:1)/100||0.01)):0;
    post('/display/push',{shopId:SHOP,register:REG,mode:PMODE,done:!!done,
      /* fresh=たったいま読み取った行。お客様画面はここだけ大きいまま残す。
         同じ商品を続けて読むと個数が増えるだけで行は増えないので、
         「最後の行」ではなく「最後に触った行」を伝えないと合わない。 */
      items:CART.map(i=>({name:i.name,qty:i.qty,was:i.unit,now:lineNow(i),image:i.image||'',
        ...(i.productId&&i.productId===LASTHIT?{fresh:1}:{})})),
      list:cartList(),cut:cartCut(),total:t,
      member:MEMBER?{name:MEMBER.name,rank:MEMBER.rank,points:MEMBER.points,earn,
        expiring:MEMBER.expiring,expireOn:MEMBER.expireOn,
        visits:MEMBER.visits||0,greet:(MEMBER.visits||0)>=1?'again':'first'}:null}).catch(()=>{});
  },250);
}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+(+n||0).toLocaleString();
const H=(...a)=>({'Authorization':'Bearer '+TOK,...Object.assign({},...a)});
async function get(p){const r=await fetch(API+p,{headers:H()});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json();}
async function post(p,b){const r=await fetch(API+p,{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify(b)});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json();}
let tt;
function toast(m,ng){const t=$('toast');t.textContent=m;t.className='on'+(ng?' ng':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',ng?3200:1900);}

/* ══════════ 読み取り ══════════
   Bluetoothのリーダーはキーボードとして振る舞う。
   人の入力と混ざらないよう「文字が続けて速く来て 最後にEnter」を機械とみなす。 */
/* ★一部のバーコードリーダーは「ALTキーを押しながら数字」で文字を送る設定になっている
   （Windows向けの方式）。iPadはこれを解釈しないので、数字がそのまま流れてくる。
   例: 4595315570400 → 052053057053051049053053055048052048048（1文字が3桁）
   端末の設定を直すのが本筋だが、直っていなくても読めるようにここで元へ戻す。
   3桁ずつが文字として成り立ち、かつ本来ありえない長さのときだけ変換する。 */
function fromAltCodes(s){
  if(!/^\d+$/.test(s)||s.length<18||s.length%3)return '';
  let out='';
  for(let i=0;i<s.length;i+=3){
    const n=+s.slice(i,i+3);
    if(n<32||n>126)return '';       // 文字にならない＝ふつうのバーコード
    out+=String.fromCharCode(n);
  }
  return out;
}
const STAFF_QR=/^SEAMSTAFF:[A-Za-z0-9_-]{1,24}:\d{6}$/;   // 担当者の社員証
const SALON_QR=/^\d{17}[0-9A-Za-z]{7}$/;   // 会員カードのQR（24桁）
const MEMNO=/^\d{10}$/;                     // うちの会員番号（10桁）
const JAN=/^\d{8}$|^\d{12,14}$/;            // 商品のバーコード
let buf='', last=0;
document.addEventListener('keydown',e=>{
  const el=document.activeElement;
  // 人が打っている欄では邪魔をしない（検索欄・合言葉など）。読み取り用の隠し欄は例外
  const typing=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&el.id!=='sink';
  const now=Date.now();
  if(now-last>120)buf='';               // 間があいたら前の読みは捨てる
  last=now;
  if(e.key==='Enter'){
    const code=buf.trim();buf='';
    if(code.length>=6&&!typing){e.preventDefault();onScan(code);}
    return;
  }
  if(e.key.length===1)buf+=e.key;
});
/* 読んだ文字列の行き先を長さで決める */
async function onScan(code){
  {const d=fromAltCodes(code); if(d)code=d;}     // ALTモードのリーダーを元へ戻す
  try{
    if(STAFF_QR.test(code)){ await loadStaff(code); return; }
    if(SALON_QR.test(code)||MEMNO.test(code)){ await loadMember(code); return; }
    if(JAN.test(code)){ await onProductCode(code); return; }
    // 形が分からないときも、いちおう商品として引いてみる（社内コード等）
    await onProductCode(code);
  }catch(err){ said('読み取り',esc(err.message||String(err)),true); toast(err.message||'読み取れませんでした',true); }
}
function said(k,v,ng){ $('said').innerHTML=`<div class="said${ng?' err':''}"><div class="said-k">${esc(k)}</div><div class="said-v">${v}</div></div>`; }

async function onProductCode(code){
  const j=await get('/products?barcode='+encodeURIComponent(code));
  const p=(j.products||[])[0];
  if(!p){ said('バーコード',esc(code)+' — 登録がありません',true); toast('この商品は登録されていません',true); return; }
  if(TAB==='stock'){ await showStock(p.id); said('在庫を確認',esc(p.name)); return; }
  addToCart(p); said('読み取りました',esc(p.name)+'　'+yen(p.price));
}

/* ══════════ 会計 ══════════ */
let LASTHIT='';                 // たったいま読み取った商品。お客様画面で大きく残す1行
function addToCart(p){
  if(lockedByAsk())return;          // お客様が画面を見ている間は触らせない
  resetFlow();                      // 金額が変わる＝前の同意は使えない
  const f=CART.find(x=>x.productId===p.id);
  if(f)f.qty++; else CART.push({productId:p.id,name:p.name,brand:p.brand||'',maker:p.maker||'',
    category:p.category||'',image:p.image||'',unit:+p.price||0,qty:1});
  LASTHIT=p.id;
  render();
}

/* ── 免税の袋 ────────────────────────────────────────────
   免税にした会計では、袋を必ずカートに入れる。ただし免税にはしない。
   どの商品を袋として使うかは店で決められる（一度選べば覚える）。 */
const TFBAG_NAME='免税袋';                        // これを商品マスタに1つ置いておけば、どのレジでも自動で入る
async function addBag(){
  if(CART.some(isBag))return;
  let b=tfBag();
  if(!b){
    /* 商品マスタから「免税袋」を探す。あればそれを使う（端末ごとの設定は要らない） */
    const j=await get('/products?q='+encodeURIComponent(TFBAG_NAME)+'&limit=5').catch(()=>({products:[]}));
    const hit=(j.products||[]).find(p=>String(p.name||'').trim()===TFBAG_NAME);
    if(hit){ b={productId:hit.id,name:hit.name,price:+hit.price||0};
      localStorage.setItem(TFBAG_K,JSON.stringify(b)); }
  }
  if(!b){ pickBag(); return; }
  if(CART.some(isBag))return;
  CART.push({productId:b.productId||'',name:b.name,unit:+b.price||0,qty:1,tfx:true,image:b.image||''});
  render();
}
function dropBag(){ CART=CART.filter(i=>!isBag(i)); }
/* 袋にする商品を選ぶ。名前に「袋」「ショッパー」を含むものを候補に出す */
async function pickBag(){
  const d=document.createElement('div'); d.className='dlg';
  d.innerHTML=`<div class="dlg-b"><h3>免税の袋を選んでください</h3>
    <p>一度選べば、次から自動で入ります　免税の対象にはしません</p>
    <div class="stk" id="bagl"><div class="empty">探しています…</div></div>
    <div class="dlg-a"><button id="bagX">やめる</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#bagX').onclick=()=>{d.remove();TAXFREE=false;dropBag();render();};
  let cand=[];
  for(const q of ['袋','ショッパー']){
    const j=await get('/products?q='+encodeURIComponent(q)+'&limit=40').catch(()=>({products:[]}));
    for(const p of (j.products||[])) if(!cand.some(x=>x.id===p.id)) cand.push(p);
  }
  const box=d.querySelector('#bagl');
  if(!box)return;
  box.innerHTML=cand.length?cand.slice(0,24).map(p=>`<div class="stk-r bagpick" role="button" tabindex="0"
      data-i="${esc(p.id)}" data-n="${esc(p.name)}" data-p="${+p.price||0}"
      style="cursor:pointer"><span>${esc(p.name)}</span><b>${yen(+p.price||0)}</b></div>`).join('')
    :'<div class="empty">候補が見つかりません　商品名に「袋」か「ショッパー」が入るものを登録してください</div>';
  box.querySelectorAll('.bagpick').forEach(b=>b.onclick=()=>{
    const v={productId:b.dataset.i,name:b.dataset.n,price:+b.dataset.p||0};
    localStorage.setItem(TFBAG_K,JSON.stringify(v));
    d.remove(); addBag(); render(); toast('免税の袋を「'+v.name+'」にしました');});
}
function cartList(){ return CART.reduce((s,i)=>s+i.unit*i.qty,0); }            // 定価の合計
function cartBefore(){ return CART.reduce((s,i)=>s+lineNow(i)*i.qty,0); }       // 免税を引く前
/* ★2026年11月1日から、免税は「値引き」ではなく「いったん税込でいただき、
   出国の確認がとれてからお返しする」に変わる（リファンド方式）。
   その日を境に、レジの動きが変わる。日付で自動的に切り替える。 */
const TF_REFUND_FROM='2026-11-01';
let TFINFO={name:'',country:'',last4:''};
const tfRefundMode=()=>jstDay(0)>=TF_REFUND_FROM;
/* ★免税の袋は免税にならない（お客様が持ち帰る商品ではなく、包装のため）。
   免税にした会計では必ずカートに入れるが、免税の計算からは外す。
   カートの行に tfx:true が付いているものが「免税にしない行」。 */
const TFBAG_K='stb_tfbag';                     // {productId,name,price} を覚えておく
const tfBag=()=>{try{return JSON.parse(localStorage.getItem(TFBAG_K)||'null')}catch(e){return null}};
const isBag=i=>!!i.tfx;
/* 免税の対象になる金額（袋を除いた分） */
function cartTaxable(){ return CART.filter(i=>!isBag(i)).reduce((s,i)=>s+lineNow(i)*i.qty,0); }
/* 消費税ぶん。旧方式は「その場で引く額」、新方式は「あとでお返しする額」 */
function taxAmt(){ return (useFeat('taxfree')&&TAXFREE)?Math.round(cartTaxable()*TAXFREE_RATE/(100+TAXFREE_RATE)):0; }
function taxCut(){ return tfRefundMode()?0:taxAmt(); }                          // その場で引く額
function cartTotal(){ return Math.max(0,cartBefore()-taxCut()); }               // 実際にいただく額
function cartCut(){ return cartList()-cartTotal(); }                            // 引いた額（合計）
function renderCart(){
  if(!CART.length){ $('cart').innerHTML='<div class="empty">バーコードを読み取ると ここに並びます</div>'; return; }
  $('cart').innerHTML=CART.map((i,ix)=>{const now=lineNow(i),cut=i.unit!==now;return `<div class="ci">
    ${i.image?`<img class="ci-img" src="${IMGBASE+i.image}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}
    <div class="ci-n">${esc(i.name)}${isBag(i)?'<span class="ci-tfx">免税にしません</span>':''}<div class="ci-b">${cut?`<span class="ci-was">${yen(i.unit)}</span>${yen(now)}　−${pctFor(i)}％`:yen(i.unit)}</div></div>
    <div class="ci-q"><button data-q="-" data-i="${ix}">−</button><span>${i.qty}</span><button data-q="+" data-i="${ix}">＋</button></div>
    <div class="ci-p">${yen(now*i.qty)}</div>
    <button class="ci-x" data-x="${ix}">×</button></div>`;}).join('');
  $('cart').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    if(lockedByAsk())return; resetFlow();
    const i=CART[+b.dataset.i]; if(b.dataset.q==='+')i.qty++; else if(--i.qty<=0)CART.splice(+b.dataset.i,1); render();});
  $('cart').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
    if(lockedByAsk())return; resetFlow(); CART.splice(+b.dataset.x,1);render();});
}

     <div class="pay">${PAYS.map(([v,l])=>

     ${PAY!=='cash'?`<div class="sr" style="color:${PAY==='transit'?'var(--clay)':'var(--sub)'};font-size:12px;padding:6px 2px 0">

     ${PAY==='cash'&&CART.length?`<div class="cashbox">
       <div class="cashh">お預かり</div>
       <div class="cashq">${cashQuick(t).map(v=>`<button data-cq="${v}">${v===t?'ちょうど':yen(v)}</button>`).join('')}</div>
       <input id="cashin" inputmode="numeric" placeholder="お預かり金額" value="${GOT||''}">
       <div class="cashc ${GOT&&GOT>=t?'ok':''}">${!GOT?'　'
         :GOT<t?`あと ${yen(t-GOT)} 足りません`
         :`おつり　<b>${yen(GOT-t)}</b>`}</div>
       ${GOT&&GOT>t?`<div class="cashd">${changeBreak(GOT-t)}</div>`:''}
     </div>`:''}
     ${(useFeat('taxfree')&&TAXFREE&&tfRefundMode())?`<div class="tfbox">
       <div class="tfh">お返しするために、3つだけ</div>
       <input id="tf-nm" value="${esc(TFINFO.name)}" placeholder="お名前（パスポートのとおり）">
       <div class="tfrow">
         <input id="tf-co" value="${esc(TFINFO.country)}" placeholder="国・地域">
         <input id="tf-p4" value="${esc(TFINFO.last4)}" maxlength="4" placeholder="旅券の下4桁">
       </div>
       <div class="tfn">旅券の番号は控えません　お返しのときは下4桁で確かめます</div>
     </div>`:''}
     ${(useFeat('taxfree')&&CART.length)?`<button class="mini" id="taxfree">${TAXFREE
       ?(tfRefundMode()?'免税をやめる':'免税の値引きを外す')
       :(tfRefundMode()?'免税にする（税込でいただき、あとで返金）':'免税ぶんを値引く（申請は別）')}</button>`:''}
     ${TF_LOCK?`<div class="tflock">免税の申請が終わっていません　シートの「入れ終わりました」を押してください</div>`:''}
     <button class="go" id="go" ${(CART.length&&!TF_LOCK)?'':'disabled'}>会計する</button>
     ${CART.length?`<button class="mini" id="clr">明細を消す</button>`:''}`;
  $('sum').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{PAY=b.dataset.p;GOT=0;render();});
  {const b=$('askpay'); if(b)b.onclick=askPayMethod;}

    paidClear(); toast('切り離しました　Squareの履歴を確かめてください',true); render();};}
  /* 現金：押すだけでお預かりが入る。手入力もできる。 */
  $('sum').querySelectorAll('[data-cq]').forEach(b=>b.onclick=()=>{GOT=+b.dataset.cq;render();});
  {const ci=$('cashin');
   if(ci)ci.oninput=()=>{ GOT=Math.max(0,parseInt(String(ci.value).replace(/[^0-9]/g,''),10)||0);
     /* 打ちながらおつりが出るように、入力欄だけ残して周りを描き直す */
     const p=ci.selectionStart; render(); const n=$('cashin');
     if(n){n.focus(); try{n.setSelectionRange(p,p);}catch(e){}} };}
  if($('go'))$('go').onclick=doCheckout;
  if($('clr'))$('clr').onclick=()=>{if(confirm('明細をすべて消しますか'))
    {CART=[];TAXFREE=false;render();}};
  {const a=$('tf-nm'),b=$('tf-co'),c=$('tf-p4');
   if(a)a.oninput=()=>TFINFO.name=a.value;

}
async function doCheckout(){
  const t=cartTotal();
  if(!CART.length)return;
  /* 本番モードのときだけ、レジ番号と担当をそろえてから会計させる。
     テスト中は何も聞かない（毎回 出勤→担当 を通すのは検証の邪魔になる）。 */
  if(REQUIRE_STAFF){
    if(!REG){ toast('先に「レジ ◯番」を決めてください',true); showRegisterPick(); return; }
    if(!STAFF){ toast('先に担当を選んでください',true); showStaffPick(); return; }
  }
  if(TAXFREE&&tfRefundMode()&&(!TFINFO.name.trim()||TFINFO.last4.length<4)){
    toast('お名前と旅券の下4桁を入れてください　これが無いと、あとでお返しできません',true);return;}
  /* お預かりを入れたのに足りていないときは止める。
     入れていないとき（0）は素通しする ― 使わない人の邪魔をしない。 */
  if(PAY==='cash'&&GOT>0&&GOT<t){ toast('お預かりが '+yen(t-GOT)+' 足りません',true); return; }
  if(!confirm(`${yen(t)} で会計します${STAFF?'　担当 '+STAFF.name:''}${
    PAY==='cash'&&GOT>t?'　おつり '+yen(GOT-t):''}　よろしいですか`))return;
  const btn=$('go'); btn.disabled=true; btn.textContent='送信中…';
  /* ★値引きしてお売りするときは、先にお客様画面で押していただく。
       押していただけなければ会計しない。 */
  CONSENT=null;
  if(needAsk()){
    btn.textContent='お客様画面をご確認ください…';
    const ok=await needConsent();
    if(!ok){ btn.disabled=false; btn.textContent='会計する'; render(); return; }
    btn.textContent='送信中…';
  }
  const id='co'+Math.random().toString(36).slice(2,8);
  /* 付けるポイント。会員のときだけ・商品は1円=1pt（お店の設定による） */
  const ptDelta=(useFeat('member')&&MEMBER&&MEMBER.name)
    ? Math.floor(t*((MEMBER.rate!=null?MEMBER.rate:1)/100||0.01)) : 0;
  let payId='', BRAND='', FEE=0;
  try{
    if(PAY!=='cash'){                       // 現金以外はSquareの端末で通す
      /* ★端末で決済が通ったあと、会計の保存が失敗することがある（回線が切れた等）。
           そのまま「会計する」を押し直すと、端末にもう一度お金が流れて
           お客様から二重にいただいてしまう。
           通った決済は必ず控えておき、同じ金額なら端末を呼ばない。 */
      const held=paidHeld();
      if(held && held.total===t){
        payId=held.payId; BRAND=held.brand||''; FEE=+held.fee||0; PAY=held.pay||PAY;
        toast('先ほど通った決済が残っていました　二重にいただかず、この決済で会計します');
      }else{
        if(held && !confirm(
          `先に ${yen(held.total)} の決済が通っています。\n`
          +`いまのお会計は ${yen(t)} です。\n\n`
          +`OK　　＝ その決済は使わず、あらためて ${yen(t)} を決済します\n`
          +`　　　　（${yen(held.total)} はお客様へ返金が必要です）\n`
          +`キャンセル ＝ いったん止めて、履歴で確かめます`)){
          btn.disabled=false; btn.textContent='会計する'; return; }
        if(held)paidClear();
        btn.textContent='端末をご案内中…';
        const r=await payByTerminal(t,PAY);
        if(r===null||r===undefined){ btn.disabled=false;btn.textContent='会計する'; return; }
        payId=r.paymentId||'';
        /* 端末で実際に選ばれた方法を優先する（お客様が別のものを出されることがある）。
           ただし大きな区分が同じなら、こちらの細かい指定（交通系/iD/QUICPay）を残す。 */
        if(r.paidBy && r.paidBy!==payBucket(PAY)) PAY=r.paidBy;
        BRAND=r.cardBrand||''; FEE=+r.fee||0;            // ブランド別の手数料を出すため
        paidHold({payId,brand:BRAND,fee:FEE,pay:PAY,total:t});
      }
    }
    /* ★お会計・免税の預り・在庫・ポイントを、サーバーで一度に確定する。
         以前はここから4本を別々に投げていて、途中で通信が切れると
         「会計だけ入って在庫が減っていない」「ポイントだけ付いた」が起きた。
         しかも失敗は全部握りつぶしていたので、誰も気づけなかった。
       ★同じidで2回来ても2回目は何もしないので、押し直しでも増えない。 */
    await post('/checkout/commit',{id,date:new Date(Date.now()+9*3600e3).toISOString().slice(0,10),
      mode:'shop',register:REG,shopId:SHOP,staffId:(STAFF&&STAFF.id)||'',staffName:(STAFF&&STAFF.name)||'',customer:(MEMBER&&MEMBER.name)||'',phone:(MEMBER&&MEMBER.phone)||'',
      tech:0,retail:cartList(),
      retailItems:CART.map(i=>({name:i.name,qty:i.qty,unit:i.unit,price:i.unit*i.qty,productId:i.productId,
        ...(i.tfx?{tfx:1}:{})})),   // tfx=免税にしない行（袋）
      discount:cartCut(),
      discountLabel:[PMODE==='member'?'メンバー価格':(PMODE==='sale'?'セール価格':''),TAXFREE?'免税':''].filter(Boolean).join('＋'),
      /* 返品交換をお受けしないことに、お客様が同意された記録 */
      /* お客様がご自身で押された記録。お支払い方法をお選びいただいた分も一緒に残す
         （交通系は「返品・返金をお受けできません」をご覧いただいてから確定している）。 */
      consent:(CONSENT||PICKCONSENT)?1:0,
      consentAt:CONSENT?new Date(CONSENT.at).toISOString()
                :(PICKCONSENT?new Date(PICKCONSENT.at).toISOString():''),
      consentText:[PICKCONSENT&&PICKCONSENT.text,CONSENT&&CONSENT.text].filter(Boolean).join('\n───\n'),
      taxfree:TAXFREE?1:0, taxfreeCut:taxCut(),   // 免税は記録として持つ（申請のときに集計する）
      taxfreeMode:TAXFREE?(tfRefundMode()?'refund':'cut'):'', taxfreeTax:TAXFREE?taxAmt():0,
      total:t,method:payBucket(PAY),squarePaymentId:payId||'',cardBrand:BRAND,fee:FEE,
      memberCode:(MEMBER&&MEMBER.code)||'',at:new Date().toISOString(),
      /* ポイント・免税の預り・在庫は、この1回で一緒に確定される */
      pointDelta:ptDelta, pointReason:'店販', salonId:(MEMBER&&MEMBER.salonId)||'',
      tfName:TFINFO.name, tfCountry:TFINFO.country, tfLast4:TFINFO.last4});
    /* ★salon.town へのポイントだけは外なので、確定のあとに追いかける。
         ここが失敗しても、こちらの台帳のポイントはもう入っている。
         同じ会計IDでは二度打たれない（サーバーが弾く）。 */
    if(ptDelta&&MEMBER&&MEMBER.salonId){
      post('/points',{id:'pt'+Math.random().toString(36).slice(2,8),name:MEMBER.name,phone:MEMBER.phone||'',
        delta:ptDelta,reason:'店販',ref:id,salonId:MEMBER.salonId,
        date:new Date(Date.now()+9*3600e3).toISOString().slice(0,10)}).catch(()=>{});
    }
    pushDisplay(true);                       // お客様側は「ありがとうございました」に切り替わる
    /* ★免税のときは、申請の入力が終わるまで次の会計に進ませない。
       レジだけ先に進むと、申請を忘れたまま次のお客様に移ってしまう。 */
    if(TAXFREE&&useFeat('taxfree')) openTfSheet(CART.slice(), id);
    paidClear();          // 会計が残ったので、決済の控えはもう要らない
    /* おつりの表示は、お渡ししたあとに消す。次のお客様に持ち越さない。 */
    const gotWas=GOT, chg=GOT>t?GOT-t:0;
    CART=[]; TAXFREE=false; TFINFO={name:'',country:'',last4:''};
    GOT=0; PICKCONSENT=null;
    if(PAY==='cash'&&gotWas>=t&&chg>0)toast('おつり '+yen(chg)+'　'+changeBreak(chg));
    said('会計しました',yen(t)+'　'+payLabel(PAY));
    toast('会計しました');
    if(MEMBER)await loadMember(MEMBER.salonId||MEMBER.code);   // ポイントを取り直す
    render();
  }catch(err){ toast(err.message||'会計に失敗しました',true); }
  finally{ if($('go')){$('go').disabled=false;$('go').textContent='会計する';} }
}

/* ══════════ お客様の同意（メンバー価格・セール価格） ══════════
   ★値引きしてお売りするものは、返品交換をお受けしない。
     だから「お買い上げの前に」お客様ご自身に押していただく。
     あとから説明しても遅い。押していただくまで会計に進まない。
   ★押した事実と、そのとき見せた文面を会計に残す。 */
/* ★免税・セール価格・メンバー価格は、返品交換をお受けしない。

const askNoReturn=()=>{
  const why=[TAXFREE?'免税':'', PMODE==='member'?'メンバー価格':(PMODE==='sale'?'セール価格':'')].filter(Boolean).join('・');
  return {kind:'noreturn',title:'ご確認ください　Please confirm',
   lines:[`${why}でお求めの商品は、ご返品・お取り替えをお受けしておりません`,
          `Items purchased with ${TAXFREE?'tax exemption':''}${TAXFREE&&PMODE!=='normal'?' / ':''}${PMODE!=='normal'?'a member or sale price':''} cannot be returned or exchanged.`,
          '不良品の場合はこの限りではありません　その場でお声がけください',
          'This does not apply to defective items. Please let us know right away.',
          '数量とお色をお確かめのうえ、お進みください　Please check the quantity and shade before continuing.'],
   button:'確認しました　Confirm'};

/* 同意が要るのは「免税」か「値引き」のとき */
const needAsk=()=>TAXFREE||PMODE!=='normal';
let ASKWAIT=null;
async function needConsent(){
  if(!needAsk())return true;                        // 定価で免税でもないなら要らない
  ASKWAIT={t:Date.now()};
  await post('/display/consent?s='+encodeURIComponent(SHOP)+'&r='+encodeURIComponent(REG),{}).catch(()=>{});
  await fetch(API+'/display/consent?s='+encodeURIComponent(SHOP)+'&r='+encodeURIComponent(REG),
    {method:'DELETE',headers:H()}).catch(()=>{});   // 前のお客様の同意を消しておく
  pushAsk(askNoReturn());
  const ok=await waitConsent(120);                  // 2分待つ
  pushAsk(null);
  ASKWAIT=null;
  if(!ok)toast('お客様の同意が確認できませんでした',true);
  return ok;
}
function pushAsk(ask){
  const t=cartTotal();
  post('/display/push',{shopId:SHOP,register:REG,mode:PMODE,done:false,
    items:CART.map(i=>({name:i.name,qty:i.qty,was:i.unit,now:lineNow(i),image:i.image||''})),
    list:cartList(),cut:cartCut(),total:t,ask:ask||null,flow:FLOW,
    member:MEMBER?{name:MEMBER.name,rank:MEMBER.rank,points:MEMBER.points,earn:0,
      visits:MEMBER.visits||0,greet:(MEMBER.visits||0)>=1?'again':'first'}:null}).catch(()=>{});
}
async function waitConsent(sec){
  const until=Date.now()+sec*1000;
  const flow=FLOW;                                  // 待ち始めたときの合図を覚えておく
  while(Date.now()<until){
    if(!ASKWAIT||FLOW!==flow)return false;          // やめたとき／カートが変わったとき
    await new Promise(r=>setTimeout(r,1200));
    try{
      const j=await get('/display/consent?s='+encodeURIComponent(SHOP)+'&r='+encodeURIComponent(REG));
      const c=j.consent;
      /* ★種類と合図の両方が合ったときだけ「押していただいた」と見なす。
           これが無いと、お支払い方法を選んでいただいただけで
           返品交換不可に同意していただいたことになってしまう。 */
      if(c&&c.at>=ASKWAIT.t&&c.kind==='noreturn'&&c.flow===flow){ CONSENT=c; return true; }
    }catch(e){}
  }
  return false;
}

     「返品・返金をお受けできません」を出してから確定する。
     見ていただいた文面は、そのまま会計に残す。 */
let PICKWAIT=null, PICKCONSENT=null;
function pushPick(pick){
  post('/display/push',{shopId:SHOP,register:REG,mode:PMODE,done:false,
    items:CART.map(i=>({name:i.name,qty:i.qty,was:i.unit,now:lineNow(i),image:i.image||''})),
    list:cartList(),cut:cartCut(),total:cartTotal(),pick:pick||null,flow:FLOW,
    member:MEMBER?{name:MEMBER.name,rank:MEMBER.rank,points:MEMBER.points,earn:0,
      visits:MEMBER.visits||0,greet:(MEMBER.visits||0)>=1?'again':'first'}:null}).catch(()=>{});
}
async function askPayMethod(){
  const t=cartTotal();
  if(t<=0){ toast('お会計がありません',true); return; }
  const b=$('askpay'); if(b){b.disabled=true;b.textContent='お客様の画面でお選びいただいています…';}
  PICKWAIT={t:Date.now()};
  /* 前のお客様の分を残さない */
  await fetch(API+'/display/consent?s='+encodeURIComponent(SHOP)+'&r='+encodeURIComponent(REG),
    {method:'DELETE',headers:H()}).catch(()=>{});
  pushPick({total:t,methods:PAYS.map(([k,l])=>({k,label:l,en:PAY_EN[k]||'',note:PAY_NOTE[k]||'',
    ...(k==='transit'?{warn:TRANSIT_WARN}:{})}))});
  const got=await waitPick(180);                 // 3分待つ
  pushPick(null);                                // 明細の画面に戻す
  PICKWAIT=null;
  if(b){b.disabled=false;b.textContent='お客様に選んでいただく';}
  if(!got){ toast('お選びいただけませんでした',true); return; }
  PAY=got.k; PICKCONSENT=got.consent;
  if(PAY==='cash')GOT=0;
  render();
  said('お支払い方法',payLabel(PAY));
  toast('お客様が '+payLabel(PAY)+' を選ばれました');
}
async function waitPick(sec){
  const until=Date.now()+sec*1000;
  const flow=FLOW;
  while(Date.now()<until){
    if(!PICKWAIT||FLOW!==flow)return null;        // やめたとき／カートが変わったとき
    await new Promise(r=>setTimeout(r,1200));
    try{
      const j=await get('/display/consent?s='+encodeURIComponent(SHOP)+'&r='+encodeURIComponent(REG));
      const c=j.consent;
      /* 種類（pay:◯◯）と合図の両方が合ったときだけ受け取る */
      if(c&&c.at>=PICKWAIT.t&&/^pay:/.test(c.kind||'')&&c.flow===flow){
        const k=c.kind.slice(4);
        if(PAYS.some(([x])=>x===k))return {k,consent:c};
      }
    }catch(e){}
  }
  return null;
}

        </div>
        ${RF.how==='mail'?`<input id="rfTo" value="${esc(RF.to)}" placeholder="メールアドレス" inputmode="email">`:''}
        ${RF.how==='line'?`<div class="rfn">お会計のあとに出るQRから、お客様ご自身で受け取っていただけます　控えはお店にも残ります</div>`:''}
      </div>

      <div class="dlg-a">
        <button id="rfX">やめる</button>
        <button class="pri" id="rfGo" ${(amt>0&&!over)?'':'disabled'}>お客様に確認していただく</button>
      </div>
      <p class="rfwarn">お客様にこの画面をお見せして、ご同意のうえで押してください</p>
    </div>`;
    d.querySelectorAll('.rfq button').forEach(b=>b.onclick=()=>{
      const ix=+b.dataset.i, max=+(items[ix].qty||1);
      RF.pick[ix]=Math.max(0,Math.min(max,(RF.pick[ix]||0)+(b.dataset.m==='+'?1:-1)));paint();});
    if(d.querySelector('#rfAll'))d.querySelector('#rfAll').onclick=()=>{items.forEach((it,ix)=>RF.pick[ix]=+(it.qty||1));paint();};
    if(d.querySelector('#rfNone'))d.querySelector('#rfNone').onclick=()=>{items.forEach((it,ix)=>RF.pick[ix]=0);paint();};
    d.querySelectorAll('.rfh').forEach(b=>b.onclick=()=>{RF.how=b.dataset.h;paint();});
    const t=d.querySelector('#rfTo'); if(t)t.oninput=()=>RF.to=t.value.trim();
    d.querySelector('#rfX').onclick=()=>d.remove();
    d.querySelector('#rfGo').onclick=async()=>{
      const g=d.querySelector('#rfGo'); g.disabled=true;
      /* ★お客様ご自身に、返金の内容と「いつ戻るか」を見て押していただく。
           押していただいてから返金する。順番を逆にしない。 */
      g.textContent='お客様画面をご確認ください…';
      const okc=await askRefundConsent(RF.co.method,amt);
      if(!okc){ toast('お客様の同意が確認できませんでした',true); g.disabled=false;
        g.textContent='お客様に確認していただく'; return; }
      g.textContent='返金しています…';
      try{
        /* ★交通系ICはSquareで返金できない。そのまま送ると失敗して記録が残らないので、
             現金でお返ししたこととして記録する（金庫から出た事実に合わせる）。
             元が何だったかは会計そのものに残っている。 */
        const isTransit=rfKey(RF.co.method)==='transit';
        const r=await post('/checkouts/refund',{id:RF.co.id,shopId:SHOP,register:REG,amount:amt,
          items:chosen.map(x=>({productId:x.productId,name:x.name,qty:x.back,price:unit(x)*x.back})),
          method:isTransit?'cash':RF.co.method, ...(isTransit?{cash:1}:{}), reason:'店頭でのご返品',
          notice:(RFCONSENT&&RFCONSENT.text)||rfNoticeText(RF.co.method,amt),
          agreed:1,agreedAt:RFCONSENT?new Date(RFCONSENT.at).toISOString():new Date().toISOString(),
          sendHow:RF.how,sendTo:RF.how==='mail'?RF.to:'',
          staffName:(STAFF&&STAFF.name)||''});
        d.remove();
        /* ★Squareは PENDING で返る。完了していないので「返金しました」とは書かない */
        toast(r.card?`カードへ ${yen(r.refunded)} の返金手続きをしました　お客様への反映には数日かかります`
                    :`${yen(r.refunded)} の返金を記録しました　現金をお返しください`);
        /* ★お客様画面に、いつ戻るかを大きく出す。
             返金でいちばん不安なのは「いつ戻るか分からない」こと。
             ここで黙っていると、そのまま持ち帰らせてしまう。 */
        showRefundDone(RF.co.method,amt,r['控えの鍵']||'');
        if(r.送った)toast('控えを '+r.送った+' に送りました');
        await loadHistory2(); render();
      }catch(err){ toast(err.message||'返金できませんでした',true); g.disabled=false; g.textContent='この内容に同意いただき、返金する'; }};
  };
  paint();
  document.body.appendChild(d);
}

/* ══════════ 免税の申請シート ══════════
   会計のあと、免税アプリ（国税庁の輸出物品販売場システム）に打ち込むための一覧を出す。
   ★これを閉じるまで次の会計に進めない。押し忘れを無くすため。
   ★アプリの入力は「商品名 / 対象品目 / 税率 / 単価(税抜) / 点数」の順なので、その順で並べる。
   ★免税アプリは税抜で入れる。こちらの値段は税込なので割り戻す。
   ★一般物品と消耗品は分けて申請する決まり。ヘアケア・化粧品は消耗品、
     ブラシ・美容家電などは一般物品。既定は消耗品にして、行ごとに変えられるようにする。
     一度変えたらその商品は次から覚えておく。 */
let TF_LOCK=false;                                   // 申請が終わるまで true
const TFKIND_K='stb_tfkind';                         // {productId:'general'|'consume'}
const tfKindMap=()=>{try{return JSON.parse(localStorage.getItem(TFKIND_K)||'{}')}catch(e){return {}}};
function tfKindOf(it){
  const m=tfKindMap(), k=String(it.productId||it.name||'');
  if(m[k])return m[k];
  /* 覚えていなければカテゴリで見当をつける。迷ったら消耗品（ヘアケアが大半のため） */
  return /小物|家電|器具|ブラシ|コーム|店舗用品/.test(String(it.category||'')+String(it.name||''))?'general':'consume';
}
function tfKindSet(it,v){ const m=tfKindMap(); m[String(it.productId||it.name||'')]=v;
  localStorage.setItem(TFKIND_K,JSON.stringify(m)); }
const tfNet=n=>Math.round(n/(1+TAXFREE_RATE/100));   // 税込 → 税抜

function openTfSheet(items,checkoutId){
  const rows=items.filter(i=>!isBag(i));             // 袋は免税にしない＝申請に入れない
  const bag=items.filter(isBag);
  TF_LOCK=true;
  const d=document.createElement('div'); d.className='dlg'; d.id='tfdlg';
  const paint=()=>{
    const gen=rows.filter(i=>tfKindOf(i)==='general'), con=rows.filter(i=>tfKindOf(i)==='consume');
    const sum=a=>a.reduce((s,i)=>s+tfNet(lineNow(i))*i.qty,0);
    const qsum=a=>a.reduce((s,i)=>s+i.qty,0);
    d.innerHTML=`<div class="dlg-b tfsheet">
      <h3>免税の申請</h3>
      <p>免税アプリに、この順で入れてください　入れ終わったら下のボタンを押すと次の会計に進めます</p>

      <div class="tfsum">
        <div><span>一般物品</span><b>${yen(sum(gen))}</b><i>${qsum(gen)}点</i></div>
        <div><span>消耗品</span><b>${yen(sum(con))}</b><i>${qsum(con)}点</i></div>
        <div class="tot"><span>合計（税抜）</span><b>${yen(sum(rows))}</b><i>${qsum(rows)}点</i></div>
      </div>

      <div class="tfrows">
        ${rows.map((i,ix)=>{const k=tfKindOf(i);return `<div class="tfr">
          <div class="tfr-n">${esc(i.name)}</div>
          <div class="tfr-g">
            <button class="tfk ${k==='general'?'on':''}" data-x="${ix}" data-k="general">一般物品</button>
            <button class="tfk ${k==='consume'?'on':''}" data-x="${ix}" data-k="consume">消耗品</button>
          </div>
          <div class="tfr-v"><span>税率</span><b>${TAXFREE_RATE}%</b></div>
          <div class="tfr-v"><span>単価（税抜）</span><b class="cp" data-c="${tfNet(lineNow(i))}">${tfNet(lineNow(i)).toLocaleString()}</b></div>
          <div class="tfr-v"><span>点数</span><b class="cp" data-c="${i.qty}">${i.qty}</b></div>
        </div>`}).join('')}
      </div>

      ${bag.length?`<div class="tfbag">袋は免税にしません　${bag.map(b=>esc(b.name)+' ×'+b.qty).join('　')}</div>`:''}

      <div class="dlg-a">
        <button id="tfCopy">数字をまとめてコピー</button>
        <button class="pri" id="tfDone">免税アプリに入れ終わりました</button>
      </div>
      <p class="tfwarn">押すまで次の会計はできません</p>
    </div>`;
    d.querySelectorAll('.tfk').forEach(b=>b.onclick=()=>{tfKindSet(rows[+b.dataset.x],b.dataset.k);paint();});
    d.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.c);toast('コピーしました');});
    d.querySelector('#tfCopy').onclick=()=>{
      const txt=rows.map(i=>[i.name,tfKindOf(i)==='general'?'一般物品':'消耗品',TAXFREE_RATE+'%',tfNet(lineNow(i)),i.qty].join('\t')).join('\n');
      navigator.clipboard&&navigator.clipboard.writeText(txt); toast('コピーしました');};
    d.querySelector('#tfDone').onclick=()=>{TF_LOCK=false;d.remove();render();toast('免税の申請を終えました　次の会計に進めます');};
  };
  paint();
  document.body.appendChild(d);
}

const payLabel=m=>({cash:'現金',card:'カード',term:'カード',emoney:'電子マネー',
  transit:'交通系',id:'iD',quickpay:'QUICPay',qr:'QR決済'}[m]||m||'—');

   「電子マネー」より「交通系IC」の方が、返品のときに迷わない。 */
const payShow=c=>c&&c.cardBrand?c.cardBrand:payLabel(c&&c.method);

const inScope=c=>HSCOPE==='all'||String(c.register||'')===String(REG||'');
/* ★返品のとき、その会計をすぐ出せることがいちばん大事。
   お客様の前で探しているあいだが、いちばん気まずい。
   お名前・電話の下4桁・金額のどれでも当たるようにする。

let HQ='';

    || (n&&String(c.phone||'').replace(/[^0-9]/g,'').endsWith(n))

    || String(c.id||'').includes(q);

    <div class="stk">${rows.length?rows.map(c=>`<div class="stk-r" data-h="${esc(c.id)}" style="cursor:pointer;${c.voided?'opacity:.5':''}">

      </span>
      <b>${yen(c.total)}</b></div>`).join(''):'<div class="empty">まだ会計がありません</div>'}</div>`;
}

function histDetail(c){

/* 封筒に手書きしていた分。締めるまで手元に持っておく */
let CIN='', COUT='', CMEMO='';
const denomKey=()=>'stb_denom:'+(REG||'');
function denomLoad(){ try{ return JSON.parse(localStorage.getItem(denomKey())||'{}'); }catch(e){ return {}; } }
function denomSave(o){ try{ localStorage.setItem(denomKey(),JSON.stringify(o)); }catch(e){} }
function denomTotal(o){ return DENOMS.reduce((s,d)=>s+d*(+o[d]||0),0); }

/* その日そのレジの、免税だけを集める。
 * 免税の申請には「売上・商品の点数・お買い上げになった人数」が要るので、
 * 締めの画面でそのまま書き写せる形にしておく。 */
function taxfreeOf(live){
  const only=live.filter(c=>c.taxfree);
  const byItem=new Map(); let qty=0, sales=0, cut=0;
  const bagName=(tfBag()||{}).name||'';
  for(const c of only){
    for(const it of (c.retailItems||[])){
      /* 袋は免税ではないので、免税の集計から外す */
      if(it.tfx||(bagName&&it.name===bagName))continue;
      const q=Math.max(1,+it.qty||1); qty+=q;
      const k=String(it.productId||it.name||'');
      const cur=byItem.get(k)||{name:it.name||'',qty:0,amount:0};
      cur.qty+=q; cur.amount+=(+it.price||0); byItem.set(k,cur);
    }
    sales+=(c.total||0)-(c.refund||0); cut+=(+c.taxfreeCut||0);
  }
  return {people:only.length, qty, sales, cut,
    items:[...byItem.values()].sort((a,b)=>b.qty-a.qty)};
}

function wireClose(){
  const f=$('floIn');
  /* 入金・出金・メモ・締めた人。打つたびに覚えて、締めるときにまとめて送る */
  const ii=$('inIn'), oo=$('outIn'), mm=$('memoIn');
  if(ii)ii.oninput=()=>{CIN=ii.value;calc();};
  if(oo)oo.oninput=()=>{COUT=oo.value;calc();};
  if(mm)mm.oninput=()=>{CMEMO=mm.value;};
  const liveNow=()=>HISTORY.filter(x=>!x.voided&&x.date===jstDay(0)&&String(x.register||'')===String(REG||''));
  const cashNow=()=>liveNow().filter(x=>x.method==='cash').reduce((s,x)=>s+((x.total||0)-(x.refund||0)),0);
  /* 金種を入れるたびに、その段の金額と合計を出し直す。
   * 合計は「数えた現金」そのもの＝別に入れ直さなくてよい。 */
  const calc=()=>{
    const o={};
    document.querySelectorAll('.dn-i').forEach(el=>{
      const d=+el.dataset.d, n=el.value===''?'':Math.max(0,Math.floor(+el.value||0));
      o[d]=n;
      const cell=document.querySelector('.dn-s[data-s="'+d+'"]');
      if(cell)cell.textContent=yen(d*(+n||0));
    });
    denomSave(o);
    const got=denomTotal(o), want=(+f.value||0)+cashNow()+(+CIN||0)-(+COUT||0);
    const wb=$('wantBox'); if(wb)wb.textContent=yen(want);
    const sum=$('cntSum'); if(sum)sum.textContent=yen(got);
    const any=DENOMS.some(d=>o[d]!==''&&o[d]!=null);
    const d2=got-want;
    $('diffBox').innerHTML=!any?'':
      `<div class="stk"><div class="stk-r" style="${d2?'color:var(--ng)':'color:var(--ok)'}"><span>${d2===0?'ぴったりです':(d2>0?'多い':'足りない')}</span><b>${d2===0?yen(0):(d2>0?'+':'−')+yen(Math.abs(d2))}</b></div></div>`;
    return {counts:o,got,want,any};
  };
  if(f)f.oninput=()=>{localStorage.setItem('stb_float:'+REG,f.value);calc();};
  document.querySelectorAll('.dn-i').forEach(el=>{ el.oninput=calc; });
  calc();

  /* 免税の申請に写すための書き出し。画面で長押しして選ばなくてよいように、
   * その場でコピーできる形にしておく。 */
  if($('tfCopy'))$('tfCopy').onclick=async()=>{
    const tf=taxfreeOf(liveNow());
    const lines=[`SEAM 免税 ${jstDay(0)}${REG?'（'+REG+'番レジ）':''}`,
      `免税だけの売上　${yen(tf.sales)}`,
      `免税で引いた額　${yen(tf.cut)}`,
      `お買い上げの人数　${tf.people}人`,
      `商品の点数　${tf.qty}点（${tf.items.length}品目）`,'',
      ...tf.items.map(i=>`${i.name}\t${i.qty}点\t${yen(i.amount)}`)];
    const txt=lines.join('\n');
    try{ await navigator.clipboard.writeText(txt); toast('免税の内訳を写しました　申請の書類に貼り付けてください'); }
    catch(e){ prompt('この内容を写してお使いください',txt); }
  };

  if($('closeGo'))$('closeGo').onclick=async()=>{
    const live=liveNow();
    const net=x=>(x.total||0)-(x.refund||0);
    const cash=live.filter(x=>x.method==='cash').reduce((s,x)=>s+net(x),0);
    const card=live.filter(x=>x.method==='card'||x.method==='term').reduce((s,x)=>s+net(x),0);
    const emo=live.filter(x=>x.method==='emoney').reduce((s,x)=>s+net(x),0);
    const qr=live.filter(x=>x.method==='qr').reduce((s,x)=>s+net(x),0);
    const tf=taxfreeOf(live);
    const r=calc();
    if(!r.any){ toast('現金の枚数を入れてください',true); return; }
    const flo=+($('floIn').value||0);
    try{ await post('/settlements',{date:jstDay(0),register:REG,shopId:SHOP,float:flo,cashSales:cash,expectedCash:flo+cash+(+CIN||0)-(+COUT||0),
        countedCash:r.got,diff:r.got-(flo+cash+(+CIN||0)-(+COUT||0)),card:card,emoney:emo,qr,
        total:cash+card+emo+qr,count:live.length,
        cashIn:+CIN||0,cashOut:+COUT||0,
        gift:live.reduce((s2,x)=>s2+(+x.giftUsed||0),0),
        pointYen:live.reduce((s2,x)=>s2+(+x.ptYen||0),0),
        /* ★このレジの分だけ数える。店全体で数えると、3台締めた日に
             同じ返金が3回計上される（お金は合うが、事務の数字が3倍になる）。
             取消済み（voided）も返金は起きているので、ここでは外さない。 */
        refundTotal:HISTORY.filter(x=>x.date===jstDay(0)&&String(x.register||'')===String(REG||''))
          .reduce((s2,x)=>s2+(x.refund||0),0),
        closedBy:($('byIn')&&$('byIn').value.trim())||((STAFF&&STAFF.name)||''),
        taxfreeTotal:tf.sales,taxfreeCut:tf.cut,taxfreeCount:tf.people,taxfreeQty:tf.qty,
        cashCounts:r.counts,
        memo:CMEMO||'',closedAt:new Date().toISOString()});
      CIN='';COUT='';CMEMO='';
      toast('レジを締めました　事務の画面にも届きました');
    }catch(err){ toast(err.message||'締められませんでした',true); }};
}

/* ══════════ Squareターミナル ══════════ */
async function payByTerminal(amount,kind){
  if(!TERM.deviceId){
    const code=prompt('Square ターミナルの端末コードを作ります\n端末に出ている「デバイスコード」を入れてください\n（初回だけ・空欄でこちらから発行）','');
    if(code===null)return null;
    if(!code){ try{ const d=await post('/terminal/device-code',{name:'SEAM 銀座 ショップ',mode:'shop'});
        alert('この番号をSquareターミナルに入れてください：\n\n'+d.code+'\n\n入れ終わったらもう一度「会計する」を押してください');
        return null; }catch(e){ toast(e.message||'端末コードを作れませんでした',true); return null; } }
    TERM.deviceId=code.trim(); localStorage.setItem('stb_term_dev:'+REG,TERM.deviceId);
  }
  /* 押したボタン → Squareターミナルの決済区分。
     emoney は古い記録との互換で残す（端末側で選ぶ画面になる）。 */
  const PT={card:'CARD_PRESENT',transit:'FELICA_TRANSPORTATION_GROUP',
            id:'FELICA_ID',quickpay:'FELICA_QUICPAY',emoney:'FELICA_ALL',qr:'QR_CODE'};
  /* Squareにも明細と担当を渡す（商品別売上・スタッフ別売上に出るように）。
     値引きで合計がずれるときは1行にまとめる（Squareが弾くため）。 */
  const its=CART.map(i=>({name:i.name,qty:i.qty,price:i.unit*i.qty}));
  const sum=its.reduce((a,x)=>a+x.price,0);
  const items=(!its.length)?[]:(sum===amount?its:[{name:its[0].name+(its.length>1?'ほか':''),qty:1,price:amount}]);
  const r=await post('/terminal/checkout',{amount,deviceId:TERM.deviceId,mode:'shop',
    paymentType:PT[kind]||'CARD_PRESENT',note:'SEAM ショップ',
    items,staffName:(STAFF&&STAFF.name)||'',ref:''});
  TERM.checkoutId=r.checkoutId;
  toast('ターミナルでお支払いをご案内ください');
  // 端末の結果を待つ（最長3分）
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,2000));
    const st=await get('/terminal/checkout?id='+encodeURIComponent(TERM.checkoutId)).catch(()=>null);
    if(!st)continue;
    if(st.status==='COMPLETED')return {paymentId:(st.paymentIds||[])[0]||'',paidBy:st.paidBy||'',
      cardBrand:st.cardBrand||'',fee:+st.fee||0};   // 何のカードで・手数料いくら引かれたか
    if(['CANCELED','CANCEL_REQUESTED'].includes(st.status)){ toast('端末で取り消されました',true); return null; }
  }
  toast('端末の返事が来ませんでした',true); return null;
}

/* ── 出勤している人から担当を選ぶ ──
   朝に出勤を打った人だけが並ぶ。名前を押したあと3桁の暗証番号が要るので、
   忙しくて置きっぱなしのiPadでも、他の人の名前で打たれることがない。 */
/* 3桁の暗証番号を、大きな数字キーで入れる。
   レジは指で速く打てることが大事なので、小さな入力欄は使わない。 */
function askPin(title,cb){
  const d=document.createElement('div'); d.className='dlg';
  let v='';
  const draw=()=>{ d.querySelector('#pinDots').textContent='●●●'.slice(0,v.length)+'○○○'.slice(0,3-v.length); };
  d.innerHTML=`<div class="dlg-b" style="max-width:340px">
    <h3>${esc(title)}</h3><p>3桁の暗証番号を入れてください</p>
    <div id="pinDots" style="text-align:center;font-size:34px;letter-spacing:.4em;color:var(--ink);margin:6px 0 18px">○○○</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-k="${n}" style="padding:20px;font-size:22px">${n}</button>`).join('')}
      <button class="btn" data-k="back" style="padding:20px;font-size:16px">戻す</button>
      <button class="btn" data-k="0" style="padding:20px;font-size:22px">0</button>
      <button class="btn" data-k="x" style="padding:20px;font-size:16px">やめる</button>
    </div></div>`;
  document.body.appendChild(d);
  draw();
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='x'){ d.remove(); return; }
    if(k==='back'){ v=v.slice(0,-1); draw(); return; }
    if(v.length>=3)return;
    v+=k; draw();
    if(v.length===3){ const p=v; setTimeout(()=>{ d.remove(); cb(p); },160); }
  });
  d.onclick=e=>{ if(e.target===d)d.remove(); };
}

  MEMBER={code:j.code,name:j.name||'',phone:j.phone||'',salonId:j.salonId||'',points:j.points||0,
    expiring:j.pointExpiring||0,expireOn:j.pointExpireOn||'',
    rank:j.rank||'',rate:j.rate,visits:j.visits||0,yVisits:j.yVisits||0,ySpend:j.ySpend||0,
    membership:j.membership||null,hasLine:!!j.hasLine};
  /* ★会員証を読んだら、何も押さずにメンバー価格へ切り替える。
     「メンバーを押し忘れて定価で会計した」が起きなくなる。 */
  if(first&&PMODE==='normal'){
    PMODE='member';
    document.querySelectorAll('#priceModes button').forEach(x=>x.classList.toggle('on',x.dataset.pm==='member'));
  }
  const greet=(MEMBER.visits||0)>=1?'いつもありがとうございます':'ようこそ SEAM へ';
  said('会員カード',esc(MEMBER.name||'（お名前未登録）')+' 様　'+greet+'　'+MEMBER.points+' pt'
    +(PMODE==='member'?'　<span style="color:var(--ok)">メンバー価格になりました</span>':''));
  toast(`${MEMBER.name||'会員'} 様　${greet}`);
  TAB='mem'; syncTabs(); await loadHistory(); render();
}
let HIST=[];
async function loadHistory(){
  HIST=[];
  if(!MEMBER)return;
  const to=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  const from=new Date(Date.now()+9*3600e3-365*86400e3).toISOString().slice(0,10);
  const j=await get(`/checkouts?from=${from}&to=${to}`).catch(()=>({checkouts:[]}));
  const ph=(MEMBER.phone||'').replace(/\D/g,'');
  HIST=(j.checkouts||[]).filter(c=>{
    const cp=String(c.phone||'').replace(/\D/g,'');
    return (ph&&cp===ph)||(MEMBER.name&&c.customer===MEMBER.name);
  }).sort((a,b)=>a.date<b.date?1:-1).slice(0,12);
}
function memHtml(){
  const m=MEMBER;
  const items=c=>{try{const a=JSON.parse(c.retailItems||'[]');return a.length?a.map(i=>i.name).join('／'):(c.tech?'施術':'')}catch(e){return c.tech?'施術':''}};
  return `<div class="mem-h">${esc(m.name||'（お名前未登録）')} 様</div>
    ${m.rank?`<div class="mem-r">${esc(m.rank)}</div>`:''}
    ${m.membership?`<div class="mem-r" style="margin-left:6px">月額会員 残り${m.membership.remaining}回</div>`:''}
    <div class="mem-g">
      <div class="mg"><div class="mg-k">ポイント</div><div class="mg-v">${m.points}</div>
        ${m.expireOn?`<div class="mg-k" style="margin-top:5px">${String(m.expireOn).slice(5).replace('-','/')} に ${m.expiring}pt 期限</div>`:''}</div>
      <div class="mg"><div class="mg-k">来店</div><div class="mg-v">${m.visits}</div></div>
      <div class="mg"><div class="mg-k">今年の来店</div><div class="mg-v">${m.yVisits}</div></div>
      <div class="mg"><div class="mg-k">今年のお買い上げ</div><div class="mg-v" style="font-size:19px">${yen(m.ySpend)}</div></div>
    </div>
    <h2 style="margin-top:26px">これまでのご利用</h2>
    <div class="hist">${HIST.length?HIST.map(c=>`<div class="hr">
        <span class="hr-d">${esc(String(c.date).slice(5).replace('-','/'))}</span>
        <span class="hr-i">${esc(items(c))||'—'}</span>
        <span class="hr-p">${yen(c.total)}</span></div>`).join('')
      :'<div class="empty">まだ記録がありません</div>'}</div>
    <button class="mini" id="memoff" style="margin-top:18px">お客様を外す</button>`;
}
function syncTabs(){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB)); }
function render(){ renderCart(); renderSum(); renderRight(); pushDisplay(false);
  const mo=$('memoff'); if(mo)mo.onclick=()=>{MEMBER=null;HIST=[];render();}; }

/* ══════════ 起動 ══════════ */
async function boot(){
  try{
    const j=await get('/shops');
    SHOPS=j.shops||[];
    if(!SHOPS.some(s=>s.id===SHOP))SHOP=(SHOPS[0]||{}).id||'ginza';
    $('shopSel').innerHTML=SHOPS.map(s=>`<option value="${esc(s.id)}" ${s.id===SHOP?'selected':''}>${esc(s.name)}</option>`).join('');
    $('shopSel').onchange=async e=>{SHOP=e.target.value;localStorage.setItem(SHOPK,SHOP);
      // お店ごとに出す機能がちがうので、切り替えたら読み直す
      try{ const sj2=await get('/settings'); const st2=sj2.settings||{};
           USEFEAT=JSON.parse(st2['useFeat:'+SHOP]||st2.useFeat||'{}')||{}; }catch(err){}
      render();toast(($('shopSel').selectedOptions[0]||{}).text+' に切り替えました');};
    // お店がひとつなら、選ぶところは出さない
    if(SHOPS.length<2)$('shopSel').style.display='none';
  }catch(err){
    localStorage.removeItem(TOKK); TOK=''; showGate(); toast('合言葉が違うようです',true); return;
  }
  $('gate').style.display='none'; $('app').style.display='block';
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;syncTabs();renderRight();});
  $('dispBtn').onclick=showDisplayUrl;
  {const k=$('kioskBtn'); if(k)k.onclick=showKioskToken;}
  regDraw(); $('regBtn').onclick=showRegisterPick;
  staffDraw(); $('staffBtn').onclick=showStaffPick;
  document.querySelectorAll('#priceModes button').forEach(b=>b.onclick=()=>{
    if(lockedByAsk())return; resetFlow();
    PMODE=b.dataset.pm;
    document.querySelectorAll('#priceModes button').forEach(x=>x.classList.toggle('on',x.dataset.pm===PMODE));
    render(); toast({normal:'通常の値段にしました',member:'メンバー価格にしました',sale:'セール価格にしました'}[PMODE]);});
  try{ const sj=await get('/settings'); const st=sj.settings||{};
       const v=st.price_rules;
       if(v){const r=JSON.parse(v);RULES.member=r.member||{};RULES.sale=r.sale||{};}
       REQUIRE_STAFF=String(st.require_staff||'')==='1';
       // 管理画面で消した機能は、このレジでも出さない
       // お店ごとの設定を先に見る。無ければ昔の全店共通ぶん
       try{ USEFEAT=JSON.parse(st['useFeat:'+SHOP]||st.useFeat||'{}')||{}; }catch(e){ USEFEAT={}; } }catch(e){}
  render();
  // 画面のどこを触っても、読み取りが効くように隠し欄へ戻す
  const focusSink=()=>{const el=document.activeElement;
    if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA'&&el.tagName!=='SELECT'))$('sink').focus({preventScroll:true});};
  document.addEventListener('click',()=>setTimeout(focusSink,60));
  setInterval(focusSink,4000); focusSink();
}
/* QRは台帳（index.html）と同じ作り方をする。必要になったときだけ読み込む。 */
function loadQRLib(){
  if(window.qrcode)return Promise.resolve();
  return new Promise((res,rej)=>{const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});
}
function qrImg(url,cell){
  try{const q=qrcode(0,'M');q.addData(url);q.make();return q.createDataURL(cell||6);}catch(e){return '';}
}
/* この端末がどのレジかを決める。店ごとに1〜9台を想定。
   ここで分かれるのは「お客様画面・履歴・レジ締め」で、データの保存先は同じ。 */
function showRegisterPick(){
  const d=document.createElement('div'); d.className='dlg';
  const opts=['1','2','3','4','5','6'].map(v=>
    `<button class="btn ${REG===v?'pri':''}" data-r="${v}" style="min-width:74px">${v}番</button>`).join('');
  d.innerHTML=`<div class="dlg-b">
    <h3>このiPadはどのレジですか</h3>
    <p>1つのお店にレジが何台あっても、それぞれが自分のお客様画面・自分のレジ締めを持ちます<br>
       売上や在庫の記録は すべて同じ場所にまとまります</p>
    <div class="dlg-a" style="flex-wrap:wrap">${opts}</div>
    <div class="dlg-a"><button class="btn" data-r="">分けない（1台だけの店）</button><button id="rclose">閉じる</button></div>
  </div>`;
  document.body.appendChild(d);
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    REG=b.dataset.r; localStorage.setItem(REGK,REG);
    TERM.deviceId=localStorage.getItem('stb_term_dev:'+REG)||'';
    d.remove(); regDraw(); render();
    toast(REG?`このiPadを ${REG}番レジ にしました`:'レジを分けない設定にしました');});
  d.querySelector('#rclose').onclick=()=>d.remove();
  d.onclick=e=>{ if(e.target===d)d.remove(); };
}
function regDraw(){ const b=$('regBtn'); if(b)b.textContent=REG?`レジ ${REG}番`:'レジ 未設定'; }

/* ══════════ カウンセリング端末の合言葉 ══════════
   ★お客様が手に取るiPadに、全権の管理トークンを置いていた。
     その札があれば返金も給与もカルテも見られる。
     カウンセリングの保存・読み出しだけができる別の札を作って、そちらを入れてもらう。 */
async function showKioskToken(){
  let tk='';
  try{ const j=await get('/kiosk/token'); tk=j.token||''; }catch(e){}
  const d=document.createElement('div'); d.className='dlg';
  const draw=()=>{ d.innerHTML=`<div class="dlg-b">
    <h3>カウンセリング端末の合言葉</h3>
    <p>お客様にお渡しするiPadの、カウンセリング画面の設定に入れてください<br>
       この合言葉でできるのは <b>カウンセリングの保存と読み出しだけ</b>です　
       会計・返金・給与・カルテには入れません</p>
    ${tk?`<div class="dlg-u">${esc(tk)}</div>`:'<p style="color:var(--clay)">まだ作られていません</p>'}
    <div class="dlg-a">
      ${tk?'<button id="kcopy" class="pri">合言葉をコピー</button>':''}
      <button id="knew">${tk?'作り直す（前の端末は使えなくなります）':'合言葉を作る'}</button>
      <button id="kclose">閉じる</button></div>
  </div>`;
    const c=d.querySelector('#kcopy');
    if(c)c.onclick=async()=>{ try{ await navigator.clipboard.writeText(tk); toast('コピーしました'); }
      catch(e){ prompt('この合言葉を写してお使いください',tk); } };
    d.querySelector('#knew').onclick=async()=>{
      if(tk&&!confirm('作り直すと、いまのカウンセリング端末は使えなくなります。\n新しい合言葉を入れ直す必要があります。\n\nよろしいですか'))return;
      try{ const j=await post('/kiosk/token',{}); tk=j.token||''; draw(); toast('作りました'); }
      catch(err){ toast(err.message||'作れませんでした',true); } };
    d.querySelector('#kclose').onclick=()=>d.remove(); };
  draw();
  d.onclick=e=>{ if(e.target===d)d.remove(); };
  document.body.appendChild(d);
}

async function showDisplayUrl(){
  let tk='';
  try{ const j=await post('/display/token',{}); tk=j.token||''; }
  catch(err){ toast(err.message||'合言葉を作れませんでした',true); return; }
  /* ★住所は「いまいるフォルダ＋display.html」で作る。
     seam.site は .html を外した住所（/booking/shop）で配信されるので、
     "shop.html を display.html に置き換える"という作り方だと置換が効かず、
     レジの住所のまま開いてしまう（実機で発覚）。 */
  const dir=location.pathname.replace(/\/[^/]*$/,'/');      // 例: /booking/
  const url=location.origin+dir+'display.html'
    +'?s='+encodeURIComponent(SHOP)+'&r='+encodeURIComponent(REG)+'&t='+encodeURIComponent(tk);
  const d=document.createElement('div'); d.className='dlg';
  d.innerHTML=`<div class="dlg-b">
    <h3>お客様にお見せする画面</h3>
    <p>もう1台のタブレットのブラウザで、この住所を開いてください　一度開いたらブックマークに入れておけば、次からは開くだけです<br>
       この画面には いまのお会計しか出ません（在庫や他のお客様は出ません）</p>
    <div class="qrwrap" id="qrwrap"><div class="qrload">QRを作っています…</div></div>
    <div class="dlg-u">${esc(url)}</div>
    <div class="dlg-a"><button id="dcopy" class="pri">住所をコピー</button>
      <button id="dopen">この端末で見てみる</button><button id="dclose">閉じる</button></div>
  </div>`;
  document.body.appendChild(d);
  /* もう1台のタブレットのカメラで読めるようにQRを出す。
     打ち間違いが起きないので、住所を手で入れるより速い。 */
  loadQRLib().then(()=>{
    const img=qrImg(url,6);
    const w=d.querySelector('#qrwrap');
    if(w)w.innerHTML=img?`<img src="${img}" alt="お客様画面のQR"><div class="qrnote">もう1台のカメラでこれを読み取ってください</div>`
                       :'<div class="qrload">QRを作れませんでした　下の住所をお使いください</div>';
  }).catch(()=>{const w=d.querySelector('#qrwrap');
    if(w)w.innerHTML='<div class="qrload">QRを読み込めませんでした　下の住所をお使いください</div>';});
  d.querySelector('#dcopy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(url); toast('コピーしました'); }
    catch(e){ toast('長押しで選んでコピーしてください',true); }};
  /* どんな画面になるのか、その場で確かめられるようにする（別タブで開く＝レジは消えない） */
  d.querySelector('#dopen').onclick=()=>{ window.open(url,'_blank'); };
  d.querySelector('#dclose').onclick=()=>d.remove();
  d.onclick=e=>{ if(e.target===d)d.remove(); };
}
function showGate(){ $('gate').style.display='block'; $('app').style.display='none'; }
$('gbtn').onclick=()=>{ const v=$('gtok').value.trim(); if(!v)return;
  TOK=v; localStorage.setItem(TOKK,v); boot(); };
$('gtok').onkeydown=e=>{ if(e.key==='Enter'){e.stopPropagation();$('gbtn').click();} };
if(TOK)boot(); else showGate();
</script>
