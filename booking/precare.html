<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>今日のご希望｜SEAM GINZA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<!-- 辞書を直したら ?v= を必ず上げる（HTML側の ?cb= では別ファイルは新しくならない） -->
<script src="pc-i18n.js?v=16"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   SEAM GINZA — 今日のご希望（来店前）
   ★これは問診票ではない。「要望を聞いて叶える」ための注文書。
     - 悩み／症状／気になることは聞かない。どうしたいかだけ聞く
     - 質問文ではなく、選べるものを差し出す言い方にする
     - 選んでも料金が増えないものは、その場で「含まれています」と言う
     - 決められないものは「おまかせ」を必ず用意する
     - 確約できないもの（お部屋）は確約しない、と正直に書く
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#16171B; --body:#4A4741; --sub:#7C776E;
  --cream:#F7F4EE; --sand:#EFE9DF; --line:#E3DCD0;
  --gold:#B8945A; --clay:#A87456; --rose:#D7A39A; --jade:#1F2A27;
  /* 明朝は言語で差し替える。Noto Serif JP に簡体字の一部が無く、
     中国語だと「现」だけ別フォントに落ちて字面が揃わないため */
  --serif:'Noto Serif JP',serif;
}
html[lang="zh-Hans"]{--serif:'Noto Serif SC','Noto Serif JP',serif}
html[lang="zh-Hant"]{--serif:'Noto Serif TC','Noto Serif JP',serif}
html[lang="ko"]{--serif:'Noto Serif KR','Noto Serif JP',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--body);
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}

/* 進み具合 */
.top{position:sticky;top:0;z-index:20;background:rgba(247,244,238,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0)}
.top .bar{height:3px;background:var(--line);
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 calc(100%/13 - 3px),transparent calc(100%/13 - 3px) calc(100%/13));
  mask-image:repeating-linear-gradient(90deg,#000 0 calc(100%/13 - 3px),transparent calc(100%/13 - 3px) calc(100%/13))}
.top .bar i{display:block;height:100%;background:var(--clay);width:0;transition:width .5s cubic-bezier(.16,1,.3,1)}
.top .in{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;max-width:520px;margin:0 auto}
.brand{font-family:var(--serif);letter-spacing:.26em;font-size:14px;color:var(--ink)}
.step{font-family:'Instrument Serif',serif;font-size:13px;color:var(--sub);letter-spacing:.08em}
.back{background:none;border:0;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;padding:6px 2px}

/* 画面 */
.scr{display:none;padding:18px 0 8px;animation:in .45s cubic-bezier(.16,1,.3,1)}
.scr.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Instrument Serif',serif;font-style:italic;font-size:16px;color:var(--clay);margin:0 0 8px}
h1{font-family:var(--serif);font-weight:500;color:var(--ink);
  font-size:clamp(22px,5.6vw,27px);line-height:1.5;letter-spacing:.02em;margin:0}
.lead{font-size:14px;line-height:2;color:var(--sub);margin:14px 0 0}
.hint{font-size:12.5px;color:var(--sub);margin:10px 0 0}
.incl{display:inline-block;font-size:11.5px;color:var(--clay);border:1px solid rgba(168,116,86,.32);
  border-radius:999px;padding:3px 11px;margin-top:12px}

/* 選ぶもの */
.opts{margin-top:22px;display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 16px;
  font:inherit;color:var(--body);cursor:pointer;transition:border-color .2s,background .2s,transform .12s}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--clay);background:linear-gradient(180deg,rgba(168,116,86,.10),rgba(168,116,86,.04))}
.opt{position:relative;overflow:hidden}
.opt.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--clay)}
.opt .tick{flex:0 0 20px;height:20px;border-radius:999px;border:1.4px solid var(--line);margin-top:2px;
  display:grid;place-items:center;transition:.2s}
.opt.on .tick{border-color:var(--clay);background:var(--clay)}
.opt.on .tick::after{content:"";width:6px;height:10px;border:2px solid #fff;border-top:0;border-left:0;
  transform:rotate(45deg) translate(-1px,-1px)}
.opt b{display:block;font-weight:500;color:var(--ink);font-size:15px;line-height:1.6}
.opt s{display:block;text-decoration:none;font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.75}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 15px;
  font:inherit;font-size:13.5px;color:var(--body);cursor:pointer;transition:.2s}
.chip.on{border-color:var(--clay);background:rgba(168,116,86,.09);color:var(--ink)}
.sub-h{font-size:12px;letter-spacing:.1em;color:var(--sub);margin:26px 0 0}
/* 見出しに線画を添える（香り・灯り・音）。
   絵によって横長・縦長が違うので、高さだけそろえて比率はいじらない＝つぶれない */
.grp{display:flex;align-items:flex-end;gap:12px;margin-top:26px}
.grp .sub-h{margin:0 0 4px}
.gill{height:52px;width:auto;max-width:110px;opacity:.92;display:block}
textarea{width:100%;margin-top:12px;min-height:82px;padding:13px;border:1px solid var(--line);
  border-radius:12px;font:inherit;font-size:14px;background:#fff;color:var(--body);resize:vertical}
textarea:focus{outline:0;border-color:var(--clay)}
.other{width:100%;margin-top:10px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
  font:inherit;font-size:14px;background:#fff;color:var(--body)}
.other:focus{outline:0;border-color:var(--clay)}

/* 部位マップ */
.mapwrap{position:relative;margin:20px auto 0;max-width:290px}
.mapwrap img{width:100%;display:block}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap .wash{filter:blur(10px);pointer-events:none}
.wash .z{fill:transparent;transition:fill .4s ease}
.wash .z[data-s="soft"]{fill:#DE9E92}.wash .z[data-s="normal"]{fill:#BCAB95}
.wash .z[data-s="strong"]{fill:#C79A45}.wash .z[data-s="focus"]{fill:#A56A42}
/* 苦手は「強さ」ではないので、温かい色をやめて冷たい灰にする＝ひと目で別物と分かる */
.wash .z[data-s="avoid"]{fill:#93A0A4}
/* 部位ごとの選択シート */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(22,23,27,.34);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:22px 22px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;
  animation:up .32s cubic-bezier(.16,1,.3,1);max-height:88vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0;font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:500}
.sheet .sd{font-size:12.5px;color:var(--sub);margin:6px 0 0}
.lv{display:grid;gap:8px;margin-top:16px}
.lvb{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:13px;padding:14px 15px;font:inherit;color:var(--body);cursor:pointer;transition:.18s}
.lvb.on{border-color:var(--clay);background:rgba(168,116,86,.07)}
.lvb .sw{flex:0 0 34px;height:34px;border-radius:10px;border:1px solid rgba(22,23,27,.08)}
.lvb b{display:block;font-weight:500;font-size:15px;color:var(--ink)}
.lvb s{display:block;text-decoration:none;font-size:12px;color:var(--sub);margin-top:2px}
.lvb.clear{background:transparent;border-style:dashed;justify-content:center;color:var(--sub);font-size:13.5px}
.hit .z{fill:transparent;cursor:pointer}
.hit .z:hover{fill:rgba(184,148,90,.10)}
/* 行わない範囲 */
.hit .off path{fill:#CFC6B8;opacity:.30;pointer-events:none}
.offnote{text-align:center;font-size:11.5px;color:var(--sub);margin:10px 0 0}
/* 押す場所の印 */
.pin{cursor:pointer}
.pin .ld{stroke:#C9BCA8;stroke-width:1.6}
.pin .dot{fill:#fff;stroke:var(--clay);stroke-width:3.4;transition:fill .2s}
.pin .tap{fill:transparent}
.pin text{font-family:'Noto Sans JP',sans-serif;font-size:34px;fill:var(--body);letter-spacing:.04em}
.pin.on .dot{fill:var(--clay)}
.pin.on text{fill:var(--ink)}
@media(prefers-reduced-motion:no-preference){
  .pin:not(.on) .dot{animation:beat 2.6s ease-in-out infinite}
  @keyframes beat{0%,72%,100%{r:15}82%{r:19}}
}
.scale{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px}
.scale span{font-size:11.5px;color:var(--sub);white-space:nowrap}
.scale i{flex:0 1 150px;height:7px;border-radius:99px;
  background:linear-gradient(90deg,#DE9E92,#BCAB95,#C79A45,#A56A42)}
.maphint{color:var(--sub);font-family:'Noto Sans JP',sans-serif;font-size:13.5px}
.picked{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-top:16px;
  font-family:var(--serif);font-size:14.5px;color:var(--ink);line-height:1.9;min-height:56px}

/* ══ 最後の演出 ══
   「送信できました」で終わらせない。ゆっくり呼吸する絵と、順に浮かぶ文字で
   読み終わるまでに ひと息つけるようにする。動きは全部ゆっくり＝急かさない。 */
.finale{position:relative;margin:6px auto 22px;max-width:420px;isolation:isolate}
.finale img{width:100%;display:block;position:relative;z-index:1;
  animation:breath 11s ease-in-out infinite}
/* 背後のあたたかい滲み。ゆっくり明滅して 呼吸のリズムをつくる */
.finale .aura{position:absolute;left:50%;top:52%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;z-index:0;filter:blur(34px);
  background:radial-gradient(circle,rgba(215,163,154,.42) 0%,rgba(184,148,90,.20) 45%,transparent 72%);
  animation:aura 11s ease-in-out infinite}
/* ひとすじの光。一度だけ流れて消える＝解けた合図 */
.finale .sweep{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;border-radius:12px}
.finale .sweep::after{content:"";position:absolute;top:-40%;bottom:-40%;width:38%;left:-45%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.72),transparent);
  transform:skewX(-14deg);animation:sweep 2.6s cubic-bezier(.22,.61,.36,1) .55s 1 both}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes aura{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.94)}
                50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes sweep{from{left:-45%}to{left:118%}}
/* 順に浮かび上がる */
.rise{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 予約への橋。ここだけは押したくなる形にする */
.gobook{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  margin:24px auto 0;max-width:340px;min-height:64px;padding:16px 22px;border-radius:999px;
  background:var(--ink);color:#fff;text-decoration:none;font-family:var(--serif);font-size:17px;
  box-shadow:0 10px 26px rgba(22,23,27,.18)}
.gobook span{width:32px;height:32px;border-radius:999px;background:#fff;color:var(--ink);
  display:grid;place-items:center;font-size:14px;font-family:'Noto Sans JP',sans-serif}
.gobook i{flex:1 0 100%;font-style:normal;font-family:'Noto Sans JP',sans-serif;font-size:12px;
  color:rgba(255,255,255,.72);text-align:center;margin-top:-4px}
/* 深呼吸をうながす一行 */
.breathe{font-family:var(--serif);font-size:15.5px;line-height:2.1;color:var(--clay);
  margin:22px 0 0;letter-spacing:.06em}

/* ══ 強さのバー（10段階）══
   ★言葉で「ふつう」「しっかり」と言われても、人によって指す強さが違う。
     指で動かせるバーにすると、その人の中の位置がそのまま伝わる。
   ★さわるまでは「おまかせ」。選ばせない自由を残す。 */
.gauge{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px 12px}
.gauge .gh{font-size:13.5px;font-weight:500;color:var(--ink)}
.gauge .gv{display:flex;align-items:baseline;gap:8px;margin-top:2px;min-height:30px}
.gauge .gv b{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--sub)}
.gauge.set .gv b{color:var(--clay)}
.gauge .gv i{font-style:normal;font-family:'Instrument Serif',serif;font-size:14px;color:var(--sub);opacity:0}
.gauge.set .gv i{opacity:1}
.gauge input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:2px 0 0;display:block}
.gauge input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,#EFE6DA,#DE9E92 32%,#C79A45 68%,#A56A42)}
.gauge input[type=range]::-moz-range-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,#EFE6DA,#DE9E92 32%,#C79A45 68%,#A56A42)}
.gauge input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:30px;height:30px;border-radius:50%;background:#fff;border:2.4px solid #CFC6B4;margin-top:-11px;
  box-shadow:0 2px 7px rgba(22,23,27,.16);transition:border-color .2s,transform .12s}
.gauge input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;
  border:2.4px solid #CFC6B4;box-shadow:0 2px 7px rgba(22,23,27,.16)}
.gauge.set input[type=range]::-webkit-slider-thumb{border-color:var(--clay)}
.gauge.set input[type=range]::-moz-range-thumb{border-color:var(--clay)}
.gauge input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.gends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:-2px}
.gclear{display:block;margin:8px auto 0;background:none;border:0;font:inherit;font-size:12px;
  color:var(--sub);text-decoration:underline;cursor:pointer;padding:4px}
.gauge:not(.set) .gclear{visibility:hidden}

/* ══ 叶えます、の返し ══
   ★押した0.2秒がいちばん気持ちいい。下の方に小さく出しても誰も気づかない。
     押したカードのすぐ下に、チェックと一緒にふわっと出す。 */
.grant{margin-top:9px;background:linear-gradient(180deg,rgba(168,116,86,.11),rgba(168,116,86,.05));
  border:1px solid rgba(168,116,86,.30);border-radius:13px;padding:13px 15px 13px 44px;
  font-size:14px;color:var(--clay);line-height:1.8;font-weight:500;display:none;position:relative}
.grant.on{display:block;animation:pop .5s cubic-bezier(.16,1,.3,1)}
.grant::before{content:"";position:absolute;left:16px;top:50%;margin-top:-8px;width:16px;height:16px;
  border-radius:50%;background:var(--clay)}
.grant::after{content:"";position:absolute;left:21.5px;top:50%;margin-top:-5px;width:4px;height:8px;
  border:1.8px solid #fff;border-top:0;border-left:0;transform:rotate(45deg)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

/* ══ 確認画面＝設計図 ══ */
.csheet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-top:16px}
.cttl{font-size:11.5px;letter-spacing:.14em;color:var(--clay);margin:0 0 12px}
.cbody{display:flex;gap:14px;align-items:flex-start}
.cfig{position:relative;flex:0 0 96px;width:96px}
.cfig img{width:100%;display:block;opacity:.55}
.cfig svg{position:absolute;inset:0;width:100%;height:100%;filter:blur(5px);opacity:.9}
.clist{flex:1;min-width:0}
.crow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid #F2EDE4}
.crow:last-child{border-bottom:0}
.crow b{flex:0 0 78px;font-weight:500;font-size:13px;color:var(--ink)}
.crow span{font-size:13px;color:var(--sub);line-height:1.7}
.crow.off b,.crow.off span{color:#93A0A4}
.cstep{padding:9px 0;border-bottom:1px solid #F2EDE4}
.cstep:last-child{border-bottom:0;padding-bottom:0}
.cstep b{display:block;font-family:var(--serif);font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.7}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cchip{font-size:12.5px;color:var(--body);background:#FAF6EE;border:1px solid rgba(168,116,86,.24);
  border-radius:999px;padding:4px 11px;line-height:1.7}
.cmeter{display:flex;align-items:center;gap:10px;padding:7px 0}
.cmeter span{flex:0 0 42px;font-size:12.5px;color:var(--sub)}
.cmeter strong{font-weight:500;font-size:13.5px;color:var(--ink)}
.cmeter i{flex:1;height:7px;border-radius:99px;background:#F0EAE0;overflow:hidden}
.cmeter i u{display:block;height:100%;text-decoration:none;border-radius:99px;
  background:linear-gradient(90deg,#DE9E92,#C79A45)}
.cmeter em{font-style:normal;font-family:'Instrument Serif',serif;font-size:13px;color:var(--sub);width:16px;text-align:right}
.cnote{font-size:12.5px;color:var(--sub);line-height:1.85;margin:8px 0 0}

/* 今日のあなた */
.plan{background:#fff;border:1px solid var(--line);border-radius:15px;padding:6px 18px 18px;margin-top:22px}
.prow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.prow:last-child{border-bottom:0}
.prow b{flex:0 0 74px;font-weight:400;font-size:10.5px;letter-spacing:.14em;color:var(--gold);
  text-transform:uppercase;padding-top:5px;font-family:'Instrument Serif',serif}
.prow span{font-family:var(--serif);font-size:14.5px;color:var(--ink);line-height:1.85}
.tl{margin-top:22px;border-left:1px solid var(--line);padding-left:20px}
.tl div{position:relative;padding:0 0 20px}
.tl div:last-child{padding-bottom:0}
.tl div::before{content:"";position:absolute;left:-25px;top:8px;width:9px;height:9px;border-radius:999px;
  background:var(--cream);border:1.4px solid var(--clay)}
.tl b{display:block;font-family:var(--serif);font-size:14.5px;color:var(--ink);font-weight:500}
.tl s{display:block;text-decoration:none;font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.8}

.ill{display:block;width:100%;max-width:210px;margin:20px auto 0}

/* 下の操作 */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(247,244,238,0),var(--cream) 34%);
  padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;
  border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-family:var(--serif);
  font-size:15.5px;letter-spacing:.04em;cursor:pointer;transition:opacity .2s}
.btn:disabled{opacity:.38}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);flex:0 0 auto;padding:0 20px;font-size:14px}

<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
const Q=new URLSearchParams(location.search);
const T=Q.get('t')||'';
/* ★見本モード ?demo=… — スタッフに見せるための空回し。
   予約トークンが要らない代わりに、保存もしない（本番のデータを一切さわらない）。
   メニューごとに見え方が変わるので、実際のパターンをそのまま並べてある。 */
const DEMOS={
  spa90:{label:'スパ 90分',   resv:{date:'2026-08-08',start:14*60,menu:'人気No.1 頭浸浴付き ヘッドスパ 90min',minutes:90,staff:'ANZU',name:'見本',nominated:true},
         allow:{parts:['head','eye','neck','dec','arm','hand','calf','sole'],skip:[],mode:'full',spotMinutes:0}},
  spa45:{label:'スパ 45分',   resv:{date:'2026-08-08',start:11*60,menu:'ショートヘッドスパ 45min',minutes:45,staff:'ANZU',name:'見本',nominated:false},
         allow:{parts:['head','eye','neck'],skip:[],mode:'full',spotMinutes:0}},
  hair10:{label:'ヘア＋会員10分',resv:{date:'2026-08-08',start:13*60,menu:'カット＋カラー',minutes:150,staff:'CHIKA',name:'見本',nominated:true},
         allow:{parts:[],skip:['parts','bath','soda','wash'],mode:'spot',spotMinutes:10}},
};
/* ★公開モード ?open=1 — ご予約の前に、体験を組み立てていただく。
   予約トークンが要らない代わりに、答えはこの端末に置いておき、
   ご予約が取れた瞬間にそのまま担当へ届ける（二度聞かない）。
   ★終わりを「予約」にしないと、満足して閉じられて終わる。 */
const OPEN=Q.get('open')==='1';
const DRAFT='seam_precare_draft';
/* 公開モードで選べるコース。★価格は出さない（決裁前のものを公開面に出さない） */
const COURSES=[
  {id:'c45', name:'ショート 45分',  min:45,  d:'頭とこめかみ 首まで',            parts:['head','eye','neck']},
  {id:'c60', name:'スタンダード 60分',min:60, d:'デコルテまでつなげます',        parts:['head','eye','neck','dec']},
  {id:'c90', name:'頭浸浴つき 90分', min:90,  d:'いちばん選ばれています',        parts:['head','eye','neck','dec','arm','hand','calf','sole']},
  {id:'c120',name:'ゆっくり 120分',  min:120, d:'手足までしっかり',              parts:['head','eye','neck','dec','arm','hand','calf','sole']},
];
const DEMO=DEMOS[Q.get('demo')||''] || (Q.has('demo')?DEMOS.spa90:null);
const DEMOKEY=DEMO?(DEMOS[Q.get('demo')]?Q.get('demo'):'spa90'):'';
const app=document.getElementById('app'), foot=document.getElementById('foot');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══════ ことば ══════
   日本語で組んだ画面を、描画のあとにDOMのテキストだけ差し替える（予約フローと同型）。
   ★選択肢の値(data-v/data-c)と保存する A は日本語のまま＝担当はいつも日本語で読める。
   自由記入(note)とメニュー名・スタッフ名は訳さない。 */
const LANGS=PC_I18N.langs;
let LANG=(()=>{
  const q=(Q.get('lang')||'').toLowerCase();
  if(LANGS.includes(q))return q;
  if(q==='zh-cn'||q==='zh-hans')return 'zh';
  if(q==='zh-tw'||q==='zh-hant'||q==='zh-hk')return 'tw';
  try{const s=localStorage.getItem('stb_lang'); if(LANGS.includes(s))return s;}catch(e){}
  const nav=(navigator.language||'ja').toLowerCase();
  if(/^ja/.test(nav))return 'ja';
  if(/^ko/.test(nav))return 'ko';
  if(/^zh/.test(nav))return /(tw|hk|mo|hant)/.test(nav)?'tw':'zh';
  return 'en';
})();
/* 「頭：しっかり ／ 首：やさしく」のような組み合わせは、語ごとに訳してつなぎ直す。
   ★記号だけで割るのを先に試す。空白まで一緒に割ると「はい お願いします」が
     「はい」「お願いします」に分かれて、どちらも辞書に無く訳が落ちる。 */
// 記号の前後の空白も区切りに含める。含めないと「はい お願いします ／ …」の
// 先頭側が「はい お願いします 」（末尾に空白）になって辞書に当たらない
/* ★記号で割るときは「ひとつでも辞書に当たれば」訳す。全部当たることを求めると、
   お客様の自由記入がひとつ混ざっただけで行まるごと日本語のまま落ちる
   （例: しっとりと ／ オージュア ／ My own brand）。
   空白まで割る2段目だけは、ふつうの文を壊さないよう「全部当たること」を保つ。 */
/* 順番が肝。まず「全部当たる」割り方を2通り試し、どちらも駄目なときだけ
   「ひとつでも当たれば」に落とす。逆にすると
   「温冷を交互に　炭酸でさっぱりしてから　長めがいい・泡をたっぷり」の
   前半だけ日本語で残る。 */
const SEPS=[[/(\s*[・／：]+\s*)/,'all'], [/([・／：\s]+)/,'all'], [/(\s*[・／：]+\s*)/,'any']];
/* deep=いま何段目か。0=行全体 / 1=組み立て文の中身 / 2=語。
   2まで割れれば足りる（例: 今回のコースは[頭・首・…]まで含まれています）。
   上限を置かないと、規則の中身がまた同じ規則に当たったときに戻ってこなくなる。 */
function tr(s,deep){
  deep=deep||0;
  const MAP=PC_I18N.map(LANG); if(!MAP)return s;
  const RX=PC_I18N.rx(LANG), PU=PC_I18N.punct(LANG);
  if(MAP[s]!=null)return MAP[s];
  if(deep<3)for(const [rx,fn] of RX){ const m=s.match(rx); if(m)return fn(m,x=>tr(x,deep+1)); }
  if(deep>=2)return s;              // 語まで来たら、それ以上は割らない
  /* ★語ごとの判定は辞書の直引きではなく tr() を通す。
     でないと「頭：しっかり（7/10）」のように 語そのものが
     組み立て文になっている場合を拾えない。 */
  for(const [SEP,need] of SEPS){
    if(!SEP.test(s))continue;
    const seg=s.split(SEP), words=seg.filter((_,k)=>k%2===0).filter(Boolean);
    const hit=words.filter(w=>tr(w,deep+1)!==w).length;
    if(words.length>1 && (need==='any' ? hit>0 : hit===words.length)){
      const out=seg.map((p,k)=>k%2?p:tr(p,deep+1)).join('');
      return PU?PU(out):out;
    }
  }
  return s;   // 訳が無いものは日本語のまま（メニュー名・お客様の自由記入など）
}
// 元の日本語を必ず持っておく。持たないと ko→en の切替で前の言語が残る
const _O=new WeakMap(), _OP=new WeakMap();
/* その言語を選んだ人にだけ明朝を足す（日本語・英語の人に余計な読み込みをさせない） */
const FONTS={zh:'Noto+Serif+SC',tw:'Noto+Serif+TC',ko:'Noto+Serif+KR'};
function ensureFont(){
  const f=FONTS[LANG]; if(!f||document.getElementById('f-'+LANG))return;
  const l=document.createElement('link'); l.id='f-'+LANG; l.rel='stylesheet';
  l.href=`https://fonts.googleapis.com/css2?family=${f}:wght@400;500&display=swap`;
  document.head.appendChild(l);
}
function applyLang(){
  document.documentElement.lang = LANG==='tw' ? 'zh-Hant' : (LANG==='zh'?'zh-Hans':LANG);
  ensureFont();
  document.title = tr('今日のご希望｜SEAM GINZA');
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentNode&&n.parentNode.nodeName;
    return (p==='SCRIPT'||p==='STYLE')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  const nodes=[]; let n; while(n=w.nextNode())nodes.push(n);
  nodes.forEach(nd=>{
    if(!_O.has(nd))_O.set(nd,nd.textContent); else nd.textContent=_O.get(nd);
    const t=nd.textContent.trim(); if(!t)return;
    const v=tr(t); if(v!==t)nd.textContent=nd.textContent.replace(t,v);
  });
  document.querySelectorAll('[placeholder]').forEach(el=>{
    if(!_OP.has(el))_OP.set(el,el.placeholder); else el.placeholder=_OP.get(el);
    el.placeholder=tr(el.placeholder);
  });
}
function setLang(l){
  LANG=l; try{localStorage.setItem('stb_lang',l);}catch(e){}
  draw();
}
function langBar(){
  return `<div class="langs">${LANGS.map(l=>
    `<button data-l="${l}" class="${l===LANG?'on':''}">${PC_I18N.label[l]}</button>`).join('')}</div>`;
}
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
let RESV=null, A={}, SEASON='mid', LAST=null, i=0, saving=null;
let ALLOW={parts:['head','eye','neck','dec','arm','hand','calf','sole'],skip:[],mode:'full',spotMinutes:0};   // メニューで触る範囲が違う

/* ══ 強さのバー ══
   10段階の数字と、その位置を表すことば。保存するのは日本語の文字列
   （例「しっかり（7/10）」）なので、担当はいつも日本語で読める。 */
const GAUGES={
  washPower:{h:'シャンプーの強さ',lo:'やさしく',hi:'しっかり'},
  power:    {h:'強さ',            lo:'やさしく',hi:'しっかり'},
  sound:    {h:'音の大きさ',      lo:'静かに',  hi:'しっかり'},
  light:    {h:'灯りの暗さ',      lo:'明るめ',  hi:'暗め'},
};
const GWORD={
  washPower:['とてもやさしく','やさしく','ふつう','しっかり','とてもしっかり'],
  power:    ['とてもやさしく','やさしく','ふつう','しっかり','とてもしっかり'],
  sound:    ['ほとんど無音','静かに','ふつう','しっかり','大きめに'],
  light:    ['明るめ','ややおさえて','ふつう','暗め','かなり暗く'],
};
const gword=(k,n)=>GWORD[k][Math.min(4,Math.floor((n-1)/2))];
const gtext=(k,n)=>`${gword(k,n)}（${n}/10）`;
/* 保存された「しっかり（7/10）」から数字だけ取り出す */
const gnum=v=>{const m=String(v||'').match(/（(\d+)\/10）/);return m?+m[1]:0;};
function gaugeHtml(k){
  const c=GAUGES[k], n=gnum(A[k]), on=n>0;
  return `<div class="gauge${on?' set':''}" data-g="${k}">
    <div class="gh">${c.h}</div>
    <div class="gv"><b>${on?gword(k,n):'おまかせ'}</b><i>${on?n+' / 10':''}</i></div>
    <input type="range" min="1" max="10" step="1" value="${on?n:5}" aria-label="${c.h}">
    <div class="gends"><span>${c.lo}</span><span>${c.hi}</span></div>
    <button class="gclear" type="button">おまかせに戻す</button></div>`;
}
function gaugeWire(root,onChange){
  (root||document).querySelectorAll('.gauge').forEach(g=>{
    const k=g.dataset.g, r=g.querySelector('input'), b=g.querySelector('.gv b'), i=g.querySelector('.gv i');
    const put=n=>{ g.classList.add('set'); b.textContent=gword(k,n); i.textContent=n+' / 10';
      A[k]=gtext(k,n); applyLang(); save(); if(onChange)onChange(k,n); };
    r.oninput=()=>put(+r.value);
    g.querySelector('.gclear').onclick=()=>{ g.classList.remove('set');
      b.textContent='おまかせ'; i.textContent=''; r.value=5; delete A[k];
      applyLang(); save(); if(onChange)onChange(k,0); };
  });
}

/* ── 部位マップ ── */
const PARTS={head:'頭',eye:'こめかみ',neck:'首',dec:'デコルテ',arm:'腕',hand:'手',calf:'ふくらはぎ',sole:'足裏'};
/* 部位ごとに ひとこと添えられる。★目は「押す」ではなく「まわりをほどく」と必ず言う */
const PNOTE={eye:'目の疲れにはここです　目もとや額は ご希望がなければ触れません　後頭部のツボと合わせてほどきます'};
/* ★「苦手」は強さではなく“触れないでほしい”。他と並べず、色も冷たい灰にして別物に見せる */
/* にじみの色。10段階を4つの帯に落とす（1-2 / 3-5 / 6-8 / 9-10） */
const TONE=n=>n<=2?'soft':(n<=5?'normal':(n<=8?'strong':'focus'));
/* 保存されている値を、担当が読む日本語にする */
function partText(part){
  const v=(A.parts||{})[part];
  const long=!!(A.long||{})[part];
  if(v==='avoid')return 'ここは苦手';
  if(typeof v==='number')return gtext('power',v)+(long?'・長めに':'');
  return long?'長めに':'';
}
/* 形はPILで人体線画の実座標を測って置いてある（勘で置くとズレる）。
   viewBox 848×1264 は元画像 760×1133 の1.1157倍。 */
const SHAPES=[
 ['head','<ellipse cx="424" cy="176" rx="74" ry="90"/>'],
 ['dec','<path d="M312 300Q424 274 536 300L544 350Q424 374 304 350Z"/>'],
 ['arm','<path d="M304 300 L346 302 L354 520 L332 618 L282 618 L286 520 Z"/>'],
 ['arm','<path d="M544 300 L502 302 L494 520 L516 618 L566 618 L562 520 Z"/>'],
 ['hand','<path d="M280 620 Q306 606 332 620 L330 700 Q306 738 288 700 Z"/>'],
 ['hand','<path d="M568 620 Q542 606 516 620 L518 700 Q542 738 560 700 Z"/>'],
 /* 目の疲れ＝左右のこめかみ。★目も眉のうえも触らないので、帯で顔を横切らせない。
    頭より後に置くことで、こめかみを押すと目が選ばれる */
 ['eye','<ellipse cx="372" cy="198" rx="32" ry="38"/>'],
 ['eye','<ellipse cx="476" cy="198" rx="32" ry="38"/>'],
 ['neck','<rect x="386" y="240" width="76" height="62" rx="26"/>'],
 // ★足は「ふくらはぎ」と「足裏」に分ける。ここは実際に触る範囲が違う
 ['calf','<path d="M346 892 L414 892 L408 1050 Q390 1120 372 1122 L358 1050 Z"/>'],
 ['calf','<path d="M434 892 L502 892 L490 1050 L476 1122 Q458 1120 440 1050 Z"/>'],
 ['sole','<path d="M352 1124 Q392 1108 414 1126 L410 1186 Q382 1200 356 1186 Z"/>'],
 ['sole','<path d="M434 1126 Q456 1108 496 1124 L492 1186 Q466 1200 438 1186 Z"/>'],
];
/* ★行わない範囲。「無い」ことを黙っていると、押しても反応しないだけの画面になる。
   うすく描いて理由を1行そえる方が、いちばん親切で正直。 */
const OFF_SHAPES=[
 '<path d="M348 384 Q424 368 500 384 L512 566 Q424 604 336 566 Z"/>',
 '<path d="M336 618 L418 618 L412 880 L354 880 Z"/>',
 '<path d="M430 618 L512 618 L494 880 L436 880 Z"/>',
];
/* 押す場所の印。ラベルは体の外に出して、細い引き線でつなぐ＝図版らしく、押す所も一目で分かる */
const MARKS={
  head:{x:424,y:126, lx:566,ly:126, side:'start'},
  eye: {x:378,y:200, lx:290,ly:200, side:'end'},
  neck:{x:424,y:276, lx:566,ly:276, side:'start'},
  dec: {x:424,y:336, lx:282,ly:340, side:'end'},
  arm: {x:314,y:500, lx:262,ly:500, side:'end'},
  hand:{x:306,y:664, lx:262,ly:664, side:'end'},
  calf:{x:466,y:980, lx:566,ly:980, side:'start'},
  sole:{x:466,y:1172,lx:566,ly:1172,side:'start'},
};
const lay=(cls)=>SHAPES.filter(([p])=>ALLOW.parts.includes(p))
  .map(([p,s])=>s.replace(/^<(\w+)/,`<$1 class="z" data-p="${p}"`)).join('');
function pins(){
  return ALLOW.parts.filter(p=>MARKS[p]).map(p=>{
    const m=MARKS[p], x2=m.side==='start'?m.lx-14:m.lx+14;
    return `<g class="pin" data-p="${p}">
      <line class="ld" x1="${m.x}" y1="${m.y}" x2="${x2}" y2="${m.ly}"/>
      <circle class="dot" cx="${m.x}" cy="${m.y}" r="15"/>
      <circle class="tap" cx="${m.x}" cy="${m.y}" r="46"/>
      <text x="${m.lx}" y="${m.ly+11}" text-anchor="${m.side}">${PARTS[p]}</text></g>`;
  }).join('');
}
function mapHtml(){
  // 「触れない部位」を並べて見せるのではなく、含まれているものを言う
  const inc=ALLOW.parts.map(k=>PARTS[k]).join('・');
  const off=ALLOW.parts.includes('calf')||ALLOW.parts.includes('sole');
  return `<span class="incl">今回のコースは ${inc} まで含まれています</span>
  <div class="mapwrap">
    <svg class="wash" viewBox="0 0 848 1264" aria-hidden="true">${lay()}</svg>
    <img src="../images/lp/spa/bodymap_figure.webp" alt="からだの図">
    <svg class="hit" viewBox="0 0 848 1264">
      ${off?`<g class="off" aria-hidden="true">${OFF_SHAPES.join('')}</g>`:''}
      ${lay()}${pins()}</svg></div>
  ${off?`<p class="offnote">うすいところ（お腹・腿）は 今回はいたしません</p>`:''}
  <div class="scale"><span>やさしく</span><i></i><span>しっかり</span></div>
  <div class="picked" id="picked"></div>`;
}
function mapWire(){
  A.parts=A.parts||{};
  // 前回の内容を引き継いだとき、今回のコースに無い部位が残らないようにする
  A.long=A.long||{};
  Object.keys(A.parts).forEach(k=>{ if(!ALLOW.parts.includes(k)) delete A.parts[k]; });
  Object.keys(A.long).forEach(k=>{ if(!ALLOW.parts.includes(k)) delete A.long[k]; });
  const paint=()=>{
    document.querySelectorAll('.wash .z').forEach(z=>{const v=A.parts[z.dataset.p];
      const s=(v==='avoid')?'avoid':(typeof v==='number'?TONE(v):((A.long||{})[z.dataset.p]?'focus':''));
      if(s)z.dataset.s=s;else delete z.dataset.s;});
    document.querySelectorAll('.pin').forEach(g=>g.classList.toggle('on',!!partText(g.dataset.p)));
    const t=Object.keys(PARTS).filter(k=>partText(k)).map(k=>PARTS[k]+'：'+partText(k));
    document.getElementById('picked').innerHTML=t.length?t.join(' ／ ')
      :'<span class="maphint">印のところを押してみてください<br>強さを選べます　苦手なところも伝えられます</span>';
    applyLang();
  };
  window.__paintMap=paint;
  document.querySelectorAll('.hit .z').forEach(z=>z.onclick=()=>openSheet(z.dataset.p));
  document.querySelectorAll('.pin').forEach(g=>g.onclick=()=>openSheet(g.dataset.p));
  paint();
}

/* 部位を押したら開く選択シート。連打で回すより、名前で選べる方が分かりやすいし
   「苦手」のような“強さではないもの”も同じ場所に置ける。 */
/* 部位ごとの希望。★強さは10段階のバーで受ける（言葉では人によって指す強さが違う）。
   「ここは苦手」と「ここを長めに」は強さではないので、バーと混ぜず別のボタンにする。 */
function openSheet(part){
  const cur=(A.parts||{})[part]||'';        // 'avoid' か 1〜10 の数字
  const avoid=cur==='avoid', n=(typeof cur==='number')?cur:0;
  const long=!!(A.long||{})[part];
  const el=document.createElement('div'); el.className='sheet on'; el.id='sheet';
  el.innerHTML=`<div class="bd"></div><div class="pn" role="dialog" aria-label="${PARTS[part]}の希望">
    <div class="grip"></div>
    <h3>${PARTS[part]}</h3>
    <p class="sd">${PNOTE[part]||'どのくらいがお好みですか'}</p>
    <div class="gauge${(!avoid&&n)?' set':''}" data-g="power" data-part="${part}">
      <div class="gh">強さ</div>
      <div class="gv"><b>${(!avoid&&n)?gword('power',n):'おまかせ'}</b><i>${(!avoid&&n)?n+' / 10':''}</i></div>
      <input type="range" min="1" max="10" step="1" value="${n||5}" aria-label="強さ" ${avoid?'disabled':''}>
      <div class="gends"><span>やさしく</span><span>しっかり</span></div>
    </div>
    <div class="lv">
      <button class="lvb${long?' on':''}" data-t="long">
        <span class="sw" style="background:#A56A42"></span>
        <span><b>ここを長めに</b><s>時間をかけてほぐします</s></span></button>
      <button class="lvb${avoid?' on':''}" data-t="avoid">
        <span class="sw" style="background:#93A0A4"></span>
        <span><b>ここは苦手</b><s>触れずにおきます</s></span></button>
      ${(cur||long)?'<button class="lvb clear" data-t="reset">選ばない状態にもどす</button>':''}
    </div></div>`;
  document.body.appendChild(el);
  applyLang();
  const close=()=>{el.remove();};
  el.querySelector('.bd').onclick=close;
  const g=el.querySelector('.gauge'), r=g.querySelector('input');
  r.oninput=()=>{ const v=+r.value;
    A.parts=A.parts||{}; A.parts[part]=v; delete (A.long||{})[part+'__x'];
    g.classList.add('set');
    g.querySelector('.gv b').textContent=gword('power',v);
    g.querySelector('.gv i').textContent=v+' / 10';
    applyLang(); if(window.__paintMap)window.__paintMap(); save();
  };
  el.querySelectorAll('.lvb').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    A.parts=A.parts||{}; A.long=A.long||{};
    if(t==='reset'){ delete A.parts[part]; delete A.long[part]; }
    else if(t==='avoid'){ if(A.parts[part]==='avoid')delete A.parts[part]; else {A.parts[part]='avoid'; delete A.long[part];} }
    else { A.long[part]=!A.long[part]; }
    if(window.__paintMap)window.__paintMap();
    save(); close();
  });
}

let SC=[];

/* ── 描画 ── */
function draw(){
  const s=SC[i];
  document.getElementById('back').hidden = i===0 || !!s.done;
  document.getElementById('stepn').textContent = (s.done||s.id==='hello'||s.id==='course'||s.id==='quick')?''
    :`${i-(OPEN?1:0)} / ${SC.length-2-(OPEN?1:0)}`;
  document.getElementById('bar').style.width = Math.round(i/(SC.length-1)*100)+'%';
  foot.hidden=!!s.done||s.id==='quick';

  if(s.confirm) return drawConfirm();
  if(s.done) return drawDone();

  let h='';
  if(s.render){ h=s.render(); }
  else{
    h=`<h1>${s.title}</h1>${s.lead?`<p class="lead">${s.lead}</p>`:''}`;
    if(s.incl)h+=`<span class="incl">${esc(s.incl)}</span>`;
    if(s.ill)h+=`<img class="ill" src="../images/lp/spa/${s.ill}.webp" alt="" aria-hidden="true" loading="lazy">`;
    if(s.gauges)h+=s.gauges.map(k=>gaugeHtml(k)).join('');
    if(s.custom)h+=s.custom();
    if(s.opts)h+=`<div class="opts">${s.opts.map(([t,d])=>
      `<button class="opt${A[s.one]===t?' on':''}" data-v="${esc(t)}">
        <span class="tick"></span><span><b>${esc(t)}</b>${d?`<s>${esc(d)}</s>`:''}</span></button>`).join('')}</div>`;
    if(s.chips)h+=`<div class="chips">${s.chips.map(c=>
      `<button class="chip${(A[s.many]||[]).includes(c)?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
    if(s.groups)h+=s.groups.map(g=>`<div class="grp">
      ${g.ill?`<img class="gill" src="../images/lp/spa/${g.ill}.webp" alt="" aria-hidden="true" loading="lazy">`:''}
      <p class="sub-h">${g.h}</p></div><div class="chips" data-g="${g.k}">${
      g.chips.map(c=>`<button class="chip${A[g.k]===c?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`).join('');
    if(s.after){h+=`<p class="sub-h">${s.after.h}</p><div class="chips" data-g2="${s.after.k}">${
      s.after.chips.map(c=>`<button class="chip${(A[s.after.k]||[]).includes(c)?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
      if(s.after.other)h+=`<input id="other" class="other" type="text"
        placeholder="${esc(s.after.otherPh||'')}" value="${esc(A[s.after.other]||'')}">`;}
    if(s.free)h+=`<input id="free" class="other" type="text"
      placeholder="${esc(s.free.ph||'')}" value="${esc(A[s.free.k]||'')}">`;
    if(s.note)h+=`<p class="sub-h">ほかにご希望があれば</p><textarea id="note" placeholder="例：終わったあと少しだけ静かに休みたいです">${esc(A.note||'')}</textarea>`;
    h+=`<div class="grant" id="grant"></div>`;
  }
  app.innerHTML=`<div class="scr on">${h}</div>`;
  document.getElementById('next').innerHTML=(s.next||'次へ')+'<span class="ar">→</span>';
  /* ★共通の配線を先に。あとから画面ごとの配線で上書きする。
     逆にすると wire() が .opt の onclick を張り直して、
     画面ごとに用意した動き（コース選択など）が消える。 */
  wire(s);
  if(s.wire)s.wire();
  if(s.id==='course')sync();
  app.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  applyLang();
  window.scrollTo(0,0);
}

  mint:'覚えておきます',
  scent:'お部屋をそのように整えておきます',
  room:'空いていれば そちらでご案内します',
  talk:'担当に伝えておきます',
  finish:'そのように仕上げます',
  after:'それに合わせて仕上げます'};
function grant(k,near){
  const g=document.getElementById('grant'); if(!g||!GRANT[k])return;
  // 押したカードのすぐ下へ移してから出す＝視線を動かさずに気づける
  if(near&&near.parentNode)near.parentNode.insertBefore(g,near.nextSibling);
  g.classList.remove('on'); void g.offsetWidth;      // もう一度アニメさせる
  g.textContent=GRANT[k]; g.classList.add('on'); applyLang();
}

function wire(s){
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    A[s.one]=b.dataset.v;
    app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));
    grant(s.one,b); save(); sync();
  });
  app.querySelectorAll('.chips').forEach(box=>{
    const gk=box.dataset.g, g2=box.dataset.g2;
    box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      const c=b.dataset.c;
      if(gk){ A[gk]=A[gk]===c?'':c; box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',A[gk]===x.dataset.c)); grant(gk,box); }
      else{ const k=g2||s.many; A[k]=A[k]||[];
        A[k]=A[k].includes(c)?A[k].filter(x=>x!==c):A[k].concat([c]);
        b.classList.toggle('on',A[k].includes(c)); }
      save(); sync();
    });
  });
  gaugeWire(app,()=>sync());
  const n=document.getElementById('note'); if(n)n.oninput=()=>{A.note=n.value;save();};
  const fr=document.getElementById('free');
  if(fr&&s.free)fr.oninput=()=>{A[s.free.k]=fr.value;save();};
  const o=document.getElementById('other');
  if(o&&s.after&&s.after.other)o.oninput=()=>{A[s.after.other]=o.value;save();};
  sync();
}
function sync(){
  const s=SC[i];
  // コースを選ぶまでは進めない（選ばないと出し分けが決まらない）
  if(s.id==='course'){ document.getElementById('next').disabled=!COURSE; return; }
  const need = s.one && !s.render && !s.confirm;
  document.getElementById('next').disabled = need ? !A[s.one] : false;
}

/* ══ 確認画面 ══
   ★ここは「入力の控え」ではなく「あなたの設計図」。
     明細（ラベル＋値の表）にすると、11問答えた見せ場がシステムのダンプになる。
     図（からだ）＋帯（時間）＋しつらえ で、作ったものを見せる。 */
function drawConfirm(){
  const st=RESV&&RESV.start||0, mn=(RESV&&RESV.minutes)||90;
  const t=(m)=>hm(Math.max(0,st+m));
  const ok=k=>ALLOW.parts.includes(k);
  const has=Object.keys(PARTS).some(k=>ok(k)&&partText(k));
  const avoid=Object.keys(PARTS).filter(k=>ok(k)&&(A.parts||{})[k]==='avoid').map(k=>PARTS[k]);
  const care =Object.keys(PARTS).filter(k=>ok(k)&&(A.parts||{})[k]!=='avoid'&&partText(k));
  const chips=a=>(a||[]).filter(Boolean).map(x=>`<span class="cchip">${esc(x)}</span>`).join('');
  const step=(time,ttl,items)=>{
    const c=chips(items); if(!c&&!ttl)return '';
    return `<div class="cstep"><b>${time?time+'　':''}${ttl}</b><div class="cchips">${c}</div></div>`;
  };
  /* 部屋のしつらえは 文字ではなくバーで見せる（選んだ位置がそのまま絵になる） */
  const meter=(k,label)=>{ const n=gnum(A[k]); if(!n)return '';
    return `<div class="cmeter"><span>${label}</span><i><u style="width:${n*10}%"></u></i><em>${n}</em></div>`; };

  app.innerHTML=`<div class="scr on">
    <p class="eyebrow">your day</p>
    <h1>当日の あなたの時間</h1>
    <p class="lead">この内容でご用意します<br>直したいところがあれば もどってください</p>

    ${has?`<div class="csheet">
      <div class="cttl">触れてほしいところ</div>
      <div class="cbody">
        <div class="cfig">
          <svg class="wash" viewBox="0 0 848 1264" aria-hidden="true">${lay()}</svg>
          <img src="../images/lp/spa/bodymap_figure.webp" alt="">
        </div>
        <div class="clist">
          ${care.map(k=>`<div class="crow"><b>${PARTS[k]}</b><span>${esc(partText(k))}</span></div>`).join('')}
          ${avoid.length?`<div class="crow off"><b>${esc(avoid.join('・'))}</b><span>ここは苦手</span></div>`:''}
        </div>
      </div></div>`:''}

    <div class="csheet">
      <div class="cttl">当日の流れ</div>
      ${step(t(0),'お越しください',[A.goal])}
      ${step('', A.spot?'シャンプーのとき':'', [A.spot])}
      ${step(t(15),'洗いながら ほぐしていきます',[A.bath,A.soda,A.washPower].concat(A.wash||[]))}
      ${step(t(mn-15),'ゆっくり戻ってきます',[A.talk])}
      ${step(t(mn),'仕上げてお帰りです',[A.finish,A.styling].concat(A.care||[],[A.careOther],A.face||[]))}
    </div>

    ${(A.scent||A.music||A.musicOther||A.drink||gnum(A.light)||gnum(A.sound)||A.room)?`<div class="csheet">
      <div class="cttl">お部屋のしつらえ</div>
      ${A.scent?`<div class="cmeter"><span>香り</span><strong>${esc(A.scent)}</strong></div>`:''}
      ${(A.music||A.musicOther)?`<div class="cmeter"><span>音楽</span><strong>${esc([A.music,A.musicOther].filter(Boolean).join(' ／ '))}</strong></div>`:''}
      ${A.drink?`<div class="cmeter"><span>お飲みもの</span><strong>${esc(A.drink)}</strong></div>`:''}
      ${meter('light','灯り')}
      ${meter('sound','音の大きさ')}
      ${A.room?`<div class="cmeter"><span>お席</span><strong>${esc(A.room)}</strong></div>`:''}
      ${A.room&&/VIP/.test(A.room)?`<p class="cnote">空いていればご希望に沿います　満席のときは別のお部屋になり、ご料金はいただきません</p>`:''}
    </div>`:''}

    ${((A.avoid||[]).length||A.note)?`<div class="csheet">
      <div class="cttl">お伝えしておくこと</div>
      <div class="cchips">${chips(A.avoid)}</div>
      ${A.note?`<p class="cnote">${esc(A.note)}</p>`:''}
    </div>`:''}

    ${(!has&&!A.goal)?`<div class="csheet"><p class="cnote">まだ何も選ばれていません　当日おうかがいします</p></div>`:''}
    <div id="err"></div></div>`;
  document.getElementById('next').innerHTML='これでお願いします<span class="ar">→</span>';
  document.getElementById('next').disabled=false;
  // 図のにじみは、部位マップと同じ規則で塗る
  document.querySelectorAll('.cfig .wash .z').forEach(z=>{const v=(A.parts||{})[z.dataset.p];
    const c=(v==='avoid')?'avoid':(typeof v==='number'?TONE(v):((A.long||{})[z.dataset.p]?'focus':''));
    if(c)z.dataset.s=c;});
  applyLang();
}

/* ══ 公開モードの終わり＝予約への橋 ══
   ★ここで完結させない。「作ったものを持ったまま予約に進める」から捨てるのが惜しくなる。
     診断(髪格診断)は完了率98.4%なのに予約に結びついていない。
     満足させて終わると、行く理由が消える。 */
function drawOpenDone(){
  const mn=(COURSE&&COURSE.min)||90;
  const url='./index.html'+(LANG!=='ja'?('?lang='+LANG):'');
  app.innerHTML=`<div class="scr on done" style="text-align:center">
    <div class="finale">
      <span class="aura"></span>
      <img src="../images/lp/spa/ill_finale.webp" alt="" aria-hidden="true">
      <span class="sweep"></span>
    </div>
    <p class="eyebrow rise" style="--d:.15s">your ${mn} minutes</p>
    <h1 class="rise" style="--d:.3s">あなたの${mn}分が<br>できました</h1>
    <p class="lead rise" style="--d:.5s">あとは 日にちを選ぶだけです<br>
      いま選んだ内容は <b style="color:var(--clay)">そのまま担当に届きます</b></p>
    <a class="gobook rise" style="--d:.7s" href="${url}">日にちを選ぶ<span>→</span>
      <i>30秒ほどで終わります</i></a>
    <p class="hint rise" style="--d:.9s">選んだ内容はこの端末に残ります　あとから変えられます</p>
    <button class="skip rise" style="--d:1s" id="again">もう一度 組み立てなおす</button></div>`;
  applyLang();
  const ag=document.getElementById('again');
  if(ag)ag.onclick=()=>{ try{localStorage.removeItem(DRAFT);}catch(e){}
    A={}; COURSE=null; RESV=null; SC=screens(); i=0; draw(); };
}

function drawDone(){
  if(OPEN) return drawOpenDone();
  const st=RESV&&RESV.start||0, mn=(RESV&&RESV.minutes)||90;
  const t=(m)=>hm(Math.max(0,st+m));
  /* ★最後は「送信完了」で終わらせない。ここが当日への期待がいちばん高まる瞬間。
     ゆっくり呼吸する絵と、順に浮かび上がる文字で ひと息つける間をつくる。 */
  app.innerHTML=`<div class="scr on done" style="text-align:center">
    <div class="finale">
      <span class="aura"></span>
      <img src="../images/lp/spa/ill_finale.webp" alt="" aria-hidden="true">
      <span class="sweep"></span>
    </div>
    <p class="eyebrow rise" style="--d:.15s">see you soon</p>
    <h1 class="rise" style="--d:.3s">お待ちしています</h1>
    <p class="lead rise" style="--d:.5s">ご希望はすべて担当に届きました<br>当日は 何も言わなくて大丈夫です</p>
    <p class="breathe rise" style="--d:.7s">ここから先は<br>何も考えなくて大丈夫です</p>
    <div class="tl rise" style="text-align:left;--d:.9s">
      <div><b>${t(0)}　お越しください</b><s>受付で書くものはありません そのままお部屋へ</s></div>
      <div><b>${t(5)}　はじまります</b><s>${esc(A.goal||'今日のご希望')}　と うかがっています とだけお伝えします</s></div>
      ${A.spot?`<div><b>シャンプーのとき　${esc(A.spot)}</b><s>${ALLOW.spotMinutes||10}分ぶん ここに使います</s></div>`:''}
      <div${A.spot?' hidden':''}><b>${t(15)}　洗いながら ほぐしていきます</b><s>${A.bath?esc(A.bath)+'　':''}${/^はい/.test(A.soda||'')?'炭酸でさっぱりしてから　':''}${(A.wash||[]).slice(0,2).join('・')||'心地よい強さで'}</s></div>
      <div><b>${t(mn-15)}　ゆっくり戻ってきます</b><s>${esc([A.scent,A.music,A.light].filter(Boolean).join(' ／ ')||'静かなお部屋で')}</s></div>
      <div><b>${t(mn)}　仕上げてお帰りです</b><s>${esc([A.finish,A.styling].filter(Boolean).join(' ／ ')||'髪を見て仕上げます')}</s></div>
    </div>
    <p class="hint rise" style="--d:1.1s">変えたくなったら このページからいつでも直せます</p></div>`;
  applyLang();
}

/* ── 保存（1問ごと・落としても続きから） ── */
function save(){
  if(DEMO)return;                       // 見本は書かない
  if(OPEN){ try{localStorage.setItem(DRAFT,JSON.stringify({a:A,course:COURSE&&COURSE.id,at:Date.now()}));}catch(e){} return; }
  clearTimeout(saving);
  saving=setTimeout(()=>{ fetch(API+'/precare',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:T,answers:A,done:false})}).catch(()=>{}); },600);
}
async function finish(){
  if(DEMO||OPEN){ save(); i=SC.length-1; draw(); return; }
  const b=document.getElementById('next'); b.disabled=true; b.textContent='お送りしています…'; applyLang();
  try{
    const r=await fetch(API+'/precare',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:T,answers:A,done:true})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'送れませんでした');
    i=SC.length-1; draw();
  }catch(e){
    const el=document.getElementById('err'); if(el)el.innerHTML=`<div class="err">${esc(e.message)}</div>`;
    b.disabled=false; b.innerHTML='これでお願いします<span class="ar">→</span>'; applyLang();
  }
}

document.getElementById('next').onclick=()=>{
  if(SC[i].confirm)return finish();
  if(i<SC.length-1){i++;draw();}
};
document.getElementById('back').onclick=()=>{ if(i>0){i--;draw();} };

function startDemo(){
  document.body.classList.add('isdemo');
  RESV=DEMO.resv; ALLOW=DEMO.allow; SEASON='summer'; LAST=null; A={};
  const bar=document.createElement('div'); bar.className='demo';
  bar.innerHTML='<b>見本</b>　お客様の画面と同じものです　選んでも保存されません<br>'
    + Object.keys(DEMOS).map(k=>`<a href="?demo=${k}" class="${k===DEMOKEY?'on':''}">${DEMOS[k].label}</a>`).join('');
  document.body.appendChild(bar);
  // ことばを変えても見本のまま切り替えられるよう、押した時点の言語を持っていく
  const as=bar.querySelectorAll('a');
  Object.keys(DEMOS).forEach((k,n)=>{ as[n].onclick=e=>{
    e.preventDefault(); location.search='?demo='+k+(LANG!=='ja'?'&lang='+LANG:''); }; });
  SC=screens(); foot.hidden=false; draw();
}

let COURSE=null;
function startOpen(){
  try{const d=JSON.parse(localStorage.getItem(DRAFT)||'null');
    if(d&&d.a&&Date.now()-d.at<7*86400000){A=d.a;COURSE=COURSES.find(c=>c.id===d.course)||null;}}catch(e){}
  if(COURSE)applyCourse(COURSE);
  SC=screens(); foot.hidden=false; draw();
}
function applyCourse(c){
  COURSE=c; RESV={date:'',start:0,menu:c.name,minutes:c.min,staff:'',name:''};
  ALLOW={parts:c.parts.slice(),skip:[],mode:'full',spotMinutes:0};
  SEASON=(new Date().getMonth()+1>=6&&new Date().getMonth()+1<=9)?'summer':'mid';
}

(async function(){
  if(DEMO) return startDemo();
  if(OPEN) return startOpen();
  if(!T){ app.innerHTML='<div class="err">リンクが正しくありません。ご予約のご案内から開いてください</div>'; applyLang(); return; }
  try{
    const r=await fetch(API+'/precare?t='+encodeURIComponent(T));
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'読み込めませんでした');
    RESV=j.reservation; SEASON=j.season||'mid'; LAST=j.last||null;
    if(j.allow&&Array.isArray(j.allow.parts))ALLOW=j.allow;
    A=(j.answers&&Object.keys(j.answers).length)?j.answers:(LAST?JSON.parse(JSON.stringify(LAST)):{});
    SC=screens();
    foot.hidden=false; draw();
  }catch(e){ app.innerHTML=`<div class="err">${esc(e.message)}</div>`; applyLang(); }
})();
</script>
