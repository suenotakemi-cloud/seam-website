name = "seam-square-pay"
main = "worker.js"
compatibility_date = "2025-01-01"

# 環境変数（公開してよい設定）。秘密鍵はここに書かず `wrangler secret put` で登録する。
[vars]
SQUARE_ENV = "sandbox"          # テスト中は sandbox / 本番は "production"
SQUARE_LOCATION_ID = "L4X65VRZXDMV7"  # 売上集計(/sales)の対象店舗ID（公開OK）。銀座のLocation ID
ALLOW_ORIGIN = "https://suenotakemi-cloud.github.io,http://localhost:3600"   # CORS許可オリジン(カンマ区切り)。*は廃止
# 管理API認証トークンは secret で設定（コミット禁止）: npx wrangler secret put ADMIN_TOKEN
FORWARD_TO = "suenotakemi@gmail.com"  # HPBメールを解析後にここにも転送（承認メール・予約確認も受信可能）
MAIL_FROM = "SEAM 銀座 <yoyaku@seam.site>"  # Resend送信元（seam.site はDKIM認証済み・受信箱に届く）

# salon.town(CUEPON)予約API連携。SALON_SYNC="on"で予約作成時にsalon.townへも同期。
SALON_SYNC = "on"                                 # selftest OK → 本番同期ON

# LINEログイン OAuth2設定（チャネルID: 2010812629）
LINE_LOGIN_CLIENT_ID = "2010812629"
LINE_LOGIN_CALLBACK  = "https://suenotakemi-cloud.github.io/seam-website/booking/line/login/result"
LINE_LOGIN_SUCCESS   = "https://suenotakemi-cloud.github.io/seam-website/booking/index.html"
# シークレットは: npx wrangler secret put LINE_LOGIN_CLIENT_SECRET
SALON_HOST = "https://sugu-api.salon.town"        # SUGUテナント(エンジニア指定 2026-07-19)。本番は https://api.salon.town
SALON_SHOP_ID = "20260720171020808ihahgPA"        # SEAM 銀座 ヘア（及川＋ANZUヘア垢）
SALON_SPA_SHOP_ID = "20260720193503315fjcjHCf"    # SEAM 銀座 SPA（CHIKA＋ANZUスパ垢・spaフラグ時こちらへ）
# スパのサロンボードは「設備(個室)」が必須項目 → 予約のinfo_js.hbp_facilityに割当部屋を載せる。
# 名前はサロンボードの設備プルダウンと完全一致必須。部屋が複数あればカンマ区切り(例 "個室A,個室B")。
SPA_ROOMS = "個室A,個室B"   # オーナー確認済(2026-07-26): スパの設備プルダウンはA/Bの2部屋のみ
# SALON_ACCOUNT_ID = ""                            # 予約者アカウント(未設定ならログインアカウント)
# 認証(secret・未設定ならtest空ログイン): npx wrangler secret put SALON_LOGIN_ID / SALON_PASS

# 秘密鍵は下記コマンドで登録（wrangler.toml には絶対に書かない）:
#   npx wrangler secret put SQUARE_ACCESS_TOKEN
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN

# Workers AI（海外のお客様の自由記入を日本語にする用）
# 外部のAPIキーを預からずに済むので、鍵がブラウザやiPadに渡ることがない
[ai]
binding = "AI"

# D1データベース（予約永続化・HPBメール取込・リマインドCron用）
# 1) npx wrangler d1 create seam-booking  → 出力の database_id を下に貼る
# 2) npx wrangler d1 execute seam-booking --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "seam-booking"
database_id = "70f51a30-132e-4113-9fbc-f48cc5a0aea0"

# メール転送バインディング（hpb@seam.site → suenotakemi@gmail.com 転送用）
[[send_email]]
name = "SEND_EMAIL"
destination_address = "suenotakemi@gmail.com"

# 前日リマインドの自動送信（毎朝9時 JST = 0時 UTC）
[triggers]
crons = ["0 0 * * *"]
