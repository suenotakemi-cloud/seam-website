<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>今日のお客様｜SEAM GINZA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   SEAM 銀座 — 担当者が読む「今日のご希望」

   ★2つの場面で使う。求めるものが違う。
     したく（接客前）… 何を用意するか。部屋・灯り・音楽・飲みもの
     施術中          … 手が濡れていて 部屋は暗い。触ってはいけない所と強さだけ

   ★施術中は暗い個室で腕の長さから見る。だから
     ・地を暗くする（明るい画面は個室で浮く・お客様のまぶたにも入る）
     ・字を大きく、押す所を減らす
     ・スクロールさせない（1画面に収める）
   ★いちばん上は必ず「触れない・苦手」。安全に関わることから読ませる。
   ══════════════════════════════════════════════════════════════ */
:root{--ink:#16171B;--body:#4A4741;--sub:#7C776E;--cream:#F7F4EE;--line:#E3DCD0;--clay:#A87456;--jade:#1F2A27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--cream);color:var(--body);
  font-family:'Noto Sans JP',-apple-system,sans-serif;font-size:15px;line-height:1.8}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:10;background:rgba(247,244,238,.96);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:'Noto Serif JP',serif;letter-spacing:.24em;font-size:14px;color:var(--ink)}
.day{font-size:13px;color:var(--sub);margin-left:auto}
h1{font-family:'Noto Serif JP',serif;font-weight:500;font-size:21px;margin:22px 0 4px;color:var(--ink)}
.lead{font-size:13px;color:var(--sub);margin:0 0 14px}
/* 一覧 */
.g{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;
  display:flex;gap:13px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.card .t{font-family:'Noto Serif JP',serif;font-size:19px;color:var(--ink);flex:0 0 62px}
.card .n{font-weight:500;color:var(--ink);font-size:16px}
.card .m{font-size:12.5px;color:var(--sub);margin-top:1px}
.tag{margin-left:auto;font-size:11.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.on{background:rgba(168,116,86,.12);color:var(--clay);border:1px solid rgba(168,116,86,.3)}
.tag.off{background:#F1EEE8;color:var(--sub);border:1px solid var(--line)}
/* 書きおき済＝翌朝の便りが用意できている印 */
.tag.wr{background:rgba(31,42,39,.1);color:var(--jade);border:1px solid rgba(31,42,39,.28)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--sub);font-size:13.5px}
.err{background:#fdeceb;border:1px solid #f5c6c2;color:#a3271f;border-radius:12px;padding:13px 14px;font-size:13.5px;margin-top:14px}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font:inherit;
  font-size:13px;color:var(--sub);cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=password]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:15px}

/* ══ 1人分の画面（暗い地） ══ */
#one{position:fixed;inset:0;z-index:60;background:#12100E;color:#EFE9DF;display:none;flex-direction:column}
#one.on{display:flex}
.obar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(239,233,223,.14);flex:0 0 auto}
.obar .nm{font-family:'Noto Serif JP',serif;font-size:19px;color:#fff}
.obar .tm{font-size:13px;color:rgba(239,233,223,.6)}
.obar button{margin-left:auto;background:none;border:1px solid rgba(239,233,223,.3);color:#EFE9DF;
  border-radius:8px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:12px 16px 0;flex:0 0 auto}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:1 0 auto;background:none;border:1px solid rgba(239,233,223,.24);color:rgba(239,233,223,.72);
  border-radius:999px;padding:11px 15px;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#EFE9DF;color:#12100E;border-color:#EFE9DF}
.opane{flex:1;overflow-y:auto;padding:14px 16px 30px}
.mood{background:rgba(201,182,142,.12);border:1px solid rgba(201,182,142,.4);
  border-radius:14px;padding:14px 16px}
.mood h3{color:#C9B68E}
/* ── 練習（施設利用時間）── */
.prbox{background:#F3F0EA;border:1px solid #E2DACB;border-radius:14px;padding:14px 15px;margin:0 0 16px}
.pr-h{font-size:12px;font-weight:700;color:#7a6f60;margin-bottom:9px}
.pr-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pr-b{background:#fff;border:1px solid #ddd5c8;border-radius:10px;padding:12px 8px;
  font:inherit;font-size:13.5px;color:#2f2a24;cursor:pointer}
.pr-b.line{grid-column:1/-1;background:none}
.pr-on{display:flex;align-items:center;gap:12px}
.pr-on b{font-family:'Noto Serif JP',serif;font-size:30px;color:#12100E}
.pr-on span{flex:1;font-size:13px;color:#7a6f60}
.pr-on .pr-b{background:#12100E;color:#fff;border-color:#12100E;padding:12px 18px}
/* ── モデル募集 ── */
.md-new{display:inline-block;background:#B4302B;color:#fff;border-radius:9px;
  padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px}
.md-a{background:#fff;border:1px solid #ece5d9;border-radius:11px;padding:11px 12px;margin-top:7px}
.md-a .n{font-size:15px;font-weight:700}
.md-a .s{font-size:12px;color:#8a8177;line-height:1.75;margin-top:2px}
.md-a .c{font-size:13px;margin-top:5px;word-break:break-all}
.md-btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.md-btns button{flex:1;min-width:88px;background:#fff;border:1px solid #ddd5c8;border-radius:9px;
  padding:9px 6px;font:inherit;font-size:12.5px;color:#2f2a24;cursor:pointer}
.md-btns button.on{background:#12100E;color:#fff;border-color:#12100E}
.md-st{font-size:11.5px;color:#a08c6a;font-weight:700}
/* ── そろそろの方 ── */
.sn-a{background:#fff;border:1px solid #ece5d9;border-radius:11px;padding:11px 12px;margin-top:7px}
.sn-a .n{font-size:15.5px;font-weight:700}
.sn-a .m{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.sn-a .d{font-size:12px;color:#8a8177;font-weight:600;white-space:nowrap}
.sn-a .no{font-size:10.5px;color:#B4302B;font-weight:800;border:1px solid #f0cdcb;
  border-radius:7px;padding:1px 6px;white-space:nowrap}
.sn-a .ok{margin-left:auto;background:none;border:1px solid #ddd5c8;border-radius:9px;padding:8px 12px;
  font:inherit;font-size:12.5px;color:#2f2a24;cursor:pointer;white-space:nowrap}
.sn-t{font-size:11.5px;color:#7a6f60;font-weight:700;margin:12px 0 0}
/* ── 一覧に出す時間 ──
   ★施術中は「あと何分か」だけが要る。数字が大きいほど、目を離さずに読める。
     こえたら色を変える。読まなくても分かる状態にしておく。 */
.tmz{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;
  font-size:12.5px;color:#7a6f60;font-weight:600}
.tmz b{font-size:15px;font-weight:800;color:#12100E}
.tmz .ok{color:#0c7a41}
.tmz .ng{color:#B4302B}
.tmz .yet{color:#a49a8c;font-weight:600}
.card.now{border-color:#12100E;box-shadow:0 0 0 2px rgba(18,16,14,.08)}
/* ── 練習の記録 ── */
.prform{padding:4px 0 30px}
.pf-h{font-family:'Noto Serif JP',serif;font-size:22px;color:#12100E;margin:8px 0 16px}
.pf-l{display:block;font-size:12px;letter-spacing:.1em;color:#7a6f60;margin:16px 0 6px;font-weight:600}
.prform .kin{background:#fff;border:1px solid #ddd5c8;color:#2f2a24}
.prform .kchip{border-color:#ddd5c8;color:#4a443c}
.prform .kchip.on{background:#12100E;color:#fff;border-color:#12100E}
.prform .kmix{background:#F3F0EA;border-color:#E2DACB}
.prform .kmix input,.prform .kmix select{background:#fff;border-color:#ddd5c8;color:#2f2a24}
.prform .kag span,.prform .kmh b{color:#2f2a24}
.prform .kbtn{border-color:#ddd5c8;color:#4a443c}
.prform .hint{color:#8a8177}
.prform .matbox{background:#F3F0EA;border-color:#E2DACB}
.prform .matbox.hi{background:#FCEFEA;border-color:#E0A896}
.prform .mat-l,.prform .mat-s{color:#7a6f60}
.prform .mat-n{color:#12100E}
.pfimgs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pfimg{display:grid;place-items:center;aspect-ratio:1;background:#fff;border:1px dashed #ddd5c8;
  border-radius:12px;overflow:hidden;cursor:pointer}
.pfimg img{width:100%;height:100%;object-fit:cover}
.pfimg span{font-size:13px;color:#8a8177}
/* ── 材料費（塗っているその場で見せる）── */
.matbox{background:rgba(239,233,223,.06);border:1px solid rgba(239,233,223,.22);
  border-radius:13px;padding:14px 16px;margin:14px 0}
.matbox.hi{background:rgba(211,110,98,.16);border-color:rgba(211,110,98,.55)}
.mat-l{font-size:11.5px;letter-spacing:.12em;color:rgba(239,233,223,.5)}
.mat-n{font-family:'Noto Serif JP',serif;font-size:30px;color:#fff;line-height:1.2;margin:3px 0}
.mat-s{font-size:12.5px;color:rgba(239,233,223,.6);line-height:1.7}
.matbox.hi .mat-s b{color:#FFD9D2}
/* ── 時間（終わりの予定まで あと何分か） ── */
.tbig{background:rgba(239,233,223,.06);border:1px solid rgba(239,233,223,.22);
  border-radius:16px;padding:18px;text-align:center;margin-bottom:4px}
.tbig.ng{background:rgba(211,60,45,.16);border-color:rgba(232,96,80,.8)}
.tb-l{font-size:12px;letter-spacing:.14em;color:rgba(239,233,223,.5)}
.tb-n{font-family:'Noto Serif JP',serif;font-size:38px;line-height:1.2;color:#fff;margin:6px 0 4px}
.tbig.ng .tb-n{color:#FFD9D2}
.tb-s{font-size:12.5px;color:rgba(239,233,223,.55);line-height:1.7}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tbtn{background:none;border:1px solid rgba(239,233,223,.26);border-radius:12px;
  padding:14px 10px;font:inherit;color:#EFE9DF;cursor:pointer;text-align:center}
.tbtn b{display:block;font-size:16px;font-weight:600}
.tbtn span{display:block;font-size:12px;color:rgba(239,233,223,.5);margin-top:3px}
.tbtn.on{background:#EFE9DF;color:#12100E;border-color:#EFE9DF}
.tbtn.on span{color:rgba(18,16,14,.6)}
.soak{text-align:center;border:1px solid rgba(239,233,223,.26);border-radius:14px;padding:18px}
.soak.ng{background:rgba(211,60,45,.18);border-color:rgba(232,96,80,.85)}
.sk-n{font-family:'Noto Serif JP',serif;font-size:46px;color:#fff;line-height:1}
.sk-s{font-size:13px;color:rgba(239,233,223,.6);margin:6px 0 12px}
/* 推薦度のQR。読み取る側がお客様なので、大きめに白地で出す */
.npsqr{text-align:center;margin-top:14px}
.npsqr img{width:210px;height:210px;background:#fff;padding:10px;border-radius:12px}
.npsqr p{font-size:13px;color:rgba(239,233,223,.65);line-height:1.7;margin-top:9px}
/* ── 自分の数字（推薦者をいちばん大きく）── */
/* ★この帯は「今日のお客様」の明るい画面に出る。暗い画面の色を使うと読めない。 */
.mecard{background:#FFF7EC;border:1px solid #E9CFA6;border-radius:16px;padding:18px 18px 16px;margin:6px 0 16px}
.me-h{font-size:12px;letter-spacing:.14em;color:#A9722F;font-weight:700}
.me-hero{display:flex;align-items:center;gap:14px;margin:10px 0 4px}
.me-n{font-family:'Noto Serif JP',serif;font-size:54px;line-height:1;color:#12100E;font-weight:500}
.me-l{font-size:15px;line-height:1.55;color:#3f3a33;font-weight:600}
.me-sub{font-size:12.5px;color:#8a8177;line-height:1.7;margin-top:6px}
.me-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;
  padding-top:14px;border-top:1px solid #E9CFA6}
.me-c{text-align:center}
.me-c b{display:block;font-size:19px;color:#12100E;font-weight:700}
.me-c span{display:block;font-size:11px;color:#8a8177;margin-top:3px}
/* ── 申し送り（いちばん上・読むまで消えない）── */
/* ★この帯は「今日のお客様」の明るい画面の上に出る。
   暗い画面の色をそのまま使うと、本文が読めない。 */
.noti{margin:6px 0 18px}
.noti-h{font-size:12px;letter-spacing:.14em;color:#A9722F;margin-bottom:9px;font-weight:700}
.noti-c{background:#FFF7EC;border:1px solid #E9CFA6;border-radius:14px;padding:15px 16px;margin-bottom:9px}
.noti-t{font-size:18px;font-weight:700;color:#12100E;line-height:1.5}
.noti-b{font-size:15px;color:#4a443c;line-height:1.75;margin-top:5px;white-space:pre-wrap}
.noti-m{font-size:12px;color:#8a8177;margin-top:7px}
.noti-ok{width:100%;margin-top:11px;background:#12100E;border:0;color:#fff;
  border-radius:11px;padding:13px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
/* ── カルテ（暗い画面で、指で押せる大きさに）── */
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{background:none;border:1px solid rgba(239,233,223,.28);color:rgba(239,233,223,.85);
  border-radius:999px;padding:11px 15px;font:inherit;font-size:15px;cursor:pointer}
.kchip.on{background:#EFE9DF;color:#12100E;border-color:#EFE9DF;font-weight:600}
.kmix{border:1px solid rgba(239,233,223,.2);border-radius:12px;padding:11px 12px;margin-bottom:10px;
  background:rgba(239,233,223,.04)}
.kmh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kmh select{flex:0 0 118px;width:auto}
.kmh b{flex:1;font-size:13px;color:rgba(239,233,223,.75);font-weight:600;white-space:nowrap}
.kmh button,.kag button{background:none;border:0;color:rgba(239,233,223,.5);font-size:16px;
  padding:4px 6px;cursor:pointer}
/* ★「アッシュとマットを混ぜている」ことが目で分かるようにする。
   薬剤が縦に並んでいるだけだと、別々に塗ったのか混ぜたのかが読めない。
   行と行のあいだに ＋ を置き、上に出来上がりの式を出す。 */
.kag{display:grid;grid-template-columns:1fr 78px 34px;gap:7px;align-items:center;margin-bottom:6px;
  position:relative}
.kag+.kag{margin-top:14px}
.kag+.kag::before{content:'＋';position:absolute;left:2px;top:-15px;
  font-size:15px;font-weight:700;color:rgba(239,233,223,.6);line-height:1}
.kag span{font-size:16px;color:#fff;line-height:1.35}
.kfx{font-size:14px;color:#EFE9DF;line-height:1.65;background:rgba(239,233,223,.07);
  border:1px solid rgba(239,233,223,.16);border-radius:9px;padding:8px 11px;margin-bottom:9px;
  word-break:break-word}
.kfx b{color:#fff;font-weight:700}
.kfx i{font-style:normal;color:rgba(239,233,223,.6);margin:0 4px}
.kfx .none{color:rgba(239,233,223,.45);font-size:13px}
.kmix input,.kmix select,.kin{width:100%;background:#1B1815;border:1px solid rgba(239,233,223,.22);
  border-radius:10px;color:#EFE9DF;font:inherit;font-size:16px;padding:10px 11px}
.kml{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px;
  font-size:10.5px;color:rgba(239,233,223,.45);font-weight:600}
.kmb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:2px}
.kvoice{width:100%;margin:0 0 10px;background:#EFE9DF;color:#12100E;border:0;border-radius:12px;
  padding:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.kvoice.on{background:#B4302B;color:#fff}
.kvlive{display:none;font-size:14px;line-height:1.7;color:#EFE9DF;background:rgba(239,233,223,.08);
  border:1px solid rgba(239,233,223,.2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.kvmsg{font-size:12.5px;color:#C9B79A;line-height:1.7;margin:0 0 10px}
.kvhint{font-size:12px;color:rgba(239,233,223,.5);line-height:1.8;margin:0 0 10px}
.kscrow{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:2px;align-items:center}
.kcam{background:#EFE9DF;color:#12100E;border:0;border-radius:10px;padding:11px 13px;
  font:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer}
/* カメラ。読めたら閉じる。枠を出して「ここに合わせる」を分かるようにする */
.cam{position:fixed;inset:0;background:#000;z-index:999;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .frame{position:absolute;left:8%;right:8%;top:34%;height:22%;
  border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.cam .msg{position:absolute;left:0;right:0;top:calc(34% + 22% + 16px);text-align:center;
  color:#fff;font-size:14px;line-height:1.8;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cam .close{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));
  margin:0 auto;width:70%;background:#fff;color:#12100E;border:0;border-radius:12px;
  padding:15px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.kbtn{width:100%;margin-top:8px;background:none;border:1px solid rgba(239,233,223,.3);
  color:#EFE9DF;border-radius:11px;padding:12px;font:inherit;font-size:15px;cursor:pointer}
.sec{margin-top:18px}
.sec:first-child{margin-top:6px}
.sec h3{font-size:12px;letter-spacing:.14em;color:rgba(239,233,223,.5);margin:0 0 8px;font-weight:500}
.big{font-family:'Noto Serif JP',serif;font-size:26px;line-height:1.5;color:#fff;margin:0}
.mid{font-size:19px;line-height:1.7;color:#fff;margin:0}
/* ★触れない・苦手はいちばん強く出す */
.stop{background:rgba(211,110,98,.16);border:1px solid rgba(211,110,98,.5);border-radius:14px;padding:14px 16px}
.stop h3{color:#F0A79C}
.stop .mid{color:#FFD9D2;font-weight:500}
/* ★アレルギーはいちばん強い赤。苦手（薄い赤）と一段はっきり分ける */
.alrg{background:rgba(211,60,45,.2);border:2px solid rgba(232,96,80,.85);border-radius:14px;padding:14px 16px}
.alrg h3{color:#FFB0A4;font-weight:700;letter-spacing:.2em}
.alrg .mid{color:#FFE2DC;font-weight:700;font-size:22px}
.algsub{font-size:14px;color:#FFC0B6;margin:6px 0 0}
.okrg{background:rgba(120,170,140,.13);border:1px solid rgba(140,200,165,.4);border-radius:14px;padding:12px 16px}
.okrg h3{color:#A9D6BA}
.okv{font-size:16px;color:#CDE8D8;margin:0}
.plist{display:grid;gap:8px}
.pr{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid rgba(239,233,223,.1)}
.pr:last-child{border-bottom:0}
.pr b{flex:0 0 96px;font-weight:500;font-size:17px;color:#fff}
.pr span{font-size:19px;color:#EFE9DF}
.pr i{font-style:normal;font-family:'Noto Serif JP',serif;font-size:15px;color:rgba(239,233,223,.55);margin-left:2px}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(239,233,223,.16);overflow:hidden;min-width:90px}
.bar u{display:block;height:100%;text-decoration:none;border-radius:99px;background:linear-gradient(90deg,#DE9E92,#C79A45)}
.kv{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(239,233,223,.1)}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 96px;font-weight:500;font-size:15px;color:rgba(239,233,223,.62)}
.kv span{font-size:19px;color:#fff}
.note{background:rgba(239,233,223,.07);border-radius:12px;padding:13px 15px;font-size:16px;line-height:1.85;color:#EFE9DF}
.none{color:rgba(239,233,223,.4);font-size:15px}
/* ══ おわりに（施術のあと1行だけ書く） ══
   ★お客様に届く一行と、店内のメモは必ず分ける。
     欄がひとつだと、お見せできないことがそのままLINEに出てしまう。 */
.wbox{background:rgba(239,233,223,.07);border-radius:14px;padding:14px 15px;margin-top:10px}
.wbox label{display:block;font-size:12px;letter-spacing:.1em;color:rgba(239,233,223,.55);margin-bottom:7px}
.wbox textarea{width:100%;background:#1B1815;border:1px solid rgba(239,233,223,.22);border-radius:11px;
  color:#EFE9DF;font:inherit;font-size:17px;line-height:1.75;padding:12px 13px;resize:vertical;min-height:92px}
.wbox textarea:focus{outline:none;border-color:#C79A45}
.wbox .cnt{font-size:11.5px;color:rgba(239,233,223,.4);text-align:right;margin-top:5px}
.wbox.priv textarea{min-height:66px;font-size:15px}
.wbox.priv label{color:rgba(239,233,223,.42)}
.hint{font-size:13px;line-height:1.8;color:rgba(239,233,223,.55);margin:6px 0 0}
.ex{font-size:14px;line-height:1.8;color:rgba(239,233,223,.72);background:rgba(199,154,69,.1);
  border-left:2px solid rgba(199,154,69,.5);border-radius:0 10px 10px 0;padding:10px 13px;margin-top:9px}
.save{width:100%;margin-top:16px;background:#EFE9DF;color:#12100E;border:0;border-radius:999px;
  padding:15px;font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.save:disabled{opacity:.45}
.mini2{background:none;border:1px solid rgba(239,233,223,.32);color:#EFE9DF;border-radius:999px;
  padding:12px 20px;font:inherit;font-size:15px;cursor:pointer;margin-top:10px}

/* ══ 譜面 ══
   ★楽譜に見せるための3つ：左端に通し番号（小節）、縦の1本線、そして余白。
     詰めると手順書に戻ってしまうので、行間はふつうより広く取る。 */
.scn{font-size:13px;line-height:1.85;color:rgba(239,233,223,.55);margin:0}
.staff5{margin-top:14px;position:relative;padding-left:2px}
/* 五線の代わりに 1本の縦線を通す＝ここが譜面の背骨 */
.staff5::before{content:'';position:absolute;left:19px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,rgba(239,233,223,.22) 8%,rgba(239,233,223,.22) 92%,transparent)}
.mv{position:relative;padding:0 0 22px 44px}
.mv:last-child{padding-bottom:6px}
.mvh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
/* 小節番号＝譜面の左肩にある数字 */
.mv .bar{position:absolute;left:8px;width:23px;height:23px;border-radius:50%;
  border:1px solid rgba(239,233,223,.3);background:#12100E;color:rgba(239,233,223,.6);
  font-size:12px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mv .tm{font-family:'Noto Serif JP',serif;font-size:17px;color:#EFE9DF;font-variant-numeric:tabular-nums}
.mv .nm{font-family:'Noto Serif JP',serif;font-size:19px;color:#fff}
.mv .ital{font-size:13px;color:rgba(239,233,223,.55);margin:-4px 0 8px}
.mv .ital em{font-style:italic;font-size:11.5px;color:rgba(239,233,223,.3);
  letter-spacing:.06em;margin-left:9px}
.mv .nm{white-space:nowrap}
.mv .ck{margin-left:auto;flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(239,233,223,.28);background:none;color:rgba(239,233,223,.35);
  font-size:15px;cursor:pointer;line-height:1}
.mv.done .bar{background:#9ED2AE;border-color:#9ED2AE;color:#12100E}
.mv.done .ck{background:#9ED2AE;border-color:#9ED2AE;color:#12100E}
.mv.done .nm,.mv.done .tm{color:rgba(239,233,223,.45)}
.mv.done .line{opacity:.4}
.line{display:flex;gap:12px;margin-top:8px}
.line b{flex:0 0 52px;font-size:11.5px;letter-spacing:.12em;font-weight:500;padding-top:4px}
.line ul{margin:0;padding-left:17px}
.line li{font-size:16.5px;line-height:1.85;color:#EFE9DF;margin-bottom:3px}
/* 声がけ＝旋律、心遣い＝伴奏。色で役割を分ける */
.line.say b{color:#E2C27A}
.line.say li::marker{color:rgba(226,194,122,.7)}
.line.care b{color:#A9C4E8}
.line.care li{color:rgba(239,233,223,.86);font-size:16px}
.line.care li::marker{color:rgba(169,196,232,.7)}
.mv .dur{font-size:12px;color:rgba(239,233,223,.42);border:1px solid rgba(239,233,223,.2);
  border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
/* ★いま演奏している楽章。練習モードのときだけ光る */
.mv.now{background:rgba(199,154,69,.07);border-radius:14px;margin-left:-8px;padding-left:52px}
.mv.now .bar{background:#C79A45;border-color:#C79A45;color:#12100E}
.mv.now .nm{color:#F2E3C0}
/* ══ 練習モード ══ 本番と間違えないよう 見た目をはっきり変える */
.reh{border:1px dashed rgba(239,233,223,.3);border-radius:14px;padding:14px 15px;margin-top:12px}
.rehh{font-size:13px;letter-spacing:.1em;color:#EFE9DF}
.rehh i{font-style:normal;font-size:12px;color:#F0A79C}
.rehd{font-size:12.5px;line-height:1.8;color:rgba(239,233,223,.5);margin:6px 0 0}
.rehT{font-family:'Noto Serif JP',serif;font-size:34px;color:#fff;margin-top:10px;font-variant-numeric:tabular-nums}
.rehT s{text-decoration:none;font-size:14px;color:rgba(239,233,223,.45);margin-left:8px}
.rehN{font-size:17px;color:#F2E3C0;margin-top:2px}
.rehN i{font-style:normal;font-size:13px;color:rgba(239,233,223,.5);margin-left:10px}
.rehP{height:6px;border-radius:99px;background:rgba(239,233,223,.14);overflow:hidden;margin-top:9px}
.rehP i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A88C,#C79A45)}
.rehb{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.rehb button{flex:1 0 auto;background:none;border:1px solid rgba(239,233,223,.3);color:#EFE9DF;
  border-radius:999px;padding:11px 14px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.rehb button.stop{border-color:rgba(240,167,156,.5);color:#F0A79C}
/* ★本番の合図は 練習と取り違えないよう 枠を実線にして色を分ける */
.reh.sig{border-style:solid;border-color:rgba(199,154,69,.4);background:rgba(199,154,69,.05)}
.sigT{font-family:'Noto Serif JP',serif;font-size:30px;color:#fff;margin-top:10px;font-variant-numeric:tabular-nums}
.sigN{font-size:15px;color:rgba(239,233,223,.7);margin-top:2px}
.sigN b{color:#F2E3C0}
.sigL{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.sigL span{font-size:12px;border:1px solid rgba(239,233,223,.22);border-radius:999px;
  padding:4px 10px;color:rgba(239,233,223,.45)}
.sigL span.on{border-color:#9ED2AE;color:#9ED2AE}
.saved{text-align:center;font-size:13.5px;color:#9ED2AE;margin-top:10px;min-height:20px}
@media(min-width:700px){.big{font-size:30px}.pr span,.kv span{font-size:21px}}
</style>
</head>
<body>
<header><div class="hin"><span class="brand">S E A M</span><span class="day" id="day"></span></div></header>
<div class="wrap" id="app"><p class="lead" style="margin-top:24px">読み込んでいます…</p></div>

<div id="one">
  <div class="obar"><span class="nm" id="onm"></span><span class="tm" id="otm"></span>
    <button id="oclose">とじる</button></div>
  <div class="tabs">
    <button data-t="prep" class="on">したく</button>
    <button data-t="score" id="tab-score">譜面</button>
    <button data-t="care">施術中</button>
    <button data-t="after">おわりに</button>
    <button data-t="time">時間</button>
    <button data-t="karte">カルテ</button>
  </div>
  <div class="opane" id="opane"></div>
</div>

<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
/* 一人ひとりでログインする。カルテに残る名前は、このログインから取る。
   端末を共有していても「誰が書いたか」が本物になる。
   ★サーバーへは ?stok=<自分の札> を必ず付ける（みんなで同じ管理トークンは使わない）。 */
let TOK=localStorage.getItem('stb_staff_tok')||'';
let ME={id:localStorage.getItem('stb_staff_id')||'',name:localStorage.getItem('stb_staff_nm')||''};
const U=(path)=>API+path+(path.indexOf('?')>=0?'&':'?')+'stok='+encodeURIComponent(TOK);
const H=()=>({'Content-Type':'application/json'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const todayKey=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const q=new URLSearchParams(location.search);
const DAY=q.get('d')||todayKey();
document.getElementById('day').textContent=DAY.replace(/-/g,'/');

const app=document.getElementById('app');
let ROWS=[];

async function load(){
  if(!TOK)return askToken();
  app.innerHTML='<p class="lead" style="margin-top:24px">読み込んでいます…</p>';
  try{
    const r=await fetch(U(`/precare/list?from=${DAY}&to=${DAY}`));
    if(r.status===401||r.status===403){TOK='';localStorage.removeItem('stb_staff_tok');return askToken('もう一度お願いします');}
    const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
    ROWS=j.rows||[]; await Promise.all([loadNoti(),loadMe(),prLoad(),mdLoad(),snLoad(),tmdLoad()]); render();
  }catch(e){ app.innerHTML=`<div class="err">読み込めませんでした: ${esc(e.message)}</div>`; }
}
async function askToken(msg){
  app.innerHTML=`<h1>ログイン</h1><p class="lead">読み込んでいます…</p>`;
  let list=[];
  try{ const r=await fetch(`${API}/staff/list`); const j=await r.json(); list=j.staff||[]; }catch(e){}
  if(!list.length){
    app.innerHTML=`<h1>ログイン</h1>
      <p class="lead">まだ暗証番号が決まっていません<br>
        レジの画面の「設定 → スタッフの暗証番号」で、ひとりずつ3桁を決めてください</p>`;
    return;
  }
  app.innerHTML=`<h1>ログイン</h1>
    <p class="lead">自分を選んで、3桁の暗証番号を入れてください${msg?'　'+esc(msg):''}</p>
    <div class="g">${list.map(x=>`<button class="card" data-s="${esc(x.id)}" data-n="${esc(x.name)}">
      <span class="t">　</span><span><span class="n">${esc(x.name)}</span></span></button>`).join('')}</div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>pinStep(b));
  /* ★自分だけのQRから開いたときは、名前を選ぶところを飛ばす。
     フロアで開くたびに一覧から自分を探すのは、毎日効いてくる手間。 */
  {const q=(new URLSearchParams(location.search).get('s')||'').replace(/[^a-z0-9_-]/gi,'');
   const me=q&&app.querySelector(`[data-s="${q}"]`);
   if(me)pinStep(me);}
}
function pinStep(b){
  {
    app.innerHTML=`<h1>${esc(b.dataset.n)}</h1>
      <p class="lead" id="lmsg">暗証番号（3桁）</p>
      <div class="row"><input type="password" id="pin" inputmode="numeric" maxlength="3"
        placeholder="＿＿＿" style="text-align:center;letter-spacing:.4em;font-size:22px">
        <button class="mini" id="pingo">入る</button></div>
      <p class="lead"><button class="mini" id="back">ひとつ戻る</button></p>`;
    const el=document.getElementById('pin'); el.focus();
    const go=async()=>{
      const v=(el.value||'').replace(/[^0-9]/g,'');
      if(v.length!==3){document.getElementById('lmsg').textContent='3桁の数字を入れてください';return;}
      try{
        const r=await fetch(`${API}/staff/login`,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({staffId:b.dataset.s,pass:v})});
        const j=await r.json();
        if(!r.ok||!j.ok)throw new Error(j.error||'入れませんでした');
        TOK=j.token; ME={id:j.staffId,name:j.name||b.dataset.n};
        localStorage.setItem('stb_staff_tok',TOK);
        localStorage.setItem('stb_staff_id',ME.id);
        localStorage.setItem('stb_staff_nm',ME.name);
        load();
      }catch(e){ document.getElementById('lmsg').textContent=e.message; el.value=''; el.focus(); }
    };
    document.getElementById('pingo').onclick=go;
    el.onkeydown=e=>{if(e.key==='Enter')go();};
    document.getElementById('back').onclick=()=>askToken();
  }
}

/* ── 申し送り ──
 * LINEは次の日には流れて消える。ここは消えない。読んだ人も残る。 */
let NOTI=[];
/* QRの部品。使うときだけ読む */
let _qrlibP=null;
function loadQRlib(){
  if(window.qrcode)return Promise.resolve();
  if(_qrlibP)return _qrlibP;
  _qrlibP=new Promise((res,rej)=>{const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    s2.onload=res;s2.onerror=res;document.head.appendChild(s2);});
  return _qrlibP;
}
async function loadNoti(){
  try{ const r=await fetch(U('/notices')); const j=await r.json(); NOTI=j.rows||[]; }catch(e){ NOTI=[]; }
}
function notiHtml(){
  const yet=NOTI.filter(x=>!x.done&&!x.自分は読んだ);
  if(!yet.length)return '';
  return `<div class="noti">
    <div class="noti-h">読んでいない申し送り ${yet.length}件</div>
    ${yet.map(x=>`<div class="noti-c" data-n="${esc(x.id)}">
      <div class="noti-t">${x.pinned?'📌 ':''}${esc(x.title)}</div>
      ${x.body?`<div class="noti-b">${esc(x.body)}</div>`:''}
      <div class="noti-m">${esc(x.by||'')}${x.due?`　${esc(x.due)}まで`:''}</div>
      <button class="noti-ok" data-ok="${esc(x.id)}">読みました</button>
    </div>`).join('')}
  </div>`;
}
function notiWire(){
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent='…';
    try{
      await fetch(U('/notices/read'),{method:'POST',headers:H(),body:JSON.stringify({id:b.dataset.ok})});
      const n=NOTI.find(x=>x.id===b.dataset.ok); if(n)n.自分は読んだ=true;
      render();
    }catch(e){ b.disabled=false; b.textContent='読みました'; }
  });
}
/* ── 自分の数字 ──
 * ★いちばん上に「推薦してくださった方」を置く。売上より先に。
 *   売上は月末にしか動かないが、推薦者は今日の1人で1人増える。
 *   自分を求めて来てくださる方が何人いるか。ここが見えると、仕事が続く。 */
let ME_NUM=null;
async function loadMe(){
  try{ const r=await fetch(`${API}/staff/me?token=${encodeURIComponent(TOK)}`);
    const j=await r.json(); ME_NUM=j&&j.ok?j:null; }catch(e){ ME_NUM=null; }
}
/* ── 練習（施設利用時間）──
 * ★これは労働時間ではない。自主的に施設を使った時間として、そのまま残す。
 *   紙に書かせると必ず抜けるので、終わったその場でスマホから押す。
 *   こちらで勝手に丸めない（丸めると届け出に使えなくなる）。 */
let PR=null, PRON=null;
async function prLoad(){
  try{ const r=await fetch(U('/practice')); const j=await r.json(); PR=j&&j.ok?j:null; }catch(e){ PR=null; }
  try{ PRON=JSON.parse(localStorage.getItem('stb_practice_on')||'null'); }catch(e){ PRON=null; }
}
function prHtml(){
  if(!PR)return '';
  const g=PR.合計||{};
  const now=PRON?Math.max(0,Math.round((Date.now()-PRON.t)/60000)):0;
  return `<div class="prbox">
    <div class="pr-h">練習（施設利用時間）　今月 ${Math.floor((g.分||0)/60)}時間${(g.分||0)%60}分</div>
    ${PRON?`<div class="pr-on"><b>${now}分</b><span>${esc(PRON.kind||'練習中')}</span>
        <button class="pr-b" id="prEnd">終わる</button></div>`
      :`<div class="pr-btns">
        ${['出勤前','退勤後','休みの日'].map(k=>`<button class="pr-b" data-pk="${k}">${k}に始める</button>`).join('')}
        <button class="pr-b line" id="prHand">あとから入れる</button></div>`}
  </div>`;
}
/* ── そろそろの方 ──
 * ★自動のLINEは、LINEに登録された方にしか飛ばない。
 *   登録されていない方は、時期が来ても誰の目にも触れないまま失客する。
 *   そこを埋めるのはこの名簿だけ。だから「LINEなし」を目立たせる。
 * ★出すのは自分のお客様だけ。他の担当のお客様に声をかけると角が立つ。 */
/* ── 一覧の時間 ──
 * ★これまで時間は、お客様を開いて「時間」のタブまで行かないと見えなかった。
 *   施術中に片手で開いて、タブを選んで、では見ない。トップに出す。
 * ★担当で絞らない。ヘルプで付いているアシスタントも、
 *   自分が付いている方の残りが見えないと動けない。 */
let TMD={}, TMTIMER=null;
async function tmdLoad(){
  try{ const r=await fetch(U(`/timeline/day?date=${DAY}`)); const j=await r.json();
    TMD=(j&&j.ok&&j.times)||{}; }catch(e){ TMD={}; }
}
const tmMin=iso=>{ if(!iso)return null; const d=new Date(Date.parse(iso)+9*3600e3);
  return d.getUTCHours()*60+d.getUTCMinutes(); };
/* 1件ぶんの時間の文字。入り／タイムアップ／残り */
function tmzHtml(r){
  const t=TMD[r.id]||{};
  const s0=r.start||0, e0=r.end||(s0+60);
  const arrive=tmMin(t.arrive), start=tmMin(t.start), done=tmMin(t.done);
  const n=nowMin();
  if(done!=null){
    return `<div class="tmz"><span>入り ${arrive!=null?hm(arrive):'—'}</span>
      <span class="ok">おわりました ${hm(done)}</span></div>`;
  }
  if(arrive==null&&start==null){
    return `<div class="tmz"><span class="yet">ご予約 ${hm(s0)}〜${hm(e0)}　まだお見えではありません</span></div>`;
  }
  const room=e0-n;
  return `<div class="tmz">
    <span>入り <b>${hm(arrive!=null?arrive:start)}</b></span>
    <span>タイムアップ <b>${hm(e0)}</b></span>
    <b class="${room<0?'ng':(room<=10?'ng':'ok')}">${room>=0?`あと ${room}分`:`${-room}分 こえています`}</b></div>`;
}
/* ★1分ごとに書き換える。全部を描き直すと、押している途中の指がずれるので
   時間の行だけ差し替える。 */
function tmTick(){
  document.querySelectorAll('[data-tmz]').forEach(el=>{
    const r=ROWS.find(x=>x.id===el.dataset.tmz); if(!r)return;
    el.outerHTML=tmzHtml(r).replace('<div class="tmz"',`<div class="tmz" data-tmz="${r.id}"`);
  });
}
function tmStart(){
  clearInterval(TMTIMER);
  TMTIMER=setInterval(()=>{ if(!document.hidden)tmTick(); },30000);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)tmTick(); });

let SN=null;
async function snLoad(){
  try{ const r=await fetch(U('/soon')); const j=await r.json(); SN=j&&j.ok?j:null; }catch(e){ SN=null; }
}
function snRow(x){
  return `<div class="sn-a" data-sn="${esc(x.key)}">
    <div class="n">${esc(x.name)} 様</div>
    <div class="m">

function prFormWire(){
  if(!PRF)return;
  const f=PRF, $$=id=>document.getElementById(id);
  const bind=(id,k)=>{const el=$$(id); if(el)el.oninput=()=>{f[k]=el.value;};};
  bind('pf-note','note'); bind('pf-mn','modelName'); bind('pf-tc','teacher');
  /* 金額は、入れ終わったところで描き直す（打っている途中で消えないように） */
  if($$('pf-mf'))$$('pf-mf').onchange=()=>{f.modelFee=$$('pf-mf').value;render();};
  if($$('pf-mf'))$$('pf-mf').oninput=()=>{f.modelFee=$$('pf-mf').value;};
  if($$('pf-hm'))$$('pf-hm').onclick=()=>{f.hasModel=true;render();};
  if($$('pf-nm'))$$('pf-nm').onclick=()=>{f.hasModel=false;render();};
  document.querySelectorAll('[data-pfm]').forEach(x=>x.onclick=()=>{f.feeMethod=x.dataset.pfm;render();});
  if($$('pf-fr'))$$('pf-fr').onclick=()=>{f.feeInReg=true;render();};
  if($$('pf-fk'))$$('pf-fk').onclick=()=>{f.feeInReg=false;render();};
  if($$('pf-nb'))$$('pf-nb').onclick=()=>{f.nextBooked=true;render();};
  if($$('pf-nn'))$$('pf-nn').onclick=()=>{f.nextBooked=false;render();};
  if($$('pf-add'))$$('pf-add').onclick=()=>{f.mix.push({where:'全体',agents:[],oxy:'',oxyG:'',min:''});render();};
  document.querySelectorAll('[data-pdm]').forEach(x=>x.onclick=()=>{f.mix.splice(+x.dataset.pdm,1);render();});
  document.querySelectorAll('[data-pda]').forEach(x=>x.onclick=()=>{
    const [i,j]=x.dataset.pda.split(':').map(Number); f.mix[i].agents.splice(j,1); render();});
  document.querySelectorAll('.kg[data-pi]').forEach(el=>el.onchange=()=>{
    const i=+el.dataset.pi,j=+el.dataset.pj; if(f.mix[i]&&f.mix[i].agents[j])f.mix[i].agents[j].g=+el.value||''; render();});
  document.querySelectorAll('[data-pf]').forEach(el=>el.onchange=()=>{
    const i=+el.dataset.pi,k=el.dataset.pf; if(!f.mix[i])return;
    f.mix[i][k]=(k==='min'||k==='oxyG')?(+el.value||''):el.value; render();});
  /* 練習の記録でも、打つ道とカメラの道を同じ中身にする */
  const pfAdd=async(i,v)=>{
    if(!v||!f.mix[i])return;
    const g=async u=>{try{const r=await fetch(U(u));const j=await r.json();return j.agents||[];}catch{return [];}};
    let hits=/^[0-9]{8,14}$/.test(v)?await g('/agents?barcode='+encodeURIComponent(v)):await g('/agents?q='+encodeURIComponent(v));
    let a=hits[0];
    if(!a&&/^[0-9]{8,14}$/.test(v)){ const hit=await kmFind(v); if(hit)a={id:'',name:hit.n,brand:hit.b||''}; }
    if(!a){ const nm=prompt('薬剤の名前',v); if(!nm)return; a={id:'',name:nm}; }
    (f.mix[i].agents||(f.mix[i].agents=[])).push({id:a.id||'',name:a.name,g:''});
    render();
  };
  document.querySelectorAll('.pf-sc').forEach(el=>el.onkeydown=async ev=>{
    if(ev.key!=='Enter')return; ev.preventDefault();
    const v=el.value.trim(); if(!v)return; el.value='';
    await pfAdd(+el.dataset.i, v);});
  document.querySelectorAll('[data-pcam]').forEach(bt=>bt.onclick=async()=>{
    const code=await scanBarcode();
    if(code)await pfAdd(+bt.dataset.pcam, code);});
  ['pf-pb','pf-pa'].forEach((id,n)=>{const el=$$(id); if(!el)return;
    el.onchange=()=>{const file=el.files&&el.files[0]; if(!file)return;
      const img=new Image();
      img.onload=()=>{ const MAX=1100,sc=Math.min(1,MAX/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        let q=0.72,data=cv.toDataURL('image/jpeg',q);
        while(data.length>550000&&q>0.4){q-=0.1;data=cv.toDataURL('image/jpeg',q);}
        f[n?'photoA':'photoB']=data; URL.revokeObjectURL(img.src); render();};
      img.src=URL.createObjectURL(file);};});
  if($$('pf-cancel'))$$('pf-cancel').onclick=()=>{PRF=null;render();};
  if($$('pf-save'))$$('pf-save').onclick=async()=>{
    const mc=matCost({mix:f.mix});
    const b=$$('pf-save'); b.disabled=true; b.textContent='記録しています…';
    await fetch(U('/practice'),{method:'POST',headers:H(),
      body:JSON.stringify({date:f.date,minutes:f.mins,kind:f.kind,note:f.note,
        startAt:f.startAt||'',endAt:f.endAt||'',
        modelName:f.hasModel?f.modelName:'',modelFee:f.hasModel?(+f.modelFee||0):0,
        feeMethod:f.feeMethod||'cash',feeInReg:!!f.feeInReg,
        agents:f.hasModel?f.mix:[],matCost:f.hasModel?mc.yen:0,
        teacher:f.teacher,checked:!!f.teacher,nextBooked:!!f.nextBooked,
        photoB:f.photoB,photoA:f.photoA})}).catch(()=>{});
    PRF=null; PRON=null; localStorage.removeItem('stb_practice_on');
    await prLoad(); render();};
}

/* ══════════════════════════════════════════════════════════
   譜面 — ヘッドスパの工程を、楽譜のように読む

   ★手順書は「読むもの」だが、譜面は「見ながら演奏するもの」。
     施術は90分ぜんぶ手が塞がっているので、
     文章ではなく **いま何小節目か** が一目で分かる形にする。

   ★いちばんの肝は、譜面が一人ひとり違うこと。
     お客様が選んだ強さ・灯り・音は、そのまま **強弱記号** になる。
     だから同じ工程でも、この方のための譜面になる。

   ★声がけ（言うこと）と 心遣い（言わずにやること）を分けて書く。
     2万人レポート p18「会話の上手さより、困る前に気づく接客」。
     心遣いは言葉にしない仕事なので、書いておかないと消える。
   ══════════════════════════════════════════════════════════ */
const DYN=n=>!n?'':(n<=2?'pp':n<=4?'p':n<=6?'mp':n<=8?'f':'ff');
const DYNJ=n=>!n?'':(n<=2?'ごく弱く':n<=4?'弱く':n<=6?'ふつうに':n<=8?'強く':'いちばん強く');

/* ══ 持ち時間の割り付け ══
   ★所要 = 施術 + 15分（2026-08-01 オーナー確認）。
     その15分は お迎え6＋お召し替え5＋お席へ4 として施術の前に置く。
   ★コースの長さで伸び縮みするのは「ほぐし」だけ。
     短いコースほど主役が痩せるので、数字で見えるようにしておく。 */
function durations(mn, hasBath){
  const bath = hasBath ? 10 : 0;
  const wash = Math.min(12, Math.max(6, Math.round(mn*0.2)));
  const back = Math.min(12, Math.max(5, Math.round(mn*0.15)));
  const fin  = 8;
  const relax = Math.max(5, mn - bath - wash - back - fin);
  return {welcome:6, change:5, seat:4, bath, wash, relax, back, fin};
}

/* 工程＝楽章。持ち時間から組み立てる */
function score(){
  const q=CUR||{}, mn=(RESV&&RESV.minutes)||90;
  const D=durations(mn, !!q.bath);
  const quiet=/話しかけない|静か|ゆっくり|眠/.test(String(q.talk||'')+String(q.goal||''));
  const sleepy=/眠って|ねむって/.test(String(q.goal||''));
  const parts=String(q.parts||'').split('／').map(x=>x.trim()).filter(Boolean);
  const M=[];

  M.push({dur:D.welcome,name:'お迎え',it:'はじまり',it2:'Preludio',
    say: quiet?['お名前だけ確認して お部屋へ　説明は最小限に']
              :['「本日はありがとうございます」','ご希望はもう届いていますと ひと言だけ'],
    care:['受付で書くものは出さない（もう頂いている）',
          q.room?`お席：${q.room}`:'',
          'お手洗いをこの時点で一度うかがう'].filter(Boolean)});

  if(q.sheet&&q.sheet!=='今回はいいです')
    M.push({dur:D.change,name:'お召し替え',it:'あいだに',it2:'Intermezzo',
      say:[`「${q.sheet}のシートをご用意しています」`,'香りだけ先にお見せする'],
      care:['ガウンの前にシートをお渡しする','汗のことは言わない　差し出すだけ']});

  M.push({dur:D.seat,name:'お席へ',it:'ゆっくりと',it2:'Adagio',
    say:[ q.drink&&q.drinkTime!=='終わってから'?`「${q.drink}をお持ちしますね」`:'',
          '「姿勢はつらくないですか」' ].filter(Boolean),
    care:[ q.pillow?`枕：${q.pillow}`:'',
           q.blanket&&q.blanket!=='かけないで'?`ブランケット：${q.blanket}`:'',
           q.lightN?`灯りを ${DYNJ(q.lightN)} 落とす（${DYN(q.lightN)}）`:'',
           q.soundN?`音は ${DYNJ(q.soundN)}（${DYN(q.soundN)}）`:'',
           q.music?`音楽：${q.music}`:'' ].filter(Boolean)});

  if(q.bath) M.push({dur:D.bath,name:'頭浸浴',it:'歩くはやさで',it2:'Andante',
    say:['「お湯の温度はいかがですか」','ここから先は 目を閉じていて大丈夫ですと伝える'],
    care:[ q.tempN?`お湯 ${DYNJ(q.tempN)}（${DYN(q.tempN)}）`:'',
           '生えぎわにタオルを当ててから流す',
           q.face?`お顔まわり：${q.face}`:'' ].filter(Boolean)});

  M.push({dur:D.wash,name:'洗い',it:'すこし軽やかに',it2:'Allegretto',
    say:[ q.washPower?`「${q.washPower.replace(/（.*/,'')}でまいります」と先に言う`:'',
          '強さを一度だけ確かめる　そのあとは聞かない' ].filter(Boolean),
    care:[ q.washPower?`シャンプー ${q.washPower}`:'',
           q.soda?`炭酸：${q.soda}`:'',
           '爪を立てない　指の腹だけ',
           ...(q.wash?[String(q.wash)]:[]) ]});

  M.push({dur:D.relax,name:'ほぐし',it:'いちばん長く',it2:'Largo',
    say: quiet?['声はかけない　力を変えるときだけ短く']
              :['部位を移るときに ひと言だけ添える'],
    care:[ ...(parts.length?parts:['おまかせ']),
           q.avoidParts?`★触れない：${q.avoidParts}`:'',
           '同じ場所を続けすぎない　左右差を最後に整える' ].filter(Boolean)});

  M.push({dur:D.back,name:'戻ってくる',it:'だんだん ゆるめて',it2:'Ritardando',
    say: sleepy?[`「${q.sleep||'そのまま'}」とうかがっています`,'起こす場合は 名前を呼ばず 手の圧をゆるめてから']
               :['「そろそろお戻りいただきます」と 小さな声で'],
    care:[ q.sleep?`眠ってしまったら：${q.sleep}`:'',
           '灯りを一段だけ上げる（急に明るくしない）',
           q.drinkTime&&q.drinkTime!=='着いてすぐ'?`お飲みもの：${q.drink||''} を ${q.drinkTime}`:'' ].filter(Boolean)});

  M.push({dur:D.fin,name:'仕上げ・お見送り',it:'おわり',it2:'Coda',
    say:['「キレイになりましたね」を必ず言う　←ここで満足が完成する',
         'おうちでのケアを ひとつだけお伝えする',
         '次回のご予約を その場でおすすめする'],
    care:[ q.finish?`仕上げ：${q.finish}`:'',
           q.styling?`スタイリング：${q.styling}`:'',
           q.care?`お試し：${q.care}`:'',
           '「おわりに」タブに 今日の一行を書く（翌朝お届けします）' ].filter(Boolean)});
  /* ご来店を0分として積み上げる */
  let acc=0;
  for(const m of M){ m.at=acc; acc+=m.dur; }
  /* ★空の行が「・」だけになって残る事故を防ぐ（実際に出た） */
  return M.map(m=>({...m, say:(m.say||[]).filter(Boolean), care:(m.care||[]).filter(Boolean)}));
}

/* ══════════════════════════════════════════════════════════
   練習モード

   ★「誰がやっても同じ」は、本番で画面を見て作るものではない。
     施術中は手が濡れていて触れないし、画面を見ている人は
     お客様を見ていない（＝2万人レポートがいちばん評価すると
     結論づけた「言う前に気づく」が消える）。

   ★だから時計はフロアの外で使う。ここで身体にリズムを入れて、
     本番は譜面を見なくても進める状態にする。
   ★4倍速まで出せるのは、90分を通しで練習させないため。
     22分で全体の形が1周できる。
   ══════════════════════════════════════════════════════════ */
/* ══ 本番の合図 ══
   ★画面は見ない。時間が本当にお金になる3点だけ 手を止めずに分かればいい。
     ・ほぐしに入る　・戻し始める（外すと必ず押す）　・仕上げ5分前
   ★正直な限界：ブラウザは 画面を消すと時計が止まります（iOSは特に）。
     伏せて置く（画面はついたまま）なら動きます。
     ポケットで確実に受け取りたければ Apple Watch か専用アプリが要ります。
     ここでは まず「3点で足りるのか」を確かめるための試作として置きます。 */
let SIG=null;
function sigStop(){ if(SIG&&SIG.timer)clearInterval(SIG.timer); SIG=null; paintSig(); }
function sigStart(){
  const M=score();
  let acc=0; const marks=[];
  M.forEach(m=>{ 
    if(m.name==='ほぐし') marks.push({at:acc, why:'ほぐしに入る'});
    if(m.name==='戻ってくる') marks.push({at:acc, why:'戻し始める'});
    if(m.name==='仕上げ・お見送り') marks.push({at:acc-5, why:'仕上げ5分前'});
    acc+=m.dur; });
  SIG={t0:Date.now(), marks, fired:{}, total:acc};
  SIG.timer=setInterval(()=>{
    const min=(Date.now()-SIG.t0)/60000;
    SIG.marks.forEach((k,n)=>{
      if(!SIG.fired[n] && min>=k.at){ SIG.fired[n]=true;
        try{ navigator.vibrate&&navigator.vibrate([180,90,180]); }catch(e){}
      }});
    paintSig();
    if(min>SIG.total) sigStop();
  },1000);
  paintSig();
}
function paintSig(){
  const el=document.getElementById('sigBar'); if(!el)return;
  if(!SIG){ el.innerHTML=''; return; }
  const min=(Date.now()-SIG.t0)/60000;
  const nx=SIG.marks.find((k,n)=>!SIG.fired[n]);
  el.innerHTML=`<div class="sigT">${String(Math.floor(min)).padStart(2,'0')}:${String(Math.floor((min%1)*60)).padStart(2,'0')}</div>
    ${nx?`<div class="sigN">つぎの合図　<b>${esc(nx.why)}</b>　あと ${Math.max(0,Math.ceil(nx.at-min))}分</div>`
        :'<div class="sigN">合図はすべて鳴りました</div>'}
    <div class="sigL">${SIG.marks.map((k,n)=>`<span class="${SIG.fired[n]?'on':''}">${esc(k.why)}</span>`).join('')}</div>`;
}

let REH=null;   // {t0, sec, speed, timer}
function rehStop(){ if(REH&&REH.timer)clearInterval(REH.timer); REH=null; }
function rehStart(speed){
  rehStop();
  REH={sec:0, speed:speed||1};
  REH.timer=setInterval(()=>{ REH.sec+=REH.speed; rehTick(); }, 1000);
  rehTick();
}
function rehTick(){
  const M=score(), total=M.reduce((a,m)=>a+m.dur,0);
  const min=REH?REH.sec/60:0;
  let cur=-1, acc=0;
  M.forEach((m,n)=>{ if(min>=acc && min<acc+m.dur)cur=n; acc+=m.dur; });
  if(min>=total){ cur=M.length-1; }
  const bar=document.getElementById('rehBar');
  if(bar){
    const m0=Math.floor(min), s0=Math.floor((min-m0)*60);
    const c=cur>=0?M[cur]:null;
    let left=0, a2=0;
    M.forEach((m,n)=>{ if(n===cur)left=(a2+m.dur)-min; a2+=m.dur; });
    bar.innerHTML=`<div class="rehT">${String(m0).padStart(2,'0')}:${String(s0).padStart(2,'0')}
        <s>/ ${total}分</s></div>
      ${c?`<div class="rehN">${esc(c.name)}<i>のこり ${Math.max(0,Math.ceil(left))}分</i></div>`:''}
      <div class="rehP"><i style="width:${Math.min(100,min/total*100)}%"></i></div>`;
  }
  document.querySelectorAll('.mv').forEach((el,n)=>el.classList.toggle('now',n===cur));
  const el=document.querySelectorAll('.mv')[cur];
  if(el&&REH&&Math.floor(min*60)%5===0)el.scrollIntoView({block:'center',behavior:'smooth'});
}

        <button id="sigOff" class="stop">とめる</button>

      <div class="mv${done[n]?' done':''}" data-n="${n}">

/* 読めたコードを返す。閉じられたら '' を返す */
function scanBarcode(){
  return new Promise(async (resolve)=>{
    const box=document.createElement('div'); box.className='cam';
    box.innerHTML=`<video playsinline muted></video>
      <div class="frame"></div>
      <div class="msg">ボトルのバーコードを枠に合わせてください</div>
      <button class="close">閉じる</button>`;
    document.body.appendChild(box);
    const video=box.querySelector('video'), msg=box.querySelector('.msg');
    let stream=null, stop=false, ctrl=null;
    const finish=(code)=>{
      if(stop)return; stop=true;
      try{ if(ctrl&&ctrl.stop)ctrl.stop(); }catch(e){}
      try{ if(stream)stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      box.remove(); resolve(code||'');
    };
    box.querySelector('.close').onclick=()=>finish('');
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      video.srcObject=stream; await video.play();
    }catch(e){
      msg.textContent='カメラを使えませんでした　設定でカメラを許可してください';
      setTimeout(()=>finish(''),2600); return;
    }
    /* ① 端末に読み取りが入っている場合 */
    if(window.BarcodeDetector){
      try{
        const det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e','itf','code_39']});
        const tick=async()=>{
          if(stop)return;
          try{ const r=await det.detect(video);
            if(r&&r.length&&r[0].rawValue){ finish(String(r[0].rawValue)); return; } }catch(e){}
          requestAnimationFrame(tick);
        };
        tick(); return;
      }catch(e){ /* だめなら②へ落ちる */ }
    }
    /* ② iPhone など。部品を取ってきて読む。
       ★この部品は版によって呼び名が変わる（decodeFromStream が無い版がある）。
         無い呼び名を呼ぶと、その場で落ちてカメラが開いたまま固まるので、
         あるものを探してから呼ぶ。どれも無ければ、正直にそう出す。 */
    try{
      const ZX=await zxLoad();
      const R=ZX&&(ZX.BrowserMultiFormatReader||ZX.BrowserBarcodeReader);
      if(!R)throw new Error('読み取りの部品がありません');
      const reader=new R();
      const hit=(res)=>{ if(res&&typeof res.getText==='function')finish(String(res.getText())); };
      if(typeof reader.decodeFromStream==='function'){
        reader.decodeFromStream(stream,video,(res,err,c)=>{ if(c&&!ctrl)ctrl=c; hit(res); });
      }else if(typeof reader.decodeFromVideoDevice==='function'){
        /* こちらは部品が自分でカメラを開くので、こちらで開いた分は先に閉じる
           （2つ開いたままだと、端末によっては真っ黒になる） */
        try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
        stream=null;
        ctrl={stop:()=>{try{reader.reset();}catch(e){}}};
        reader.decodeFromVideoDevice(null,video,(res)=>hit(res));
      }else{
        throw new Error('読み取りの部品が合いません');
      }
    }catch(e){
      msg.textContent='この端末では読み取れません　薬剤名で探してください';
      setTimeout(()=>finish(''),2800);
    }
  });
}
const kRatio=(a,b)=>(!a||!b)?'':('1:'+String(Math.round(b/a*100)/100));
/* ═══ 話して記入 ═══
 * salontown-booking で作った解析をそのまま持ってきた（同じ中身にしておく）。
 * 「N-8を30グラム 1対2 放置20分 次回は7週間後」のような話し言葉を
 * 薬剤・量・比率・放置・部位・次回に振り分ける。
 * ★入れっぱなしにしない。行として出して、必ず目で確かめられる形で反映する。
 *   聞き違いは必ず起きる。起きたときに直せることのほうが、精度より大事。
 */
const kataV = (s) => s.replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

const normV = (s) => kataV(String(s).toLowerCase())
  .replace(/[ー\-\s・]/g, '')
  .replace(/エヌ/g, 'n').replace(/オキシ/g, 'ox').replace(/オー|オウ/g, 'o')
  .replace(/エックス/g, 'x').replace(/ハチ/g, '8').replace(/ロク/g, '6')
  .replace(/[％]/g, '%');
function matchProductV(word, products) {
  const w = normV(word);
  if (!w || w.length < 2) return null;
  let best = null, bestScore = 0;
  for (const p of (products || [])) {
    const n = normV(p.name);
    let score = 0;
    if (n.includes(w) || w.includes(n)) score = Math.min(w.length, n.length) / Math.max(w.length, n.length);
    else {
      for (let len = Math.min(w.length, n.length); len >= 2; len--) {
        let hit = false;
        for (let i = 0; i + len <= w.length; i++) {
          if (n.includes(w.slice(i, i + len))) { score = len / Math.max(w.length, n.length); hit = true; break; }
        }
        if (hit) break;
      }
    }
    if (score > bestScore) { bestScore = score; best = p; }
  }
  if (bestScore >= 0.3) return best;
  /* 短い通称（「オキシ」→ox等）: 台帳でその語を含む薬剤が1つだけなら採用。複数なら？のまま */
  const contains = (products || []).filter(p => normV(p.name).includes(w));
  if (contains.length === 1) return contains[0];
  return null;
}
/* 音声認識の器。無い端末では null（呼ぶ側が文字入力に切り替える）
   ★iPhoneのSafariは対応していない。だから「使えません」で終わらせず、
     必ず打つ道を出す。 */
function makeSpeech(onText, onEnd) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ja-JP'; r.interimResults = true; r.continuous = true;
  let finalText = '';
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    onText(finalText, interim);
  };
  r.onend = () => onEnd(finalText);
  r.onerror = () => {};
  return r;
}
/* 話した内容を、SEAMのカルテの形（mix）に置きかえる。
 * ★salontown は1行に「name(A + B) / g / ratio」を持つが、
 *   SEAMは1つの塗りに薬剤が何本もぶら下がる形。ここで橋渡しする。
 * ★勝手に決めない。比率から割れるときだけ割る。割れないものは空で置いて、
 *   スタッフに埋めてもらう（数字を推測で埋めると、材料費が嘘になる）。 */
function voiceToMix(r){
  const out=[];
  (r.meds||[]).forEach(m=>{
    const names=String(m.name||'').split(' + ').map(x=>x.replace(/^？/,'').trim()).filter(Boolean);
    if(!names.length)return;
    const tot=+m.g||0;
    let gs=names.map(()=>'');
    if(tot){
      const rt=String(m.ratio||'').split(':').map(Number).filter(x=>x>0);
      if(names.length===1)gs=[tot];
      else if(rt.length===names.length){
        const sum=rt.reduce((a,b)=>a+b,0);
        gs=rt.map(x=>Math.round(tot*x/sum*10)/10);
      }
      /* 数が合わないときは分けない。合計だけ1本目に置くと嘘になるので空のまま */
    }
    const e={where:(m.zone&&KWHERE.includes(m.zone))?m.zone:'全体',
      agents:names.map((n,i)=>({id:'',name:n,g:gs[i]||''})),
      oxy:'',oxyG:'',min:m.min||''};
    /* 薬剤1本＋「1対2」＝ 1剤:2剤 と読む（現場のいちばん多い言い方）。
       オキシの濃度は言葉から決められないので、選ぶのは人にまかせる */
    if(names.length===1&&tot){
      const rt=String(m.ratio||'').split(':').map(Number);
      if(rt.length===2&&rt[0]>0&&rt[1]>0)e.oxyG=Math.round(tot*rt[1]/rt[0]*10)/10;
    }
    out.push(e);
  });
  return out;
}
/* 読点の無い一続きの言葉から、台帳にある薬剤名を拾い出す。
 * ★長いものから探す。「アッシュ」と「アッシュ 12」があるとき、
 *   短いほうで先に当たると、12が量として拾われてしまう。
 * ★名前のすぐ後ろにある数字＋g を、その薬剤の量として一緒に取る
 *   （「アッシュ12を20グラムマット6を10グラム」＝2本それぞれに量がある）。 */
function scanNames(seg, products){
  const list=(products||[]).map(p=>String(p.name||'')).filter(n=>n.length>=2)
    .sort((a,b)=>normV(b).length-normV(a).length);
  const nseg=normV(seg);
  const used=new Array(nseg.length).fill(false);
  const hits=[];
  for(const nm of list){
    const nn=normV(nm); if(nn.length<2)continue;
    let from=0;
    while(from<=nseg.length-nn.length){
      const i=nseg.indexOf(nn,from); if(i<0)break;
      let free=true; for(let k=i;k<i+nn.length;k++) if(used[k]){free=false;break;}
      if(free){ for(let k=i;k<i+nn.length;k++)used[k]=true;
        hits.push({name:nm,at:i,end:i+nn.length}); }
      from=i+1;
    }
  }
  hits.sort((a,b)=>a.at-b.at);
  const gs=hits.map((h,i)=>{
    const nx=hits[i+1]?hits[i+1].at:nseg.length;
    const m=nseg.slice(h.end,nx).match(/(\d+(?:\.\d+)?)\s*(?:g|ml)/);
    return m?m[1]:'';
  });
  let rest=''; for(let i=0;i<nseg.length;i++) if(!used[i])rest+=nseg[i];
  return {names:hits.map(h=>h.name), gs, rest};
}
function parseVoice(text, products) {
  const t = String(text)
    .replace(/[０-９．]/g, c => c === '．' ? '.' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/ミリリットル|みりりっとる|ｍｌ|ＭＬ|シーシー|cc/g, 'ml')
    .replace(/(\d)\s*(?:ミリ|みり)(?:リットル|りっとる)?/g, '$1ml')
    .replace(/グラム|ぐらむ/g, 'g')
    .replace(/パーセント|ぱーせんと/g, '%')
    .replace(/ワンツー|いちたいに|一対二/g, '1:2')
    .replace(/(\d+(?:\.\d+)?)対(\d+(?:\.\d+)?)/g, '$1:$2')
    .replace(/放置/g, ' 放置');
  const out = { meds: [], next: '', state: '', zoneStates: {}, memo: [] };
  const nx = t.match(/次回[はにも]?(.+?)(?:[。]|$)/);
  if (nx) out.next = nx[1].trim();

     抜かずに進むと、句読点を入れずに話したとき（＝ふつうの話し方）に
     文がひとかたまりのまま「次回を含む」と判定され、薬剤ごと捨てられていた。
     「N-8を30グラム 1対2 放置20分 次回は7週間後」が丸ごと消えていた。 */
  let tt = t.replace(/次回[はにも]?.*$/, ' ');
  /* 来店時の状態（「来た時の状態に対して薬剤設定をする」＝ビフォーの記録） */
  /* ★「来た時は毛先が褪色 根元にアッシュ8を30グラム」のように、
     状態を先に言ってから調合に入るのがふつうの話し方。
     ここで最後まで取ってしまうと、そのあとの薬剤が全部消える。
     句読点か、調合が始まったと分かるところ（部位＋数字＋g/分）で切る。 */
  const STOP = '(?:[、。]|(?:根元|中間|毛先|全体|前髪|もみあげ|襟足|表面|ホイル|インナー)[はにをがのも]?[^、。]{0,24}?\\d+\\s*(?:g|ml|分)|$)';
  const stRe = new RegExp('(?:来た時の状態|来店時の状態|来た時|来店時)[はがも]?(.+?)(?=' + STOP + ')');
  const stM = t.match(stRe);
  if (stM && stM[1].trim()) {

  const ZONES = /(根元|中間|毛先|全体|ホイル|ホイール|インナー|前髪|もみあげ|襟足|表面)/;
  /* 番号でも呼べる: ①/1番=根元・②/2番=中間・③/3番=毛先 */
  const tz = tt
    .replace(/[①]|[1１一]\s*番(?:目)?/g, '根元')
    .replace(/[②]|[2２二]\s*番(?:目)?/g, '中間')
    .replace(/[③]|[3３三]\s*番(?:目)?/g, '毛先')
    .replace(/根本/g, '根元');
  const segs = tz.split(/[、。,]|そして|あと/).map(s => s.trim()).filter(Boolean);
  let cur = null, lastZone = '';
  for (const seg of segs) {
    if (/次回|来た時|来店時|状態/.test(seg)) continue;
    /* 量は「はかりで量る」＝単位はgかml。比率は薬剤どうしの割合（3:1等） */
    const amt = seg.match(/(\d+(?:\.\d+)?)\s*(ml|g)\b/);
    const min = seg.match(/(?:放置)?\s*(\d+)\s*分/);
    const ratio = seg.match(/(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)/);
    const zoneM = seg.match(ZONES);
    /* ★「根元にアッシュ、マット10g」のように、2つ目で部位を言い直さないのがふつう。
       言われなければ直前の部位のままにする（言い直さないと全体になっていた）。 */
    const zone = zoneM ? zoneM[1].replace('ホイール', 'ホイル') : lastZone;
    if (zoneM) lastZone = zone;

    /* エリアの状態（薬剤でなく髪の説明）:「根元 2センチ新生毛」「毛先 13レベル ベージュ…」
       明度レベル(4〜15)とダメージレベルも拾い、髪の図の色に使う */
    const STATEY = /新生|センチ|cm|ダメージ|明度|残留|赤み|黄み|褪色|退色|レベル|トーン|バージン|黒染め|白髪|ブリーチ毛/;
    if (zone && !amt && !ratio && STATEY.test(seg)) {
      const desc = seg.replace(new RegExp(ZONES.source, 'g'), '').replace(/^[はがのにで]+/, '').trim();
      if (desc) {
        const lv = desc.match(/(\d{1,2})\s*(?:レベル|トーン)/) || desc.match(/明度\s*(\d{1,2})/);
        const dmg = desc.match(/ダメージ(?:レベル)?\s*(?:は)?\s*(\d)/);
        out.zoneStates[zone] = { text: desc,
          level: lv ? Math.min(15, Math.max(3, +lv[1])) : null,
          damage: dmg ? +dmg[1] : null };
        continue;
      }
    }

    /* ★話し言葉には読点が入らない。
       「アッシュ12マット20新生毛NB9…30グラム」のように全部くっついて届く。
       読点で切る前提のままだと、これがまるごと1つの薬剤名になっていた
       （実機で「アッシュ 12 マット 20 新繊毛な NB 9 ダメージもな 30g」という
        1行ができた）。
       そこで、台帳にある薬剤名を長いものから順に探して、当たったところで切る。
       当たらなかった言葉は捨てずに、書きおきへ回す。 */
    {
      const found = scanNames(seg, products);
      if (found.names.length > 1) {
        const gAll = amt ? +amt[1] : 0;
        const rt = ratio ? [+ratio[1], +ratio[2]] : null;
        const sumR = rt ? (rt[0] + rt[1]) : 0;
        found.names.forEach((nm, k) => {
          let g = found.gs[k] || '';
          if (!g && gAll && rt && found.names.length === 2 && sumR)
            g = String(Math.round(gAll * rt[k] / sumR * 10) / 10);
          cur = { code: '', name: nm, g: g, unit: (amt && amt[2]) || 'g',
            min: min ? min[1] : '', ratio: '', zone };
          out.meds.push(cur);
        });
        /* ★当たらなかった言葉は書きおきに回さない。
           ここに残るのは正規化したあとの文字（「根元ニヲ20gヲ10g1:2デ放置25分」）で、
           人が読めるものではない。読めないものをカルテに残すと、次の人が困る。 */
        continue;
      }
    }
    /* 薬剤名の部分だけ残す（量・比率・時間・部位を除く。レベル番号「サファイア12」は残す） */
    const nameArea = seg
      .replace(/(\d+(?:\.\d+)?)\s*(ml|g|分|%)/g, ' ')
      .replace(/\d+(?:\.\d+)?:\d+(?:\.\d+)?/g, ' ')
      .replace(/放置|置いて|置きました/g, ' ')
      .replace(new RegExp(ZONES.source, 'g'), ' ');
    /* 「AとBを3対1で40g」＝1つのボウル（配合）。と/＋で薬剤を分ける */
    const parts = nameArea.split(/と|＋|\+|たす/)
      .map(p => p.replace(/[のでをはにが]/g, ' ').trim())
      .filter(p => p.replace(/\s/g, '').length >= 2);
    const names = parts.map(p => { const h = matchProductV(p, products);
      return h ? h.name : '？' + p.replace(/\s+/g, ' '); });
    const anyHit = names.some(n => !n.startsWith('？'));

    if (names.length && (anyHit || amt || ratio)) {
      cur = { code: '', name: names.join(' + '), g: '', unit: 'g', min: '', ratio: '', zone };
      out.meds.push(cur);
    } else if (zone && cur && !cur.zone) {
      cur.zone = zone;   // 「根元に」だけの言い足し
    }
    if (amt) {
      if (cur && cur.g === '') { cur.g = amt[1]; cur.unit = amt[2]; }
      else { /* 名前が取れないまま量だけ来た→上書きせず「要確認」行を作る */
        cur = { code: '', name: '？薬剤名を確認', g: amt[1], unit: amt[2], min: '', ratio: '', zone };
        out.meds.push(cur);
      }
    }
    if (min && cur) cur.min = min[1];
    if (ratio && cur && !cur.ratio) cur.ratio = ratio[1] + ':' + ratio[2];
    if (!amt && !min && !ratio && !names.length && !zone && seg.length > 3) out.memo.push(seg);
  }
  return out;
}

/* ★調合を1行の式で見せる。
 *   アッシュ 20g ＋ マット 10g ＝ 1剤30g／OX6% 60g
 * 数字を入れた瞬間にここが動くので、「いま何を混ぜているか」が手元で読める。
 * 空のときは、何を入れればいいかを書いておく（空欄だけ並ぶと手が止まる）。 */
function kFormula(m){
  const ag=(m.agents||[]).filter(a=>a&&a.name);
  if(!ag.length)return `<div class="kfx"><span class="none">薬剤を足すと、調合の式がここに出ます（例）アッシュ 20g ＋ マット 10g</span></div>`;
  const parts=ag.map(a=>`<b>${esc(a.name)}</b>${a.g?' '+a.g+'g':''}`).join('<i>＋</i>');
  const g1=ag.reduce((s,a)=>s+(+a.g||0),0);
  const tail=[g1?`1剤 ${g1}g`:'', m.oxy?(m.oxy+(m.oxyG?' '+m.oxyG+'g':'')):'', m.min?m.min+'分':'']
    .filter(Boolean).join('　');
  return `<div class="kfx">${parts}${tail?`<i>＝</i>${tail}`:''}</div>`;
}
/* ── 材料費 ──
 * ★あとから「今月は材料費が高かった」と言っても、もう戻せない。
 *   だから、いま塗っているその場で見せる。
 *   グラムを入れた瞬間に金額が動く＝ひとりひとりが意識できる。
 * 値段が入っていない薬剤は足さない。分からないものを混ぜると、数字が嘘になる。 */
let KVOICE=null;
/* 話した名前を薬剤の台帳と照合するための一覧。
   台帳に無い薬剤は「？名前」のまま行になる（勝手に別のものにしない） */
let _vag=null;
async function voiceAgents(){
  if(_vag)return _vag;
  try{ const r=await fetch(U('/agents')); const j=await r.json();
    _vag=(j.agents||[]).map(a=>({name:a.name||'',id:a.id||''})).filter(a=>a.name); }
  catch(e){ _vag=[]; }
  return _vag;
}
let AGP={};   // 薬剤の1gあたり（id と 名前 の両方で引けるように）
async function loadAgentPrice(){
  try{ const r=await fetch(U('/agents')); const j=await r.json();
    (j.agents||[]).forEach(a=>{ if(a.perG){AGP[a.id]=a.perG; AGP[a.name]=a.perG;} }); }catch(e){}
}
function matCost(body){
  let yen=0, unknown=0, g=0, bleach=false;
  (((body||{}).mix)||[]).forEach(m=>{
    (m.agents||[]).forEach(a=>{
      const gg=+a.g||0; if(!gg)return; g+=gg;
      if(/ブリーチ|ライトナー|パウダー/i.test(a.name||''))bleach=true;
      const per=AGP[a.id]||AGP[a.name]; if(per)yen+=per*gg; else unknown++;
    });
    const og=+m.oxyG||0;
    if(og){ g+=og; const per=AGP[m.oxy]; if(per)yen+=per*og; else unknown++; }
  });
  return {yen:Math.round(yen), unknown, g:Math.round(g), bleach};
}
/* 菊池マスタ（JAN→商品名の辞書・5,700件）。知らないバーコードでも名前が出る。
   大きいので、必要になった最初の1回だけ読む。 */
let _km=null,_kmP=null;
function kmLoad(){
  if(_km)return Promise.resolve(_km);
  if(!_kmP)_kmP=fetch('master-kikuchi.json?v=20260811').then(r=>r.ok?r.json():{items:[]})
    .then(j=>{_km=j.items||[];return _km;}).catch(()=>{_km=[];return _km;});
  return _kmP;
}
async function kmFind(code){ const m=await kmLoad(); return m.find(x=>x.c===String(code))||null; }
const kMixes=b=>((b||{}).mix||[]);
const kMixText=b=>kMixes(b).map(m=>[m.where,
  (m.agents||[]).map(a=>a.name+(a.g?' '+a.g+'g':'')).join('＋'),
  m.oxy?(m.oxy+(m.oxyG?' '+m.oxyG+'g':'')):'', m.min?m.min+'分':'']
  .filter(Boolean).join(' ')).filter(Boolean).join(' ／ ');

/* 来店前にうかがった力加減を、カルテの言葉に置きかえる */
function preShampoo(){
  const w=(CUR&&(CUR.washPower||''))||'';
  if(!w)return '';
  if(/とてもやさし|やさしく/.test(w))return '弱め希望';
  if(/とてもしっかり|しっかり/.test(w))return '強め希望';
  if(/ふつう/.test(w))return 'ちょうどよい';
  return '';
}

  const key=(String(RESV.phone||'').replace(/[^0-9]/g,''))||('n:'+(RESV.name||''));
  KT={key,name:RESV.name||'',phone:RESV.phone||'',date:DAY,staff:STAFFNM[RESV.staffId]||'',
      menu:RESV.menuName||'',resvId:RESV.id,body:{mix:[],treat:'',free:''},nextNote:'',assistant:'',
      advice:[],shampoo:preShampoo()};
  KT_LAST=null;
  try{
    const r=await fetch(U(`/karte?key=${encodeURIComponent(key)}`));
    const j=await r.json();
    const list=(j&&j.karte)||[];
    const today=list.find(x=>x.date===DAY);
    if(today)KT=Object.assign(KT,today,{body:Object.assign({mix:[],treat:'',free:''},today.body||{})});
    KT_LAST=list.find(x=>x.date!==DAY)||null;
  }catch(e){}
}

  p.innerHTML=`

      ${L.assistant?`<p class="mid">アシスタント ${esc(L.assistant)}</p>`:''}

      <button class="kvoice" id="kvoice">🎤 話して記入</button>
      <div class="kvlive" id="kvlive"></div>

      <p class="kvhint">例）根元にアッシュ8を20グラム、マット6を10グラム、1対2で放置25分</p>
      ${mix||'<p class="mid">まだありません</p>'}
      <button class="kbtn" id="kadd">＋ 塗りを足す</button></div>
    ${(()=>{const mc=matCost(b);
      if(!mc.g)return '';
      return `<div class="matbox ${mc.bleach?'hi':''}">

function kWire(p){
  const b=KT.body;
  p.querySelectorAll('.kmix select,.kmb input').forEach(el=>el.onchange=()=>{
    const i=+el.dataset.i,f=el.dataset.f; if(!b.mix[i]||!f)return;
    b.mix[i][f]=(f==='min'||f==='oxyG')?(+el.value||''):el.value; paint();});
  p.querySelectorAll('.kg').forEach(el=>el.onchange=()=>{
    const i=+el.dataset.i,j=+el.dataset.j; if(b.mix[i]&&b.mix[i].agents[j])b.mix[i].agents[j].g=+el.value||''; paint();});
  p.querySelectorAll('[data-dm]').forEach(x=>x.onclick=()=>{b.mix.splice(+x.dataset.dm,1);paint();});
  p.querySelectorAll('[data-da]').forEach(x=>x.onclick=()=>{
    const [i,j]=x.dataset.da.split(':').map(Number); b.mix[i].agents.splice(j,1); paint();});
  /* ── 話して記入 ──
     ★話した内容を、そのまま行にして出す。書き換えはしない。
       聞き違いは必ず起きるので、直せる形で置くことが精度より大事。 */
  {const vb=p.querySelector('#kvoice');
   if(vb)vb.onclick=async()=>{
     if(KVOICE){ try{KVOICE.stop();}catch(e){} return; }
     const live=p.querySelector('#kvlive'), msg=p.querySelector('#kvmsg');
     const apply=async(text)=>{
       KVOICE=null; vb.textContent='🎤 話して記入'; vb.classList.remove('on');
       if(live){live.style.display='none';live.textContent='';}
       const t=String(text||'').trim(); if(!t)return;
       const prods=await voiceAgents();
       const r=parseVoice(t,prods);
       const adds=voiceToMix(r);
       adds.forEach(x=>(b.mix||(b.mix=[])).push(x));
       /* 次回のご提案とメモは、書きおきの欄へ足す（消さずに足す） */
       const extra=[...(r.next?['【次回】'+r.next]:[]),...(r.state?['【来た時】'+r.state]:[]),...(r.memo||[])];
       if(extra.length)b.free=(b.free?b.free+'\n':'')+extra.join('\n');
       KT._vmsg=adds.length
         ?`${adds.length}件を入れました　g数とオキシを確かめてください`
         :'薬剤は聞き取れませんでした　書きおきに残しています';
       paint();
     };
     KVOICE=makeSpeech((fin,interim)=>{ if(live){live.style.display='block';live.textContent=fin+interim;} }, apply);
     if(!KVOICE){
       /* iPhoneのSafariはここに来る。使えませんで終わらせず、打つ道を出す */
       const t=prompt('この端末は話して記入に対応していません\nそのまま文字で入れてください\n\n例）根元にアッシュ8を20グラム、マット6を10グラム、1対2で放置25分');
       if(t)await apply(t);
       return;
     }
     vb.textContent='⏹ 話し終えたらタップ'; vb.classList.add('on');
     if(msg)msg.textContent='';
     try{ KVOICE.start(); }catch(e){ KVOICE=null; vb.textContent='🎤 話して記入'; vb.classList.remove('on'); }
   };}
  {const mg=p.querySelector('#kvmsg'); if(mg&&KT._vmsg){mg.textContent=KT._vmsg; KT._vmsg='';}}
  const add=p.querySelector('#kadd'); if(add)add.onclick=()=>{(b.mix||(b.mix=[])).push({where:'根元',agents:[],oxy:'',oxyG:'',min:''});paint();};
  const cp=p.querySelector('#kcopy'); if(cp)cp.onclick=()=>{
    b.mix=kMixes(KT_LAST.body).map(m=>({where:m.where||'',oxy:m.oxy||'',oxyG:m.oxyG||'',min:m.min||'',
      agents:(m.agents||[]).map(a=>({id:a.id||'',name:a.name||'',brand:a.brand||'',g:a.g||''}))})); paint();};
  /* ★打つ道とカメラの道を、同じ中身にする。
     別々に書くと、片方だけ直して、もう片方が動かない事故になる。 */
  const kAdd=async(i,v)=>{
    if(!v)return;
    const g=async u=>{try{const r=await fetch(U(u));const j=await r.json();return j.agents||[];}catch{return [];}};
    let hits=/^[0-9]{8,14}$/.test(v)?await g('/agents?barcode='+encodeURIComponent(v)):await g('/agents?q='+encodeURIComponent(v));
    let a=hits[0];
    if(hits.length>1){ const n=+prompt('どれですか　番号を\n\n'+hits.slice(0,12).map((x,k)=>`${k+1}. ${x.name}`).join('\n'),'1'); a=hits[n-1]; }
    if(!a&&/^[0-9]{8,14}$/.test(v)){
      const hit=await kmFind(v);
      if(hit){
        try{
          const r=await fetch(U('/agents'),{method:'POST',headers:H(),
            body:JSON.stringify({barcode:v,name:hit.n,brand:hit.b||''})});
          const j=await r.json(); a={id:j.id||'',name:hit.n,brand:hit.b||''};
        }catch{ a={id:'',name:hit.n,brand:hit.b||''}; }
      }
    }
    if(!a){
      const isBc=/^[0-9]{8,14}$/.test(v);
      const nm=prompt(isBc?`はじめての薬剤です\n${v}\n\n名前を入れてください`:'薬剤の名前', isBc?'':v);
      if(nm==null||!nm.trim())return;
      try{
        const r=await fetch(U('/agents'),{method:'POST', headers:H(),
          body:JSON.stringify({barcode:isBc?v:'',name:nm.trim()})});
        const j=await r.json(); if(!j.ok)throw 0; a={id:j.id,name:nm.trim()};
      }catch{ return; }
    }
    (b.mix[i].agents||(b.mix[i].agents=[])).push({id:a.id||'',name:a.name||'',brand:a.brand||'',g:''});
    paint();
  };
  p.querySelectorAll('.ksc').forEach(el=>el.onkeydown=async e=>{
    if(e.key!=='Enter')return; e.preventDefault();
    const v=el.value.trim(); if(!v)return; el.value='';
    await kAdd(+el.dataset.i, v);
  });
  /* カメラで読む。読めたら、打ったときとまったく同じ道を通す */
  p.querySelectorAll('[data-cam]').forEach(bt=>bt.onclick=async()=>{
    const code=await scanBarcode();
    if(code)await kAdd(+bt.dataset.cam, code);
  });
  p.querySelectorAll('[data-adv]').forEach(x=>x.onclick=()=>{
    const v=x.dataset.adv, a=KT.advice||(KT.advice=[]);
    const i=a.indexOf(v); if(i>=0)a.splice(i,1); else a.push(v); paint();});
  p.querySelectorAll('[data-sham]').forEach(x=>x.onclick=()=>{
    KT.shampoo=(KT.shampoo===x.dataset.sham)?'':x.dataset.sham; paint();});
  const sv=v=>{};
  const ks=p.querySelector('#kasst'); if(ks)ks.oninput=()=>KT.assistant=ks.value;
  const kn=p.querySelector('#knext'); if(kn)kn.oninput=()=>KT.nextNote=kn.value;
  const kf=p.querySelector('#kfree'); if(kf)kf.oninput=()=>b.free=kf.value;
  const btn=p.querySelector('#ksave');
  if(btn)btn.onclick=async()=>{
    const msg=p.querySelector('#kmsg'); btn.disabled=true; msg.textContent='';
    try{
      const r=await fetch(U('/karte'),{method:'POST', headers:H(),
        body:JSON.stringify(KT)});
      const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      KT.id=j.id; if(j.author)KT.author=j.author;
      msg.textContent='保存しました';
    }catch(e){ msg.style.color='#F0A79C'; msg.textContent='保存できませんでした: '+e.message; }
    btn.disabled=false;
  };
}

function paintAfter(p){
  const nm=(RESV&&RESV.name)||'お客様';
  p.innerHTML=`
    <div class="sec"><h3>翌朝 ${esc(nm)}様に届きます</h3>
      <p class="hint">今日 気づいたことを ひとつだけ<br>
        次に会うときの約束になるように書いてください</p>
      <div class="ex">首の左側が 右よりずっと張っていました<br>次は そこから始めさせてください</div>
      <div class="wbox">
        <label>お客様に届く一行</label>
        <textarea id="wnote" maxlength="160" placeholder="書かなければ 便りにこの欄は出ません">${esc(NOTE.note)}</textarea>
        <div class="cnt" id="wcnt"></div>
      </div>
      <div class="wbox priv">
        <label>店内だけのメモ　※お客様には届きません</label>
        <textarea id="wmemo" maxlength="600" placeholder="次回への申し送り 薬剤 苦手なことなど">${esc(NOTE.memo)}</textarea>
      </div>
      <button class="save" id="wsave">保存する</button>
      <p class="saved" id="wmsg"></p>
    </div>
    <div class="sec"><h3>お帰りぎわに お渡しする1枚</h3>
      <p class="hint">その方が選んだものだけを並べた記念の1枚です<br>
        この画面をお見せして 撮っていただいてください</p>
      <button class="mini2" id="wkeep">1枚をひらく</button></div>
    <div class="sec"><h3>ひとつだけ おうかがいする</h3>
      <p class="hint">この画面をお見せして 読み取っていただきます<br>
        「またおすすめしたいか」を 数字ひとつだけ お聞きします</p>
      <button class="mini2" id="wnps">コードを出す</button>
      <div id="npsBox"></div></div>`;
  const kb=document.getElementById('wkeep');
  if(kb)kb.onclick=async()=>{
    /* ★合言葉は必要になった1件だけ取りに行く（その日ぶんを一覧で持ち歩かない） */
    kb.disabled=true;
    try{
      const r=await fetch(U(`/visit/keepsake?resv=${encodeURIComponent(RESV.id)}`));
      const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      window.open(j.url,'_blank');
    }catch(e){ const m=document.getElementById('wmsg'); m.style.color='#F0A79C'; m.textContent='ひらけませんでした: '+e.message; }
    kb.disabled=false;
  };
  /* ── 推薦度のQR ──
   * 端末をこちらのレジに繋いでいなくても、担当のスマホからなら聞ける。
   * どの予約かが分かっているので、担当もお名前も日付も紐づく。 */
  const nb=document.getElementById('wnps');
  if(nb)nb.onclick=async()=>{
    nb.disabled=true; nb.textContent='つくっています…';
    try{
      const r=await fetch(U('/nps/token'),{method:'POST',headers:H(),
        body:JSON.stringify({resvId:RESV.id,shopId:'ginza'})});
      const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||'つくれませんでした');
      await loadQRlib();
      const url2=location.origin+location.pathname.replace(/staff-spa\.html?$/,'')+'ask.html?t='+encodeURIComponent(j.token);
      const img=window.qrcode?(()=>{const q=qrcode(0,'M');q.addData(url2);q.make();return q.createDataURL(7);})():'';
      document.getElementById('npsBox').innerHTML=img
        ? `<div class="npsqr"><img src="${img}" alt=""><p>お客様のスマホで<br>読み取っていただいてください</p></div>`
        : `<p class="hint" style="word-break:break-all">${esc(url2)}</p>`;
      nb.style.display='none';
    }catch(e){ nb.disabled=false; nb.textContent='コードを出す';
      const m2=document.getElementById('wmsg'); if(m2){m2.style.color='#F0A79C';m2.textContent=e.message;} }
  };
  const t=document.getElementById('wnote'), c=document.getElementById('wcnt');
  const cnt=()=>{ const n=t.value.length; c.textContent=n?`${n} / 160`:''; };
  t.oninput=cnt; cnt();
  document.getElementById('wsave').onclick=async()=>{
    const btn=document.getElementById('wsave'), msg=document.getElementById('wmsg');
    btn.disabled=true; msg.textContent='';
    NOTE={note:t.value,memo:document.getElementById('wmemo').value};
    try{
      const r=await fetch(U(`/visit/note`),{method:'POST', headers:H(),
        body:JSON.stringify({resv:RESV.id,note:NOTE.note,memo:NOTE.memo,staffId:RESV.staffId||'',staffName:STAFFNM[RESV.staffId]||''})});
      const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      msg.textContent=NOTE.note.trim()?'保存しました　翌朝お届けします':'保存しました';
    }catch(e){ msg.style.color='#F0A79C'; msg.textContent='保存できませんでした: '+e.message; }
    btn.disabled=false;
  };
}
const STAFFNM={s1:'及川 大輝',s2:'ANZU',s3:'CHIKA'};

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  paint();
});
document.getElementById('oclose').onclick=()=>{document.getElementById('one').classList.remove('on');};
/* 端末を共有しているので、抜ける口を分かりやすいところに置く */
document.getElementById('day').onclick=()=>{
  if(!TOK||!confirm((ME.name||'')+' さんからログアウトしますか'))return;
  TOK='';ME={id:'',name:''};
  ['stb_staff_tok','stb_staff_id','stb_staff_nm'].forEach(k=>localStorage.removeItem(k));
  askToken();
};
load();
</script>
