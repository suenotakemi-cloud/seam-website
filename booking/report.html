<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>売上と発注｜SEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ SEAM 売上と発注（iPad用）══
   売れたものを見て、そのまま発注書にして、余っているものに気づくための画面。
   数字を出すだけで、勝手に発注も返品もしない。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#16171B;--body:#3E3B36;--sub:#7C776E;--line:#E3DCD0;--cream:#FBF9F5;
  --gold:#B8945A;--clay:#A87456;--ok:#1F6B45;--ng:#B4442E;--bg:#F7F5F1}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--body);font-family:'Noto Sans JP',-apple-system,sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap;
  padding-top:calc(10px + env(safe-area-inset-top))}
.brand{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.16em;color:var(--ink)}
.spacer{flex:1}
.tabs{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tabs button{padding:10px 18px;border:0;background:#fff;font-size:13.5px;color:var(--sub);letter-spacing:.05em}
.tabs button.on{background:var(--ink);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 90px}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.range button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px 16px;font-size:13px;color:var(--body)}
.range button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.range input[type=date]{border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:#fff;color:var(--ink)}
h2{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:.14em;
  color:var(--clay);margin:28px 0 10px}
h2:first-child{margin-top:2px}
.note{font-size:12.5px;color:var(--sub);line-height:2;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kc{background:#fff;border:1px solid var(--line);border-radius:3px;padding:16px 18px}
.kc-k{font-size:11.5px;letter-spacing:.08em;color:var(--sub)}
.kc-v{font-family:'Cormorant Garamond',serif;font-size:27px;color:var(--ink);line-height:1.2;margin-top:4px;font-weight:600}
.kc-s{font-size:11.5px;color:var(--sub);margin-top:3px}
.rows{background:#fff;border:1px solid var(--line);border-radius:3px}
.r{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.r:last-child{border-bottom:0}
.r-n{flex:1;min-width:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-q{font-size:12px;color:var(--sub);white-space:nowrap}
.r-v{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--ink);white-space:nowrap;min-width:96px;text-align:right}
.bar{height:4px;background:var(--sand,#EFE9DF);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.r-w{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.mk{background:#fff;border:1px solid var(--line);border-radius:3px;margin-bottom:12px}
.mk-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mk-n{flex:1;font-size:15px;color:var(--ink)}
.mk-s{font-size:12px;color:var(--sub);white-space:nowrap}
.mk-v{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--ink)}
.oi{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.oi:last-child{border-bottom:0}
.oi-n{flex:1;min-width:0}
.oi-b{font-size:11px;color:var(--sub);letter-spacing:.04em}
.oi-q{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--ink);min-width:44px;text-align:right}
.oi-s{font-size:11.5px;color:var(--sub);min-width:112px;text-align:right}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;border:1px solid var(--line);
  border-radius:2px;padding:2px 8px;color:var(--clay);margin-left:6px}
.tag.ng{color:var(--ng);border-color:rgba(180,68,46,.34)}
.act{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.act button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:12px 20px;font-size:13.5px;color:var(--body)}
.act button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--sub);font-size:13px;padding:30px;text-align:center}
.gate{max-width:400px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:3px;padding:32px 26px}
.gate h1{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.14em;color:var(--ink);margin:0 0 6px;font-weight:600}
.gate p{font-size:13px;color:var(--sub);margin:0 0 18px}
.gate input{width:100%;border:1px solid var(--line);border-radius:3px;padding:14px}
.gate button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:3px;background:var(--ink);color:#fff;font-size:15px}
.qs{display:grid;gap:10px;margin:14px 0}
.q{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;cursor:pointer}
.q:hover{border-color:var(--ink)}
.q-i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--cream);
  display:grid;place-items:center;font-size:14px}
.q-b{flex:1;min-width:0;display:block}
.q-t{display:block;font-weight:800;font-size:14.5px}
.q-s{display:block;font-size:12.5px;color:var(--sub);line-height:1.6}
.q-a{flex:none;font-size:11.5px;font-weight:800;color:#fff;background:var(--ink);
  border-radius:999px;padding:7px 14px;white-space:nowrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.05em;color:var(--sub);font-weight:800;
  padding:9px 12px;background:var(--cream);white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .tsub{color:var(--sub);font-size:11.5px}
.tbl tr.tot td{font-weight:800;background:var(--cream)}
.prth{width:38px;height:38px;object-fit:cover;border-radius:5px;background:var(--cream)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:3px;font-size:14px;z-index:200;transition:.22s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ng{background:var(--ng)}
@media print{
  .top,.range,.act,.note,#toast{display:none!important}
  body{background:#fff}
  .mk{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <h1>売上と発注</h1>
  <p>売れたものを見て、そのまま発注書にする画面です</p>
  <input id="gtok" type="password" placeholder="管理トークン" autocomplete="off">
  <button id="gbtn">開く</button>
</div>

<div id="app" style="display:none">
  <div class="top">
    <span class="brand">SEAM REPORT</span>
    <select id="shopSel"></select>
    <div class="tabs" id="tabs">
      <button data-t="home" class="on">事務</button>
      <button data-t="sales">売上</button>
      <button data-t="repeat">再来</button>
      <button data-t="nps">推薦</button>
      <button data-t="tm">時間</button>
      <button data-t="mat">材料費</button>
      <button data-t="pr">練習</button>
      <button data-t="rec">照合</button>
      <button data-t="payroll">給与</button>
      <button data-t="pay">支払い</button>
      <button data-t="cash">現金</button>
      <button data-t="acc">経理</button>
      <button data-t="tf">免税</button>
      <button data-t="rev">口コミ</button>
      <button data-t="noti">申し送り</button>
      <button data-t="sup">備品</button>
      <button data-t="ap">応募</button>
      <button data-t="stf">スタッフ</button>
      <button data-t="kin">勤怠</button>
      <button data-t="md">モデル</button>
      <button data-t="li">掲載</button>
      <button data-t="order" data-feat="order">発注書</button>
      <button data-t="alert" data-feat="order">在庫アラート</button>
    </div>
    <span class="spacer"></span>
  </div>
  <div class="wrap">
    <div class="range" id="range"></div>
    <div id="body"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const API='https://seam-square-pay.suenotakemi.workers.dev';
const TOKK='stb_admin_tok', SHOPK='stb_shop';
let TOK=localStorage.getItem(TOKK)||'';
let SHOP=localStorage.getItem(SHOPK)||'ginza';
/* ?tab=ap のように指定して開ける（レジの画面から、その場所へ直接飛ぶため） */
let TAB=(new URLSearchParams(location.search).get('tab'))||'home';
let FROM='', TO='', PRESET='7', DATA=null, ORDER=null, ALERT=null, PSORT='v';
let REP=null, RWIN=90, RLOST=180;
let REC=null, HOME=null, PAY=null, PB=null, CB=null, CBMON='', JR=null, TF=null, RV=null, NO=null;
let SUP=null, AP=null, LI=null, NP=null, IMP=null, TMS=null, MAT=null, PRA=null;
let BUFFER=0, ALERT_DAYS=90, ALERT_MONTHS=6;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(+n||0).toLocaleString();
const H=(...a)=>({'Authorization':'Bearer '+TOK,...Object.assign({},...a)});
async function post(p,body){const r=await fetch(API+p,{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify(body)});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json();}
async function del(p){const r=await fetch(API+p,{method:'DELETE',headers:H()});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function get(p){const r=await fetch(API+p,{headers:H()});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json();}
let tt;function toast(m,ng){const t=$('toast');t.textContent=m;t.className='on'+(ng?' ng':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',ng?3000:1800);}
const jst=(off=0)=>new Date(Date.now()+9*3600e3-off*86400e3).toISOString().slice(0,10);

/* ── 期間の選び方。よく使う幅はボタン、細かいときは日付で ── */
/* 指定されたタブに、見た目もそろえる */
(function(){const b=document.querySelector(`#tabs button[data-t="${TAB}"]`);
  if(b){document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}})();
function drawRange(){
  const P=[['0','今日'],['7','1週間'],['30','1か月'],['90','3か月'],['365','1年']];
  $('range').innerHTML=P.map(([v,l])=>`<button data-p="${v}" class="${PRESET===v?'on':''}">${l}</button>`).join('')
    +`<span style="color:var(--sub);font-size:12.5px;margin:0 4px">または</span>
      <input type="date" id="f" value="${FROM}"><span style="color:var(--sub)">〜</span><input type="date" id="t" value="${TO}">
      <button id="go2">この期間で見る</button>`;
  $('range').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    PRESET=b.dataset.p; TO=jst(0); FROM=jst(+b.dataset.p); load();});
  $('go2').onclick=()=>{const f=$('f').value,t=$('t').value;
    if(!f||!t){toast('日付を2つ選んでください',true);return;}
    PRESET=''; FROM=f<t?f:t; TO=f<t?t:f; load();};
}

/* ── 売上 ── */
const IMGBASE='https://seam.site/';
function barRows(list,unit){
  if(!list||!list.length)return '<div class="empty">この期間の記録がありません</div>';
  const max=Math.max(...list.map(x=>x.v||0),1);
  return `<div class="rows">`+list.map(x=>`<div class="num">
    ${x.image?`<img src="${IMGBASE+esc(x.image)}" alt="" loading="lazy" style="width:38px;height:38px;object-fit:contain;background:var(--cream);border-radius:2px;flex:none" onerror="this.style.display='none'">`:''}
    <span class="r-w"><span class="r-n">${esc(x.k)}</span>
      <span class="bar"><i style="width:${Math.round((x.v||0)/max*100)}%"></i></span></span>
    ${x.q!=null?`<span class="r-q">${x.q}${unit||'点'}</span>`:(x.n!=null?`<span class="r-q">${x.n}件</span>`:'')}
    <span class="r-v">${yen(x.v)}</span></div>`).join('')+`</div>`;
}
/* 件数の棒。barRows は金額用なので、そのまま使うと「9件 ¥9」になる */
function countRows(list){
  if(!list||!list.length)return '<div class="empty">この期間の記録がありません</div>';
  const max=Math.max(...list.map(x=>x.v||0),1);
  return `<div class="rows">`+list.map(x=>`<div class="r">
    <span class="r-w"><span class="r-n">${esc(x.k)}</span>
      <span class="bar"><i style="width:${Math.round((x.v||0)/max*100)}%"></i></span></span>
    <span class="r-v">${x.v}件</span></div>`).join('')+`</div>`;
}
function salesHtml(){
  if(!DATA)return '<div class="empty">読み込んでいます…</div>';
  const s=DATA.summary;
  const M={cash:'現金',card:'クレジット',term:'クレジット',emoney:'電子マネー',qr:'QR決済',hpb:'スマート支払い(HPB)'};
  const meth=DATA.byMethod.map(x=>({...x,k:M[x.k]||x.k}));
  const db=DATA.discountBreak||{}, pf=DATA.profit||{};
  const brands=DATA.byCardBrand||[];
  /* 手数料はブランドごとに率が違う。実際に引かれた額が分かるものは●、
     料率からの見積もりは印を付けない（見積もりを実績に見せない） */
  const brandRows=!brands.length?'<div class="empty">現金以外の会計がありません</div>':
    `<div class="tblwrap"><table class="tbl"><thead><tr>
      <th>ブランド</th><th>種類</th><th class="num">売上</th><th class="num">件数</th>
      <th class="num">料率</th><th class="num">手数料</th></tr></thead><tbody>`
    +brands.map(b=>`<tr><td>${esc(b.k)}</td><td class="tsub">${esc(b.method)}</td>
      <td class="num">${yen(b.v)}</td><td class="num">${b.n}</td>
      <td class="num tsub">${b.feeIsReal?'実額':b.rate+'%'}</td>
      <td class="num">${yen(b.fee)}${b.feeIsReal?' <span title="Squareから受け取った実際の手数料">●</span>':''}</td></tr>`).join('')
    +`</tbody></table></div>
      <p class="note">● は Square から受け取った<b>実際に引かれた額</b>です　印の無い行は、設定した料率からの見積もりです
      ${s.feeUnknownSales?`<br>ブランドが記録されていない会計が ${yen(s.feeUnknownSales)} あります（レジで1タップ選ぶと、ここに分かれます）`:''}</p>`;
  const dr=[['値引き（メンバー・セール）',db.value],['ポイント利用',db.point],['ギフト券',db.gift],['免税ぶん',db.taxfree]]
    .filter(([,v])=>v>0);
  /* ★モデル会計はこの画面の数字から外してある。
     外したことを黙っていると「売上が合わない」になるので、必ず1行出す。 */
  const md=DATA.model||{};
  return `<div class="cards">
      <div class="kc"><div class="kc-k">総売上</div><div class="kc-v">${yen(s.gross)}</div></div>
      <div class="kc"><div class="kc-k">純売上</div><div class="kc-v">${yen(s.net)}</div><div class="kc-s">返金を引いた額</div></div>
      <div class="kc"><div class="kc-k">決済手数料</div><div class="kc-v">−${yen(s.fee)}</div><div class="kc-s">ブランド別の料率で計算</div></div>
      <div class="kc"><div class="kc-k">手取り</div><div class="kc-v">${yen(s.take)}</div><div class="kc-s">手数料を引いた額</div></div>
      <div class="kc"><div class="kc-k">件数</div><div class="kc-v">${s.count}</div></div>
      <div class="kc"><div class="kc-k">平均</div><div class="kc-v">${yen(s.avg)}</div><div class="kc-s">1件あたり</div></div>
      <div class="kc"><div class="kc-k">施術</div><div class="kc-v">${yen(s.tech)}</div></div>
      <div class="kc"><div class="kc-k">店販</div><div class="kc-v">${yen(s.retail)}</div>
        ${pf.margin!=null?`<div class="kc-s">粗利 ${yen(pf.retail)}（${pf.margin}%）</div>`:'<div class="kc-s">仕入値が未入力です</div>'}</div>
    </div>
    ${md.count?`<p class="note">この期間、モデル料金の会計が ${md.count}件 ${yen(md.value)} 別にあります（うち現金 ${yen(md.cash)}）<br>
      上の数字には入れていません　客単価と歩合が狂うためです　<a href="?tab=md">モデルの欄で見る</a></p>`:''}
    <h2>お支払いの内訳</h2>${barRows(meth)}
    <h2>ブランド別と手数料</h2>${brandRows}
    <h2>値引き・ポイント・ギフト・免税</h2>
    ${dr.length?`<div class="tblwrap"><table class="tbl"><tbody>
      ${dr.map(([k,v])=>`<tr><td>${k}</td><td class="num">−${yen(v)}</td></tr>`).join('')}
      <tr class="tot"><td>合計</td><td class="num">−${yen(dr.reduce((a,[,v])=>a+v,0))}</td></tr>
    </tbody></table></div>`:'<div class="empty">この期間は値引きがありません</div>'}
    <h2>日別</h2>${barRows(DATA.byDay)}
    <div class="two"><div><h2>ブランド別</h2>${barRows(DATA.byBrand.slice(0,15))}</div>
      <div><h2>メーカー別</h2>${barRows(DATA.byMaker.slice(0,15))}</div></div>
    <div class="two"><div><h2>種類別</h2>${barRows(DATA.byCategory.slice(0,15))}</div>
      <div><h2>レジ別 / 担当別</h2>${barRows(DATA.byRegister)}<div style="height:10px"></div>${barRows(DATA.byStaff)}</div></div>
    <h2>売れた商品と利益</h2>
    <div class="act" style="margin-bottom:8px">
      <span style="align-self:center;font-size:13px;color:var(--sub)">並べ方</span>
      <button data-sort="v" class="${PSORT==='v'?'pri':''}">売れた順</button>
      <button data-sort="p" class="${PSORT==='p'?'pri':''}">もうかった順</button>
    </div>
    ${prodTable()}`;
}
/* 商品の表。利益は仕入値が入っているものだけ出す。
   分からないものを0円や推定で埋めると、合計が本当の利益に見えてしまう。 */
function prodTable(){
  const list=(DATA.byProduct||[]).slice();
  if(PSORT==='p')list.sort((a,b)=>(b.profit==null?-1:b.profit)-(a.profit==null?-1:a.profit));
  const rows=list.slice(0,60);
  if(!rows.length)return '<div class="empty">この期間の記録がありません</div>';
  const noCost=list.filter(x=>x.profit==null).length;
  return `<div class="tblwrap"><table class="tbl"><thead><tr>
      <th>商品</th><th class="num">点数</th><th class="num">売上</th>
      <th class="num">仕入</th><th class="num">粗利</th><th class="num">粗利率</th></tr></thead><tbody>`
    +rows.map(x=>`<tr><td>${esc(x.k)}${x.maker?`<div class="tsub">${esc(x.maker)}</div>`:''}</td>
      <td class="num">${x.q||0}</td><td class="num">${yen(x.v)}</td>
      <td class="num tsub">${x.cost?yen(x.cost):'—'}</td>
      <td class="num">${x.profit==null?'<span class="tsub">—</span>':yen(x.profit)}</td>
      <td class="num">${x.margin==null?'<span class="tsub">—</span>':x.margin+'%'}</td></tr>`).join('')

/* ── CSVの書き出し ──
 * マネーフォワードは Windows なら Shift-JIS、Mac なら UTF-8 で読みます。
 * ここは UTF-8 に BOM を付けて出す（Excelでも文字化けしない形）。 */
function csvDL(name,rows){
  const esc2=v=>{const t=String(v==null?'':v);return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const body=rows.map(r=>r.map(esc2).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

 *   年5日の取得義務（労基法39条7項）は、放っておくと年度末に間に合わなくなる。
 * ★みなし残業の超過は、別途お支払いする対象。見落とすと未払いになる。 */
let KIN=null;
function kinHtml(){
  if(!KIN)return '<div class="empty">読み込んでいます…</div>';
  const ap=KIN.申請||[], st=KIN.スタッフ||[];
  const 足りない=st.filter(x=>x.足りない>0);
  const 超過=st.filter(x=>x.みなし超過>0);
  const 合わない=st.filter(x=>x.今月&&x.今月.合わない日&&x.今月.合わない日.length);
  const SPAN={day:'1日',half:'半日',hour:'時間'};
  return `<div class="cards">
      <div class="kc"><div class="kc-k">承認まちの申請</div>
        <div class="kc-v" style="color:${ap.length?'var(--danger)':'inherit'}">${ap.length}</div></div>
      <div class="kc"><div class="kc-k">年5日が足りない人</div>
        <div class="kc-v" style="color:${足りない.length?'var(--danger)':'inherit'}">${足りない.length}</div>
        <div class="kc-s">法律で取らせる義務があります</div></div>
      <div class="kc"><div class="kc-k">みなしを超えた人</div>
        <div class="kc-v" style="color:${超過.length?'var(--danger)':'inherit'}">${超過.length}</div>
        <div class="kc-s">別途お支払いの対象です</div></div>
    </div>
    ${合わない.length?`<p class="note" style="color:var(--danger)">打刻がそろっていない人が ${合わない.length}人います　${合わない.map(x=>esc(x.name)+'（'+x.今月.合わない日.length+'日）').join('・')}</p>`:''}
    <h2>承認まち ${ap.length}件</h2>
    ${ap.length?`<div class="tblwrap"><table><thead><tr><th>お名前</th><th>日</th><th>単位</th><th>種類</th><th>ひとこと</th><th></th></tr></thead>
      <tbody>${ap.map(x=>`<tr>
        <td>${esc(x.名前)}</td><td>${String(x.日).replace(/-/g,'/')}</td>
        <td>${SPAN[x.単位]||x.単位}${x.単位==='hour'?' '+x.時間+'h':''}</td>
        <td>${esc(x.種類)}</td><td>${esc(x.ひとこと||'')}</td>
        <td><button class="mini pri kin-ok" data-id="${esc(x.id)}">承認</button>
          <button class="mini kin-no" data-id="${esc(x.id)}">見送り</button></td></tr>`).join('')}</tbody></table></div>`
      :'<div class="empty">いまありません</div>'}
    <h2>スタッフごと</h2>
    <div class="tblwrap"><table><thead><tr><th>お名前</th><th>入社日</th><th class="num">付与</th><th class="num">残り</th>
      <th class="num">今年とった</th><th class="num">今月の実働</th><th class="num">残業</th><th class="num">みなし枠</th><th>状態</th></tr></thead>
      <tbody>${st.map(x=>`<tr>
        <td>${esc(x.name)}</td><td>${x.入社日?String(x.入社日).replace(/-/g,'/'):'—'}</td>
        <td class="num">${x.付与日数}日</td><td class="num">${x.残り日数}日</td>
        <td class="num">${x.今年とった日}日</td>
        <td class="num">${(x.今月||{}).実働||0}h</td><td class="num">${(x.今月||{}).残業||0}h</td>
        <td class="num">${x.みなし枠||'—'}</td>
        <td>${x.足りない>0?`<b style="color:var(--danger)">年5日まで あと${x.足りない}日</b>`:''}
          ${x.みなし超過>0?`<b style="color:var(--danger)">みなし超過 ${x.みなし超過}h</b>`:''}
          ${!x.入社日?'<span class="tsub">入社日が未入力</span>':''}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">有給の付与は入社日と週の所定日数から法どおりに出しています（労基法39条）　付与から2年で時効です<br>
      時間で取る有給は、労使協定があるときだけ・年5日ぶんまでです（39条4項）　協定が無い場合はお使いにならないでください</p>`;
}

/* ── スタッフ登録 ──
 * ★本部が一人ずつ打つのは手間なので、本人に書いてもらって承認する形にした。
 * ★生年月日と住所は労務のためのもの。一覧には出さず、押したときだけ開く。
 *   ずらりと並べておくと、画面を見せただけで人の住所が漏れる。
 * ★承認したときに紹介リンクのコードを1回だけ発行し、あとは変えない。
 *   名前や店舗が変わってもリンクが死なないようにする。 */
/* QRの部品。使う画面を開いた最初の1回だけ取ってくる */
let _qrP=null;
function loadQR(){
  if(window.qrcode)return Promise.resolve();
  if(_qrP)return _qrP;
  _qrP=new Promise(res=>{const t=document.createElement('script');
    t.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    t.onload=res;t.onerror=res;document.head.appendChild(t);});
  return _qrP;
}
function qrImg(text,cell){
  if(!window.qrcode)return '';
  try{ const q=qrcode(0,'M'); q.addData(String(text)); q.make();
    return q.createDataURL(cell||6,8); }catch(e){ return ''; }
}

        <div class="tsub">${x.insta?`Instagram @${esc(x.insta)}`:''}${x.lineId?`　LINE ${esc(x.lineId)}`:''}</div>

              <input type="number" class="wk-pm" data-id="${esc(x.id)}" value="${x.ptoManual==null?'':x.ptoManual}" min="0" max="40" step="0.5" placeholder="空＝法どおり" style="width:110px;font-size:13px"></label>

/* ── そろそろの方 ──
 * ★事務が見るのは名前ではなく「担当ごとの本数」と「LINEなしの人数」。
 *   LINEなしの方は自動のご案内が飛ばないので、人が動かないと必ず失客する。
 *   ここが担当によって偏っていたら、それは仕組みでなく人の問題として扱える。 */
let SN=null;
function snHtml(){
  if(!SN)return '<div class="empty">読み込んでいます…</div>';
  const f=SN.はじめて||[], r=SN.いつもの||[], m=SN.まとめ||{};
  const row=x=>`<tr><td>${esc(x.name)}${x.uncertain?'<span class="tsub">　電話なし</span>':''}</td>
    <td>${esc(x.staff||'—')}</td><td class="num">${x.visits}</td>
    <td class="num">${x.since}</td><td class="num">${x.over}</td>
    <td>${x.line?'<span class="tsub">LINEあり</span>':'<b style="color:var(--danger)">LINEなし</b>'}</td></tr>`;
  const tbl=(a,cap)=>a.length?`<h2>${cap} ${a.length}人</h2>
    <div class="tblwrap"><table><thead><tr><th>お客様</th><th>担当</th><th class="num">ご来店</th>
      <th class="num">前回から</th><th class="num">超過</th><th>LINE</th></tr></thead>
      <tbody>${a.map(row).join('')}</tbody></table></div>`:'';
  const by=SN.担当ごと||{};
  return `<div class="cards">
      <div class="kc"><div class="kc-k">はじめての方</div>
        <div class="kc-v">${(m.はじめて||{}).人数||0}</div>
        <div class="kc-s">${SN.firstDays}日たっても2回目が無い方</div></div>
      <div class="kc"><div class="kc-k">いつもの間隔を過ぎた方</div>
        <div class="kc-v">${(m.いつもの||{}).人数||0}</div></div>
      <div class="kc"><div class="kc-k">LINEなし</div>
        <div class="kc-v" style="color:var(--danger)">${((m.はじめて||{}).LINEなし||0)+((m.いつもの||{}).LINEなし||0)}</div>
        <div class="kc-s">自動のご案内が飛びません</div></div>
    </div>
    <p class="note">先のご予約がある方 ${m.予約あり||0}人・お声がけ済み ${m.お声がけ済み||0}人・まだ判定しない方 ${m.まだ判定しない||0}人は外しています<br>
      ${esc(SN.ことわり||'')}　スタッフのスマホには、その人のお客様だけが出ています</p>
    ${Object.keys(by).length?`<h2>担当ごと</h2>
      <div class="tblwrap"><table><thead><tr><th>担当</th><th class="num">はじめて</th>
        <th class="num">いつもの</th><th class="num">うちLINEなし</th></tr></thead>
        <tbody>${Object.entries(by).sort((a,b)=>(b[1].はじめて+b[1].いつもの)-(a[1].はじめて+a[1].いつもの))
          .map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.はじめて}</td>
            <td class="num">${v.いつもの}</td><td class="num">${v.LINEなし}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${tbl(f,'はじめてお越しになって、まだ次が無い方')}
    ${tbl(r,'いつもの間隔を過ぎている方')}`;
}

/* ── モデル募集 ──

const MD_ST={new:'ご連絡まち',fixed:'日時が決まった',done:'終わった'};

  const m=MDM.まとめ||{}, rows=MDM.rows||[];

    <div class="cards">

      <div class="tblwrap"><table><thead><tr><th>日</th><th>担当</th><th>モデルさん</th>
        <th class="num">いただいた</th><th class="num">材料費</th><th class="num">差</th>
        <th>受取</th><th>次回予約</th></tr></thead><tbody>
        ${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.staff)}</td><td>${esc(x.model)}</td>
          <td class="num">${yen(x.fee)}</td>
          <td class="num">${x.材料費わからず?'—':yen(x.mat)}</td>
          <td class="num" style="${!x.材料費わからず&&x.実費との差>0?'color:var(--danger)':''}">${x.材料費わからず?'—':yen(x.実費との差)}</td>

}

function alertHtml(){
  if(!ALERT)return '<div class="empty">読み込んでいます…</div>';
  const box=(t,d,cls)=>`<h2>${t}</h2>
    <div class="cards" style="margin-bottom:10px">
      <div class="kc"><div class="kc-k">品目</div><div class="kc-v">${d.count}</div></div>
      <div class="kc"><div class="kc-k">寝ている金額</div><div class="kc-v">${yen(d.value)}</div><div class="kc-s">上代での目安</div></div>
    </div>
    ${d.items.length?`<div class="rows">`+d.items.slice(0,60).map(x=>`<div class="num">
      <span class="r-w"><span class="r-n">${esc(x.name)}<span class="tag ${cls}">${x.months!=null?x.months+'ヶ月分':'売れていません'}</span></span>
        <span class="oi-b">${esc(x.maker)}　在庫 ${x.stock}${x.sold?'　売れた '+x.sold:''}</span></span>
      <span class="r-v">${yen(x.value)}</span></div>`).join('')+`</div>`
      :'<div class="empty">ありません</div>'}`;
  return `<p class="note">返品や値下げを決めるための材料です　数字を出すだけで、勝手に何かを動かすことはありません<br>
      不良在庫＝${ALERT.days}日まったく売れていないもの　過剰在庫＝いまの売れ方だと使い切るのに${ALERT.months}ヶ月以上かかるもの</p>
    <div class="act">
      <span style="align-self:center;font-size:13px;color:var(--sub)">売れていない期間</span>
      ${[30,60,90,180].map(v=>`<button data-d="${v}" class="${ALERT_DAYS===v?'pri':''}">${v}日</button>`).join('')}
      <span style="align-self:center;font-size:13px;color:var(--sub);margin-left:10px">多すぎの目安</span>
      ${[3,6,12].map(v=>`<button data-m="${v}" class="${ALERT_MONTHS===v?'pri':''}">${v}ヶ月分</button>`).join('')}
    </div>
    ${box('不良在庫（まったく売れていない）',ALERT.dead,'ng')}
    ${box('過剰在庫（多すぎる）',ALERT.over,'')}`;
}

/* Squareからの取り込み。まず下見、押されたら入れる。
   いきなり入れない＝入れてから「違った」を起こさない。 */
function wireRec(){
  const dry=$('body').querySelector('#imp-dry');
  if(dry)dry.onclick=async()=>{
    dry.disabled=true; dry.textContent='Squareを見ています…';
    try{ IMP=await get(`/square/import?from=${FROM}&to=${TO}&shop=${encodeURIComponent(SHOP)}`); }
    catch(e){ toast(e.message||'読めませんでした',true); dry.disabled=false; dry.textContent='Squareから取り込む（まず下見）'; return; }
    $('body').innerHTML=recHtml(); wireRec();
  };
  const go=$('body').querySelector('#imp-go');
  if(go)go.onclick=async()=>{
    if(!confirm(`Squareの ${IMP.取り込める件数}件を台帳に入れます。よろしいですか`))return;
    go.disabled=true; go.textContent='入れています…';
    try{ IMP=await get(`/square/import?from=${FROM}&to=${TO}&shop=${encodeURIComponent(SHOP)}&go=1`); }
    catch(e){ toast(e.message||'入れられませんでした',true); go.disabled=false; return; }
    toast(`${IMP.取り込んだ件数}件を入れました`);
    REC=await get(`/reconcile?date=${FROM}&to=${TO}`);
    $('body').innerHTML=recHtml(); wireRec();
  };
}

/* 管理画面の「つかう機能をえらぶ」で消したものは、この画面でも出さない */
let USEFEAT={};
const useFeat=(v)=>USEFEAT[v]!==false;
async function applyFeat(){
  try{ const sj=await get('/settings'); const st=sj.settings||{};
       USEFEAT=JSON.parse(st['useFeat:'+SHOP]||st.useFeat||'{}')||{}; }catch(e){ USEFEAT={}; }
  document.querySelectorAll('[data-feat]').forEach(el=>{
    const on=useFeat(el.dataset.feat);
    el.style.display=on?'':'none';
    if(!on&&el.classList.contains('on')){
      const first=document.querySelector('nav button:not([style*="none"])')||document.querySelector('[data-t="sales"]');
      if(first)first.click();
    }
  });
}
async function boot(){
  await applyFeat();
  try{ const j=await get('/shops'); const shops=j.shops||[];
    if(!shops.some(s=>s.id===SHOP))SHOP=(shops[0]||{}).id||'ginza';
    $('shopSel').innerHTML=shops.map(s=>`<option value="${esc(s.id)}" ${s.id===SHOP?'selected':''}>${esc(s.name)}</option>`).join('');
    $('shopSel').style.cssText='border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:#fff;color:var(--ink)';
    $('shopSel').onchange=e=>{SHOP=e.target.value;localStorage.setItem(SHOPK,SHOP);load();};
  }catch(err){ localStorage.removeItem(TOKK);TOK='';showGate();toast('合言葉が違うようです',true);return; }
  $('gate').style.display='none'; $('app').style.display='block';
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    TAB=b.dataset.t;
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===TAB));
    load();});
  TO=jst(0); FROM=jst(7); load();
}
